<script id="data" type="application/json">{"rec": [{"t": "h1", "title": "Bienvenidos", "sub": "Cómo usar esta guía (léanla juntos primero)"}, {"t": "p", "text": "Esta guía está hecha para dos personas que acaban de llegar a Aruba y necesitan comunicarse en inglés <b>desde ya<\/b>: en el supermercado, con los vecinos, en el banco y, sobre todo, en el trabajo. No es un libro de gramática: es una caja de herramientas para hablar."}, {"t": "p", "text": "En Aruba los idiomas oficiales son el papiamento y el neerlandés, pero el inglés y el español se usan muchísimo, sobre todo en turismo, servicio al cliente y comercio. Eso es una ventaja: van a escuchar inglés todos los días y mucha gente tendrá paciencia con ustedes."}, {"t": "h2", "title": "Cómo está organizada"}, {"t": "bullets", "items": ["<b>Parte 1 – Tips para aprender rápido:<\/b> hábitos que funcionan para adultos ocupados.", "<b>Parte 2 – Pronunciación:<\/b> los errores típicos de los hispanohablantes y cómo corregirlos.", "<b>Parte 3 – Gramática mínima:<\/b> solo lo necesario para armar frases.", "<b>Parte 4 – Situaciones del día a día:<\/b> supermercado, casa, vecinos, banco, médico, transporte, restaurante y emergencias.", "<b>Parte 5 – Inglés para el trabajo:<\/b> una sección para el técnico de telecomunicaciones y otra para la agente de reservaciones.", "<b>Parte 6 – Ejercicios y juegos en pareja<\/b>, con respuestas al final.", "<b>Parte 7 – Plan de 12 semanas<\/b> y hoja de seguimiento."]}, {"t": "h2", "title": "Cómo leer la columna «Cómo suena»"}, {"t": "p", "text": "Para ayudarles al principio, muchas frases traen una pronunciación aproximada escrita «a la española». Es una muleta, no una regla: no es exacta. Úsenla para arrancar y luego escuchen el audio real (Google Translate, un diccionario en línea o YouTube) y repitan imitando."}, {"t": "box", "kind": "tip", "title": "★ Antes de empezar", "items": ["Lean esta guía con un lápiz en la mano. Marquen las frases que usan cada semana y tachen las que ya dicen sin pensar. Ver el progreso motiva muchísimo."]}, {"t": "h1", "title": "Parte 1 · Tips para aprender más rápido", "sub": "Hábitos pequeños, todos los días, valen más que horas sueltas el fin de semana"}, {"t": "box", "kind": "warn", "title": "♥ La ventaja de aprender en pareja", "items": ["Ustedes tienen algo que los estudiantes solos no tienen: un compañero de práctica en casa. Úsenlo. Corríjanse con cariño, hagan los role-plays de esta guía y compitan sanamente (¿quién aprende más palabras esta semana?)."]}, {"t": "h1", "title": "Parte 2 · Pronunciación para hispanohablantes", "sub": "Los 8 errores más comunes y cómo arreglarlos"}, {"t": "h2", "title": "El alfabeto en inglés (¡vital para deletrear nombres!)"}, {"t": "p", "text": "En el trabajo de reservaciones y en el técnico van a deletrear nombres, correos y números de serie todo el tiempo. Aprendan el alfabeto y el código fonético internacional:"}, {"t": "vocab", "rows": [["A – ei", "Alpha"], ["B – bi", "Bravo"], ["C – si", "Charlie"], ["D – di", "Delta"], ["E – i", "Echo"], ["F – ef", "Foxtrot"], ["G – dyi", "Golf"], ["H – eich", "Hotel"], ["I – ai", "India"], ["J – dyei", "Juliet"], ["K – kei", "Kilo"], ["L – el", "Lima"], ["M – em", "Mike"], ["N – en", "November"], ["O – ou", "Oscar"], ["P – pi", "Papa"], ["Q – kiu", "Quebec"], ["R – ar", "Romeo"], ["S – es", "Sierra"], ["T – ti", "Tango"], ["U – iu", "Uniform"], ["V – vi", "Victor"], ["W – dábel-iu", "Whiskey"], ["X – ex", "X-ray"], ["Y – uái", "Yankee"], ["Z – zi / zed", "Zulu"]]}, {"t": "box", "kind": "tip", "title": "★ Cuidado", "items": ["Las letras que más confunden: <b>E<\/b> («i») vs. <b>I<\/b> («ai»); <b>G<\/b> («dyi») vs. <b>J<\/b> («dyei»); <b>A<\/b> («ei») vs. <b>E<\/b> («i»). Al deletrear un correo: <b>@<\/b> = «at», <b>.<\/b> = «dot», <b>_<\/b> = «underscore», <b>-<\/b> = «dash»."]}, {"t": "h1", "title": "Parte 3 · Gramática mínima para sobrevivir", "sub": "Con estas 6 estructuras pueden decir casi todo"}, {"t": "h3", "title": "1. Verbo TO BE (ser / estar)"}, {"t": "phrases", "rows": [["I <b>am<\/b> from Venezuela. / I'm tired.", "ái am from... / áim táierd", "Soy de Venezuela. / Estoy cansado(a)."], ["He <b>is<\/b> a technician. / She's at work.", "ji is a teknishan", "Él es técnico. / Ella está en el trabajo."], ["We <b>are<\/b> new in Aruba.", "uí ar niú in arúba", "Somos nuevos en Aruba."], ["<b>Is<\/b> it open? / <b>Are<\/b> you busy?", "is it óupen?", "¿Está abierto? / ¿Estás ocupado?"]]}, {"t": "h3", "title": "2. Presente simple (rutinas)"}, {"t": "p", "text": "Igual para todos, pero con <b>he/she/it<\/b> se agrega <b>-s<\/b>: <i>I work / he work<b>s<\/b><\/i>. Negativo: <i>I <b>don't<\/b> work / she <b>doesn't<\/b> work<\/i>. Pregunta: <i><b>Do<\/b> you work here? <b>Does<\/b> he speak Spanish?<\/i>"}, {"t": "h3", "title": "3. Presente continuo (lo que pasa ahora)"}, {"t": "p", "text": "<b>am/is/are + verbo-ing<\/b>: <i>I'm cooking. He's installing the modem. We're looking for an apartment.<\/i>"}, {"t": "h3", "title": "4. Pasado simple"}, {"t": "p", "text": "Regular: verbo + <b>-ed<\/b> (<i>worked, called, booked<\/i>). Irregulares importantes: <i>go → went, have → had, buy → bought, pay → paid, get → got, see → saw, do → did, make → made, say → said, come → came<\/i>. Pregunta y negativo con <b>did<\/b>: <i>Did you call? I didn't see it.<\/i>"}, {"t": "h3", "title": "5. Futuro"}, {"t": "p", "text": "<b>going to<\/b> para planes: <i>We're going to visit the beach on Sunday.<\/i> <b>will<\/b> para decisiones y promesas en el momento: <i>I'll check that for you. I'll call you back.<\/i> (¡Muy útil en el trabajo!)"}, {"t": "h3", "title": "6. Pedir con cortesía: can / could / would"}, {"t": "phrases", "rows": [["<b>Can<\/b> I pay with card?", "kan ái péi uiz kard?", "¿Puedo pagar con tarjeta?"], ["<b>Could<\/b> you repeat that, please?", "kud iú ripít dat, plis?", "¿Podría repetir eso, por favor?"], ["<b>Would<\/b> you like a receipt?", "uud iú láik a risít?", "¿Le gustaría un recibo?"], ["I <b>would like<\/b> / I'd like a coffee.", "áid láik a cófi", "Quisiera un café."]]}, {"t": "box", "kind": "tip", "title": "★ Las palabras «W»", "items": ["Las preguntas con palabra interrogativa: <b>What<\/b> (qué), <b>Where<\/b> (dónde), <b>When<\/b> (cuándo), <b>Who<\/b> (quién), <b>Why<\/b> (por qué), <b>How<\/b> (cómo), <b>How much<\/b> (cuánto cuesta), <b>How many<\/b> (cuántos), <b>What time<\/b> (a qué hora), <b>Which<\/b> (cuál)."]}, {"t": "h1", "title": "Parte 4 · Situaciones del día a día", "sub": "Empiecen por aquí: las frases que más van a usar"}, {"t": "h2", "title": "Frases de supervivencia (memorícenlas esta semana)"}, {"t": "phrases", "rows": [["Hello! / Good morning / Good afternoon", "jelóu / gud mórning / gud áfternun", "¡Hola! / Buenos días / Buenas tardes"], ["How are you? — Fine, thanks. And you?", "jáu ar iú? — fáin, zenks. end iú?", "¿Cómo está? — Bien, gracias. ¿Y usted?"], ["Sorry, I don't understand.", "sóri, ái dóunt anderstánd", "Disculpe, no entiendo."], ["Can you speak slowly, please?", "kan iú spik slóuli, plis?", "¿Puede hablar despacio, por favor?"], ["Can you repeat that, please?", "kan iú ripít dat, plis?", "¿Puede repetir, por favor?"], ["How do you say ... in English?", "jáu du iú séi ... in ínglish?", "¿Cómo se dice ... en inglés?"], ["What does ... mean?", "uát das ... min?", "¿Qué significa ...?"], ["Do you speak Spanish?", "du iú spik spánish?", "¿Habla español?"], ["My English is not very good, I'm learning.", "mái ínglish is not véri gud, áim lérning", "Mi inglés no es muy bueno, estoy aprendiendo."], ["Can you write it down, please?", "kan iú ráit it dáun, plis?", "¿Me lo puede escribir, por favor?"], ["Excuse me, where is ...?", "ekskiús mi, uér is...?", "Disculpe, ¿dónde está...?"], ["Thank you very much! / You're welcome.", "zenk iú véri mach / iór uélcam", "¡Muchas gracias! / De nada."], ["No problem. / Of course.", "nou próblem / of cors", "No hay problema. / Claro."], ["Have a nice day! — You too!", "jav a náis déi — iú tu", "¡Que tenga buen día! — ¡Igualmente!"]]}, {"t": "box", "kind": "tip", "title": "★ Bonus local", "items": ["En Aruba también escucharán papiamento. Unas palabras para quedar bien: <b>Bon dia<\/b> (buenos días), <b>Bon tardi<\/b> (buenas tardes), <b>Danki<\/b> (gracias), <b>Con ta bai?<\/b> (¿cómo estás?), <b>Mi ta bon<\/b> (estoy bien). Los arubianos aprecian mucho el esfuerzo."]}, {"t": "h1", "title": "En el supermercado", "sub": "At the supermarket / grocery store"}, {"t": "h3", "title": "Vocabulario"}, {"t": "vocab", "rows": [["cart / basket", "carrito / cesta"], ["aisle", "pasillo"], ["checkout / cashier", "caja / cajero(a)"], ["receipt", "recibo"], ["bag (plastic / paper)", "bolsa"], ["price / on sale", "precio / en oferta"], ["cash / card", "efectivo / tarjeta"], ["change", "vuelto / cambio"], ["produce", "frutas y verduras"], ["dairy", "lácteos"], ["meat / chicken / fish", "carne / pollo / pescado"], ["bakery", "panadería"], ["frozen food", "congelados"], ["cleaning products", "productos de limpieza"], ["a pound / a kilo", "una libra / un kilo"], ["a dozen eggs", "una docena de huevos"], ["a loaf of bread", "un pan (de molde)"], ["a bottle of water", "una botella de agua"], ["a can of beans", "una lata de frijoles"], ["expiration date", "fecha de vencimiento"]]}, {"t": "h3", "title": "Frases útiles"}, {"t": "phrases", "rows": [["Excuse me, where can I find the rice?", "ekskiús mi, uér kan ái fáind de ráis?", "Disculpe, ¿dónde encuentro el arroz?"], ["Is it in aisle 5?", "is it in áil fáiv?", "¿Está en el pasillo 5?"], ["How much is this?", "jáu mach is dis?", "¿Cuánto cuesta esto?"], ["Do you have ... ?", "du iú jav...?", "¿Tienen ...?"], ["Can I get half a pound of ham, please?", "kan ái guet jaf a páund of jam, plis?", "¿Me da media libra de jamón?"], ["Sliced, please. / Thin, please.", "sláist, plis / zin, plis", "En rebanadas / Delgado, por favor."], ["Can I pay with card?", "kan ái péi uiz kard?", "¿Puedo pagar con tarjeta?"], ["Do you accept US dollars?", "du iú aksépt iú-es dólars?", "¿Aceptan dólares?"], ["I don't need a bag, thanks.", "ái dóunt nid a bag, zenks", "No necesito bolsa, gracias."], ["Can I have the receipt?", "kan ái jav de risít?", "¿Me da el recibo?"]]}, {"t": "dialog", "title": "en la caja", "lines": [["Cashier", "Hi! Did you find everything okay?", "¡Hola! ¿Encontró todo bien?"], ["You", "Yes, thank you. Do you accept credit cards?", "Sí, gracias. ¿Aceptan tarjetas de crédito?"], ["Cashier", "Yes, we do. Do you need a bag?", "Sí. ¿Necesita bolsa?"], ["You", "Yes, two bags, please.", "Sí, dos bolsas, por favor."], ["Cashier", "Your total is 85 florins. Insert or tap your card.", "Su total es 85 florines. Inserte o acerque su tarjeta."], ["You", "Thank you! Have a nice day.", "¡Gracias! Que tenga buen día."]]}, {"t": "box", "kind": "tip", "title": "★ Ejercicio de la vida real", "items": ["Antes de ir al súper, escriban la lista de compras <b>en inglés<\/b>. Es el ejercicio más fácil y útil de toda la semana. En Aruba la moneda es el florín arubeño (AWG), y en muchos lugares también aceptan dólares: pregunten siempre en qué moneda les dan el vuelto (<i>«Is the change in florins or dollars?»<\/i>)."]}, {"t": "h1", "title": "En la casa", "sub": "At home: rutina, cocina, mantenimiento y conversación en pareja"}, {"t": "h3", "title": "Partes de la casa y objetos (¡para etiquetar!)"}, {"t": "vocab", "rows": [["living room", "sala"], ["bedroom", "dormitorio"], ["bathroom", "baño"], ["kitchen", "cocina"], ["fridge", "nevera"], ["stove / oven", "estufa / horno"], ["microwave", "microondas"], ["sink", "fregadero / lavamanos"], ["washing machine", "lavadora"], ["dryer", "secadora"], ["air conditioner (AC)", "aire acondicionado"], ["fan", "ventilador"], ["light switch", "interruptor"], ["outlet", "enchufe (pared)"], ["faucet / tap", "grifo / llave"], ["trash can", "bote de basura"], ["closet", "clóset"], ["key / lock", "llave / cerradura"], ["broom / mop", "escoba / trapeador"], ["dishes", "platos"]]}, {"t": "h3", "title": "Rutina diaria — para practicar juntos"}, {"t": "phrases", "rows": [["I wake up at 6. / I take a shower.", "ái uéik ap at six / ái téik a sháuer", "Me despierto a las 6. / Me ducho."], ["What do you want for breakfast?", "uát du iú uánt for brékfast?", "¿Qué quieres desayunar?"], ["I'm going to work. See you later!", "áim góing tu uork. si iú léiter", "Me voy al trabajo. ¡Nos vemos!"], ["How was your day?", "jáu uas iór déi?", "¿Cómo te fue hoy?"], ["It was good / busy / long / stressful.", "it uas gud / bísi / long / strésful", "Fue bueno / ocupado / largo / estresante."], ["Can you help me with the dishes?", "kan iú jelp mi uiz de díshis?", "¿Me ayudas con los platos?"], ["Let's cook dinner together.", "lets kuk díner tuguéder", "Cocinemos la cena juntos."], ["We need to buy milk and eggs.", "uí nid tu bái milk end egs", "Tenemos que comprar leche y huevos."], ["Don't forget to pay the electricity bill.", "dóunt forguét tu péi de electrísiti bil", "No olvides pagar la luz."], ["Turn on / turn off the AC, please.", "tern on / tern of de ei-si", "Prende / apaga el aire, por favor."], ["I'm tired. Let's go to bed.", "áim táierd. lets gou tu bed", "Estoy cansado(a). Vamos a dormir."]]}, {"t": "h3", "title": "Con el casero o un técnico en casa"}, {"t": "phrases", "rows": [["The AC is not working.", "de ei-si is not uórking", "El aire no funciona."], ["There is a leak in the bathroom.", "der is a lik in de bázrum", "Hay una fuga en el baño."], ["When can you come to fix it?", "uén kan iú kam tu fix it?", "¿Cuándo puede venir a arreglarlo?"], ["The rent is due on the first of the month.", "de rent is du on de ferst of de manz", "La renta se paga el primero de cada mes."]]}, {"t": "box", "kind": "tip", "title": "★ Juego de la cena: «Three things»", "items": ["Cada noche, durante la cena, cada uno cuenta en inglés <b>tres cosas<\/b> que hizo en el día, usando el pasado: <i>«Today I worked a lot. I talked to a customer. I bought bread.»<\/i> El otro hace una pregunta: <i>«Who did you talk to?»<\/i>"]}, {"t": "h1", "title": "Vecinos, compañeros y «small talk»", "sub": "Conversación corta y amable: la clave para hacer amigos"}, {"t": "phrases", "rows": [["Hi, I'm María. We just moved in next door.", "jái, áim maría. uí yast muvd in next dor", "Hola, soy María. Nos acabamos de mudar al lado."], ["Nice to meet you!", "náis tu mit iú", "¡Mucho gusto!"], ["Where are you from? — I'm from ...", "uér ar iú from? — áim from...", "¿De dónde eres? — Soy de ..."], ["How long have you lived in Aruba?", "jáu long jav iú livd in arúba?", "¿Cuánto tiempo llevas viviendo en Aruba?"], ["We've been here for two months.", "uív bin jíer for tu manz", "Llevamos dos meses aquí."], ["What do you do? — I work in telecommunications.", "uát du iú du? — ái uork in télecomiunikéishons", "¿A qué te dedicas? — Trabajo en telecomunicaciones."], ["I'm a reservations agent.", "áim a reservéishons éiyent", "Soy agente de reservaciones."], ["It's so hot today! / What a beautiful day!", "its sou jot tudéi / uát a biútiful déi", "¡Qué calor hace hoy! / ¡Qué día tan bonito!"], ["Can you recommend a good restaurant / beach?", "kan iú rekoménd a gud réstorant / bich?", "¿Me recomiendas un buen restaurante / playa?"], ["What do you like to do on weekends?", "uát du iú láik tu du on uíkends?", "¿Qué te gusta hacer los fines de semana?"], ["Let me know if you need anything.", "let mi nóu if iú nid énizing", "Avísame si necesitas algo."]]}, {"t": "h2", "title": "Banco, gobierno y trámites"}, {"t": "phrases", "rows": [["I'd like to open a bank account.", "áid láik tu óupen a bank akáunt", "Quisiera abrir una cuenta bancaria."], ["What documents do I need?", "uát dókiuments du ái nid?", "¿Qué documentos necesito?"], ["Here is my passport and my work permit.", "jíer is mái pásport end mái uork pérmit", "Aquí está mi pasaporte y mi permiso de trabajo."], ["I have an appointment at 10.", "ái jav an apóintment at ten", "Tengo una cita a las 10."], ["Where do I sign? / Do I fill out this form?", "uér du ái sáin? / du ái fil áut dis form?", "¿Dónde firmo? / ¿Lleno este formulario?"], ["How long does it take?", "jáu long das it téik?", "¿Cuánto tiempo tarda?"], ["Can I take a number?", "kan ái téik a námber?", "¿Puedo sacar un número / turno?"]]}, {"t": "h1", "title": "Médico y farmacia", "sub": "At the doctor / pharmacy"}, {"t": "vocab", "rows": [["headache", "dolor de cabeza"], ["stomachache", "dolor de estómago"], ["sore throat", "dolor de garganta"], ["fever", "fiebre"], ["cough", "tos"], ["cold / flu", "resfriado / gripe"], ["allergy", "alergia"], ["prescription", "receta médica"], ["pill / tablet", "pastilla"], ["insurance", "seguro"], ["appointment", "cita"], ["blood test", "examen de sangre"]]}, {"t": "phrases", "rows": [["I need to see a doctor.", "ái nid tu si a dóctor", "Necesito ver a un médico."], ["I'd like to make an appointment.", "áid láik tu méik an apóintment", "Quisiera hacer una cita."], ["I have a headache and a fever.", "ái jav a jédeik end a fíver", "Tengo dolor de cabeza y fiebre."], ["It hurts here.", "it jerts jíer", "Me duele aquí."], ["Since yesterday / for three days.", "sins iésterdei / for zri déis", "Desde ayer / desde hace tres días."], ["I'm allergic to penicillin.", "áim alérgic tu penisílin", "Soy alérgico(a) a la penicilina."], ["How many times a day?", "jáu méni táims a déi?", "¿Cuántas veces al día?"], ["Do I need a prescription for this?", "du ái nid a prescrípshon for dis?", "¿Necesito receta para esto?"], ["Here is my insurance card.", "jíer is mái inshúrans kard", "Aquí está mi tarjeta del seguro."]]}, {"t": "h2", "title": "Transporte, restaurante y emergencias"}, {"t": "phrases", "rows": [["Does this bus go to Oranjestad?", "das dis bas gou tu oranyestad?", "¿Este bus va a Oranjestad?"], ["How much is the fare?", "jáu mach is de fer?", "¿Cuánto es el pasaje?"], ["Please take me to this address.", "plis téik mi tu dis adrés", "Por favor lléveme a esta dirección."], ["A table for two, please.", "a téibol for tu, plis", "Una mesa para dos, por favor."], ["Can we see the menu? / The check, please.", "kan uí si de méniu? / de chek, plis", "¿Nos trae el menú? / La cuenta, por favor."], ["Is the tip included?", "is de tip inclúded?", "¿La propina está incluida?"], ["<b>Help!<\/b> / Call an ambulance!", "jelp / col an ámbiulans", "¡Ayuda! / ¡Llame una ambulancia!"], ["There's been an accident.", "ders bin an áksident", "Hubo un accidente."], ["My address is ...", "mái adrés is...", "Mi dirección es ..."]]}, {"t": "box", "kind": "warn", "title": "⚠ Importante", "items": ["En Aruba, para ambulancia y bomberos se marca el <b>911<\/b>; para la policía, el <b>100<\/b>. Practiquen juntos, en voz alta, cómo decir su dirección completa en inglés y cómo describir la emergencia en una frase: <i>«My husband fell and he is hurt. We are at [address].»<\/i> Escríbanla y péguenla en la nevera."]}, {"t": "h1", "title": "Parte 5 · Inglés para el trabajo", "sub": "A. Técnico de telecomunicaciones (para él)"}, {"t": "p", "text": "Buenas noticias: gran parte del vocabulario técnico ya está en inglés (router, modem, Wi-Fi, fiber, switch). El reto es la conversación con clientes, supervisores y compañeros. Aquí está lo esencial."}, {"t": "h3", "title": "Vocabulario técnico"}, {"t": "vocab", "rows": [["fiber optic cable", "cable de fibra óptica"], ["splice / splicing", "empalme / empalmar"], ["connector", "conector"], ["router / modem", "router / módem"], ["ONT (optical network terminal)", "terminal óptica (ONT)"], ["signal / signal strength", "señal / potencia de señal"], ["outage", "caída del servicio"], ["installation / setup", "instalación / configuración"], ["troubleshooting", "diagnóstico de fallas"], ["work order / ticket", "orden de trabajo / ticket"], ["cabinet / box", "gabinete / caja"], ["pole / ladder", "poste / escalera"], ["wall jack / outlet", "toma de pared"], ["drill", "taladro"], ["cable tester / power meter", "probador / medidor de potencia"], ["bandwidth / speed", "ancho de banda / velocidad"], ["password / network name", "contraseña / nombre de red"], ["reboot / reset", "reiniciar / restablecer"], ["damaged / broken / loose", "dañado / roto / flojo"], ["safety gear / harness", "equipo de seguridad / arnés"], ["helmet / gloves", "casco / guantes"], ["the field / on site", "en campo / en sitio"], ["customer premises", "domicilio del cliente"], ["downtime", "tiempo sin servicio"]]}, {"t": "h3", "title": "Con el cliente (llegar, explicar, terminar)"}, {"t": "phrases", "rows": [["Good morning, I'm the technician from [company].", "gud mórning, áim de teknishan from...", "Buenos días, soy el técnico de [empresa]."], ["I'm here to install your internet service.", "áim jíer tu instól iór ínternet sérvis", "Vengo a instalar su servicio de internet."], ["I'm here to check the problem with your connection.", "áim jíer tu chek de próblem uiz iór konékshon", "Vengo a revisar el problema con su conexión."], ["Can you show me where the modem is?", "kan iú shou mi uér de móudem is?", "¿Me muestra dónde está el módem?"], ["What is the problem exactly?", "uát is de próblem eksáktli?", "¿Cuál es el problema exactamente?"], ["When did the problem start?", "uén did de próblem start?", "¿Cuándo empezó el problema?"], ["I need to drill a small hole here. Is that okay?", "ái nid tu dril a smol jóul jíer. is dat okéi?", "Necesito hacer un hoyito aquí. ¿Está bien?"], ["It will take about one hour.", "it uil téik abáut uan áuer", "Tardará más o menos una hora."], ["The cable was damaged. I replaced it.", "de kéibol uas dámeyd. ái ripléist it", "El cable estaba dañado. Lo cambié."], ["Everything is working now.", "évrizing is uórking náu", "Ya todo funciona."], ["This is your Wi-Fi name and password.", "dis is iór uái-fai néim end pásuord", "Este es su nombre de Wi-Fi y contraseña."], ["If you have any problem, please call customer service.", "if iú jav éni próblem, plis col cástomer sérvis", "Si tiene algún problema, llame a servicio al cliente."], ["Can you sign here, please?", "kan iú sáin jíer, plis?", "¿Puede firmar aquí, por favor?"]]}, {"t": "h3", "title": "Con el supervisor y los compañeros"}, {"t": "phrases", "rows": [["I finished the job at [address].", "ái fínisht de yob at...", "Terminé el trabajo en [dirección]."], ["I need more cable / another connector.", "ái nid mor kéibol / anóder konéktor", "Necesito más cable / otro conector."], ["The customer wasn't home.", "de cástomer uásent jóum", "El cliente no estaba en casa."], ["There's no signal at the box.", "ders nou sígnal at de box", "No hay señal en la caja."], ["I think the problem is in the main line.", "ái zink de próblem is in de méin láin", "Creo que el problema está en la línea principal."], ["I'm on my way. / I'm running late.", "áim on mái uéi / áim rániŋ léit", "Voy en camino. / Voy con retraso."], ["Can you help me with this? / Can you show me how?", "kan iú jelp mi uiz dis? / ... shou mi jáu?", "¿Me ayudas con esto? / ¿Me enseñas cómo?"], ["Sorry, can you say that again more slowly?", "sóri, kan iú séi dat aguén mor slóuli?", "Perdón, ¿lo repites más despacio?"], ["Be careful! / Watch out!", "bi kérful / uách áut", "¡Ten cuidado! / ¡Cuidado!"]]}, {"t": "dialog", "title": "una visita técnica", "lines": [["Customer", "Hi! The internet has been down since yesterday.", "¡Hola! El internet no funciona desde ayer."], ["Tech", "Good morning. I'm sorry about that. Can I see the modem, please?", "Buenos días. Lo siento. ¿Puedo ver el módem?"], ["Customer", "Sure, it's in the living room.", "Claro, está en la sala."], ["Tech", "The red light is on. I'm going to check the cable outside.", "La luz roja está prendida. Voy a revisar el cable afuera."], ["Tech", "The connector was loose. I fixed it. Can you check your phone now?", "El conector estaba flojo. Lo arreglé. ¿Puede revisar su teléfono ahora?"], ["Customer", "Yes! It's working. Thank you so much!", "¡Sí! Ya funciona. ¡Muchas gracias!"], ["Tech", "You're welcome. Please sign here. Have a nice day!", "De nada. Por favor firme aquí. ¡Que tenga buen día!"]]}, {"t": "box", "kind": "tip", "title": "★ Tip para el técnico", "items": ["Prepara una «tarjeta de bolsillo» (o nota en el celular) con tus 10 frases de cliente más usadas. Léela en el carro antes de cada visita. En un mes las dirás de memoria. También practica decir números de teléfono, direcciones y números de serie en voz alta: es lo que más se usa en campo."]}, {"t": "h1", "title": "Inglés para el trabajo", "sub": "B. Agente de reservaciones (para ella)"}, {"t": "p", "text": "Las reservaciones siguen un guion bastante repetitivo. Esa es una gran ventaja: si dominas el guion, dominas el 80% de tus llamadas. Aquí hay frases útiles para hotel, aerolínea, tours o alquiler de autos; adapta las que correspondan a tu empresa."}, {"t": "h3", "title": "Vocabulario"}, {"t": "vocab", "rows": [["booking / reservation", "reserva"], ["availability", "disponibilidad"], ["to book", "reservar"], ["confirmation number", "número de confirmación"], ["check-in / check-out", "entrada / salida"], ["arrival / departure", "llegada / salida"], ["rate / price per night", "tarifa / precio por noche"], ["deposit", "depósito"], ["cancellation policy", "política de cancelación"], ["refund", "reembolso"], ["fully booked / sold out", "lleno / agotado"], ["single / double room", "habitación sencilla / doble"], ["ocean view", "vista al mar"], ["guest", "huésped"], ["adults / children", "adultos / niños"], ["flight number", "número de vuelo"], ["round trip / one way", "ida y vuelta / solo ida"], ["upgrade", "mejora de categoría"], ["special request", "solicitud especial"], ["taxes and fees", "impuestos y cargos"], ["to hold / on hold", "esperar / en espera"], ["to transfer a call", "transferir una llamada"]]}, {"t": "h3", "title": "El guion de una llamada"}, {"t": "phrases", "rows": [["Thank you for calling [company], this is [name]. How may I help you?", "zenk iú for cóling..., dis is... jáu mei ái jelp iú?", "Gracias por llamar a [empresa], habla [nombre]. ¿En qué puedo ayudarle?"], ["I'd be happy to help you with that.", "áid bi jápi tu jelp iú uiz dat", "Con gusto le ayudo con eso."], ["May I have your full name, please?", "méi ái jav iór ful néim, plis?", "¿Me da su nombre completo, por favor?"], ["Could you spell that for me, please?", "kud iú spel dat for mi, plis?", "¿Me lo podría deletrear?"], ["What dates are you looking for?", "uát déits ar iú lúking for?", "¿Qué fechas busca?"], ["How many guests will be staying?", "jáu méni guests uil bi stéiing?", "¿Cuántos huéspedes se hospedarán?"], ["Let me check the availability for you.", "let mi chek de aveilabíliti for iú", "Permítame revisar la disponibilidad."], ["Could you hold for a moment, please?", "kud iú jóuld for a móument, plis?", "¿Puede esperar un momento, por favor?"], ["Thank you for holding.", "zenk iú for jóulding", "Gracias por esperar."], ["We have a double room available for those dates.", "uí jav a dábel rum avéilabol for dóus déits", "Tenemos una habitación doble disponible para esas fechas."], ["The rate is 180 dollars per night, plus taxes.", "de réit is uán-éiti dólars per náit, plas táxes", "La tarifa es 180 dólares por noche, más impuestos."], ["Would you like me to book it for you?", "uud iú láik mi tu buk it for iú?", "¿Desea que se la reserve?"], ["Your confirmation number is ...", "iór konferméishon námber is...", "Su número de confirmación es ..."], ["You will receive a confirmation email shortly.", "iú uil risív a konferméishon ímeil shórtli", "Recibirá un correo de confirmación en breve."], ["Is there anything else I can help you with?", "is der énizing els ái kan jelp iú uiz?", "¿Hay algo más en que pueda ayudarle?"], ["Thank you for choosing us. Have a great day!", "zenk iú for chúsing as. jav a gréit déi", "Gracias por elegirnos. ¡Que tenga un gran día!"]]}, {"t": "h3", "title": "Cuando no entiendes o hay un problema"}, {"t": "phrases", "rows": [["I'm sorry, the line is not clear. Could you repeat that?", "áim sóri, de láin is not clíer...", "Disculpe, la línea no está clara. ¿Puede repetir?"], ["Just to confirm, that's March 15th to the 20th?", "yast tu konférm, dats march fiftínz tu de tuéntiez?", "Para confirmar, ¿del 15 al 20 de marzo?"], ["I apologize for the inconvenience.", "ái apóloyais for de inconvíniens", "Le pido disculpas por el inconveniente."], ["Unfortunately, we are fully booked on those dates.", "anfórchunetli, uí ar fúli bukt...", "Lamentablemente estamos llenos esas fechas."], ["I can offer you an alternative.", "ái kan ófer iú an oltérnativ", "Le puedo ofrecer una alternativa."], ["Let me transfer you to my supervisor.", "let mi transfér iú tu mái supervaisor", "Le transfiero con mi supervisor(a)."], ["There is a cancellation fee of ...", "der is a canseléishon fi of...", "Hay un cargo por cancelación de ..."]]}, {"t": "h3", "title": "Correos electrónicos: frases listas"}, {"t": "bullets", "items": ["<b>Saludo:<\/b> <i>Dear Mr. / Ms. [Apellido],<\/i> — <i>Thank you for your email.<\/i>", "<b>Confirmar:<\/b> <i>I am pleased to confirm your reservation for [dates].<\/i>", "<b>Adjuntar:<\/b> <i>Please find attached your booking confirmation.<\/i>", "<b>Pedir información:<\/b> <i>Could you please send us your flight details?<\/i>", "<b>Disculpa:<\/b> <i>We apologize for any inconvenience this may cause.<\/i>", "<b>Cierre:<\/b> <i>Please do not hesitate to contact us if you have any questions. We look forward to welcoming you. Kind regards, [Nombre]<\/i>"]}, {"t": "dialog", "title": "una reserva por teléfono", "lines": [["Agent", "Thank you for calling. This is Ana. How may I help you?", "Gracias por llamar. Habla Ana. ¿En qué puedo ayudarle?"], ["Caller", "Hi, I'd like to book a room for next weekend.", "Hola, quisiera reservar una habitación para el próximo fin de semana."], ["Agent", "Of course. What are your arrival and departure dates?", "Claro. ¿Cuáles son sus fechas de llegada y salida?"], ["Caller", "Arriving Friday the 20th, leaving Sunday the 22nd.", "Llego el viernes 20, salgo el domingo 22."], ["Agent", "Let me check... Yes, we have an ocean-view room at 210 dollars per night. Would you like to book it?", "Déjeme revisar... Sí, tenemos una con vista al mar a 210 dólares la noche. ¿Desea reservarla?"], ["Caller", "Yes, please.", "Sí, por favor."], ["Agent", "May I have your full name? Could you spell your last name, please?", "¿Su nombre completo? ¿Podría deletrear su apellido?"], ["Caller", "Smith. S-M-I-T-H.", "Smith. S-M-I-T-H."], ["Agent", "Thank you, Mr. Smith. Your confirmation number is A-7-4-2-9.", "Gracias, Sr. Smith. Su número de confirmación es A-7-4-2-9."]]}, {"t": "box", "kind": "tip", "title": "★ Tip para la agente", "items": ["Escribe tu guion completo de llamada en una hoja y tenlo junto a la computadora. Practica con tu esposo en casa: él hace de cliente (¡y que a veces sea un cliente difícil!). Graba tu voz en el celular diciendo el saludo de bienvenida y compárala con la de una compañera nativa."]}, {"t": "h1", "title": "Parte 6 · Ejercicios para practicar", "sub": "Háganlos con lápiz; las respuestas están al final"}, {"t": "exercise", "title": "Ejercicio 1 · Completa con am / is / are", "items": ["I ______ a technician.", "She ______ at work now.", "We ______ from Colombia.", "The store ______ closed on Sunday.", "______ you busy?", "My husband and I ______ new in Aruba."], "note": null}, {"t": "exercise", "title": "Ejercicio 2 · Traduce al inglés", "items": ["¿Cuánto cuesta esto?", "No entiendo. ¿Puede hablar despacio?", "Quisiera abrir una cuenta bancaria.", "El internet no funciona desde ayer.", "Permítame revisar la disponibilidad.", "Tengo dolor de cabeza."], "note": null}, {"t": "exercise", "title": "Ejercicio 3 · Pasado simple: escribe el pasado", "items": ["go → ______", "buy → ______", "work → ______", "pay → ______", "have → ______", "call → ______", "fix → ______", "book → ______"], "note": null}, {"t": "exercise", "title": "Ejercicio 4 · Ordena las palabras", "items": ["you / help / How / I / may / ?", "the / Where / rice / is / ?", "card / pay / I / Can / with / ?", "number / Your / confirmation / is / B-325", "cable / damaged / The / was"], "note": null}, {"t": "exercise", "title": "Ejercicio 5 · ¿Qué dirías? (situaciones)", "items": ["Estás en la caja y quieres saber si aceptan dólares.", "Llegas a casa de un cliente para instalar internet. Preséntate.", "Un cliente te llama y no entendiste su apellido.", "Tu vecino te saluda por primera vez.", "Tienes que decirle al casero que el aire acondicionado no funciona."], "note": null}, {"t": "exercise", "title": "Ejercicio 6 · Deletrea en voz alta (en pareja)", "items": ["Tu nombre completo y apellidos.", "Tu correo electrónico (con «at» y «dot»).", "Tu número de teléfono, número por número.", "Tu dirección en Aruba.", "Un número de confirmación inventado: K7-Q2-J9-G4 (¡cuidado con G y J!)."], "note": "Uno deletrea y el otro escribe. Después cambien de rol y comparen."}, {"t": "h1", "title": "Juegos y role-plays en pareja", "sub": "La práctica más divertida y la que más resultados da"}, {"t": "h2", "title": "Role-plays (10 minutos cada uno)"}, {"t": "p", "text": "Uno hace de cliente/empleado y el otro de ustedes mismos. Usen las frases de esta guía. Luego cambien de rol. La segunda vez, intenten hacerlo <b>sin mirar la guía<\/b>."}, {"t": "h2", "title": "Juegos rápidos"}, {"t": "bullets", "items": ["<b>«What's this?»<\/b> — Uno señala un objeto de la casa; el otro tiene 3 segundos para decir el nombre en inglés. Punto por respuesta correcta.", "<b>20 preguntas<\/b> — Uno piensa en un objeto; el otro adivina solo con preguntas de sí/no en inglés: <i>«Is it in the kitchen? Is it big?»<\/i>", "<b>El día al revés<\/b> — Cuenten su día del final al principio, en pasado.", "<b>Dictado de compras<\/b> — Uno dicta la lista del súper en inglés y el otro la escribe sin ver.", "<b>La palabra del día<\/b> — Cada mañana uno elige una palabra nueva. Quien la use más veces en el día gana (el perdedor lava los platos 😉).", "<b>Noticias de 1 minuto<\/b> — Cada uno cuenta en inglés algo que pasó en su trabajo. El otro hace dos preguntas."]}, {"t": "h1", "title": "Parte 7 · Plan de 12 semanas", "sub": "Una meta clara por semana"}, {"t": "h2", "title": "Hoja de seguimiento semanal"}, {"t": "p", "text": "Imprímanla (o cópienla en el cuaderno) y marquen cada día lo que hicieron. Una para cada uno."}, {"t": "box", "kind": "info", "title": "Nuestra meta", "items": ["Escriban aquí 3 frases que quieren poder decir con confianza dentro de 3 meses:", "1. ____________________________________________________________", "2. ____________________________________________________________", "3. ____________________________________________________________"]}, {"t": "h1", "title": "Respuestas de los ejercicios", "sub": "Revisen juntos y repitan en voz alta las que fallaron"}, {"t": "box", "kind": "warn", "title": "♥ Un último consejo", "items": ["Aprender un idioma de adulto, en un país nuevo y trabajando, es difícil, y ustedes lo están haciendo juntos. Habrá días en que sientan que no avanzan: es normal. Sigan con los 15 minutos diarios, hablen aunque sea con errores, y en unos meses se van a sorprender de todo lo que entienden y dicen.", "<b>You can do it! — ¡Ustedes pueden! — Boso por!<\/b>"]}, {"t": "h1", "title": "Números, fechas, hora y dinero", "sub": "Lo que más se dicta por teléfono y en la caja"}, {"t": "p", "text": "Los números son lo que más falla al principio, y en sus dos trabajos se usan todo el día: precios, fechas de reserva, teléfonos, direcciones, números de orden. Practíquenlos con el juego «Números al oído»."}, {"t": "h3", "title": "Números clave"}, {"t": "vocab", "rows": [["one, two, three", "1, 2, 3"], ["four, five, six", "4, 5, 6"], ["seven, eight, nine", "7, 8, 9"], ["ten, eleven, twelve", "10, 11, 12"], ["thirteen", "13"], ["thirty", "30"], ["fourteen", "14"], ["forty", "40"], ["fifteen", "15"], ["fifty", "50"], ["twenty-one", "21"], ["one hundred", "100"], ["two hundred fifty", "250"], ["one thousand", "1,000"], ["zero / oh", "0 (en teléfonos se dice «oh»)"], ["double five", "55 (en teléfonos)"]]}, {"t": "box", "kind": "tip", "title": "13 o 30", "items": ["<b>thirTEEN<\/b> lleva la fuerza al final; <b>THIRty<\/b> al principio. Si dudan, confirmen: <i>«One-three or three-zero?»<\/i>. Sirve igual para 14/40, 15/50, 16/60."]}, {"t": "h3", "title": "Primero, segundo… (para fechas y pisos)"}, {"t": "vocab", "rows": [["first (1st)", "primero"], ["second (2nd)", "segundo"], ["third (3rd)", "tercero"], ["fourth (4th)", "cuarto"], ["fifth (5th)", "quinto"], ["twelfth (12th)", "duodécimo"], ["twentieth (20th)", "vigésimo"], ["twenty-first (21st)", "vigésimo primero"], ["thirtieth (30th)", "trigésimo"], ["thirty-first (31st)", "trigésimo primero"]]}, {"t": "h3", "title": "Días y meses"}, {"t": "vocab", "rows": [["Monday", "lunes"], ["Tuesday", "martes"], ["Wednesday", "miércoles"], ["Thursday", "jueves"], ["Friday", "viernes"], ["Saturday", "sábado"], ["Sunday", "domingo"], ["January", "enero"], ["February", "febrero"], ["March", "marzo"], ["April", "abril"], ["May", "mayo"], ["June", "junio"], ["July", "julio"], ["August", "agosto"], ["September", "septiembre"], ["October", "octubre"], ["November", "noviembre"], ["December", "diciembre"], ["today / tomorrow", "hoy / mañana"], ["yesterday", "ayer"], ["next week", "la próxima semana"], ["last month", "el mes pasado"]]}, {"t": "h3", "title": "Frases con hora, fecha y dinero"}, {"t": "phrases", "rows": [["What time is it?", "uát táim is it?", "¿Qué hora es?"], ["It's three forty-five.", "its zri fórti fáiv", "Son las 3:45."], ["It's half past two.", "its jaf past tu", "Son las dos y media."], ["At nine in the morning.", "at náin in de mórning", "A las nueve de la mañana."], ["What time do you open?", "uát táim du iú óupen?", "¿A qué hora abren?"], ["We close at six p.m.", "uí clóus at six pi-em", "Cerramos a las 6 p. m."], ["What is today's date?", "uát is tudéis déit?", "¿Qué fecha es hoy?"], ["Today is November fourteenth.", "tudéi is novémber fortínz", "Hoy es 14 de noviembre."], ["From March fifteenth to March twentieth.", "from march fiftínz tu march tuéntiez", "Del 15 al 20 de marzo."], ["My phone number is five six zero, one two three four.", "", "Mi teléfono es 560 1234."], ["The total is forty-five dollars and fifty cents.", "", "El total es 45 dólares con 50."], ["It costs twenty florins.", "it costs tuénti flórins", "Cuesta 20 florines."], ["Is that in florins or in dollars?", "", "¿Eso es en florines o en dólares?"], ["Can you write the number down, please?", "", "¿Me puede escribir el número?"]]}, {"t": "box", "kind": "tip", "title": "Fechas", "items": ["En inglés americano se dice primero el mes: <i>March 15th<\/i>. Al escribir 03/04 puede ser 4 de marzo o 3 de abril; por eso en reservaciones se confirma siempre con el nombre del mes."]}, {"t": "h1", "title": "Por teléfono", "sub": "Llamar, contestar, dejar mensajes y pedir que repitan"}, {"t": "p", "text": "Por teléfono no se ven los gestos, así que cuesta más. La clave es tener frases fijas para ganar tiempo y confirmar todo lo importante repitiéndolo."}, {"t": "phrases", "rows": [["Hello, this is María speaking.", "jelóu, dis is maría spíking", "Hola, habla María."], ["Who is calling, please?", "ju is cóling, plis?", "¿Quién llama, por favor?"], ["May I speak to Mr. Croes, please?", "méi ái spik tu míster crus, plis?", "¿Puedo hablar con el Sr. Croes?"], ["One moment, please.", "uán móument, plis", "Un momento, por favor."], ["He is not available right now.", "ji is not avéilabol ráit náu", "No está disponible en este momento."], ["Can I take a message?", "kan ái téik a mésech?", "¿Quiere dejar un mensaje?"], ["Can I leave a message?", "kan ái liv a mésech?", "¿Puedo dejar un mensaje?"], ["Could you call me back, please?", "kud iú col mi bak, plis?", "¿Me puede devolver la llamada?"], ["I'll call you back in ten minutes.", "áil col iú bak in ten mínits", "Le devuelvo la llamada en diez minutos."], ["Sorry, I can't hear you well.", "sóri, ái kant jíer iú uel", "Disculpe, no lo escucho bien."], ["The connection is bad.", "de konékshon is bad", "La conexión está mala."], ["Could you speak a little louder, please?", "", "¿Puede hablar un poco más alto?"], ["Let me repeat that to make sure.", "", "Déjeme repetirlo para estar seguro(a)."], ["So that's Tuesday at ten, correct?", "", "Entonces es el martes a las diez, ¿correcto?"], ["Sorry, I have the wrong number.", "", "Disculpe, me equivoqué de número."], ["Thank you for calling. Goodbye.", "", "Gracias por llamar. Adiós."]]}, {"t": "box", "kind": "tip", "title": "La técnica del eco", "items": ["Repitan siempre el dato clave con sus palabras: nombre, fecha, hora, número. <i>«So that's two adults, three nights, from the fifth. Correct?»<\/i> Evita errores y les da tiempo para pensar."]}, {"t": "dialog", "title": "dejar un mensaje", "lines": [["You", "Hello, this is Carlos from the telecom company. May I speak to Mrs. Lopez?", "Hola, habla Carlos de la empresa de telecomunicaciones. ¿Puedo hablar con la Sra. López?"], ["Other", "She's not here right now. Can I take a message?", "No está en este momento. ¿Quiere dejar un mensaje?"], ["You", "Yes, please. I'm coming tomorrow at nine to install the internet.", "Sí, por favor. Voy mañana a las nueve a instalar el internet."], ["Other", "Tomorrow at nine. Okay, I'll tell her.", "Mañana a las nueve. Bien, yo le digo."], ["You", "Thank you. My number is five six zero, one two three four.", "Gracias. Mi número es 560 1234."]]}, {"t": "h1", "title": "Carro, servicios y trámites", "sub": "Gasolinera, taller, luz, agua, celular y oficinas"}, {"t": "h3", "title": "Carro y gasolinera"}, {"t": "vocab", "rows": [["gas station", "gasolinera"], ["fill it up", "tanque lleno"], ["flat tire", "llanta ponchada"], ["driver's license", "licencia de conducir"], ["car insurance", "seguro del carro"], ["mechanic", "mecánico"], ["battery", "batería"], ["parking lot", "estacionamiento"], ["roundabout", "rotonda"], ["turn left / right", "doble a la izquierda / derecha"], ["go straight", "siga derecho"], ["traffic", "tráfico"]]}, {"t": "phrases", "rows": [["Twenty florins of gas, please.", "", "Veinte florines de gasolina, por favor."], ["Fill it up, please.", "fil it ap, plis", "Lleno, por favor."], ["My car won't start.", "mái car uóunt start", "Mi carro no arranca."], ["I have a flat tire.", "ái jav a flat táier", "Tengo una llanta ponchada."], ["How much will the repair cost?", "", "¿Cuánto costará la reparación?"], ["When will it be ready?", "uén uil it bi rédi?", "¿Cuándo estará listo?"], ["How do I get to the hospital?", "", "¿Cómo llego al hospital?"], ["Is it far from here?", "is it far from jíer?", "¿Queda lejos de aquí?"]]}, {"t": "h3", "title": "Luz, agua, internet y celular"}, {"t": "vocab", "rows": [["electricity bill", "recibo de luz"], ["water bill", "recibo de agua"], ["due date", "fecha de vencimiento"], ["meter", "medidor"], ["power outage", "apagón"], ["prepaid / postpaid", "prepago / pospago"], ["SIM card", "tarjeta SIM"], ["data plan", "plan de datos"], ["top up", "recargar saldo"], ["contract", "contrato"], ["proof of address", "comprobante de domicilio"], ["ID / identification", "identificación"]]}, {"t": "phrases", "rows": [["I'd like to set up an account.", "", "Quisiera abrir una cuenta (de servicio)."], ["I want to pay this bill.", "ái uánt tu péi dis bil", "Quiero pagar este recibo."], ["There is no water in my house.", "", "No hay agua en mi casa."], ["The power went out.", "de páuer uent áut", "Se fue la luz."], ["I need a SIM card with a data plan.", "", "Necesito una SIM con plan de datos."], ["I'd like to top up twenty florins.", "", "Quisiera recargar veinte florines."], ["Which documents do I need to bring?", "", "¿Qué documentos tengo que traer?"], ["I'm here to renew my permit.", "", "Vengo a renovar mi permiso."], ["Is this the right line?", "is dis de ráit láin?", "¿Esta es la fila correcta?"], ["Could you help me fill out this form?", "", "¿Me ayuda a llenar este formulario?"]]}, {"t": "box", "kind": "tip", "title": "En las oficinas", "items": ["Lleven siempre pasaporte, permiso y un comprobante de domicilio, y anoten antes de salir las tres frases que van a necesitar. En Aruba el departamento de migración se llama DIMAS."]}, {"t": "h1", "title": "Errores típicos de hispanohablantes", "sub": "Corregir estos 20 cambia cómo los escuchan"}, {"t": "p", "text": "Estos errores salen de traducir palabra por palabra desde el español. Todo el mundo los comete; lo importante es reconocerlos."}, {"t": "h3", "title": "Gramática"}, {"t": "table", "head": ["Así no", "Así sí", "Por qué"], "rows": [["I have 30 years.", "I <b>am<\/b> 30 years old.", "La edad va con <i>to be<\/i>."], ["I have hungry / cold.", "I <b>am<\/b> hungry / cold.", "Hambre, frío, sueño, miedo: con <i>to be<\/i>."], ["Is raining. / Is important.", "<b>It<\/b> is raining. / <b>It<\/b> is important.", "En inglés siempre hay sujeto."], ["She work here.", "She work<b>s<\/b> here.", "He / she / it llevan -s."], ["Where you work?", "Where <b>do<\/b> you work?", "Las preguntas necesitan <i>do / does / did<\/i>."], ["I no understand.", "I <b>don't<\/b> understand.", "El negativo es <i>don't / doesn't<\/i>."], ["I didn't went.", "I didn't <b>go<\/b>.", "Después de <i>did<\/i>, el verbo va sin cambios."], ["The people is nice.", "People <b>are<\/b> nice.", "<i>People<\/i> es plural y va sin <i>the<\/i>."], ["I live here since two months.", "I've lived here <b>for<\/b> two months.", "<i>For<\/i> + duración; <i>since<\/i> + fecha."], ["In Monday / in the night.", "<b>On<\/b> Monday / <b>at<\/b> night.", "<i>On<\/i> días, <i>in<\/i> meses y años, <i>at<\/i> horas."], ["I am agree.", "I agree.", "<i>Agree<\/i> ya es verbo."], ["Can you explain me?", "Can you explain <b>it to<\/b> me?", "<i>Explain something to someone<\/i>."], ["I want that you come.", "I want <b>you to<\/b> come.", "<i>Want + persona + to + verbo<\/i>."], ["a red car big", "a big red car", "El adjetivo va antes del sustantivo."]]}, {"t": "h3", "title": "Falsos amigos"}, {"t": "table", "head": ["Palabra en inglés", "Significa", "No significa"], "rows": [["actually", "en realidad", "actualmente (= <i>currently<\/i>)"], ["embarrassed", "avergonzado(a)", "embarazada (= <i>pregnant<\/i>)"], ["to assist", "ayudar", "asistir a (= <i>to attend<\/i>)"], ["library", "biblioteca", "librería (= <i>bookstore<\/i>)"], ["to realize", "darse cuenta", "realizar (= <i>to do, to carry out<\/i>)"], ["sensible", "sensato", "sensible (= <i>sensitive<\/i>)"], ["carpet", "alfombra", "carpeta (= <i>folder<\/i>)"], ["to support", "apoyar", "soportar (= <i>to stand, to put up with<\/i>)"], ["eventually", "al final, con el tiempo", "eventualmente (= <i>occasionally<\/i>)"], ["constipated", "estreñido", "resfriado (= <i>to have a cold<\/i>)"]]}, {"t": "box", "kind": "warn", "title": "Ojo en el trabajo", "items": ["<i>«Please assist the meeting»<\/i> no existe: se dice <i>attend the meeting<\/i>. Y <i>«I will realize the installation»<\/i> debe ser <i>I will do the installation<\/i>."]}, {"t": "h1", "title": "Verbos clave", "sub": "Los irregulares más usados y los verbos de dos palabras del trabajo"}, {"t": "h3", "title": "Verbos irregulares (presente, pasado)"}, {"t": "vocab", "rows": [["be, was / were", "ser / estar"], ["have, had", "tener"], ["do, did", "hacer"], ["go, went", "ir"], ["get, got", "conseguir / recibir"], ["make, made", "hacer / fabricar"], ["say, said", "decir"], ["tell, told", "contar / decir a alguien"], ["see, saw", "ver"], ["come, came", "venir"], ["take, took", "tomar / llevar"], ["give, gave", "dar"], ["know, knew", "saber / conocer"], ["think, thought", "pensar"], ["find, found", "encontrar"], ["buy, bought", "comprar"], ["pay, paid", "pagar"], ["send, sent", "enviar"], ["leave, left", "salir / dejar"], ["bring, brought", "traer"], ["speak, spoke", "hablar"], ["write, wrote", "escribir"], ["read, read", "leer (el pasado suena «red»)"], ["put, put", "poner"], ["cut, cut", "cortar"], ["break, broke", "romper"], ["lose, lost", "perder"], ["forget, forgot", "olvidar"], ["understand, understood", "entender"], ["run, ran", "correr / funcionar"]]}, {"t": "h3", "title": "Verbos de dos palabras (phrasal verbs)"}, {"t": "phrases", "rows": [["turn on / turn off", "tern on / tern of", "prender / apagar"], ["plug in / unplug", "plag in / anplág", "enchufar / desenchufar"], ["set up", "set ap", "instalar, configurar"], ["log in / log out", "log in / log áut", "iniciar / cerrar sesión"], ["fill out", "fil áut", "llenar (un formulario)"], ["pick up", "pik ap", "recoger; contestar el teléfono"], ["hang up", "jang ap", "colgar"], ["call back", "col bak", "devolver la llamada"], ["hold on", "jóuld on", "esperar un momento"], ["look for", "luk for", "buscar"], ["find out", "fáind áut", "averiguar"], ["check in / check out", "chek in / chek áut", "registrarse / hacer la salida"], ["write down", "ráit dáun", "anotar"], ["go ahead", "gou ajéd", "adelante, proceda"], ["run out of", "ran áut of", "quedarse sin"], ["be back", "bi bak", "regresar"]]}, {"t": "box", "kind": "tip", "title": "Cómo aprenderlos", "items": ["No memoricen listas. Aprendan cada verbo dentro de una frase suya: <i>«I set up the router.» «Please fill out this form.» «I'll call you back.»<\/i>"]}, {"t": "h1", "title": "Técnico: diagnóstico, seguridad y reportes", "sub": "Para el día a día en campo"}, {"t": "h3", "title": "Preguntas de diagnóstico al cliente"}, {"t": "phrases", "rows": [["Is the problem with the internet, the TV or the phone?", "", "¿El problema es con el internet, la TV o el teléfono?"], ["Does it happen all the time or only sometimes?", "", "¿Pasa todo el tiempo o solo a veces?"], ["Which lights are on on the modem?", "", "¿Qué luces están prendidas en el módem?"], ["Is the light red, green or blinking?", "", "¿La luz está roja, verde o parpadeando?"], ["Did you restart the modem?", "", "¿Reinició el módem?"], ["Please unplug it, wait ten seconds, and plug it in again.", "", "Desenchúfelo, espere diez segundos y vuelva a enchufarlo."], ["How many devices are connected?", "", "¿Cuántos dispositivos están conectados?"], ["Is the Wi-Fi slow in the whole house or only in one room?", "", "¿El Wi-Fi está lento en toda la casa o solo en un cuarto?"], ["Did anyone move or cut a cable?", "", "¿Alguien movió o cortó un cable?"], ["May I come in? I need to check the equipment.", "", "¿Puedo pasar? Necesito revisar el equipo."]]}, {"t": "h3", "title": "Explicar la solución con palabras simples"}, {"t": "phrases", "rows": [["The signal is weak here because of the walls.", "", "La señal es débil aquí por las paredes."], ["I recommend moving the router to the center of the house.", "", "Recomiendo mover el router al centro de la casa."], ["I changed the connector and tested the line.", "", "Cambié el conector y probé la línea."], ["The speed is now what your plan includes.", "", "La velocidad ya es la que incluye su plan."], ["I couldn't fix it today. I need a part.", "", "No pude arreglarlo hoy. Necesito una pieza."], ["Another technician will come tomorrow.", "", "Otro técnico vendrá mañana."], ["There is an outage in the area. We are working on it.", "", "Hay una caída en la zona. Estamos trabajando en eso."], ["It should be back in a few hours.", "", "Debería volver en unas horas."], ["I'm sorry for the inconvenience.", "", "Disculpe las molestias."]]}, {"t": "h3", "title": "Seguridad en el trabajo"}, {"t": "vocab", "rows": [["hard hat", "casco"], ["safety glasses", "lentes de seguridad"], ["safety harness", "arnés"], ["high voltage", "alto voltaje"], ["power line", "línea eléctrica"], ["caution / danger", "precaución / peligro"], ["first aid kit", "botiquín"], ["cone", "cono"]]}, {"t": "phrases", "rows": [["Is the power off?", "is de páuer of?", "¿Está cortada la corriente?"], ["Hold the ladder, please.", "jóuld de láder, plis", "Sostén la escalera, por favor."], ["Don't touch that cable.", "dóunt tach dat kéibol", "No toques ese cable."], ["Stay back, please.", "stéi bak, plis", "Manténgase atrás, por favor."], ["I need help over here.", "ái nid jelp óuver jíer", "Necesito ayuda aquí."], ["Someone is hurt. Call 911.", "", "Hay alguien herido. Llamen al 911."]]}, {"t": "h3", "title": "Notas para la orden de trabajo"}, {"t": "p", "text": "Las notas se escriben cortas y en pasado. Copien estos modelos y cambien los datos:"}, {"t": "phrases", "rows": [["Replaced damaged drop cable.", "", "Se reemplazó el cable de acometida dañado."], ["Installed new modem and tested speed.", "", "Se instaló módem nuevo y se probó la velocidad."], ["Signal levels normal after repair.", "", "Niveles de señal normales tras la reparación."], ["Customer not home. Left a note.", "", "Cliente ausente. Se dejó una nota."], ["Needs follow-up visit.", "", "Requiere visita de seguimiento."], ["No fault found. Service working.", "", "No se encontró falla. Servicio funcionando."]]}, {"t": "dialog", "title": "reportar al supervisor por radio o teléfono", "lines": [["Supervisor", "Carlos, what's your status?", "Carlos, ¿cuál es tu estado?"], ["Tech", "I finished the first job. I'm on my way to the second one.", "Terminé el primer trabajo. Voy en camino al segundo."], ["Supervisor", "Any problems?", "¿Algún problema?"], ["Tech", "Yes. I ran out of connectors. Can someone bring me a box?", "Sí. Me quedé sin conectores. ¿Alguien me puede traer una caja?"], ["Supervisor", "Okay. Where are you now?", "Bien. ¿Dónde estás ahora?"], ["Tech", "I'm in Noord, near the gas station.", "Estoy en Noord, cerca de la gasolinera."], ["Supervisor", "Copy that. Someone will be there in twenty minutes.", "Entendido. Alguien llega en veinte minutos."]]}, {"t": "h1", "title": "Reservaciones: cambios, pagos y clientes difíciles", "sub": "Lo que viene después de dominar el guion básico"}, {"t": "h3", "title": "Modificar y cancelar"}, {"t": "phrases", "rows": [["I can change the dates for you.", "", "Le puedo cambiar las fechas."], ["May I have your confirmation number, please?", "", "¿Me da su número de confirmación?"], ["I found your reservation.", "", "Encontré su reserva."], ["There is a price difference of forty dollars.", "", "Hay una diferencia de precio de 40 dólares."], ["Free cancellation until 48 hours before arrival.", "", "Cancelación gratis hasta 48 horas antes de la llegada."], ["Your reservation has been cancelled.", "", "Su reserva ha sido cancelada."], ["The refund will take five to seven business days.", "", "El reembolso tarda de cinco a siete días hábiles."], ["This rate is non-refundable.", "", "Esta tarifa no es reembolsable."]]}, {"t": "h3", "title": "Pagos"}, {"t": "phrases", "rows": [["How would you like to pay?", "", "¿Cómo desea pagar?"], ["May I have the card number, please?", "", "¿Me da el número de la tarjeta?"], ["And the expiration date?", "", "¿Y la fecha de vencimiento?"], ["The name on the card, please.", "", "El nombre que aparece en la tarjeta, por favor."], ["We require a deposit of one night.", "", "Requerimos un depósito de una noche."], ["The payment was declined. Do you have another card?", "", "El pago fue rechazado. ¿Tiene otra tarjeta?"], ["The payment went through.", "", "El pago se procesó."], ["The total, including taxes, is six hundred thirty dollars.", "", "El total, con impuestos, es 630 dólares."]]}, {"t": "h3", "title": "Ofrecer más (venta amable)"}, {"t": "phrases", "rows": [["Would you like to add breakfast?", "", "¿Le gustaría agregar el desayuno?"], ["For twenty dollars more, I can offer you an ocean view.", "", "Por 20 dólares más le puedo ofrecer vista al mar."], ["Do you need airport transportation?", "", "¿Necesita transporte al aeropuerto?"], ["Is this for a special occasion?", "", "¿Es para una ocasión especial?"]]}, {"t": "h3", "title": "Clientes molestos: escuchar, disculparse, resolver"}, {"t": "phrases", "rows": [["I understand how frustrating this is.", "", "Entiendo lo frustrante que es esto."], ["I'm very sorry about that.", "", "Lo siento mucho."], ["Let me see what I can do for you.", "", "Déjeme ver qué puedo hacer por usted."], ["Thank you for your patience.", "", "Gracias por su paciencia."], ["Here is what I can offer.", "", "Esto es lo que le puedo ofrecer."], ["I'm not able to do that, but I can do this.", "", "Eso no lo puedo hacer, pero puedo hacer esto."], ["I'll make sure this gets resolved.", "", "Me aseguraré de que esto se resuelva."], ["Would you like to speak with my supervisor?", "", "¿Desea hablar con mi supervisor(a)?"]]}, {"t": "box", "kind": "tip", "title": "La fórmula", "items": ["Primero escuchar sin interrumpir, luego reconocer el problema, disculparse una vez y ofrecer una solución concreta. Hablar más despacio y más bajo ayuda a calmar la llamada."]}, {"t": "dialog", "title": "un cliente molesto", "lines": [["Caller", "I booked an ocean-view room and they gave me a parking-lot view!", "¡Reservé vista al mar y me dieron vista al estacionamiento!"], ["Agent", "I'm very sorry about that. I understand how frustrating this is.", "Lo siento mucho. Entiendo lo frustrante que es."], ["Agent", "May I have your confirmation number, please?", "¿Me da su número de confirmación?"], ["Caller", "It's B-5-5-2-1.", "Es B-5-5-2-1."], ["Agent", "Thank you for your patience. I found your reservation. Let me see what I can do.", "Gracias por su paciencia. Encontré su reserva. Déjeme ver qué puedo hacer."], ["Agent", "I can move you to an ocean-view room today at no extra cost.", "Lo puedo cambiar hoy a una habitación con vista al mar sin costo adicional."], ["Caller", "Okay. Thank you.", "Está bien. Gracias."], ["Agent", "You're welcome. Is there anything else I can help you with?", "De nada. ¿Hay algo más en que pueda ayudarle?"]]}, {"t": "h1", "title": "Sonar amable y profesional", "sub": "El inglés directo suena brusco; estas fórmulas lo suavizan"}, {"t": "p", "text": "En español se puede decir «deme un café» con una sonrisa y suena bien. En inglés, la misma frase sin <i>please<\/i> ni <i>could<\/i> suena a orden. En servicio al cliente, estas fórmulas valen oro."}, {"t": "table", "head": ["Directo (suena brusco)", "Amable y profesional"], "rows": [["Give me your name.", "<b>May I have<\/b> your name, please?"], ["Wait.", "<b>One moment, please.<\/b>"], ["What?", "<b>Sorry, could you repeat that?<\/b>"], ["I want a coffee.", "<b>I'd like<\/b> a coffee, please."], ["You are wrong.", "<b>I think there may be a mistake.<\/b>"], ["No.", "<b>I'm afraid that's not possible.<\/b>"], ["I don't know.", "<b>Let me find out for you.<\/b>"], ["Sign here.", "<b>Could you sign here, please?<\/b>"], ["You have to pay.", "<b>There is a fee of ten dollars.<\/b>"]]}, {"t": "phrases", "rows": [["Could you please…?", "kud iú plis…?", "¿Podría, por favor…?"], ["Would you mind waiting a moment?", "", "¿Le importaría esperar un momento?"], ["I'm afraid we are closed.", "", "Me temo que estamos cerrados."], ["Let me find out for you.", "", "Déjeme averiguarlo."], ["That's a good question.", "", "Buena pregunta."], ["Take your time.", "téik iór táim", "Tómese su tiempo."], ["My pleasure.", "mái plésher", "Con gusto."], ["I appreciate it.", "ái aprísheit it", "Se lo agradezco."], ["No worries.", "nou uórris", "No se preocupe."], ["Have a good one!", "jav a gud uán", "¡Que le vaya bien!"]]}, {"t": "h3", "title": "Para ganar tiempo mientras piensan"}, {"t": "phrases", "rows": [["Let me think.", "let mi zink", "Déjeme pensar."], ["How can I say this…", "", "Cómo le digo…"], ["I mean…", "ái min", "O sea…"], ["Let me check.", "let mi chek", "Déjeme revisar."], ["Give me one second.", "", "Deme un segundo."]]}], "tips": [["1. Poco, pero todos los días", "15 a 30 minutos diarios funcionan mejor que 3 horas el domingo. Elijan un momento fijo: el café de la mañana, el viaje al trabajo o después de cenar."], ["2. La «hora en inglés» en casa", "Escojan una hora al día (por ejemplo, la cena) en la que solo se habla inglés entre ustedes. Si no saben una palabra, la dicen en español y la buscan juntos. Sin burlas: los dos están aprendiendo."], ["3. Etiqueten la casa", "Peguen papelitos con el nombre en inglés: <i>fridge, stove, sink, door, window, mirror, closet<\/i>. Cada vez que toquen algo, díganlo en voz alta."], ["4. Cambien el idioma del teléfono", "Pongan el celular, WhatsApp y Netflix en inglés. Ya saben dónde está cada botón, así que aprenderán las palabras sin esfuerzo."], ["5. Aprendan frases, no palabras sueltas", "En vez de memorizar «receipt = recibo», memoricen «<i>Can I have the receipt, please?<\/i>». Las frases completas se usan de inmediato."], ["6. Hablen solos (en serio)", "Narren lo que hacen: «<i>I'm making coffee. I'm opening the door. I'm going to work.<\/i>» Esto entrena la boca y el cerebro a la vez."], ["7. Técnica del «shadowing» (sombra)", "Pongan un audio corto en inglés, pausen después de cada frase y repítanla imitando el ritmo y la entonación, como un eco. 5 minutos al día mejoran mucho la pronunciación."], ["8. Series con subtítulos en inglés", "Primero con subtítulos en español, luego en inglés. Elijan comedias o series del día a día (no de época ni ciencia ficción). Vean el mismo episodio dos veces."], ["9. Preparen antes de salir", "Antes de ir al banco, al médico o a una cita, escriban 3 a 5 frases que van a necesitar y practíquenlas en el carro. Así llegan con confianza."], ["10. Un cuaderno compartido", "Cada vez que escuchen una frase nueva en el trabajo o en la calle, anótenla. El domingo se enseñan mutuamente lo que aprendió cada uno."], ["11. Equivocarse es parte del plan", "La gente entiende un inglés imperfecto. Lo importante es comunicar. Si no entienden, digan: «<i>Sorry, my English is not very good. Can you speak slowly, please?<\/i>»"], ["12. Usen apps como complemento", "Apps de vocabulario y de repetición espaciada (tarjetas) ayudan 10 minutos al día, pero no reemplazan hablar con personas."], ["13. Aprovechen el trabajo", "Su trabajo es su mejor clase: cada día escuchan el mismo vocabulario. Pidan a un compañero que les corrija una frase al día."], ["14. Celebren los logros", "Primera llamada en inglés, primer correo sin traductor, primera conversación con un vecino: ¡celébrenlo! La motivación es combustible."]], "pron": [["La «e» antes de S", "En español decimos «estudent», «espeak». En inglés se empieza directo con la S: <b>s-tudent, s-peak, s-chool, s-pain<\/b>. Truco: hagan un «ssss» de serpiente y luego la palabra."], ["Vocales cortas y largas", "<b>ship<\/b> (barco, «i» corta) vs. <b>sheep<\/b> (oveja, «ii» larga). <b>live<\/b> vs. <b>leave<\/b>; <b>full<\/b> vs. <b>fool<\/b>. Alarguen la vocal cuando hay «ee» o «ea»."], ["La TH", "Pongan la punta de la lengua entre los dientes y soplen: <b>think, thank you, three<\/b>. En <b>this, that, the, mother<\/b> es igual pero con vibración (como una «d» suave)."], ["V y B son distintas", "La <b>V<\/b> se hace con los dientes de arriba tocando el labio de abajo: <b>very, van, five<\/b>. La <b>B<\/b> con los dos labios: <b>bed, bus<\/b>."], ["Las consonantes finales", "No se comen el final: <b>work-ed, ask-ed, cost-s, want-s<\/b>. En inglés el final cambia el significado (<i>want<\/i> vs. <i>won't<\/i>)."], ["La terminación -ED", "Suena «t» después de sonidos sordos (<i>worked<\/i> = «uorkt»), «d» en la mayoría (<i>called<\/i> = «cold»), e «id» solo después de t/d (<i>wanted<\/i> = «uántid»)."], ["La H suena", "La H en inglés se pronuncia como una «j» suave: <b>hello<\/b> («jelóu»), <b>house<\/b> («jáus»), <b>help<\/b> («jelp»)."], ["La J y la Y", "<b>J<\/b> suena «ll» fuerte o «dy»: <b>job<\/b> («dyob»). <b>Y<\/b> suena «i»: <b>yes<\/b> («iés»). Nunca confundan <b>yes<\/b> con <b>Jess<\/b>."]], "plan": [["1", "Supervivencia", "Frases de supervivencia + saludos. Cambiar el teléfono a inglés. Etiquetar la casa."], ["2", "Pronunciación y alfabeto", "Alfabeto y código fonético. Deletrear nombres, correos y teléfonos."], ["3", "Supermercado", "Vocabulario de comida. Lista de compras en inglés. Ir y pagar hablando solo inglés."], ["4", "Casa y rutina", "Presente simple. Juego «Three things» en cada cena. Primera «hora en inglés»."], ["5", "Trabajo I", "Cada uno memoriza sus 15 frases de trabajo más importantes."], ["6", "Pasado simple", "Verbos irregulares. Contar el día en pasado. Role-play de vecinos."], ["7", "Trabajo II", "Diálogos completos: visita técnica y llamada de reserva. Grabarse y escucharse."], ["8", "Trámites y salud", "Banco, médico, farmacia, emergencias. Escribir la frase del 911 y pegarla en la nevera."], ["9", "Futuro y cortesía", "going to / will / could / would. Correos de trabajo con frases listas."], ["10", "Escuchar", "Un episodio de serie a la semana con subtítulos en inglés. Shadowing 5 min/día."], ["11", "Clientes difíciles", "Quejas, disculpas, alternativas, cancelaciones. Role-play de «cliente difícil»."], ["12", "Repaso y celebración", "Repetir todos los ejercicios sin mirar. Salir a cenar y pedir todo en inglés. ¡Celebrar!"]], "rp": [["Supermercado", "Uno es el cajero, el otro compra 5 productos. Pregunten precios, paguen y pidan el recibo."], ["Técnico en casa", "Ella es una clienta molesta porque no tiene internet; él llega, pregunta, revisa y explica la solución."], ["Llamada de reserva", "Él llama para reservar un hotel de 3 noches para 2 adultos y 1 niño; ella sigue el guion completo."], ["Cliente difícil", "Él llama para cancelar una reserva y pide reembolso; ella explica la política de cancelación con cortesía."], ["Nuevos vecinos", "Preséntense, digan de dónde son, a qué se dedican y pidan una recomendación de playa."], ["En el médico", "Uno es el doctor; el otro describe síntomas: desde cuándo, dónde duele, alergias."], ["Llamada de emergencia", "Practiquen decir al 911 qué pasó y su dirección completa, claro y despacio."]], "ans": [["Ejercicio 1", "1. am · 2. is · 3. are · 4. is · 5. Are · 6. are"], ["Ejercicio 2", "1. How much is this? · 2. I don't understand. Can you speak slowly, please? · 3. I'd like to open a bank account. · 4. The internet hasn't worked since yesterday. / The internet has been down since yesterday. · 5. Let me check the availability. · 6. I have a headache."], ["Ejercicio 3", "went · bought · worked · paid · had · called · fixed · booked"], ["Ejercicio 4", "1. How may I help you? · 2. Where is the rice? · 3. Can I pay with card? · 4. Your confirmation number is B-325. · 5. The cable was damaged."], ["Ejercicio 5", "(Respuestas posibles) 1. Do you accept US dollars? · 2. Good morning, I'm the technician from [company]. I'm here to install your internet. · 3. I'm sorry, could you spell your last name, please? · 4. Hi! Nice to meet you. I'm [name]. We just moved in. · 5. Hi, the AC is not working. When can you come to fix it?"], ["Ejercicio 6", "Respuesta libre. Revisen especialmente: E («i») / I («ai»), G («dyi») / J («dyei»), @ = «at», . = «dot». K7-Q2-J9-G4 = «kei-seven, kiu-tu, dyei-náin, dyi-for»."]]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var $ = function(s, r){ return (r||document).querySelector(s); };
var view = $('#view');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

var synth = window.speechSynthesis || null, voice=null;
function pickVoice(){ if(!synth) return; var vs=synth.getVoices()||[]; voice = vs.filter(function(v){return /^en[-_]US/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null; }
if(synth){ pickVoice(); try{ synth.addEventListener('voiceschanged',pickVoice); }catch(e){} }
function clean(t){ return plain(t).replace(/\[company\]/gi,'the company').replace(/\[name\]/gi,'Ana').replace(/\[address\]/gi,'the address').replace(/\[[^\]]*\]/g,'').replace(/\s*\([^)]*\)/g,'').replace(/\.\.\./g,' ').replace(/ \/ /g,'. ').replace(/—/g,'. ').replace(/→/g,', '); }
var ttsCap=null, sayTok=0, curU=null;
function hookTts(){ try{ if(window.claude&&window.claude.use){ Promise.resolve(window.claude.use('tts')).then(function(t){ ttsCap=t||null; }).catch(function(){}); return true; } }catch(e){} return false; }
if(!hookTts()){ window.addEventListener('load',hookTts); }
function canSpeak(){ return !!(ttsCap||synth); }
function stopAll(){ sayTok++; try{ if(ttsCap) ttsCap.stop(); }catch(e){} try{ if(synth&&(synth.speaking||synth.pending)) synth.cancel(); }catch(e){} document.querySelectorAll('.speaking').forEach(function(x){x.classList.remove('speaking');}); }
var NOAUDIO='El audio no está disponible aquí. Abran la guía en Chrome o Safari y revisen el volumen del teléfono.';
function say(text, slow, el, done){
  var tok=++sayTok, txt=clean(text), fin=false;
  document.querySelectorAll('.speaking').forEach(function(x){x.classList.remove('speaking');});
  if(el) el.classList.add('speaking');
  function finish(ok,msg){ if(fin) return; fin=true; if(el) el.classList.remove('speaking'); if(tok!==sayTok) return; if(msg) toast(msg); if(done) done(!!ok); }
  function browser(){
    if(!synth){ finish(false,NOAUDIO); return; }
    try{
      var busy=synth.speaking||synth.pending; if(busy) synth.cancel();
      var u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; if(!voice) pickVoice(); if(voice&&!/Android/i.test(navigator.userAgent)) u.voice=voice; u.rate=slow?0.6:0.9;
      var started=false, wd;
      u.onstart=function(){ started=true; clearTimeout(wd); };
      u.onend=function(){ clearTimeout(wd); finish(true); };
      u.onerror=function(ev){ clearTimeout(wd); var c=ev&&ev.error; if(c==='interrupted'||c==='canceled'){ finish(false); } else finish(false,NOAUDIO); };
      curU=u; /* keep a reference: some browsers drop the utterance otherwise */
      var go=function(){ if(tok!==sayTok){ finish(false); return; } try{ synth.resume(); }catch(e){} synth.speak(u); wd=setTimeout(function(){ if(!started&&!fin){ try{synth.cancel();}catch(e){} finish(false,NOAUDIO); } },7000); };
      if(busy) setTimeout(go,120); else go();
    }catch(e){ finish(false,NOAUDIO); }
  }
  if(ttsCap){
    try{ if(synth&&(synth.speaking||synth.pending)) synth.cancel(); }catch(e){}
    var cap=ttsCap;
    var sp; try{ sp=Promise.resolve(cap.speak(txt,{language:'en',rate:slow?0.7:1})); }catch(e){ sp=Promise.reject(e); }
    sp.then(function(){ finish(true); }).catch(function(err){
      if(tok!==sayTok){ finish(false); return; }
      var c=err&&err.code;
      if(c==='not_granted'){ ttsCap=null; browser(); }
      else if(c==='rate_limited'){ finish(false,'Demasiados audios seguidos. Esperen unos segundos.'); }
      else if(c==='busy'){ finish(false,'Terminen el dictado por voz para poder escuchar.'); }
      else if(c==='viewer_stopped'||c==='stopped'||c==='replaced'||c==='cancelled'||c==='canceled'){ finish(false); }
      else browser();
    });
  } else browser();
}
var toastT; function toast(m){ var t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3200); }

    case 'phrases': return b.rows.map(function(r){return phraseRow(r[0],r[1],r[2]);}).join('');

    default: return '';
  } }

function touch(){ var m=me(), t=today(); if(!m.days[t]){ m.days[t]=1; save(); } }
function streak(){ var d=me().days, t=today(), n=0; if(!d[t]) t--; while(d[t]){ n++; t--; } return n; }

function hookCaps(late){ var ok=false; try{ ok=!!(window.claude&&window.claude.use); }catch(e){}
  if(!ok&&!late&&document.readyState!=='complete'){ window.addEventListener('load',function(){ hookCaps(true); }); return; }

    var pr; try{ pr=Promise.resolve(window.claude.use(n)); }catch(e){ pr=Promise.resolve(null); }
    pr.then(function(v){ caps[n]=v||null; },function(){ caps[n]=null; }).then(function(){

function pool(k,noMine){ var out=[], seen={};
  TOPICS.forEach(function(t){ if((k!=='all'&&t.k!==k)||t.nopool) return;
    [].concat(t.s).forEach(function(i){ SECS[i].blocks.forEach(function(b){
      if(b.t==='phrases') b.rows.forEach(function(r){ var en=plain(r[0]); if(seen[en]) return; seen[en]=1; out.push({en:en,pr:r[1],es:plain(r[2]),ph:1}); });
      if(b.t==='vocab') b.rows.forEach(function(r){ var en=plain(r[0]); if(seen[en]) return; seen[en]=1; out.push({en:en,pr:'',es:plain(r[1])}); });
    }); }); });
  if(!noMine&&mem&&(k==='all'||k==='mio')) me().mine.forEach(function(x){ if(!seen[x.en]){ seen[x.en]=1; out.push({en:x.en,pr:'',es:x.es,ph:1,mine:1}); } });
  return out; }
ALLPH=pool('all',true).filter(function(x){return x.ph;});

function block(b){
  switch(b.t){
    case 'h2': return '<h2>'+b.title+'</h2>';

    case 'box': return '<aside class="box '+b.kind+'">'+(b.title?'<strong class="t">'+b.title.replace(/^[★♥⚠]\s*/,'')+'</strong>':'')+b.items.map(function(i){return '<p>'+i+'</p>';}).join('')+'</aside>';
    case 'phrases': return b.rows.map(function(r){return phraseRow(r[0],r[1],r[2]);}).join('');
    case 'vocab': return '<div class="vgrid">'+b.rows.map(function(r){ var m=/^([A-Z]) – /.exec(r[0]); var s=m?(m[1]+', as in '+r[1]):r[0].replace(/\s*\([^)]*\)/g,'');
        return '<button class="v" data-say="'+esc(s)+'"><b lang="en">'+r[0]+'</b><span>'+r[1]+'</span></button>'; }).join('')+'</div>';
    case 'table': return '<div class="tscroll"><table class="t"><tr>'+b.head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+b.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
    case 'dialog': return '<div class="dlg"><h4><span>Diálogo: '+b.title+'</span><span class="row"><button class="btn small" data-dlg="all">Escuchar todo</button><button class="btn small" data-dlg="es">Ocultar español</button></span></h4>'+

    default: return '';
  } }

    setTimeout(function(){ if(!alive()) return; say(c.en,false,null,function(ok2){ if(!ok2||!alive()){ g0.auto=false; if(G===g0) shadow(); return; }

/* micrófono */
var mic={on:false,text:'',target:'',heardAt:0};
function wireMic(){ var d=caps.dictation; if(!d||mic.wired) return; mic.wired=true;
  try{ d.onPartial(function(x){ var f=$('#micFb'); if(f&&mic.on){ f.className='fb'; f.textContent=(x&&x.text)||''; } });
    d.onFinal(function(x){ mic.text+=' '+((x&&x.text)||''); if(mic.on){ try{ d.stop(); }catch(e){} } });
    d.onState(function(x){ if(x&&x.state==='listening'){ mic.on=true; micBtn(); } else if(x&&x.state==='idle'){ var was=mic.on; mic.on=false; micBtn(); if(was) micScore(); } }); }catch(e){} }
function micBtn(){ var b=$('#micBtn'); if(b) b.textContent=mic.on?'Escuchando… toquen para terminar':'Decirla al micrófono'; }
function stopMic(){ if(mic.on&&caps.dictation){ try{ caps.dictation.stop(); }catch(e){} } mic.on=false; }
function micScore(){ var f=$('#micFb'); if(!f) return; var heard=norm(mic.text).split(' ').filter(Boolean), want=norm(mic.target).split(' ').filter(Boolean);
  if(!heard.length){ f.className='fb bad'; f.textContent='No se escuchó nada. Acérquense al micrófono y prueben otra vez.'; return; }
  var hit=0, left=heard.slice(); want.forEach(function(w){ var i=left.indexOf(w); if(i>=0){ hit++; left.splice(i,1); } }); var pct=Math.round(100*hit/want.length);
  f.className='fb '+(pct>=80?'ok':'bad'); f.textContent='Se entendió: «'+mic.text.trim()+'». Coincide '+pct+'%.'+(pct>=80?' Muy bien.':' Escuchen la frase lenta y prueben otra vez.'); touch(); }

function tutorPrompt(sc){ return 'You are an English conversation partner for a Spanish-speaking adult beginner (CEFR A1-A2) who just moved to Aruba. Role-play this situation: '+sc+'\n\nRules:\n- Stay in character. Use short, simple, natural English: one or two sentences, common words.\n- Always end your turn with something the learner can answer.\n- After each learner message, check their English.\n- Reply in EXACTLY this format, three lines, nothing else:\nEN: <your line in the role-play, in English>\nES: <Spanish translation of your line>\nTIP: <in Spanish: if the learner\'s last message had a mistake, show the corrected sentence in English and explain it in one short sentence; if it was fine, say "Muy bien." and optionally a more natural way to say it; on your first turn write "Empiecen cuando quieran.">\n\nStart now with your first line.'; }
function parseTutor(t){ function pick(k){ var m=new RegExp('(?:^|\\n)\\s*'+k+':\\s*([\\s\\S]*?)(?=\\n\\s*(?:EN|ES|TIP):|$)').exec(t); return m?m[1].trim():''; } var en=pick('EN'); return {en:en||t.trim(),es:pick('ES'),tip:pick('TIP')}; }

function chatDraw(pending){ var c=$('#chat'); if(!c||!G.chat) return;

  c.scrollTop=c.scrollHeight; }
function tutorTurn(){ var g0=G; if(g0.busy) return; g0.busy=true; chatDraw('Escribiendo…');
