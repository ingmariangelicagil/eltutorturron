, "¿Qué fecha es hoy?"], ["Today is November fourteenth.", "tudéi is novémber fortínz", "Hoy es 14 de noviembre."], ["From March fifteenth to March twentieth.", "from march fiftínz tu march tuéntiez", "Del 15 al 20 de marzo."], ["My phone number is five six zero, one two three four.", "", "Mi teléfono es 560 1234."], ["The total is forty-five dollars and fifty cents.", "", "El total es 45 dólares con 50."], ["It costs twenty florins.", "it costs tuénti flórins", "Cuesta 20 florines."], ["Is that in florins or in dollars?", "", "¿Eso es en florines o en dólares?"], ["Can you write the number down, please?", "", "¿Me puede escribir el número?"]]}, {"t": "box", "kind": "tip", "title": "Fechas", "items": ["En inglés americano se dice primero el mes: <i>March 15th<\/i>. Al escribir 03/04 puede ser 4 de marzo o 3 de abril; por eso en reservaciones se confirma siempre con el nombre del mes."]}, {"t": "h1", "title": "Por teléfono", "sub": "Llamar, contestar, dejar mensajes y pedir que repitan"}, {"t": "p", "text": "Por teléfono no se ven los gestos, así que cuesta más. La clave es tener frases fijas para ganar tiempo y confirmar todo lo importante repitiéndolo."}, {"t": "phrases", "rows": [["Hello, this is María speaking.", "jelóu, dis is maría spíking", "Hola, habla María."], ["Who is calling, please?", "ju is cóling, plis?", "¿Quién llama, por favor?"], ["May I speak to Mr. Croes, please?", "méi ái spik tu míster crus, plis?", "¿Puedo hablar con el Sr. Croes?"], ["One moment, please.", "uán móument, plis", "Un momento, por favor."], ["He is not available right now.", "ji is not avéilabol ráit náu", "No está disponible en este momento."], ["Can I take a message?", "kan ái téik a mésech?", "¿Quiere dejar un mensaje?"], ["Can I leave a message?", "kan ái liv a mésech?", "¿Puedo dejar un mensaje?"], ["Could you call me back, please?", "kud iú col mi bak, plis?", "¿Me puede devolver la llamada?"], ["I'll call you back in ten minutes.", "áil col iú bak in ten mínits", "Le devuelvo la llamada en diez minutos."], ["Sorry, I can't hear you well.", "sóri, ái kant jíer iú uel", "Disculpe, no lo escucho bien."], ["The connection is bad.", "de konékshon is bad", "La conexión está mala."], ["Could you speak a little louder, please?", "", "¿Puede hablar un poco más alto?"], ["Let me repeat that to make sure.", "", "Déjeme repetirlo para estar seguro(a)."], ["So that's Tuesday at ten, correct?", "", "Entonces es el martes a las diez, ¿correcto?"], ["Sorry, I have the wrong number.", "", "Disculpe, me equivoqué de número."], ["Thank you for calling. Goodbye.", "", "Gracias por llamar. Adiós."]]}, {"t": "box", "kind": "tip", "title": "La técnica del eco", "items": ["Repitan siempre el dato clave con sus palabras: nombre, fecha, hora, número. <i>«So that's two adults, three nights, from the fifth. Correct?»<\/i> Evita errores y les da tiempo para pensar."]}, {"t": "dialog", "title": "dejar un mensaje", "lines": [["You", "Hello, this is Carlos from the telecom company. May I speak to Mrs. Lopez?", "Hola, habla Carlos de la empresa de telecomunicaciones. ¿Puedo hablar con la Sra. López?"], ["Other", "She's not here right now. Can I take a message?", "No está en este momento. ¿Quiere dejar un mensaje?"], ["You", "Yes, please. I'm coming tomorrow at nine to install the internet.", "Sí, por favor. Voy mañana a las nueve a instalar el internet."], ["Other", "Tomorrow at nine. Okay, I'll tell her.", "Mañana a las nueve. Bien, yo le digo."], ["You", "Thank you. My number is five six zero, one two three four.", "Gracias. Mi número es 560 1234."]]}, {"t": "h1", "title": "Carro, servicios y trámites", "sub": "Gasolinera, taller, luz, agua, celular y oficinas"}, {"t": "h3", "title": "Carro y gasolinera"}, {"t": "vocab", "rows": [["gas station", "gasolinera"], ["fill it up", "tanque lleno"], ["flat tire", "llanta ponchada"], ["driver's license", "licencia de conducir"], ["car insurance", "seguro del carro"], ["mechanic", "mecánico"], ["battery", "batería"], ["parking lot", "estacionamiento"], ["roundabout", "rotonda"], ["turn left / right", "doble a la izquierda / derecha"], ["go straight", "siga derecho"], ["traffic", "tráfico"]]}, {"t": "phrases", "rows": [["Twenty florins of gas, please.", "", "Veinte florines de gasolina, por favor."], ["Fill it up, please.", "fil it ap, plis", "Lleno, por favor."], ["My car won't start.", "mái car uóunt start", "Mi carro no arranca."], ["I have a flat tire.", "ái jav a flat táier", "Tengo una llanta ponchada."], ["How much will the repair cost?", "", "¿Cuánto costará la reparación?"], ["When will it be ready?", "uén uil it bi rédi?", "¿Cuándo estará listo?"], ["How do I get to the hospital?", "", "¿Cómo llego al hospital?"], ["Is it far from here?", "is it far from jíer?", "¿Queda lejos de aquí?"]]}, {"t": "h3", "title": "Luz, agua, internet y celular"}, {"t": "vocab", "rows": [["electricity bill", "recibo de luz"], ["water bill", "recibo de agua"], ["due date", "fecha de vencimiento"], ["meter", "medidor"], ["power outage", "apagón"], ["prepaid / postpaid", "prepago / pospago"], ["SIM card", "tarjeta SIM"], ["data plan", "plan de datos"], ["top up", "recargar saldo"], ["contract", "contrato"], ["proof of address", "comprobante de domicilio"], ["ID / identification", "identificación"]]}, {"t": "phrases", "rows": [["I'd like to set up an account.", "", "Quisiera abrir una cuenta (de servicio)."], ["I want to pay this bill.", "ái uánt tu péi dis bil", "Quiero pagar este recibo."], ["There is no water in my house.", "", "No hay agua en mi casa."], ["The power went out.", "de páuer uent áut", "Se fue la luz."], ["I need a SIM card with a data plan.", "", "Necesito una SIM con plan de datos."], ["I'd like to top up twenty florins.", "", "Quisiera recargar veinte florines."], ["Which documents do I need to bring?", "", "¿Qué documentos tengo que traer?"], ["I'm here to renew my permit.", "", "Vengo a renovar mi permiso."], ["Is this the right line?", "is dis de ráit láin?", "¿Esta es la fila correcta?"], ["Could you help me fill out this form?", "", "¿Me ayuda a llenar este formulario?"]]}, {"t": "box", "kind": "tip", "title": "En las oficinas", "items": ["Lleven siempre pasaporte, permiso y un comprobante de domicilio, y anoten antes de salir las tres frases que van a necesitar. En Aruba el departamento de migración se llama DIMAS."]}, {"t": "h1", "title": "Errores típicos de hispanohablantes", "sub": "Corregir estos 20 cambia cómo los escuchan"}, {"t": "p", "text": "Estos errores salen de traducir palabra por palabra desde el español. Todo el mundo los comete; lo importante es reconocerlos."}, {"t": "h3", "title": "Gramática"}, {"t": "table", "head": ["Así no", "Así sí", "Por qué"], "rows": [["I have 30 years.", "I <b>am<\/b> 30 years old.", "La edad va con <i>to be<\/i>."], ["I have hungry / cold.", "I <b>am<\/b> hungry / cold.", "Hambre, frío, sueño, miedo: con <i>to be<\/i>."], ["Is raining. / Is important.", "<b>It<\/b> is raining. / <b>It<\/b> is important.", "En inglés siempre hay sujeto."], ["She work here.", "She work<b>s<\/b> here.", "He / she / it llevan -s."], ["Where you work?", "Where <b>do<\/b> you work?", "Las preguntas necesitan <i>do / does / did<\/i>."], ["I no understand.", "I <b>don't<\/b> understand.", "El negativo es <i>don't / doesn't<\/i>."], ["I didn't went.", "I didn't <b>go<\/b>.", "Después de <i>did<\/i>, el verbo va sin cambios."], ["The people is nice.", "People <b>are<\/b> nice.", "<i>People<\/i> es plural y va sin <i>the<\/i>."], ["I live here since two months.", "I've lived here <b>for<\/b> two months.", "<i>For<\/i> + duración; <i>since<\/i> + fecha."], ["In Monday / in the night.", "<b>On<\/b> Monday / <b>at<\/b> night.", "<i>On<\/i> días, <i>in<\/i> meses y años, <i>at<\/i> horas."], ["I am agree.", "I agree.", "<i>Agree<\/i> ya es verbo."], ["Can you explain me?", "Can you explain <b>it to<\/b> me?", "<i>Explain something to someone<\/i>."], ["I want that you come.", "I want <b>you to<\/b> come.", "<i>Want + persona + to + verbo<\/i>."], ["a red car big", "a big red car", "El adjetivo va antes del sustantivo."]]}, {"t": "h3", "title": "Falsos amigos"}, {"t": "table", "head": ["Palabra en inglés", "Significa", "No significa"], "rows": [["actually", "en realidad", "actualmente (= <i>currently<\/i>)"], ["embarrassed", "avergonzado(a)", "embarazada (= <i>pregnant<\/i>)"], ["to assist", "ayudar", "asistir a (= <i>to attend<\/i>)"], ["library", "biblioteca", "librería (= <i>bookstore<\/i>)"], ["to realize", "darse cuenta", "realizar (= <i>to do, to carry out<\/i>)"], ["sensible", "sensato", "sensible (= <i>sensitive<\/i>)"], ["carpet", "alfombra", "carpeta (= <i>folder<\/i>)"], ["to support", "apoyar", "soportar (= <i>to stand, to put up with<\/i>)"], ["eventually", "al final, con el tiempo", "eventualmente (= <i>occasionally<\/i>)"], ["constipated", "estreñido", "resfriado (= <i>to have a cold<\/i>)"]]}, {"t": "box", "kind": "warn", "title": "Ojo en el trabajo", "items": ["<i>«Please assist the meeting»<\/i> no existe: se dice <i>attend the meeting<\/i>. Y <i>«I will realize the installation»<\/i> debe ser <i>I will do the installation<\/i>."]}, {"t": "h1", "title": "Verbos clave", "sub": "Los irregulares más usados y los verbos de dos palabras del trabajo"}, {"t": "h3", "title": "Verbos irregulares (presente, pasado)"}, {"t": "vocab", "rows": [["be, was / were", "ser / estar"], ["have, had", "tener"], ["do, did", "hacer"], ["go, went", "ir"], ["get, got", "conseguir / recibir"], ["make, made", "hacer / fabricar"], ["say, said", "decir"], ["tell, told", "contar / decir a alguien"], ["see, saw", "ver"], ["come, came", "venir"], ["take, took", "tomar / llevar"], ["give, gave", "dar"], ["know, knew", "saber / conocer"], ["think, thought", "pensar"], ["find, found", "encontrar"], ["buy, bought", "comprar"], ["pay, paid", "pagar"], ["send, sent", "enviar"], ["leave, left", "salir / dejar"], ["bring, brought", "traer"], ["speak, spoke", "hablar"], ["write, wrote", "escribir"], ["read, read", "leer (el pasado suena «red»)"], ["put, put", "poner"], ["cut, cut", "cortar"], ["break, broke", "romper"], ["lose, lost", "perder"], ["forget, forgot", "olvidar"], ["understand, understood", "entender"], ["run, ran", "correr / funcionar"]]}, {"t": "h3", "title": "Verbos de dos palabras (phrasal verbs)"}, {"t": "phrases", "rows": [["turn on / turn off", "tern on / tern of", "prender / apagar"], ["plug in / unplug", "plag in / anplág", "enchufar / desenchufar"], ["set up", "set ap", "instalar, configurar"], ["log in / log out", "log in / log áut", "iniciar / cerrar sesión"], ["fill out", "fil áut", "llenar (un formulario)"], ["pick up", "pik ap", "recoger; contestar el teléfono"], ["hang up", "jang ap", "colgar"], ["call back", "col bak", "devolver la llamada"], ["hold on", "jóuld on", "esperar un momento"], ["look for", "luk for", "buscar"], ["find out", "fáind áut", "averiguar"], ["check in / check out", "chek in / chek áut", "registrarse / hacer la salida"], ["write down", "ráit dáun", "anotar"], ["go ahead", "gou ajéd", "adelante, proceda"], ["run out of", "ran áut of", "quedarse sin"], ["be back", "bi bak", "regresar"]]}, {"t": "box", "kind": "tip", "title": "Cómo aprenderlos", "items": ["No memoricen listas. Aprendan cada verbo dentro de una frase suya: <i>«I set up the router.» «Please fill out this form.» «I'll call you back.»<\/i>"]}, {"t": "h1", "title": "Técnico: diagnóstico, seguridad y reportes", "sub": "Para el día a día en campo"}, {"t": "h3", "title": "Preguntas de diagnóstico al cliente"}, {"t": "phrases", "rows": [["Is the problem with the internet, the TV or the phone?", "", "¿El problema es con el internet, la TV o el teléfono?"], ["Does it happen all the time or only sometimes?", "", "¿Pasa todo el tiempo o solo a veces?"], ["Which lights are on on the modem?", "", "¿Qué luces están prendidas en el módem?"], ["Is the light red, green or blinking?", "", "¿La luz está roja, verde o parpadeando?"], ["Did you restart the modem?", "", "¿Reinició el módem?"], ["Please unplug it, wait ten seconds, and plug it in again.", "", "Desenchúfelo, espere diez segundos y vuelva a enchufarlo."], ["How many devices are connected?", "", "¿Cuántos dispositivos están conectados?"], ["Is the Wi-Fi slow in the whole house or only in one room?", "", "¿El Wi-Fi está lento en toda la casa o solo en un cuarto?"], ["Did anyone move or cut a cable?", "", "¿Alguien movió o cortó un cable?"], ["May I come in? I need to check the equipment.", "", "¿Puedo pasar? Necesito revisar el equipo."]]}, {"t": "h3", "title": "Explicar la solución con palabras simples"}, {"t": "phrases", "rows": [["The signal is weak here because of the walls.", "", "La señal es débil aquí por las paredes."], ["I recommend moving the router to the center of the house.", "", "Recomiendo mover el router al centro de la casa."], ["I changed the connector and tested the line.", "", "Cambié el conector y probé la línea."], ["The speed is now what your plan includes.", "", "La velocidad ya es la que incluye su plan."], ["I couldn't fix it today. I need a part.", "", "No pude arreglarlo hoy. Necesito una pieza."], ["Another technician will come tomorrow.", "", "Otro técnico vendrá mañana."], ["There is an outage in the area. We are working on it.", "", "Hay una caída en la zona. Estamos trabajando en eso."], ["It should be back in a few hours.", "", "Debería volver en unas horas."], ["I'm sorry for the inconvenience.", "", "Disculpe las molestias."]]}, {"t": "h3", "title": "Seguridad en el trabajo"}, {"t": "vocab", "rows": [["hard hat", "casco"], ["safety glasses", "lentes de seguridad"], ["safety harness", "arnés"], ["high voltage", "alto voltaje"], ["power line", "línea eléctrica"], ["caution / danger", "precaución / peligro"], ["first aid kit", "botiquín"], ["cone", "cono"]]}, {"t": "phrases", "rows": [["Is the power off?", "is de páuer of?", "¿Está cortada la corriente?"], ["Hold the ladder, please.", "jóuld de láder, plis", "Sostén la escalera, por favor."], ["Don't touch that cable.", "dóunt tach dat kéibol", "No toques ese cable."], ["Stay back, please.", "stéi bak, plis", "Manténgase atrás, por favor."], ["I need help over here.", "ái nid jelp óuver jíer", "Necesito ayuda aquí."], ["Someone is hurt. Call 911.", "", "Hay alguien herido. Llamen al 911."]]}, {"t": "h3", "title": "Notas para la orden de trabajo"}, {"t": "p", "text": "Las notas se escriben cortas y en pasado. Copien estos modelos y cambien los datos:"}, {"t": "phrases", "rows": [["Replaced damaged drop cable.", "", "Se reemplazó el cable de acometida dañado."], ["Installed new modem and tested speed.", "", "Se instaló módem nuevo y se probó la velocidad."], ["Signal levels normal after repair.", "", "Niveles de señal normales tras la reparación."], ["Customer not home. Left a note.", "", "Cliente ausente. Se dejó una nota."], ["Needs follow-up visit.", "", "Requiere visita de seguimiento."], ["No fault found. Service working.", "", "No se encontró falla. Servicio funcionando."]]}, {"t": "dialog", "title": "reportar al supervisor por radio o teléfono", "lines": [["Supervisor", "Carlos, what's your status?", "Carlos, ¿cuál es tu estado?"], ["Tech", "I finished the first job. I'm on my way to the second one.", "Terminé el primer trabajo. Voy en camino al segundo."], ["Supervisor", "Any problems?", "¿Algún problema?"], ["Tech", "Yes. I ran out of connectors. Can someone bring me a box?", "Sí. Me quedé sin conectores. ¿Alguien me puede traer una caja?"], ["Supervisor", "Okay. Where are you now?", "Bien. ¿Dónde estás ahora?"], ["Tech", "I'm in Noord, near the gas station.", "Estoy en Noord, cerca de la gasolinera."], ["Supervisor", "Copy that. Someone will be there in twenty minutes.", "Entendido. Alguien llega en veinte minutos."]]}, {"t": "h1", "title": "Reservaciones: cambios, pagos y clientes difíciles", "sub": "Lo que viene después de dominar el guion básico"}, {"t": "h3", "title": "Modificar y cancelar"}, {"t": "phrases", "rows": [["I can change the dates for you.", "", "Le puedo cambiar las fechas."], ["May I have your confirmation number, please?", "", "¿Me da su número de confirmación?"], ["I found your reservation.", "", "Encontré su reserva."], ["There is a price difference of forty dollars.", "", "Hay una diferencia de precio de 40 dólares."], ["Free cancellation until 48 hours before arrival.", "", "Cancelación gratis hasta 48 horas antes de la llegada."], ["Your reservation has been cancelled.", "", "Su reserva ha sido cancelada."], ["The refund will take five to seven business days.", "", "El reembolso tarda de cinco a siete días hábiles."], ["This rate is non-refundable.", "", "Esta tarifa no es reembolsable."]]}, {"t": "h3", "title": "Pagos"}, {"t": "phrases", "rows": [["How would you like to pay?", "", "¿Cómo desea pagar?"], ["May I have the card number, please?", "", "¿Me da el número de la tarjeta?"], ["And the expiration date?", "", "¿Y la fecha de vencimiento?"], ["The name on the card, please.", "", "El nombre que aparece en la tarjeta, por favor."], ["We require a deposit of one night.", "", "Requerimos un depósito de una noche."], ["The payment was declined. Do you have another card?", "", "El pago fue rechazado. ¿Tiene otra tarjeta?"], ["The payment went through.", "", "El pago se procesó."], ["The total, including taxes, is six hundred thirty dollars.", "", "El total, con impuestos, es 630 dólares."]]}, {"t": "h3", "title": "Ofrecer más (venta amable)"}, {"t": "phrases", "rows": [["Would you like to add breakfast?", "", "¿Le gustaría agregar el desayuno?"], ["For twenty dollars more, I can offer you an ocean view.", "", "Por 20 dólares más le puedo ofrecer vista al mar."], ["Do you need airport transportation?", "", "¿Necesita transporte al aeropuerto?"], ["Is this for a special occasion?", "", "¿Es para una ocasión especial?"]]}, {"t": "h3", "title": "Clientes molestos: escuchar, disculparse, resolver"}, {"t": "phrases", "rows": [["I understand how frustrating this is.", "", "Entiendo lo frustrante que es esto."], ["I'm very sorry about that.", "", "Lo siento mucho."], ["Let me see what I can do for you.", "", "Déjeme ver qué puedo hacer por usted."], ["Thank you for your patience.", "", "Gracias por su paciencia."], ["Here is what I can offer.", "", "Esto es lo que le puedo ofrecer."], ["I'm not able to do that, but I can do this.", "", "Eso no lo puedo hacer, pero puedo hacer esto."], ["I'll make sure this gets resolved.", "", "Me aseguraré de que esto se resuelva."], ["Would you like to speak with my supervisor?", "", "¿Desea hablar con mi supervisor(a)?"]]}, {"t": "box", "kind": "tip", "title": "La fórmula", "items": ["Primero escuchar sin interrumpir, luego reconocer el problema, disculparse una vez y ofrecer una solución concreta. Hablar más despacio y más bajo ayuda a calmar la llamada."]}, {"t": "dialog", "title": "un cliente molesto", "lines": [["Caller", "I booked an ocean-view room and they gave me a parking-lot view!", "¡Reservé vista al mar y me dieron vista al estacionamiento!"], ["Agent", "I'm very sorry about that. I understand how frustrating this is.", "Lo siento mucho. Entiendo lo frustrante que es."], ["Agent", "May I have your confirmation number, please?", "¿Me da su número de confirmación?"], ["Caller", "It's B-5-5-2-1.", "Es B-5-5-2-1."], ["Agent", "Thank you for your patience. I found your reservation. Let me see what I can do.", "Gracias por su paciencia. Encontré su reserva. Déjeme ver qué puedo hacer."], ["Agent", "I can move you to an ocean-view room today at no extra cost.", "Lo puedo cambiar hoy a una habitación con vista al mar sin costo adicional."], ["Caller", "Okay. Thank you.", "Está bien. Gracias."], ["Agent", "You're welcome. Is there anything else I can help you with?", "De nada. ¿Hay algo más en que pueda ayudarle?"]]}, {"t": "h1", "title": "Sonar amable y profesional", "sub": "El inglés directo suena brusco; estas fórmulas lo suavizan"}, {"t": "p", "text": "En español se puede decir «deme un café» con una sonrisa y suena bien. En inglés, la misma frase sin <i>please<\/i> ni <i>could<\/i> suena a orden. En servicio al cliente, estas fórmulas valen oro."}, {"t": "table", "head": ["Directo (suena brusco)", "Amable y profesional"], "rows": [["Give me your name.", "<b>May I have<\/b> your name, please?"], ["Wait.", "<b>One moment, please.<\/b>"], ["What?", "<b>Sorry, could you repeat that?<\/b>"], ["I want a coffee.", "<b>I'd like<\/b> a coffee, please."], ["You are wrong.", "<b>I think there may be a mistake.<\/b>"], ["No.", "<b>I'm afraid that's not possible.<\/b>"], ["I don't know.", "<b>Let me find out for you.<\/b>"], ["Sign here.", "<b>Could you sign here, please?<\/b>"], ["You have to pay.", "<b>There is a fee of ten dollars.<\/b>"]]}, {"t": "phrases", "rows": [["Could you please…?", "kud iú plis…?", "¿Podría, por favor…?"], ["Would you mind waiting a moment?", "", "¿Le importaría esperar un momento?"], ["I'm afraid we are closed.", "", "Me temo que estamos cerrados."], ["Let me find out for you.", "", "Déjeme averiguarlo."], ["That's a good question.", "", "Buena pregunta."], ["Take your time.", "téik iór táim", "Tómese su tiempo."], ["My pleasure.", "mái plésher", "Con gusto."], ["I appreciate it.", "ái aprísheit it", "Se lo agradezco."], ["No worries.", "nou uórris", "No se preocupe."], ["Have a good one!", "jav a gud uán", "¡Que le vaya bien!"]]}, {"t": "h3", "title": "Para ganar tiempo mientras piensan"}, {"t": "phrases", "rows": [["Let me think.", "let mi zink", "Déjeme pensar."], ["How can I say this…", "", "Cómo le digo…"], ["I mean…", "ái min", "O sea…"], ["Let me check.", "let mi chek", "Déjeme revisar."], ["Give me one second.", "", "Deme un segundo."]]}, {"t": "h1", "title": "Small talk: conversar con clientes y compañeros", "sub": "Etapa 4 · A2+ · Romper el hielo, mantener la conversación y despedirse bien"}, {"t": "p", "text": "En Aruba, con turistas y compañeros, la conversación ligera abre puertas: el clima, el viaje, el fin de semana. No hace falta hablar mucho; hace falta preguntar y mostrar interés."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["small talk", "conversación ligera"], ["weather", "clima"], ["trip", "viaje"], ["weekend", "fin de semana"], ["by the way", "por cierto"], ["anyway", "en fin"], ["actually", "en realidad (no «actualmente»)"], ["lovely", "encantador"], ["busy", "ocupado"], ["relaxing", "relajante"], ["first time", "primera vez"], ["hometown", "ciudad natal"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Is this your first time in Aruba?", "is dis iór ferst táim in arúba?", "¿Es su primera vez en Aruba?"], ["Where are you visiting from?", "uér ar iú vísiting from?", "¿De dónde nos visita?"], ["How was your weekend?", "jáu uós iór uíkend?", "¿Cómo estuvo tu fin de semana?"], ["It's a beautiful day, isn't it?", "its a biútiful dei, ísent it?", "Es un día precioso, ¿verdad?"], ["Have you tried the local food?", "jav iú tráid de lóucal fud?", "¿Ha probado la comida local?"], ["I've been living here for a year.", "áiv bin líving jíer for a íer", "Vivo aquí desde hace un año."], ["That sounds great!", "dat sáunds gréit!", "¡Suena genial!"], ["By the way, my name is Mariana.", "bai de uéi, mai néim is mariána", "Por cierto, me llamo Mariana."], ["Anyway, I'd better get back to work.", "éniuei, áid béter guet bak tu uérk", "En fin, mejor vuelvo al trabajo."], ["Enjoy the rest of your stay!", "enyói de rest of iór stei!", "¡Disfrute el resto de su estadía!"]]}, {"t": "dialog", "title": "Con un huésped en el lobby", "lines": [["Guest", "Good morning! It's so windy today.", "¡Buenos días! Hay mucho viento hoy."], ["Mariana", "Good morning! Yes, the trade winds keep Aruba cool. Is this your first time here?", "¡Buenos días! Sí, los alisios mantienen fresca a Aruba. ¿Es su primera vez aquí?"], ["Guest", "Yes, we're from Chicago.", "Sí, somos de Chicago."], ["Mariana", "Welcome! Have you been to Eagle Beach yet?", "¡Bienvenidos! ¿Ya fueron a Eagle Beach?"], ["Guest", "Not yet. Is it far?", "Todavía no. ¿Está lejos?"], ["Mariana", "Only ten minutes by taxi. Enjoy your stay!", "Solo diez minutos en taxi. ¡Disfruten su estadía!"]]}, {"t": "box", "kind": "tip", "title": "Preguntas de cola: ¿verdad?", "items": ["Para invitar a responder, el inglés usa una «tag question»: <b>It's hot, isn't it?<\/b> / <b>You're new, aren't you?<\/b> Si la frase es positiva, la cola es negativa. No digas «It's hot, true?»."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["Esta semana inicia tres conversaciones cortas en inglés (un cliente, un compañero, un vecino) con una pregunta sobre el clima o el fin de semana."]}, {"t": "h1", "title": "Contar experiencias: el pasado", "sub": "Etapa 4 · A2+ · Pasado simple y «I have…»: contar qué pasó y qué has hecho"}, {"t": "p", "text": "En el trabajo y en la vida hay que contar cosas: qué pasó con un cliente, qué hiciste ayer, qué experiencia tienes. Para lo terminado se usa el pasado simple; para la experiencia de vida, «I have + participio»."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["went", "fui"], ["had", "tuve"], ["did", "hice"], ["said / told", "dijo / contó"], ["fixed", "arreglé"], ["called", "llamé"], ["ago", "hace (tiempo)"], ["last week", "la semana pasada"], ["already", "ya"], ["yet", "todavía (en preguntas y negativas)"], ["ever / never", "alguna vez / nunca"], ["experience", "experiencia"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Yesterday I installed three modems.", "iésterdei ái instóld zri móudems", "Ayer instalé tres módems."], ["A guest called to complain about the noise.", "a guest cold tu complein abáut de nóis", "Un huésped llamó para quejarse del ruido."], ["I moved to Aruba two years ago.", "ái muvd tu arúba tu íers agóu", "Me mudé a Aruba hace dos años."], ["What happened?", "uát jápend?", "¿Qué pasó?"], ["I didn't understand at first.", "ái dídnt onderstánd at ferst", "Al principio no entendí."], ["Have you ever worked with fiber?", "jav iú éver uérkt uiz fáiber?", "¿Alguna vez has trabajado con fibra?"], ["I have worked in hotels for five years.", "ái jav uérkt in joutéls for fáiv íers", "He trabajado en hoteles por cinco años."], ["I've already sent the confirmation.", "áiv olrédi sent de confirméishon", "Ya envié la confirmación."], ["We haven't finished yet.", "uí jávent fínisht iet", "Todavía no hemos terminado."], ["It was a long day, but it went well.", "it uós a long dei, bot it uent uél", "Fue un día largo, pero salió bien."]]}, {"t": "dialog", "title": "Contarle el día al supervisor", "lines": [["Supervisor", "How did it go today, Eduardo?", "¿Cómo te fue hoy, Eduardo?"], ["Eduardo", "It went well. I finished four installations.", "Bien. Terminé cuatro instalaciones."], ["Supervisor", "Any problems?", "¿Algún problema?"], ["Eduardo", "One customer had a damaged cable, so I replaced it.", "Un cliente tenía un cable dañado, así que lo cambié."], ["Supervisor", "Great job. Did you update the report?", "Excelente. ¿Actualizaste el reporte?"], ["Eduardo", "Yes, I've already updated it.", "Sí, ya lo actualicé."]]}, {"t": "box", "kind": "tip", "title": "Hace dos años = two years ago", "items": ["«Hace» + tiempo se dice al revés: <b>two years ago<\/b>, <b>a week ago<\/b>. Y en preguntas y negativas el pasado lo lleva <b>did<\/b>: <b>Did you call?<\/b>, <b>I didn't call<\/b> (nunca «didn't called»)."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["Cada noche esta semana, cuéntale a tu pareja en inglés tres cosas que hiciste en el trabajo, con first, then y finally."]}, {"t": "h1", "title": "Planes, citas y compromisos: el futuro", "sub": "Etapa 4 · A2+ · Going to, will y el presente continuo para citas"}, {"t": "p", "text": "Agendar una visita técnica o una reserva, prometer una solución, explicar el plan del día: todo eso es futuro. Con tres estructuras lo cubres casi todo."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["appointment", "cita"], ["schedule", "horario, agenda / agendar"], ["tomorrow morning", "mañana en la mañana"], ["later", "más tarde"], ["as soon as possible", "lo antes posible"], ["on time", "a tiempo"], ["delay", "retraso"], ["reschedule", "reprogramar"], ["confirm", "confirmar"], ["promise", "prometer"], ["deadline", "fecha límite"], ["available", "disponible"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I'm going to check the connection first.", "áim góing tu chek de conékshon ferst", "Primero voy a revisar la conexión."], ["A technician will call you tomorrow.", "a teknishan uíl col iú tumórou", "Un técnico lo llamará mañana."], ["I'll send you the confirmation right away.", "áil send iú de confirméishon ráit euéi", "Le envío la confirmación enseguida."], ["We're coming on Thursday at ten.", "uír cóming on zérsdei at ten", "Vamos el jueves a las diez."], ["Are you available tomorrow morning?", "ar iú avéilabol tumórou mórning?", "¿Está disponible mañana en la mañana?"], ["Can we reschedule for Friday?", "can uí riskéyul for fráidei?", "¿Podemos reprogramar para el viernes?"], ["I'll be there in twenty minutes.", "áil bi der in tuénti mínits", "Llego en veinte minutos."], ["It's going to take about an hour.", "its góing tu téik abáut an áuer", "Va a tomar como una hora."], ["I promise it will be ready today.", "ái prómis it uíl bi rédi tudéi", "Le prometo que estará listo hoy."], ["I'll let you know as soon as possible.", "áil let iú nou as sun as pósibol", "Le aviso lo antes posible."]]}, {"t": "dialog", "title": "Agendar una visita", "lines": [["Customer", "My internet is down again. When can someone come?", "Mi internet se cayó otra vez. ¿Cuándo puede venir alguien?"], ["Eduardo", "I'm going to check the schedule. Are you available tomorrow at nine?", "Voy a revisar la agenda. ¿Está disponible mañana a las nueve?"], ["Customer", "I work in the morning. How about the afternoon?", "Trabajo en la mañana. ¿Y en la tarde?"], ["Eduardo", "We're coming at two then. I'll send you a text to confirm.", "Entonces vamos a las dos. Le mando un mensaje para confirmar."], ["Customer", "Perfect, thank you.", "Perfecto, gracias."]]}, {"t": "box", "kind": "tip", "title": "¿Will o going to?", "items": ["<b>going to<\/b>: lo que ya decidiste (<b>I'm going to replace the router<\/b>). <b>will<\/b>: lo que decides en el momento o prometes (<b>I'll call you back<\/b>). Para citas acordadas, el presente continuo: <b>We're meeting at three<\/b>."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["Escribe en inglés tu agenda de mañana con tres planes y léela en voz alta antes de dormir."]}, {"t": "h1", "title": "Resolver problemas y quejas", "sub": "Etapa 5 · B1 · Escuchar, disculparse, explicar y ofrecer soluciones"}, {"t": "p", "text": "Un cliente molesto es la prueba de fuego. La fórmula que funciona en cualquier idioma: escuchar, mostrar empatía, disculparse, explicar el siguiente paso y cumplir."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["complaint", "queja"], ["issue", "problema, asunto"], ["inconvenience", "molestia, inconveniente"], ["apologize", "disculparse"], ["refund", "reembolso"], ["compensation", "compensación"], ["upgrade", "mejora (de habitación o plan)"], ["frustrating", "frustrante"], ["understand", "entender"], ["solution", "solución"], ["follow up", "dar seguimiento"], ["manager", "gerente"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I'm really sorry for the inconvenience.", "áim ríli sóri for di inconvíniens", "Lamento mucho la molestia."], ["I completely understand how you feel.", "ái complítli onderstánd jáu iú fil", "Entiendo perfectamente cómo se siente."], ["Let me see what I can do.", "let mi si uát ái can du", "Déjeme ver qué puedo hacer."], ["Could you tell me exactly what happened?", "cud iú tel mi egsáktli uát jápend?", "¿Me podría decir exactamente qué pasó?"], ["Here's what we can do for you.", "jíers uát uí can du for iú", "Esto es lo que podemos hacer por usted."], ["We can offer you a room upgrade.", "uí can ófer iú a rum ópgreid", "Le podemos ofrecer una mejor habitación."], ["The problem was a damaged cable outside.", "de próblem uós a dámeyd kéibol áutsaid", "El problema era un cable dañado afuera."], ["I'll follow up with you this afternoon.", "áil fálou op uiz iú dis áfternun", "Le daré seguimiento esta tarde."], ["I'm afraid that's not possible, but…", "áim afréid dats not pósibol, bot…", "Me temo que eso no es posible, pero…"], ["Thank you for your patience.", "zank iú for iór péishens", "Gracias por su paciencia."]]}, {"t": "dialog", "title": "Una queja en recepción", "lines": [["Guest", "This is unacceptable. The air conditioning doesn't work!", "¡Esto es inaceptable! ¡El aire acondicionado no funciona!"], ["Mariana", "I'm really sorry for the inconvenience. When did you notice it?", "Lamento mucho la molestia. ¿Cuándo lo notó?"], ["Guest", "Last night. We couldn't sleep.", "Anoche. No pudimos dormir."], ["Mariana", "I completely understand. Here's what we can do: I can move you to an upgraded room right now.", "Lo entiendo perfectamente. Esto es lo que podemos hacer: lo puedo cambiar ahora mismo a una habitación mejor."], ["Guest", "Okay, that would be great.", "Bueno, eso sería genial."], ["Mariana", "Thank you for your patience. I'll send someone to help with your luggage.", "Gracias por su paciencia. Le envío a alguien para ayudarle con el equipaje."]]}, {"t": "box", "kind": "tip", "title": "Suavizar: could, would, I'm afraid", "items": ["Con un cliente molesto, las formas suaves bajan la tensión: <b>Could you…?<\/b> en vez de <b>Can you…?<\/b>, <b>I'm afraid…<\/b> antes de una mala noticia, <b>I would recommend…<\/b> en vez de <b>You must…<\/b>."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["Practica con tu mascota la situación «Cliente molesto» o «Explicar una demora» hasta que la hagas sin mirar las frases."]}, {"t": "h1", "title": "Mensajes y correos de trabajo", "sub": "Etapa 5 · B1 · WhatsApp, correos y reportes cortos, claros y profesionales"}, {"t": "p", "text": "Mucho del trabajo se resuelve por escrito: confirmar una reserva, avisar un retraso, mandar un reporte. Un buen mensaje es corto: saludo, motivo, detalle, siguiente paso y despedida."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["email", "correo"], ["subject", "asunto"], ["attached", "adjunto"], ["regarding", "sobre, respecto a"], ["request", "solicitud"], ["reminder", "recordatorio"], ["update", "actualización"], ["please find", "le envío (formal)"], ["kind regards", "saludos cordiales"], ["ASAP", "lo antes posible"], ["FYI", "para tu información"], ["ETA", "hora estimada de llegada"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I'm writing regarding your reservation.", "áim ráiting rigárding iór reservéishon", "Le escribo respecto a su reserva."], ["Please find the invoice attached.", "plis fáind di ínvois atácht", "Le adjunto la factura."], ["Just a quick reminder about tomorrow.", "yost a kuik rimáinder abáut tumórou", "Solo un recordatorio rápido sobre mañana."], ["Could you please confirm by Friday?", "cud iú plis confírm bai fráidei?", "¿Podría confirmar antes del viernes?"], ["Sorry for the late reply.", "sóri for de léit ripláy", "Perdón por responder tarde."], ["Here's a quick update on the repair.", "jíers a kuik ópdeit on de ripér", "Aquí va una actualización rápida de la reparación."], ["Let me know if you have any questions.", "let mi nou if iú jav éni kuéstions", "Avíseme si tiene alguna pregunta."], ["I'm running ten minutes late.", "áim róning ten mínits léit", "Voy diez minutos tarde."], ["Looking forward to your stay.", "lúking fóruerd tu iór stei", "Esperamos su visita con gusto."], ["Kind regards, Mariana", "káind rigárds, mariána", "Saludos cordiales, Mariana"]]}, {"t": "dialog", "title": "Mensaje al cliente (WhatsApp)", "lines": [["Eduardo", "Hi Mr. Croes, this is Eduardo from the internet company.", "Hola, Sr. Croes, le escribe Eduardo de la compañía de internet."], ["Eduardo", "I'm running about fifteen minutes late because of traffic. Sorry for the delay!", "Voy unos quince minutos tarde por el tráfico. ¡Disculpe el retraso!"], ["Customer", "No problem. See you soon.", "No hay problema. Nos vemos pronto."], ["Eduardo", "Thank you. My ETA is 10:15.", "Gracias. Llego a las 10:15."]]}, {"t": "box", "kind": "tip", "title": "Nada de «I write you for…»", "items": ["El error más común al escribir: traducir «le escribo para…» como <b>I write you for<\/b>. Lo natural es <b>I'm writing to…<\/b> o <b>I'm writing regarding…<\/b>. Y en correos, <b>Dear<\/b> solo si es formal; con clientes conocidos basta <b>Hi<\/b>."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["Escribe en inglés un mensaje real que tengas que mandar esta semana (confirmación, retraso o reporte) y pídele a tu mascota que lo corrija en «Pregúntale: ¿cómo se dice…?»."]}, {"t": "h1", "title": "Reuniones y hablar con el supervisor", "sub": "Etapa 5 · B1 · Dar tu opinión, pedir aclaraciones y proponer ideas"}, {"t": "p", "text": "En una reunión no hace falta inglés perfecto: hace falta saber pedir que repitan, decir lo que piensas y proponer. Estas frases te dan esa seguridad."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["meeting", "reunión"], ["agenda", "temas de la reunión"], ["point", "punto, idea"], ["suggestion", "sugerencia"], ["proposal", "propuesta"], ["workload", "carga de trabajo"], ["shift", "turno"], ["training", "capacitación"], ["feedback", "comentarios, retroalimentación"], ["clarify", "aclarar"], ["agree / disagree", "estar de acuerdo / no estarlo"], ["priority", "prioridad"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Sorry, could you repeat that more slowly?", "sóri, cud iú ripít dat mor slóuli?", "Perdón, ¿podría repetirlo más despacio?"], ["Just to clarify, do you mean…?", "yost tu clárifai, du iú min…?", "Solo para aclarar, ¿quiere decir…?"], ["In my opinion, we need more time.", "in mai opínion, uí nid mor táim", "En mi opinión, necesitamos más tiempo."], ["I agree with that.", "ái agrí uiz dat", "Estoy de acuerdo con eso."], ["I see your point, but…", "ái si iór póint, bot…", "Entiendo tu punto, pero…"], ["Can I make a suggestion?", "can ái méik a suyéschon?", "¿Puedo hacer una sugerencia?"], ["What if we checked the cables first?", "uát if uí chekt de kéibols ferst?", "¿Y si revisamos los cables primero?"], ["Could I get some feedback on my work?", "cud ái guet som fídbak on mai uérk?", "¿Me podría dar comentarios sobre mi trabajo?"], ["I'd like to take more training.", "áid láik tu téik mor tréining", "Me gustaría tomar más capacitación."], ["What's the priority for this week?", "uáts de praióriti for dis uík?", "¿Cuál es la prioridad esta semana?"]]}, {"t": "dialog", "title": "Reunión del equipo", "lines": [["Supervisor", "We have too many late check-ins. Any ideas?", "Tenemos demasiados check-in tardíos. ¿Alguna idea?"], ["Mariana", "Can I make a suggestion? What if we sent a reminder the day before?", "¿Puedo hacer una sugerencia? ¿Y si mandamos un recordatorio el día antes?"], ["Supervisor", "Good idea. Who can prepare the message?", "Buena idea. ¿Quién puede preparar el mensaje?"], ["Mariana", "I can. Just to clarify, in English and Spanish?", "Yo puedo. Solo para aclarar, ¿en inglés y en español?"], ["Supervisor", "Yes, both. Thanks, Mariana.", "Sí, en los dos. Gracias, Mariana."]]}, {"t": "box", "kind": "tip", "title": "Pedir que repitan no es fallar", "items": ["Pedir aclaración demuestra profesionalismo. Ten listas tres frases: <b>Sorry, could you repeat that?<\/b>, <b>Could you speak more slowly?<\/b>, <b>Just to clarify…<\/b>. Evita «What?»: suena brusco."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["En tu próxima reunión o conversación con el supervisor, usa al menos una frase para aclarar y una para proponer."]}, {"t": "h1", "title": "Entrevistas y crecer en el trabajo", "sub": "Etapa 5 · B1 · Hablar de tu experiencia, tus fortalezas y tus metas"}, {"t": "p", "text": "Para un ascenso, un trabajo nuevo o una capacitación, hay que saber venderse en inglés: quién eres, qué sabes hacer, un logro concreto y qué quieres aprender."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["interview", "entrevista"], ["experience", "experiencia"], ["skills", "habilidades"], ["strength / weakness", "fortaleza / debilidad"], ["achievement", "logro"], ["responsible for", "responsable de"], ["certificate", "certificado"], ["promotion", "ascenso"], ["goal", "meta"], ["reliable", "confiable"], ["team player", "buen compañero de equipo"], ["fluent", "con fluidez"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Tell me about yourself.", "tel mi abáut iorsélf", "Hábleme de usted."], ["I have eight years of experience in telecommunications.", "ái jav éit íers of ekspíriens in telecomiunikéishons", "Tengo ocho años de experiencia en telecomunicaciones."], ["I was responsible for fiber installations.", "ái uós rispónsibol for fáiber instaléishons", "Era responsable de instalaciones de fibra."], ["My biggest strength is solving problems quickly.", "mai bíguest strenz is sólving próblems kuíkli", "Mi mayor fortaleza es resolver problemas rápido."], ["I'm improving my English every day.", "áim imprúving mai ínglish évri dei", "Estoy mejorando mi inglés cada día."], ["One of my achievements was reducing complaints.", "uán of mai achívments uós ridiúsing compléints", "Uno de mis logros fue reducir las quejas."], ["I work well under pressure.", "ái uérk uél ónder présher", "Trabajo bien bajo presión."], ["Where do you see yourself in five years?", "uér du iú si iorsélf in fáiv íers?", "¿Dónde se ve en cinco años?"], ["I'd like to become a team leader.", "áid láik tu bicóm a tim líder", "Me gustaría llegar a ser líder de equipo."], ["Do you have any questions for us?", "du iú jav éni kuéstions for os?", "¿Tiene alguna pregunta para nosotros?"]]}, {"t": "dialog", "title": "Entrevista para un ascenso", "lines": [["Manager", "Why do you want this position, Mariana?", "¿Por qué quiere este puesto, Mariana?"], ["Mariana", "I've worked in reservations for six years, and I'm ready for more responsibility.", "He trabajado seis años en reservaciones y estoy lista para más responsabilidad."], ["Manager", "What's your biggest strength?", "¿Cuál es su mayor fortaleza?"], ["Mariana", "I stay calm with difficult guests and always find a solution.", "Mantengo la calma con huéspedes difíciles y siempre encuentro una solución."], ["Manager", "And your English?", "¿Y su inglés?"], ["Mariana", "I'm improving every day. I practice with a tutor app daily.", "Mejora cada día. Practico a diario con una app tutora."]]}, {"t": "box", "kind": "tip", "title": "Experiencia: for y since", "items": ["<b>for<\/b> + cantidad de tiempo (<b>for six years<\/b>); <b>since<\/b> + punto de inicio (<b>since 2019<\/b>). Con experiencia que sigue hoy: <b>I have worked…<\/b>, no «I work here since…»."]}, {"t": "box", "kind": "tip", "title": "Reto de la semana", "items": ["Prepara y graba tu presentación de 1 minuto: quién eres, tu experiencia, un logro y tu meta. Repítela hasta decirla sin leer."]}, {"t": "h1", "title": "1. Hello! Me presento", "sub": "Etapa 1 · Pre-A1 · Saludar, decir tu nombre, tu edad y de dónde eres"}, {"t": "p", "text": "¡Hola, Camila! En esta unidad aprendes a presentarte. Es lo primero que vas a usar con tus amigos y tus maestras. Escucha cada frase, repítela en voz alta y marca ✓ cuando la digas sin mirar."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["hello / hi", "hola"], ["goodbye / bye", "adiós"], ["good morning", "buenos días"], ["good afternoon", "buenas tardes"], ["name", "nombre"], ["friend", "amigo, amiga"], ["teacher", "maestra, maestro"], ["girl / boy", "niña / niño"], ["please", "por favor"], ["thank you", "gracias"], ["yes / no", "sí / no"], ["Aruba", "Aruba"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Hello! My name is Camila.", "jelóu! mai néim is camíla", "¡Hola! Me llamo Camila."], ["What's your name?", "uáts iór néim?", "¿Cómo te llamas?"], ["I'm ten years old.", "áim ten íers óuld", "Tengo diez años."], ["How old are you?", "jáu óuld ar iú?", "¿Cuántos años tienes?"], ["I live in Aruba.", "ái liv in arúba", "Vivo en Aruba."], ["I speak Spanish and English.", "ái spik spánish and ínglish", "Hablo español e inglés."], ["Nice to meet you!", "náis tu mit iú!", "¡Mucho gusto!"], ["How are you?", "jáu ar iú?", "¿Cómo estás?"], ["I'm fine, thank you.", "áim fáin, zank iú", "Estoy bien, gracias."], ["See you tomorrow!", "si iú tumórou!", "¡Nos vemos mañana!"]]}, {"t": "dialog", "title": "Una amiga nueva en el colegio", "lines": [["Ana", "Hi! What's your name?", "¡Hola! ¿Cómo te llamas?"], ["Camila", "Hi! My name is Camila. And you?", "¡Hola! Me llamo Camila. ¿Y tú?"], ["Ana", "I'm Ana. How old are you?", "Soy Ana. ¿Cuántos años tienes?"], ["Camila", "I'm ten years old.", "Tengo diez años."], ["Ana", "Me too! Nice to meet you.", "¡Yo también! Mucho gusto."], ["Camila", "Nice to meet you, Ana!", "¡Mucho gusto, Ana!"]]}, {"t": "box", "kind": "tip", "title": "Truco: la edad no se «tiene»", "items": ["En español decimos «tengo diez años», pero en inglés se dice <b>I <u>am<\/u> ten<\/b> (soy diez). Nunca digas «I have ten years». Di: <b>I'm ten years old<\/b> o solo <b>I'm ten<\/b>."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Preséntate frente al espejo: tu nombre, tu edad y dónde vives. Después preséntate a Turrón, Sam o Roma en la pestaña de tu mascota."]}, {"t": "box", "kind": "warn", "title": "Para mamá y papá", "items": ["Celebren el intento, no la perfección: a los 10 años el miedo a equivocarse frena más que cualquier error. Si dice «I have ten years», repitan la frase bien dicha con alegría (<i>«Oh, you're ten!»<\/i>) sin decir «está mal»."]}, {"t": "h1", "title": "2. Mi salón Montessori", "sub": "Etapa 1 · Pre-A1 · Objetos del salón, colores y números hasta 20"}, {"t": "p", "text": "En tu salón Montessori hay materiales, mesas, tapetes y estantes. Aprende a nombrarlos y a pedirlos en inglés."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["classroom", "salón de clases"], ["work mat / rug", "tapete de trabajo"], ["shelf", "estante"], ["table / chair", "mesa / silla"], ["pencil / pen", "lápiz / bolígrafo"], ["eraser", "borrador"], ["crayons", "creyones"], ["scissors", "tijeras"], ["glue", "pegamento"], ["notebook", "cuaderno"], ["backpack", "mochila"], ["red, blue, yellow", "rojo, azul, amarillo"], ["green, orange, purple", "verde, naranja, morado"], ["pink, black, white", "rosado, negro, blanco"], ["one to ten", "1 al 10"], ["eleven, twelve, thirteen", "11, 12, 13"], ["twenty", "20"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["This is my pencil.", "dis is mai pénsil", "Este es mi lápiz."], ["Can I have the scissors, please?", "can ái jav de sísors, plis?", "¿Me das las tijeras, por favor?"], ["Where is my eraser?", "uér is mai iréiser?", "¿Dónde está mi borrador?"], ["It's on the shelf.", "its on de shelf", "Está en el estante."], ["I need a blue crayon.", "ái nid a blu créion", "Necesito un creyón azul."], ["My favorite color is purple.", "mai féivorit cólor is pérpol", "Mi color favorito es el morado."], ["I have twelve crayons.", "ái jav tuelv créions", "Tengo doce creyones."], ["Can I borrow your glue?", "can ái bórou iór glu?", "¿Me prestas tu pegamento?"], ["Here you are.", "jíer iú ar", "Aquí tienes."], ["I put it back on the shelf.", "ái put it bak on de shelf", "Lo devuelvo al estante."]]}, {"t": "dialog", "title": "Pedir material", "lines": [["Camila", "Excuse me, can I have the red crayon, please?", "Disculpa, ¿me das el creyón rojo, por favor?"], ["Leo", "Sure! Here you are.", "¡Claro! Aquí tienes."], ["Camila", "Thank you! I need it for my map.", "¡Gracias! Lo necesito para mi mapa."], ["Leo", "You're welcome.", "De nada."]]}, {"t": "box", "kind": "tip", "title": "El color va antes", "items": ["En inglés el color va <b>antes<\/b> de la cosa: <b>a blue crayon<\/b> (un creyón azul), <b>a red apple<\/b>. Y el color nunca lleva -s: <b>two blue crayons<\/b>, no «blues»."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Busca 5 objetos de tu mochila y di su nombre y su color en inglés: «a green notebook, a pink eraser…»."]}, {"t": "h1", "title": "3. Mi familia y mis mascotas", "sub": "Etapa 1 · Pre-A1 · Familia, mascotas y descripciones simples"}, {"t": "p", "text": "Tu familia es muy especial: mamá, papá y tres perritos que te ayudan a aprender. ¡Vamos a presentarlos en inglés!"}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["mom / mother", "mamá / madre"], ["dad / father", "papá / padre"], ["parents", "papás (padres)"], ["daughter", "hija"], ["brother / sister", "hermano / hermana"], ["grandma / grandpa", "abuela / abuelo"], ["cousin", "primo, prima"], ["aunt / uncle", "tía / tío"], ["dog / puppy", "perro / cachorro"], ["pet", "mascota"], ["big / small", "grande / pequeño"], ["old / young", "viejo / joven"], ["funny", "chistoso"], ["cute", "lindo, tierno"], ["fluffy", "esponjoso, peludo"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["This is my family.", "dis is mai fámili", "Esta es mi familia."], ["My mom's name is Mariana.", "mai moms néim is mariána", "Mi mamá se llama Mariana."], ["My dad's name is Eduardo.", "mai dads néim is eduárdo", "Mi papá se llama Eduardo."], ["I have three dogs.", "ái jav zri dogs", "Tengo tres perros."], ["Turrón is a beagle.", "turrón is a bígol", "Turrón es un beagle."], ["Sam is old and very calm.", "sam is óuld and véri cam", "Sam es viejito y muy tranquilo."], ["Roma is white and fluffy.", "róma is uáit and flófi", "Roma es blanca y esponjosa."], ["She has a pink bow.", "shi jas a pink bóu", "Ella tiene un moño rosado."], ["Do you have a pet?", "du iú jav a pet?", "¿Tienes una mascota?"], ["I love my family.", "ái lov mai fámili", "Amo a mi familia."]]}, {"t": "dialog", "title": "Hablando de mascotas", "lines": [["Leo", "Do you have a pet?", "¿Tienes una mascota?"], ["Camila", "Yes! I have three dogs: Turrón, Sam and Roma.", "¡Sí! Tengo tres perros: Turrón, Sam y Roma."], ["Leo", "Wow! What is Roma like?", "¡Guau! ¿Cómo es Roma?"], ["Camila", "She is white and fluffy. She is three years old.", "Es blanca y esponjosa. Tiene tres años."], ["Leo", "So cute!", "¡Qué linda!"]]}, {"t": "box", "kind": "tip", "title": "He y she", "items": ["En inglés los animales y las personas se distinguen: <b>he<\/b> (él) para Turrón y Sam, <b>she<\/b> (ella) para Roma. Y con he/she el verbo lleva <b>-s<\/b>: <b>she <u>has<\/u><\/b>, <b>he <u>likes<\/u><\/b>."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Dibuja a tu familia con los tres perros y escribe una frase en inglés debajo de cada uno."]}, {"t": "h1", "title": "4. Mi casa y mi cuarto", "sub": "Etapa 1 · Pre-A1 · Partes de la casa, juguetes y dónde están las cosas"}, {"t": "p", "text": "Aprende a decir dónde están las cosas en tu casa. Las palabras <b>in, on, under<\/b> y <b>next to<\/b> te van a servir todo el tiempo."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["house / home", "casa / hogar"], ["bedroom", "cuarto"], ["kitchen", "cocina"], ["living room", "sala"], ["bathroom", "baño"], ["bed", "cama"], ["closet", "clóset"], ["window / door", "ventana / puerta"], ["toys", "juguetes"], ["book", "libro"], ["tablet", "tableta"], ["in / on", "dentro de / encima de"], ["under", "debajo de"], ["next to", "al lado de"], ["behind", "detrás de"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["This is my bedroom.", "dis is mai bédrum", "Este es mi cuarto."], ["My books are on the shelf.", "mai buks ar on de shelf", "Mis libros están en el estante."], ["The dog is under the bed.", "de dog is ónder de bed", "El perro está debajo de la cama."], ["My backpack is next to the door.", "mai bákpak is nekst tu de dor", "Mi mochila está al lado de la puerta."], ["Where are my shoes?", "uér ar mai shus?", "¿Dónde están mis zapatos?"], ["They are in the closet.", "déi ar in de clóset", "Están en el clóset."], ["I clean my room on Saturday.", "ái clin mai rum on sáturdei", "Limpio mi cuarto el sábado."], ["Can I play in the living room?", "can ái plei in de líving rum?", "¿Puedo jugar en la sala?"], ["Dinner is ready!", "díner is rédi!", "¡La cena está lista!"], ["Good night, Mom!", "gud náit, mom!", "¡Buenas noches, mamá!"]]}, {"t": "dialog", "title": "¿Dónde está Turrón?", "lines": [["Mom", "Camila, where is Turrón?", "Camila, ¿dónde está Turrón?"], ["Camila", "I don't know. Is he in the kitchen?", "No sé. ¿Está en la cocina?"], ["Mom", "No, he isn't.", "No, no está."], ["Camila", "Look! He is under my bed!", "¡Mira! ¡Está debajo de mi cama!"]]}, {"t": "box", "kind": "tip", "title": "Is y are", "items": ["Una cosa: <b>is<\/b> (the book <u>is<\/u> on the bed). Varias cosas: <b>are<\/b> (the books <u>are<\/u> on the bed). Para preguntar: <b>Where is…?<\/b> / <b>Where are…?<\/b>"]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Esconde un juguete y que mamá o papá lo busquen. Dales pistas en inglés: «It's under… It's next to…»."]}, {"t": "h1", "title": "5. Mi rutina", "sub": "Etapa 2 · A1 · Lo que haces cada día y la hora"}, {"t": "p", "text": "Cuenta tu día desde que te levantas hasta que te duermes. Usa el presente simple: <b>I wake up, I eat, I go…<\/b>"}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["wake up", "despertarse"], ["get up", "levantarse"], ["brush my teeth", "cepillarme los dientes"], ["take a shower", "bañarme"], ["get dressed", "vestirme"], ["have breakfast", "desayunar"], ["go to school", "ir al colegio"], ["have lunch", "almorzar"], ["do homework", "hacer la tarea"], ["have dinner", "cenar"], ["go to bed", "acostarme"], ["every day", "todos los días"], ["in the morning", "en la mañana"], ["in the afternoon", "en la tarde"], ["at night", "en la noche"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I wake up at six thirty.", "ái uéik op at six zérti", "Me despierto a las seis y media."], ["I brush my teeth after breakfast.", "ái brosh mai tiz áfter brékfast", "Me cepillo los dientes después del desayuno."], ["My dad takes me to school.", "mai dad téiks mi tu skul", "Mi papá me lleva al colegio."], ["School starts at eight o'clock.", "skul starts at éit oclók", "El colegio empieza a las ocho."], ["What time is it?", "uát táim is it?", "¿Qué hora es?"], ["It's half past three.", "its jaf past zri", "Son las tres y media."], ["I do my homework in the afternoon.", "ái du mai jómuerk in di áfternun", "Hago mi tarea en la tarde."], ["I walk the dogs with my mom.", "ái uók de dogs uiz mai mom", "Paseo a los perros con mi mamá."], ["I go to bed at nine.", "ái gou tu bed at náin", "Me acuesto a las nueve."], ["On weekends I wake up late.", "on uíkends ái uéik op léit", "Los fines de semana me despierto tarde."]]}, {"t": "dialog", "title": "La maestra pregunta", "lines": [["Teacher", "Camila, what time do you wake up?", "Camila, ¿a qué hora te despiertas?"], ["Camila", "I wake up at six thirty.", "Me despierto a las seis y media."], ["Teacher", "And what do you have for breakfast?", "¿Y qué desayunas?"], ["Camila", "I have pancakes and juice.", "Como panquecas y jugo."]]}, {"t": "box", "kind": "tip", "title": "La -s de he y she", "items": ["Con I, you, we, they no cambia: <b>I wake up<\/b>. Con he, she, it se agrega -s: <b>my dad wake<u>s<\/u> up<\/b>, <b>Roma sleep<u>s<\/u> a lot<\/b>. Es el error más común: ¡atrapa la -s!"]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Mañana, cuenta en voz alta cada cosa que haces mientras la haces: «I'm brushing my teeth… I'm getting dressed…»."]}, {"t": "box", "kind": "warn", "title": "Para mamá y papá", "items": ["Usen el inglés en rutinas fijas (el desayuno, el camino al colegio, la hora de dormir). Las rutinas repetidas son la forma más natural en que los niños adquieren un idioma: siempre las mismas frases, en el mismo momento."]}, {"t": "h1", "title": "6. La comida y la lonchera", "sub": "Etapa 2 · A1 · Comida, gustos y pedir algo"}, {"t": "p", "text": "¿Qué llevas en tu lonchera? ¿Qué te gusta y qué no? Aprende a decirlo con <b>I like<\/b> y <b>I don't like<\/b>."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["lunchbox", "lonchera"], ["sandwich", "sándwich"], ["fruit", "fruta"], ["apple / banana", "manzana / cambur, plátano"], ["mango / watermelon", "mango / patilla, sandía"], ["cheese", "queso"], ["bread", "pan"], ["rice and beans", "arroz y caraotas, frijoles"], ["chicken / fish", "pollo / pescado"], ["water / juice", "agua / jugo"], ["milk", "leche"], ["cookies", "galletas"], ["ice cream", "helado"], ["snack", "merienda"], ["delicious / yummy", "delicioso / rico"], ["hungry / thirsty", "con hambre / con sed"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I'm hungry!", "áim jóngri!", "¡Tengo hambre!"], ["I'm thirsty. Can I have some water?", "áim zérsti. can ái jav som uóter?", "Tengo sed. ¿Me das agua?"], ["I like mangoes.", "ái láik mángous", "Me gustan los mangos."], ["I don't like fish.", "ái dount láik fish", "No me gusta el pescado."], ["What's in your lunchbox?", "uáts in iór lónchbox?", "¿Qué hay en tu lonchera?"], ["I have a cheese sandwich and an apple.", "ái jav a chis sánduich and an ápol", "Tengo un sándwich de queso y una manzana."], ["Do you want to share?", "du iú uánt tu sher?", "¿Quieres compartir?"], ["This is delicious!", "dis is delíshos!", "¡Esto está delicioso!"], ["Can I have more, please?", "can ái jav mor, plis?", "¿Me das más, por favor?"], ["No, thank you. I'm full.", "nou, zank iú. áim ful", "No, gracias. Estoy llena."]]}, {"t": "dialog", "title": "A la hora del almuerzo", "lines": [["Ana", "What's in your lunchbox today?", "¿Qué tienes hoy en la lonchera?"], ["Camila", "Rice, chicken and a mango. And you?", "Arroz, pollo y un mango. ¿Y tú?"], ["Ana", "Pasta. I don't like mangoes.", "Pasta. No me gustan los mangos."], ["Camila", "Really? I love mangoes!", "¿De verdad? ¡Me encantan los mangos!"]]}, {"t": "box", "kind": "tip", "title": "Me gusta = I like", "items": ["Al revés que en español: en inglés <b>tú<\/b> eres quien gusta. «Me gustan los mangos» = <b>I like mangoes<\/b>. «A Roma le gusta el queso» = <b>Roma likes cheese<\/b> (¡con -s!)."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["En la cena, di qué hay en la mesa y si te gusta: «I like the rice. I don't like the onions»."]}, {"t": "h1", "title": "7. El recreo y mis amigos", "sub": "Etapa 2 · A1 · Juegos, invitar a jugar y turnarse"}, {"t": "p", "text": "En el recreo se habla muchísimo. Aprende a invitar, a turnarte y a jugar limpio."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["recess / break", "recreo"], ["playground", "parque, área de juegos"], ["swing / slide", "columpio / tobogán"], ["ball", "pelota"], ["tag", "la ere, el pegado"], ["hide-and-seek", "el escondite"], ["jump rope", "saltar la cuerda"], ["team", "equipo"], ["turn", "turno"], ["winner", "ganador"], ["run / jump", "correr / saltar"], ["catch / throw", "atrapar / lanzar"], ["fair", "justo"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Do you want to play with me?", "du iú uánt tu plei uiz mi?", "¿Quieres jugar conmigo?"], ["Can I play too?", "can ái plei tu?", "¿Puedo jugar también?"], ["Let's play tag!", "lets plei tag!", "¡Juguemos a la ere!"], ["You're it!", "iór it!", "¡Tú la llevas!"], ["It's my turn.", "its mai tern", "Es mi turno."], ["Whose turn is it?", "jus tern is it?", "¿De quién es el turno?"], ["Throw me the ball!", "zróu mi de bol!", "¡Lánzame la pelota!"], ["That's not fair!", "dats not fer!", "¡Eso no es justo!"], ["Good game!", "gud guéim!", "¡Buen juego!"], ["Are you okay?", "ar iú oukéi?", "¿Estás bien?"]]}, {"t": "dialog", "title": "Unirse a un juego", "lines": [["Camila", "Hi! Can I play too?", "¡Hola! ¿Puedo jugar también?"], ["Mateo", "Sure! We're playing hide-and-seek.", "¡Claro! Estamos jugando al escondite."], ["Camila", "Cool! Who counts?", "¡Genial! ¿Quién cuenta?"], ["Mateo", "You count to twenty!", "¡Tú cuentas hasta veinte!"], ["Camila", "One, two, three… Ready or not, here I come!", "Uno, dos, tres… ¡Listos o no, allá voy!"]]}, {"t": "box", "kind": "tip", "title": "Let's = vamos a", "items": ["<b>Let's<\/b> sirve para proponer: <b>Let's play<\/b> (juguemos), <b>Let's go<\/b> (vamos), <b>Let's share<\/b> (compartamos). Va con el verbo sin «to»."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Enséñale a un amigo a decir «Let's play!» y «It's my turn» en el recreo."]}, {"t": "h1", "title": "8. Mi cuerpo y cómo me siento", "sub": "Etapa 2 · A1 · Partes del cuerpo, emociones y decir que algo te duele"}, {"t": "p", "text": "Saber decir cómo te sientes es muy importante. En Montessori se habla de las emociones con calma; aquí aprendes a hacerlo en inglés."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["head", "cabeza"], ["eyes / ears", "ojos / orejas"], ["nose / mouth", "nariz / boca"], ["arm / hand", "brazo / mano"], ["leg / foot (feet)", "pierna / pie (pies)"], ["stomach / tummy", "estómago / barriga"], ["happy / sad", "feliz / triste"], ["angry", "bravo, enojado"], ["scared", "asustado"], ["tired", "cansado"], ["excited", "emocionado"], ["nervous", "nervioso"], ["sick", "enfermo"], ["headache", "dolor de cabeza"], ["calm", "tranquilo"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I feel happy today.", "ái fil jápi tudéi", "Hoy me siento feliz."], ["I'm a little nervous.", "áim a lítol nérvos", "Estoy un poco nerviosa."], ["My tummy hurts.", "mai tómi jerts", "Me duele la barriga."], ["I have a headache.", "ái jav a jédeik", "Tengo dolor de cabeza."], ["I don't feel well.", "ái dount fil uél", "No me siento bien."], ["Can I go to the nurse?", "can ái gou tu de ners?", "¿Puedo ir a la enfermería?"], ["I'm angry because…", "áim ángri bicós…", "Estoy brava porque…"], ["I need a break.", "ái nid a bréik", "Necesito un descanso."], ["How do you feel?", "jáu du iú fil?", "¿Cómo te sientes?"], ["Take a deep breath.", "téik a dip brez", "Respira profundo."]]}, {"t": "dialog", "title": "En el salón", "lines": [["Teacher", "Camila, are you okay? You look sad.", "Camila, ¿estás bien? Te ves triste."], ["Camila", "I don't feel well. My head hurts.", "No me siento bien. Me duele la cabeza."], ["Teacher", "Do you want to go to the nurse?", "¿Quieres ir a la enfermería?"], ["Camila", "Yes, please. Thank you.", "Sí, por favor. Gracias."]]}, {"t": "box", "kind": "tip", "title": "Me duele = …hurts", "items": ["«Me duele la mano» = <b>My hand hurts<\/b> (mi mano duele). Para varias: <b>My feet hurt<\/b>. Y ojo: <b>foot<\/b> → <b>feet<\/b> es un plural irregular."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Juega a «Simon says» con tu familia: «Simon says touch your nose!». Si no dicen «Simon says», ¡no se vale moverse!"]}, {"t": "h1", "title": "9. La playa y el clima", "sub": "Etapa 3 · A1+ · El tiempo, la playa y la protección del sol"}, {"t": "p", "text": "En Aruba casi siempre hace sol y hay brisa. Aprende a hablar del clima y de un día de playa."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["weather", "clima, tiempo"], ["sunny", "soleado"], ["windy", "con viento, ventoso"], ["hot", "caluroso"], ["cloudy", "nublado"], ["rainy", "lluvioso"], ["beach", "playa"], ["sand", "arena"], ["waves", "olas"], ["sea / ocean", "mar / océano"], ["shell", "concha"], ["sunscreen", "protector solar"], ["towel", "toalla"], ["swim", "nadar"], ["sandcastle", "castillo de arena"], ["fish / turtle", "pez / tortuga"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["It's sunny and windy today.", "its sóni and uíndi tudéi", "Hoy está soleado y con viento."], ["Let's go to the beach!", "lets gou tu de bich!", "¡Vamos a la playa!"], ["Don't forget your sunscreen.", "dount forguét iór sónscrin", "No olvides tu protector solar."], ["The water is so clear!", "de uóter is sou clíer!", "¡El agua está tan clara!"], ["I can see a fish!", "ái can si a fish!", "¡Puedo ver un pez!"], ["Let's build a sandcastle.", "lets bild a sándcasol", "Hagamos un castillo de arena."], ["I found a pretty shell.", "ái fáund a príti shel", "Encontré una concha bonita."], ["Can I swim, please?", "can ái suím, plis?", "¿Puedo nadar, por favor?"], ["Stay where we can see you.", "stei uér uí can si iú", "Quédate donde te podamos ver."], ["It's too hot! I need some shade.", "its tu jot! ái nid som shéid", "¡Hace mucho calor! Necesito sombra."]]}, {"t": "dialog", "title": "Un sábado en la playa", "lines": [["Dad", "What's the weather like today?", "¿Cómo está el tiempo hoy?"], ["Camila", "It's sunny and windy. Perfect for the beach!", "Soleado y con viento. ¡Perfecto para la playa!"], ["Dad", "Okay! Sunscreen first.", "¡Bueno! Primero el protector solar."], ["Camila", "Can Roma come too?", "¿Roma puede venir también?"], ["Dad", "Yes, but she stays in the shade.", "Sí, pero ella se queda en la sombra."]]}, {"t": "box", "kind": "tip", "title": "It's para el clima", "items": ["Para el clima siempre se empieza con <b>It's<\/b>: <b>It's hot<\/b>, <b>It's raining<\/b>. Nunca «Is hot» ni «Hace calor» traducido palabra por palabra («Makes hot» ❌)."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Sé la reportera del clima: mira por la ventana y da el reporte en inglés: «Good morning! Today in Aruba it's…»."]}, {"t": "h1", "title": "10. Los animales de Aruba", "sub": "Etapa 3 · A1+ · Animales de la isla, describir y comparar"}, {"t": "p", "text": "Aruba tiene animales muy especiales: iguanas, flamencos, burritos, loros y el búho que vive en la tierra (el shoco). ¡Vamos a describirlos!"}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["iguana", "iguana"], ["flamingo", "flamenco"], ["donkey", "burro"], ["parakeet", "perico, prikichi"], ["burrowing owl", "búho de madriguera, shoco"], ["lizard", "lagartija"], ["goat", "chivo"], ["turtle", "tortuga"], ["pelican", "pelícano"], ["cactus", "cactus"], ["wings / tail", "alas / cola"], ["feathers", "plumas"], ["fast / slow", "rápido / lento"], ["bigger than", "más grande que"], ["smaller than", "más pequeño que"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Flamingos are pink.", "flamíngous ar pink", "Los flamencos son rosados."], ["The iguana is green and long.", "di iguána is grin and long", "La iguana es verde y larga."], ["The shoco lives in the ground.", "de shóco livs in de gráund", "El shoco vive en la tierra."], ["Donkeys are slow but strong.", "dónkis ar slou bot strong", "Los burros son lentos pero fuertes."], ["A pelican is bigger than a parakeet.", "a pélican is bíguer dan a párakit", "Un pelícano es más grande que un perico."], ["Iguanas eat leaves and flowers.", "iguánas it livs and fláuers", "Las iguanas comen hojas y flores."], ["Look! A parakeet in the tree!", "luk! a párakit in de tri!", "¡Mira! ¡Un perico en el árbol!"], ["We must protect the animals.", "uí most protékt di ánimals", "Debemos proteger a los animales."], ["My favorite animal is the flamingo.", "mai féivorit ánimal is de flamíngo", "Mi animal favorito es el flamenco."], ["Turtles lay their eggs on the beach.", "térrols lei der egs on de bich", "Las tortugas ponen sus huevos en la playa."]]}, {"t": "dialog", "title": "Proyecto de animales", "lines": [["Teacher", "Which animal did you choose for your project?", "¿Qué animal escogiste para tu proyecto?"], ["Camila", "The burrowing owl. In Papiamento it's called shoco.", "El búho de madriguera. En papiamento se llama shoco."], ["Teacher", "Great! Where does it live?", "¡Genial! ¿Dónde vive?"], ["Camila", "It lives in holes in the ground, and it's very small.", "Vive en huecos en la tierra y es muy pequeño."]]}, {"t": "box", "kind": "tip", "title": "Comparar: -er than", "items": ["Palabras cortas: agrega <b>-er than<\/b>: <b>big → bigger than<\/b>, <b>fast → faster than<\/b>, <b>small → smaller than<\/b>. Palabras largas: <b>more beautiful than<\/b>. Nunca «more bigger»."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Escoge un animal de Aruba y di tres cosas sobre él en inglés: color, tamaño y qué come."]}, {"t": "h1", "title": "11. En la ciudad", "sub": "Etapa 3 · A1+ · Lugares, comprar y pedir direcciones"}, {"t": "p", "text": "Cuando vas a Oranjestad, al supermercado o a la biblioteca, puedes usar inglés para preguntar y comprar."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["supermarket", "supermercado"], ["bakery", "panadería"], ["library", "biblioteca"], ["park", "parque"], ["bank", "banco"], ["pharmacy", "farmacia"], ["bus stop", "parada de autobús"], ["street", "calle"], ["left / right", "izquierda / derecha"], ["straight ahead", "derecho"], ["near / far", "cerca / lejos"], ["money / price", "dinero / precio"], ["florin", "florín"], ["cashier", "cajero, cajera"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Excuse me, where is the library?", "ekskiús mi, uér is de láibreri?", "Disculpe, ¿dónde está la biblioteca?"], ["Go straight and turn left.", "gou stréit and tern left", "Siga derecho y gire a la izquierda."], ["It's next to the bank.", "its nekst tu de bank", "Está al lado del banco."], ["Is it far from here?", "is it far from jíer?", "¿Está lejos de aquí?"], ["How much is this?", "jáu moch is dis?", "¿Cuánto cuesta esto?"], ["It's five florins.", "its fáiv flórins", "Son cinco florines."], ["Can I pay with this?", "can ái pei uiz dis?", "¿Puedo pagar con esto?"], ["I'd like a chocolate pastechi, please.", "áid láik a chócolet pastéchi, plis", "Quisiera un pastechi de chocolate, por favor."], ["Where can I find the books for kids?", "uér can ái fáind de buks for kids?", "¿Dónde encuentro los libros para niños?"], ["Thank you for your help!", "zank iú for iór jelp!", "¡Gracias por su ayuda!"]]}, {"t": "dialog", "title": "En la biblioteca", "lines": [["Camila", "Excuse me, where are the books about animals?", "Disculpe, ¿dónde están los libros de animales?"], ["Librarian", "They're on the second shelf, on the right.", "Están en el segundo estante, a la derecha."], ["Camila", "Can I take two books home?", "¿Puedo llevarme dos libros a casa?"], ["Librarian", "Yes, you can. Bring them back in two weeks.", "Sí, puedes. Devuélvelos en dos semanas."]]}, {"t": "box", "kind": "tip", "title": "I'd like = quisiera", "items": ["<b>I want<\/b> (quiero) suena brusco cuando pides algo. Es más amable decir <b>I'd like…, please<\/b> o <b>Can I have…, please?<\/b>"]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["La próxima vez que vayan a una tienda, pide algo en inglés. Practícalo antes con tu mascota en la app."]}, {"t": "h1", "title": "12. Fiestas y celebraciones", "sub": "Etapa 3 · A1+ · Cumpleaños, Carnaval, Navidad y fechas"}, {"t": "p", "text": "En Aruba hay muchas fiestas: el Carnaval, el Día del Himno y la Bandera el 18 de marzo, Navidad y, claro, ¡los cumpleaños!"}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["birthday", "cumpleaños"], ["party", "fiesta"], ["cake", "torta, pastel"], ["candles", "velas"], ["present / gift", "regalo"], ["balloons", "globos"], ["invitation", "invitación"], ["costume", "disfraz"], ["parade", "desfile"], ["Carnival", "Carnaval"], ["flag", "bandera"], ["Christmas", "Navidad"], ["New Year", "Año Nuevo"], ["January to December", "enero a diciembre"], ["first, second, third", "primero, segundo, tercero"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["When is your birthday?", "uén is iór bérzdei?", "¿Cuándo es tu cumpleaños?"], ["My birthday is in May.", "mai bérzdei is in mei", "Mi cumpleaños es en mayo."], ["Happy birthday!", "jápi bérzdei!", "¡Feliz cumpleaños!"], ["Can you come to my party?", "can iú com tu mai párti?", "¿Puedes venir a mi fiesta?"], ["Make a wish!", "méik a uísh!", "¡Pide un deseo!"], ["This present is for you.", "dis présent is for iú", "Este regalo es para ti."], ["I'm wearing a costume for Carnival.", "áim uéring a cóstium for cárnival", "Me voy a poner un disfraz para Carnaval."], ["We watch the parade every year.", "uí uoch de paréid évri íer", "Vemos el desfile todos los años."], ["Flag Day is on March eighteenth.", "flag dei is on march eitínz", "El Día de la Bandera es el 18 de marzo."], ["Merry Christmas!", "méri crísmas!", "¡Feliz Navidad!"]]}, {"t": "dialog", "title": "Una invitación", "lines": [["Ana", "Camila, can you come to my birthday party?", "Camila, ¿puedes venir a mi fiesta de cumpleaños?"], ["Camila", "Yes! When is it?", "¡Sí! ¿Cuándo es?"], ["Ana", "On Saturday, at three o'clock.", "El sábado a las tres."], ["Camila", "Great! I'll ask my mom. Thank you!", "¡Genial! Le preguntaré a mi mamá. ¡Gracias!"]]}, {"t": "box", "kind": "tip", "title": "Meses con mayúscula", "items": ["En inglés los meses y los días van con mayúscula: <b>May<\/b>, <b>Saturday<\/b>. Y las fechas usan <b>in<\/b> para el mes (<b>in May<\/b>) y <b>on<\/b> para el día (<b>on Saturday<\/b>, <b>on May 5th<\/b>)."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Haz una invitación en inglés para una fiesta imaginaria de Turrón, Sam o Roma: fecha, hora y lugar."]}, {"t": "h1", "title": "13. Mi trabajo Montessori", "sub": "Etapa 4 · A2 · Escoger trabajo, pedir ayuda, ordenar y trabajar en equipo"}, {"t": "p", "text": "En Montessori tú escoges tu trabajo, lo haces con calma y lo devuelves a su lugar. Estas frases te ayudan a hacerlo en inglés y a ser amable con los demás (Grace and Courtesy)."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["work", "trabajo (actividad)"], ["material", "material"], ["choose", "escoger"], ["practice", "practicar"], ["finish", "terminar"], ["tidy up / put away", "ordenar / guardar"], ["lesson", "lección"], ["presentation", "presentación"], ["group", "grupo"], ["partner", "compañero"], ["quiet", "silencioso, tranquilo"], ["focus", "concentrarse"], ["help", "ayuda, ayudar"], ["interrupt", "interrumpir"], ["peace table", "mesa de la paz"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["May I work with this material?", "méi ái uérk uiz dis matírial?", "¿Puedo trabajar con este material?"], ["I choose the map work today.", "ái chus de map uérk tudéi", "Hoy escojo el trabajo del mapa."], ["Can you show me how to do it?", "can iú shou mi jáu tu du it?", "¿Me puedes mostrar cómo se hace?"], ["I'm not finished yet.", "áim not fínisht iet", "Todavía no he terminado."], ["I'm finished. I'll put it away.", "áim fínisht. áil put it euéi", "Terminé. Lo voy a guardar."], ["Excuse me, may I interrupt?", "ekskiús mi, méi ái interrópt?", "Disculpa, ¿puedo interrumpir?"], ["Can we work together?", "can uí uérk tuguéder?", "¿Podemos trabajar juntos?"], ["Please wait, I'm concentrating.", "plis uéit, áim cónsentreiting", "Espera, por favor, me estoy concentrando."], ["I need help with this.", "ái nid jelp uiz dis", "Necesito ayuda con esto."], ["Thank you for the lesson.", "zank iú for de léson", "Gracias por la lección."]]}, {"t": "dialog", "title": "Escoger un trabajo", "lines": [["Camila", "Excuse me, may I interrupt?", "Disculpe, ¿puedo interrumpir?"], ["Teacher", "Yes, Camila. How can I help you?", "Sí, Camila. ¿En qué te ayudo?"], ["Camila", "May I work with the fraction circles?", "¿Puedo trabajar con los círculos de fracciones?"], ["Teacher", "Of course. Do you remember how to use them?", "Claro. ¿Recuerdas cómo se usan?"], ["Camila", "Not really. Can you show me again?", "No mucho. ¿Me lo puede mostrar otra vez?"]]}, {"t": "box", "kind": "tip", "title": "May I = ¿me permite?", "items": ["<b>May I…?<\/b> es la forma más educada de pedir permiso, perfecta para hablar con maestras: <b>May I go to the bathroom?<\/b> <b>May I sit here?<\/b> Entre amigos se usa más <b>Can I…?<\/b>"]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Durante tu ciclo de trabajo, piensa en inglés qué estás haciendo: «I'm choosing… I'm working… I'm putting it away»."]}, {"t": "box", "kind": "warn", "title": "Para mamá y papá", "items": ["En Montessori se aprende haciendo. En casa, denle «trabajos» reales en inglés: poner la mesa, regar las plantas, preparar una merienda, siguiendo instrucciones sencillas en inglés. Así el idioma se pega a la acción."]}, {"t": "h1", "title": "14. Ciencias y naturaleza", "sub": "Etapa 4 · A2 · Plantas, el agua, el sistema solar (Educación Cósmica)"}, {"t": "p", "text": "En Montessori aprendes cómo funciona el universo: las plantas, el agua, los planetas. Estas palabras te sirven para tus proyectos de ciencias."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["plant / seed", "planta / semilla"], ["root / stem / leaf", "raíz / tallo / hoja"], ["flower", "flor"], ["grow", "crecer"], ["sunlight", "luz del sol"], ["water cycle", "ciclo del agua"], ["cloud / rain", "nube / lluvia"], ["evaporate", "evaporarse"], ["planet", "planeta"], ["Earth / Moon / Sun", "Tierra / Luna / Sol"], ["star", "estrella"], ["solar system", "sistema solar"], ["experiment", "experimento"], ["observe", "observar"], ["because", "porque"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Plants need water and sunlight to grow.", "plants nid uóter and sónlait tu gróu", "Las plantas necesitan agua y luz del sol para crecer."], ["The roots drink water from the soil.", "de ruts drink uóter from de sóil", "Las raíces toman agua de la tierra."], ["Water evaporates when it's hot.", "uóter ivápereits uén its jot", "El agua se evapora cuando hace calor."], ["The Earth goes around the Sun.", "di erz gous aráund de son", "La Tierra gira alrededor del Sol."], ["There are eight planets in our solar system.", "der ar éit plánets in áuer sólar sístem", "Hay ocho planetas en nuestro sistema solar."], ["I think it will grow because…", "ái zink it uíl gróu bicós…", "Creo que va a crecer porque…"], ["What do you observe?", "uát du iú obsérv?", "¿Qué observas?"], ["I observe that the leaf is turning yellow.", "ái obsérv dat de lif is térning iélou", "Observo que la hoja se está poniendo amarilla."], ["Let's do an experiment!", "lets du an ekspériment!", "¡Hagamos un experimento!"], ["My hypothesis is…", "mai jaipózesis is…", "Mi hipótesis es…"]]}, {"t": "dialog", "title": "El experimento del frijol", "lines": [["Teacher", "What does a seed need to grow?", "¿Qué necesita una semilla para crecer?"], ["Camila", "It needs water, soil and sunlight.", "Necesita agua, tierra y luz del sol."], ["Teacher", "What happens if we put it in a dark closet?", "¿Qué pasa si la ponemos en un clóset oscuro?"], ["Camila", "I think it will grow slowly, because it has no sunlight.", "Creo que crecerá lento, porque no tiene luz."]]}, {"t": "box", "kind": "tip", "title": "Cognados: tus amigos", "items": ["Muchas palabras de ciencias se parecen al español: <b>planet, experiment, energy, evaporate, observe<\/b>. Son «cognados». ¡Úsalos! Pero cuidado con la pronunciación: en inglés suenan distinto."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Siembra una semilla en casa y escribe un diario en inglés: «Day 1: I planted the seed. Day 3: …»."]}, {"t": "h1", "title": "15. Matemáticas en inglés", "sub": "Etapa 4 · A2 · Números grandes, operaciones, fracciones y figuras"}, {"t": "p", "text": "Las matemáticas tienen su propio idioma. Con estas palabras puedes explicar tus problemas y tus respuestas en inglés."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["plus / minus", "más / menos"], ["times", "por (multiplicar)"], ["divided by", "dividido entre"], ["equals", "es igual a"], ["add / subtract", "sumar / restar"], ["multiply / divide", "multiplicar / dividir"], ["half", "mitad, medio"], ["a quarter", "un cuarto"], ["fraction", "fracción"], ["one hundred", "cien"], ["one thousand", "mil"], ["square / circle", "cuadrado / círculo"], ["triangle / rectangle
