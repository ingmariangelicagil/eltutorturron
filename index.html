<title>English Dog: aprendiendo inglés con Turrón</title>
<script>
/* Turrón con Gemini (API de Google AI Studio). La clave la pega cada persona
   en su teléfono y se guarda solo en ese navegador; no está en la página. */
(function(){
  var MODEL = "gemini-3.5-flash-lite", KEY = "turron-gemini-key";
  function getKey(){ try{ return localStorage.getItem(KEY) || ""; }catch(e){ return ""; } }
  window.TUTOR_KEY = { get: getKey, set: function(v){ try{ if(v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); }catch(e){} } };
  window.TUTOR_GEMINI = function(msgs){
    var key = getKey();
    if (!key) return Promise.reject({ code: "clave" });
    var sys = msgs[0].content, rest = msgs.slice(1);
    var contents = rest.length ? rest.map(function(m){ return { role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }; })
                               : [{ role: "user", parts: [{ text: "Start the conversation now." }] }];
    return fetch("https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: contents,
        generationConfig: { maxOutputTokens: 400, temperature: 0.7 } })
    }).then(function(r){
      if (r.status === 429) throw { code: "rate_limited" };
      if (r.status === 400 || r.status === 401 || r.status === 403) return r.text().then(function(t){ throw { code: /API_KEY|API key|PERMISSION|unauth/i.test(t) ? "clave" : "gemini", message: t.slice(0, 300) }; });
      if (!r.ok) throw { code: "gemini", message: "HTTP " + r.status };
      return r.json();
    }).then(function(j){
      var c = j && j.candidates && j.candidates[0], parts = c && c.content && c.content.parts || [];
      return parts.map(function(p){ return p.text || ""; }).join("");
    }, function(e){ if (e && e.code) throw e; throw { code: "gemini", message: String(e) }; });
  };
})();
</script>

<script>
/* English Dog en jeirer.web.app: entrar, perfil por correo, elegir mascota y sincronizar el progreso.
   - Google: un correo que diga «mariana» (o «mariangelica») es Mariana; ejesil@gmail.com o uno que diga «eduardo»
     es Eduardo; cualquier otro correo tiene su propio perfil de invitado.
   - Botón CAMILA: entra sin cuenta (Firebase anónimo) al perfil de Camila.
   - El progreso vive en el teléfono (localStorage) y Firebase lo comparte: perfiles/{el|ella|camila|g_uid}.
   La configuración de abajo es pública por diseño: la seguridad está en firestore.rules. */
(function(){
  var CFG={apiKey:"AIzaSyDp_7oEY4YRsRxOsjyzbhhefSRKm5dc84Q",authDomain:"jeirer.firebaseapp.com",projectId:"jeirer",appId:"1:542831715434:web:0a269a1de3c63486dbd613",messagingSenderId:"542831715434"};
  /* App Check (obligatorio para Gemini por Firebase): clave de sitio de Fraud Defense (reCAPTCHA Enterprise), pública por diseño. */
  var APPCHECK_KEY="6LetvSAuAAAAAGkggZKzPpXpfhjb1rHWyT9WV4M_";
  var SDK="https://www.gstatic.com/firebasejs/12.0.0/", HOME="https://jeirer.web.app/", FLAG="turron-sync";
  var host=location.hostname, onFirebase=/^jeirer\.(web\.app|firebaseapp\.com)$/.test(host), local=/^(localhost|127\.0\.0\.1)$/.test(host);
  var S={on:onFirebase||local, ready:false, loading:false, user:null, lk:'', pid:'', first:false, picking:false, status:'', err:'', remote:null, unsub:null, timer:0};
  var F=null;
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
  function app(){ return window.TURRON_APP; }
  function esc(s){ return app()?app().esc(s):String(s); }
  function redraw(){ var c=document.getElementById('syncCard'); if(c) c.outerHTML=card(); gateUpdate(); }

  /* ---------- quién es cada correo ---------- */
  function personOf(u){ if(u.isAnonymous) return 'camila'; var e=(u.email||'').toLowerCase();
    if(e==='ejesil@gmail.com') return 'el'; if(/mariana|mariangelica/.test(e)) return 'ella'; if(/eduardo/.test(e)) return 'el'; return 'inv'; }
  function firstName(u){ if(u.isAnonymous) return 'Camila'; return (u.displayName||u.email||'Invitado').split(/[ @]/)[0]; }

  /* ---------- unir progreso: nunca se pierde lo aprendido en ningún teléfono ---------- */
  function obj(x){ return x&&typeof x==='object'&&!Array.isArray(x)?x:{}; }
  function mergeP(a,b){ a=obj(a); b=obj(b); var au=a.u||0, bu=b.u||0, newer=bu>au?b:a, o={}, k;
    o.u=Math.max(au,bu);
    o.known={}; [a.known,b.known].forEach(function(m){ m=obj(m); for(k in m) if(m[k]) o.known[k]=true; });
    o.days={}; [a.days,b.days].forEach(function(m){ m=obj(m); for(k in m) if(m[k]) o.days[k]=m[k]; });
    o.srs={}; [a.srs,b.srs].forEach(function(m){ m=obj(m); for(k in m){ var e=m[k], c=o.srs[k]; if(e&&(!c||(e.d||0)>(c.d||0)||((e.d||0)===(c.d||0)&&(e.b||0)>(c.b||0)))) o.srs[k]=e; } });
    var sa=obj(a.sess), sb=obj(b.sess); if(sa.d===sb.d){ o.sess={}; for(k in sa) o.sess[k]=sa[k]; for(k in sb) if(sb[k]) o.sess[k]=sb[k]; } else o.sess=(sa.d||0)>(sb.d||0)?sa:sb;
    var seen={}; o.mine=[]; (Array.isArray(newer.mine)?newer.mine:[]).concat(Array.isArray(newer===a?b.mine:a.mine)?(newer===a?b.mine:a.mine):[]).forEach(function(x){ if(x&&x.en&&!seen[x.en]){ seen[x.en]=1; o.mine.push(x); } });
    ['weeks','track','goals','cando'].forEach(function(f){ o[f]=obj(newer[f]); });
    o.pet=newer.pet||a.pet||b.pet;
    for(k in newer) if(!(k in o)) o[k]=newer[k];
    if(!o.pet) delete o.pet;
    return o; }
  function same(a,b){ return JSON.stringify(a||{})===JSON.stringify(b||{}); }

  /* ---------- Firebase ---------- */
  function load(){ if(F) return Promise.resolve(F); if(S.loading) return S.loading;
    S.loading=Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]).then(function(m){
      var cfg={}; for(var k in CFG) cfg[k]=CFG[k]; if(onFirebase) cfg.authDomain=host; // mismo dominio: el login funciona en iPhone
      var a=m[0].initializeApp(cfg);
      var ac=APPCHECK_KEY&&!local?import(SDK+'firebase-app-check.js').then(function(c){ c.initializeAppCheck(a,{provider:new c.ReCaptchaEnterpriseProvider(APPCHECK_KEY),isTokenAutoRefreshEnabled:true}); }).catch(function(){}):Promise.resolve();
      return ac.then(function(){ F={app:a,A:m[1],D:m[2],auth:m[1].getAuth(a),db:m[2].getFirestore(a)};
        m[1].onAuthStateChanged(F.auth,onUser); return F; }); });
    return S.loading; }
  function onUser(u){ S.user=u; S.ready=true; S.err=''; S.first=false; S.remote=null; stopListen();
    window.TUTOR_AI_READY=!!u; if(u&&app()&&app().aiReady){ try{ app().aiReady(); }catch(e){} }
    if(!u){ S.lk=''; S.pid=''; lsSet(FLAG,null); if(app()) app().logout(); redraw(); return; }
    lsSet(FLAG,'1'); S.lk=personOf(u); S.pid=S.lk==='inv'?'g_'+u.uid:S.lk;
    if(app()) app().login(S.lk,firstName(u),u.uid);
    listen(); redraw(); }
  function fail(e){ S.err=(e&&/offline|unavailable/.test(e.code||''))?'Sin conexión. Se guarda al volver.':(e&&e.code==='permission-denied')?'Este perfil no tiene permiso. Prueben con otra cuenta.':'No se pudo sincronizar. Prueben otra vez.'; S.first=true; redraw(); }
  function stopListen(){ if(S.unsub){ S.unsub(); S.unsub=null; } }
  function listen(){ var ref=F.D.doc(F.db,'perfiles',S.pid);
    S.unsub=F.D.onSnapshot(ref,function(s){ var rem={}; if(s.exists()){ try{ rem=JSON.parse(s.data().data||'{}'); }catch(e){ rem={}; } }
      S.remote=rem; S.first=true; var A=app(); if(!A){ redraw(); return; }
      var loc=A.get()[S.lk]||{}, m=mergeP(loc,rem);
      if(!same(m,loc)) A.putPerson(S.lk,m);
      if(!s.exists()||!same(m,rem)) push(); else S.status='Sincronizado';
      redraw(); },fail); }
  function push(){ clearTimeout(S.timer); S.timer=setTimeout(flush,1200); }
  function flush(){ clearTimeout(S.timer); S.timer=0; if(!F||!S.user||!S.pid||!app()) return; var loc=app().get()[S.lk]||{}, m=S.remote?mergeP(loc,S.remote):loc;
    S.status='Guardando…'; redraw();
    F.D.setDoc(F.D.doc(F.db,'perfiles',S.pid),{data:JSON.stringify(m),updated:F.D.serverTimestamp()})
      .then(function(){ S.status='Sincronizado'; redraw(); }).catch(fail); }
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&S.timer) flush(); });

  function signIn(){ S.err=''; lsSet(FLAG,'1'); load().then(function(){ var p=new F.A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      var mobile=matchMedia('(pointer:coarse)').matches||matchMedia('(display-mode: standalone)').matches;
      return (mobile&&onFirebase)?F.A.signInWithRedirect(F.auth,p):F.A.signInWithPopup(F.auth,p); }).catch(function(e){ if(e&&/popup-closed|cancelled/.test(e.code||'')) return; S.err='No se pudo entrar con Google. Prueben otra vez.'; redraw(); }); }
  function signInCamila(){ S.err=''; lsSet(FLAG,'1'); load().then(function(){ return F.A.signInAnonymously(F.auth); }).catch(function(){ S.err='No se pudo entrar. Revisen el internet y prueben otra vez.'; redraw(); }); }
  function signOut(){ if(S.timer) flush(); stopListen(); S.picking=false; F.A.signOut(F.auth); }

  /* ---------- Gemini por Firebase AI Logic: con sesión iniciada, la mascota no pide clave ---------- */
  var AIM='gemini-3.5-flash-lite';
  function aiCall(msgs){ return load().then(function(){ return F.auth.authStateReady(); }).then(function(){ if(!F.auth.currentUser) throw {code:'clave'}; if(F.AI) return; return import(SDK+'firebase-ai.js').then(function(m){ F.AIm=m; F.AI=m.getAI(F.app,{backend:new m.GoogleAIBackend()}); }); }).then(function(){
      var model=F.AIm.getGenerativeModel(F.AI,{model:AIM,systemInstruction:msgs[0].content,generationConfig:{maxOutputTokens:400,temperature:0.7}}), rest=msgs.slice(1);
      var contents=rest.length?rest.map(function(m){ return {role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}; }):[{role:'user',parts:[{text:'Start the conversation now.'}]}];
      return model.generateContent({contents:contents}).then(function(r){ return r.response.text(); });
    }).catch(function(e){ if(e&&e.code&&!e.message) throw e; var msg=String(e&&e.message||e); throw {code:/429|quota|RESOURCE_EXHAUSTED/i.test(msg)?'rate_limited':'gemini',message:msg.slice(0,300)}; }); }
  var keyGemini=window.TUTOR_GEMINI;
  window.TUTOR_GEMINI=function(msgs){
    if(S.on&&(S.user||lsGet(FLAG))) return aiCall(msgs).catch(function(e){ if(e.code!=='rate_limited'&&keyGemini&&window.TUTOR_KEY&&window.TUTOR_KEY.get()) return keyGemini(msgs); throw e; });
    return keyGemini?keyGemini(msgs):Promise.reject({code:'clave'}); };

  /* ---------- llevar el progreso desde GitHub Pages ---------- */
  function carryURL(){ var m=app().get(); var json=JSON.stringify({el:m.el,ella:m.ella}); return HOME+'#importar='+btoa(unescape(encodeURIComponent(json))); }
  var imported=null;
  (function(){ var h=location.hash; if(h.indexOf('#importar=')!==0) return; try{ imported=JSON.parse(decodeURIComponent(escape(atob(h.slice(10))))); }catch(e){ imported=null; }
    try{ history.replaceState(null,'',location.pathname+'#inicio'); }catch(e){} })();
  function applyImport(){ var A=app(); if(!A||!imported) return; ['el','ella'].forEach(function(w){ if(imported[w]) A.putPerson(w,mergeP(A.get()[w],obj(imported[w]))); }); imported=null; if(S.pid) push(); }

  /* ---------- pantalla de entrada: entrar y elegir mascota ---------- */
  function hasPet(){ return !!(app()&&app().pet()); }
  function needGate(){ if(!S.on) return false;
    if(!S.ready) return !lsGet(FLAG)&&navigator.onLine!==false;   // con sesión guardada no se bloquea mientras carga
    if(!S.user) return navigator.onLine!==false;                    // sin internet no se puede entrar: se deja usar la app
    if(S.picking) return true;
    return !hasPet(); }
  function petCards(){ var A=app(), cur=A.pet(); return '<div class="gpets" role="group" aria-label="Mascotas">'+A.pets().map(function(p){
      return '<button class="gpet'+(p.k===cur?' on':'')+'" data-sync="pet" data-k="'+p.k+'"><span class="gpdog" data-pet="'+p.k+'" aria-hidden="true">'+A.welcomeFrame(14,p.k)+'</span><b>'+esc(p.n)+'</b><small>'+esc(p.breed)+(p.age?' · '+p.age+' años':'')+'</small></button>'; }).join('')+'</div>'; }
  var gateKey='', gateAnim=0, gateTick=0;
  function gateUpdate(){ var g=document.getElementById('gate'), need=needGate(), A=app();
    if(!need||!A){ if(g){ g.remove(); document.documentElement.classList.remove('gated'); } gateKey=''; clearInterval(gateAnim); gateAnim=0; return; }
    var html;
    if(S.user&&!S.first&&!S.picking&&navigator.onLine!==false){
      html='<div class="gate-in"><span class="gtrio" aria-hidden="true">'+trio()+'</span><h1>English Dog</h1><p class="gload">Cargando tu progreso…</p></div>'; }
    else if(S.user){
      html='<div class="gate-in gpick"><h1>English Dog</h1><p class="gq">'+(S.picking?'Elige tu mascota':'¡Hola, '+esc(firstName(S.user))+'! ¿Con cuál mascota quieres aprender?')+'</p>'+petCards()+
        (S.picking&&hasPet()?'<p><button class="slow" data-sync="nopick">Cancelar</button></p>':'<p><button class="slow" data-sync="out">Usar otra cuenta</button></p>')+'</div>'; }
    else html='<div class="gate-in"><p class="gsay" aria-hidden="true">¡Bienvenidos!</p><span class="gtrio" aria-hidden="true">'+trio()+'</span><h1>English Dog</h1>'+
      '<div class="gsolo"><button class="btn gbtn" data-sync="in">Entrar con Google</button><button class="btn gcam" data-sync="camila">CAMILA</button>'+(S.err?'<p class="gerr">'+esc(S.err)+'</p>':'')+'</div></div>';
    if(html===gateKey) return; gateKey=html;
    if(!g){ g=document.createElement('div'); g.id='gate'; g.setAttribute('role','dialog'); g.setAttribute('aria-modal','true'); g.setAttribute('aria-label','Entrar a English Dog'); document.body.appendChild(g); document.documentElement.classList.add('gated'); }
    g.innerHTML=html; var b=g.querySelector('button'); if(b) try{ b.focus({preventScroll:true}); }catch(e){}
    if(!gateAnim){ gateTick=0; gateAnim=setInterval(function(){ if(document.hidden||!document.getElementById('gate')) return; gateTick++;
      [].forEach.call(document.querySelectorAll('#gate [data-pet]'),function(d,i){ d.innerHTML=app().welcomeFrame(gateTick+i*7,d.getAttribute('data-pet')); }); },230); } }
  function trio(){ var A=app(); return ['sam','turron','roma'].map(function(k,i){ return '<span class="gdog" data-pet="'+k+'">'+A.welcomeFrame(i*7,k)+'</span>'; }).join(''); }
  window.addEventListener('online',gateUpdate); window.addEventListener('offline',gateUpdate);

  /* ---------- tarjeta en Inicio ---------- */
  function card(){ var b='<section class="sync" id="syncCard" aria-live="polite"><h2>Tu cuenta</h2>';
    if(imported) return b+'<p>Trajeron su progreso desde la versión anterior. ¿Lo sumamos al de este teléfono? No se borra nada.</p><div class="row"><button class="btn fill" data-sync="import">Sumar mi progreso</button><button class="btn" data-sync="noimport">Ahora no</button></div></section>';
    if(!S.on) return b+'<p>English Dog ahora vive en <b>jeirer.web.app</b>, donde cada uno entra con su cuenta y tiene su progreso en todos sus teléfonos.</p><div class="row"><a class="btn fill" href="'+HOME+'">Abrir jeirer.web.app</a><button class="btn" data-sync="carry">Llevar mi progreso</button></div></section>';
    if(!S.user) return b+'<p class="note">'+(S.ready?'Sin sesión. Entren para guardar el progreso en la nube.':'Conectando…')+'</p>'+(S.ready?'<button class="btn fill" data-sync="in">Entrar con Google</button>':'')+'</section>';
    var A=app(), pk=A.pet(), pn=pk?(A.pets().filter(function(p){ return p.k===pk; })[0]||{}).n:'';
    return b+'<p>Hola, '+esc(firstName(S.user))+'. '+(pn?'Aprendes con <b>'+esc(pn)+'</b>. ':'')+'<span class="note">'+esc(S.status||'Conectando…')+'</span></p>'+
      (S.err?'<p class="fb bad">'+esc(S.err)+'</p>':'')+'<div class="row"><button class="btn small" data-sync="pick">Cambiar de mascota</button><button class="btn small" data-sync="out">Salir</button></div></section>'; }

  document.addEventListener('click',function(e){ var t=e.target.closest&&e.target.closest('[data-sync]'); if(!t) return; var a=t.getAttribute('data-sync');
    if(a==='in') signIn();
    else if(a==='camila') signInCamila();
    else if(a==='pet'){ S.picking=false; app().setPet(t.getAttribute('data-k')); gateKey=''; redraw(); }
    else if(a==='pick'){ S.picking=true; gateKey=''; redraw(); }
    else if(a==='nopick'){ S.picking=false; redraw(); }
    else if(a==='out') signOut();
    else if(a==='carry'){ location.href=carryURL(); }
    else if(a==='import'){ applyImport(); redraw(); }
    else if(a==='noimport'){ imported=null; redraw(); } });

  window.TURRON_SYNC={ card:card, canSignIn:function(){ return S.on&&!S.user; },
    changed:function(){ var A=app(); if(A){ var m=A.get(); if(m[m.who]) m[m.who].u=Date.now(); } if(S.user&&S.pid&&S.first) push(); } };
  window.TUTOR_AI_READY=S.on&&!!lsGet(FLAG);
  if(S.on){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',gateUpdate); else gateUpdate();
    load().catch(function(){ S.ready=true; S.err='No se pudo conectar. Revisen el internet y prueben otra vez.'; redraw(); }); }
})();
</script>

'1' y='11' width='3' height='1' fill='%232B1A12'/%3E%3Crect x='4' y='11' width='6' height='1' fill='%23FFF8EE'/%3E%3Crect x='10' y='11' width='2' height='1' fill='%232B1A12'/%3E%3Crect x='12' y='11' width='6' height='1' fill='%23FFF8EE'/%3E%3Crect x='18' y='11' width='3' height='1' fill='%232B1A12'/%3E%3Crect x='3' y='12' width='2' height='1' fill='%232B1A12'/%3E%3Crect x='5' y='12' width='12' height='1' fill='%23FFF8EE'/%3E%3Crect x='17' y='12' width='2' height='1' fill='%232B1A12'/%3E%3Crect x='4' y='13' width='1' height='1' fill='%232B1A12'/%3E%3Crect x='5' y='13' width='5' height='1' fill='%23D6336C'/%3E%3Crect x='10' y='13' width='2' height='1' fill='%23FFC83A'/%3E%3Crect x='12' y='13' width='5' height='1' fill='%23D6336C'/%3E%3Crect x='17' y='13' width='1' height='1' fill='%232B1A12'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --foam:#F1F9F8; --paper:#FFFFFF; --ink:#0F2F3A; --soft:#5C7680; --line:#D3E6E6;
  --lagoon:#0B8A99; --deep:#0A4D63; --flamingo:#E4487A; --sun:#FFC83A; --aloe:#2F8F5B;
  --lagoon-t:#DDF2F3; --flamingo-t:#FCE4EC; --sun-t:#FFF3CF; --aloe-t:#DFF2E6;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--foam);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--flamingo);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700;margin:1.8rem 0 .7rem}
h3{font-size:1.1rem;font-weight:700;color:var(--deep);margin:1.5rem 0 .5rem}
p{margin:.5rem 0;max-width:68ch}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;flex:1;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;opacity:.8}
.who{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.who button{border:0;background:none;color:#fff;padding:6px 14px;border-radius:999px;font-size:.9rem}
.who button[aria-pressed=true]{background:var(--sun);color:var(--ink);font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:2px solid var(--line);display:flex;justify-content:center}
.tabs button{flex:1;max-width:150px;border:0;background:none;padding:9px 4px 11px;font-size:.78rem;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--deep);font-weight:700;box-shadow:inset 0 3px 0 var(--flamingo)}

/* hero */
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden;padding:26px 0 34px}
.hero::before{content:"";position:absolute;right:-120px;top:-150px;width:270px;height:270px;border-radius:50%;background:var(--sun)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:18px;background:
  radial-gradient(circle at 12px -6px,transparent 13px,var(--foam) 14px) 0 0/24px 18px repeat-x}
.hero .wrap{position:relative}
.hero .kicker{font-size:.95rem;opacity:.9;margin:0 0 8px;max-width:22ch}
.daily{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.6rem);line-height:1.02;letter-spacing:-.025em;margin:0 0 10px;max-width:14ch;text-wrap:balance}
.daily-es{font-size:1.1rem;margin:0;opacity:.95}
.daily-pr{font-style:italic;opacity:.7;margin:2px 0 16px}
.bigplay{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--flamingo);color:#fff;font-weight:700;padding:13px 22px;border-radius:999px;font-size:1.05rem}
.bigplay.ghost{background:rgba(255,255,255,.16)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* generic pieces */
.btn{border:2px solid var(--deep);background:var(--paper);color:var(--deep);font-weight:700;padding:10px 18px;border-radius:999px}
.btn.fill{background:var(--deep);color:#fff}
.btn.pink{background:var(--flamingo);border-color:var(--flamingo);color:#fff}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1}
.stat span{color:var(--soft);font-size:.9rem}
.meter{height:8px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--aloe);border-radius:9px}
.box{border-left:6px solid var(--lagoon);background:var(--lagoon-t);border-radius:4px 14px 14px 4px;padding:12px 16px;margin:14px 0}
.box.tip{border-color:var(--sun);background:var(--sun-t)}
.box.warn{border-color:var(--flamingo);background:var(--flamingo-t)}
.box strong.t{display:block;font-family:var(--display);margin-bottom:2px}
ul.bl{padding-left:1.2rem;margin:.5rem 0}
ul.bl li{margin:.35rem 0;max-width:68ch}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px;margin:0 -18px;scrollbar-width:thin}
.chips button{white-space:nowrap;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 15px;font-size:.93rem}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

/* phrase rows */
.phr{background:var(--paper);border:2px solid var(--line);border-radius:14px;margin:8px 0;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 12px;align-items:start}
.phr.known{border-color:var(--aloe);background:var(--aloe-t)}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--lagoon);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.play.speaking{background:var(--flamingo)}
.phr .en{font-weight:700;font-size:1.08rem}
.phr .pr{font-style:italic;color:var(--soft);font-size:.92rem}
.phr .es{font-size:.98rem}
.phr .side{display:flex;flex-direction:column;gap:6px;align-items:center}
.slow{border:0;background:none;font-size:.85rem;min-height:36px;min-width:44px;color:var(--deep);text-decoration:underline;padding:8px 4px}
.know{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font-weight:700;color:transparent}
.known .know{background:var(--aloe);border-color:var(--aloe);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0}
.v{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.v b{font-size:1rem}.v span{color:var(--soft);font-size:.9rem}
.v.speaking{border-color:var(--flamingo)}
.dlg{background:var(--paper);border:2px solid var(--deep);border-radius:16px;padding:14px;margin:16px 0}
.dlg h4{font-family:var(--display);margin:0 0 8px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ln{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.ln .play{width:36px;height:36px}
.ln .whoL{font-size:.8rem;color:var(--flamingo);font-weight:700}
.ln .es{color:var(--soft);font-size:.93rem}
.hide-es .ln .es{visibility:hidden}
table.t{width:100%;border-collapse:collapse;margin:10px 0;background:var(--paper);border-radius:12px;overflow:hidden}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child{font-weight:700;width:30%}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:16px 0}
.mode{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:16px}
.mode b{font-family:var(--display);font-size:1.15rem;display:block}
.mode span{color:var(--soft);font-size:.93rem}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--lagoon)}}
.mode i{font-style:normal;display:inline-block;width:38px;height:38px;border-radius:11px;margin-bottom:8px;display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.stage{background:var(--paper);border:2px solid var(--deep);border-radius:20px;padding:22px;margin:16px 0;text-align:center}
.stage .q{font-family:var(--display);font-size:clamp(1.4rem,5vw,2rem);font-weight:700;margin:10px 0 4px;text-wrap:balance}
.stage .sub{color:var(--soft);margin:0 0 14px}
.opts{display:grid;gap:9px;margin:14px 0;text-align:left}
.opt{border:2px solid var(--line);background:var(--foam);border-radius:12px;padding:12px 14px;text-align:left}
.opt.ok{border-color:var(--aloe);background:var(--aloe-t);font-weight:700}
.opt.bad{border-color:var(--flamingo);background:var(--flamingo-t)}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;padding:8px;border-radius:12px}
.words.ans{border:2px dashed var(--line);margin-bottom:10px}
.w{border:2px solid var(--deep);background:var(--paper);border-radius:10px;padding:7px 13px;font-weight:700}
.fb{font-weight:700;min-height:1.6em;margin:10px 0}
.fb.ok{color:var(--aloe)}.fb.bad{color:var(--flamingo)}
.card{perspective:1000px;margin:12px auto;max-width:460px}
.card button{width:100%;min-height:210px;border:2px solid var(--deep);border-radius:20px;background:var(--sun-t);padding:22px;font-size:1rem}
.card.flip button{background:var(--lagoon-t)}
.inp{font:inherit;border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);max-width:100%}
.inp.ok{border-color:var(--aloe);background:var(--aloe-t)}
.inp.bad{border-color:var(--flamingo);background:var(--flamingo-t)}
.inp.s{width:6.5em;padding:4px 8px}
.ex{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.ex ol{padding-left:1.3rem;margin:.4rem 0}.ex li{margin:.6rem 0}
.ex .inp.w100{width:100%;margin-top:4px}
details{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
select.inp{padding-right:28px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.spell{font-family:var(--display);font-size:2.4rem;font-weight:800;letter-spacing:.08em}

/* plan */
.wk{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;align-items:start;cursor:pointer}
.wk.done{border-color:var(--aloe);background:var(--aloe-t)}
.wk input{width:24px;height:24px;accent-color:var(--aloe);margin-top:3px}
.wk b{font-family:var(--display)}
.wk small{display:block;color:var(--soft);font-size:.9rem}
.trk{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden}
.trk th,.trk td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-size:.92rem}
.trk td:first-child,.trk th:first-child{text-align:left;padding-left:12px}
.trk input{width:22px;height:22px;accent-color:var(--lagoon)}
.sos{background:var(--flamingo);color:#fff;border-radius:16px;padding:16px 18px;margin:18px 0}
.sos b{font-family:var(--display);font-size:1.5rem}
.note{color:var(--soft);font-size:.9rem}
@media (min-width:760px){
  body{padding-bottom:0;padding-top:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--line);order:-1}

.top .wrap{padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.45rem;font-weight:700;line-height:1}
.brand small{font-family:var(--body);font-size:.8rem;font-weight:400;opacity:.85;margin-top:3px}
.logo{display:block;width:44px;height:28px;flex:none}
.logo svg{display:block;width:100%;height:100%}
.who{background:rgba(255,241,223,.14)}
.who button{font-size:.86rem;padding:6px 11px}
.who button[aria-pressed=true]{background:var(--tag);color:var(--tink)}

/* inicio: Turrón dice la frase del día */
.hero{background:var(--hero);color:var(--hero-ink);padding:20px 0 34px}
.hero::before{content:none}
.hero::after{height:8px;background:linear-gradient(90deg,var(--foam) 50%,transparent 50%) 0 0/16px 8px repeat-x}
.hero .kicker{max-width:none;font-size:1rem}
.bubble{background:var(--cream);color:var(--tink);box-shadow:0 4px 0 rgba(43,26,18,.28);margin:0 0 22px}
.bubble::after{border-top-color:var(--cream);left:40px;filter:drop-shadow(0 4px 0 rgba(43,26,18,.28))}
.bubble .daily-pr{color:#6E5444}
.hrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.hdog{width:88px;height:88px;margin-bottom:-6px}
.hrow .row{align-self:center}
.bigplay{background:var(--collar);color:#fff}
.bigplay.ghost{background:rgba(43,26,18,.14);color:var(--hero-ink);--bs:rgba(43,26,18,.3)}

/* sesión de hoy: cuatro huellas */
.today{justify-content:space-between;margin:26px 0 12px}
.today h2{font-size:1.5rem}
.paws{display:flex;gap:6px;flex:none;padding-bottom:6px}
.paw{display:block;width:28px;height:24px}
.paw:nth-child(odd){transform:translateY(6px)}
.paw svg{display:block;width:100%;height:100%;fill:var(--line)}
.paw.on svg{fill:var(--paw);animation:pop .3s ease}
.stats .stat.streak{background:var(--sun-t)}
.sdog{width:44px;height:28px}

/* trabajo y estados vacíos */
.jobhead{display:flex;align-items:flex-end;gap:12px;margin:22px 0 4px}
.jobhead h1{margin:0;min-width:0;font-size:clamp(1.45rem,6.4vw,2.4rem);hyphens:auto;overflow-wrap:break-word}
.jdog{width:clamp(44px,14vw,66px);aspect-ratio:1;height:auto}
h1{overflow-wrap:break-word}
.empty{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.empty p{margin:0}
.edog{width:66px;height:66px}

/* respuesta correcta o incorrecta: Turrón reacciona */
.fb.ok:not(:empty)::before,.fb.bad:not(:empty)::before{content:"";display:inline-block;width:33px;height:21px;margin-right:8px;vertical-align:-4px;background:var(--dog-head) center/contain no-repeat;image-rendering:pixelated}
.fb.ok:not(:empty)::before{background-image:var(--dog-ok)}

/* avisos */
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--foam);padding:10px 16px 10px 12px;border-radius:14px;box-shadow:0 8px 24px rgba(43,26,18,.3);font-size:.95rem}
#toast::before{content:"";flex:none;width:33px;height:21px;background:var(--dog-head) center/contain no-repeat;image-rendering:pixelated}
#toast[hidden]{display:none}

/* cajas: sin franja lateral, borde fino teñido */
.box,.msg.tipm,.msg.okm{border:1px solid color-mix(in srgb,var(--lagoon) 35%,transparent);border-radius:14px}
.box.tip,.msg.tipm{border-color:color-mix(in srgb,var(--sun) 70%,transparent)}
.box.warn{border-color:color-mix(in srgb,var(--flamingo) 40%,transparent)}
.msg.okm{border-color:color-mix(in srgb,var(--aloe) 45%,transparent)}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--caramel)}}

/* barra inferior: Turrón al centro */
.tabs{box-shadow:var(--bar-shadow)}
.tabs button{font-size:.78rem;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* el contenido nunca queda debajo de la barra: su alto real + margen + la barra de inicio del iPhone */
@media (max-width:759px){
  body{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  .tabs button{padding-left:1px;padding-right:1px}
}
@media (max-width:360px){.tabs button{font-size:.75rem}}
.tabs .tcenter{overflow:visible;text-overflow:clip;justify-content:flex-end;padding-top:0}
.tabs .tcenter .tdog{flex:none;margin-top:-34px;margin-bottom:2px}
.tabs button[aria-current=page]{background:var(--sun-t);color:var(--deep)}
.tabs .tcenter{position:relative;justify-content:flex-end;gap:3px}
.tabs .tcenter[aria-current=page]{background:none}
.tdog{display:grid;place-items:center;width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--caramel);border:3px solid var(--paper);box-shadow:0 4px 0 var(--cocoa);transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.tdog svg{width:44px;height:28px;margin-top:4px}
.tcenter[aria-current=page] .tdog{background:var(--tag);box-shadow:0 4px 0 #B98F1C}
.tcenter:active .tdog{transform:translateY(3px)}

/* pestaña de Turrón */
.tstage{background:var(--hero)}
.tstage::before{content:none}
.doglab{color:var(--hero-ink)}
.tb{background:var(--cream);color:var(--tink)}
.tb::before{border-right-color:var(--cream)}
.tb .es{color:#6E5444}

/* teléfono: notch, barra de estado, teclado, toques largos */
.top .wrap{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
button,.tabs,.chips,.who,summary,.pdog,.dog{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (display-mode:standalone){html,body{overscroll-behavior-y:none}}
@media (max-width:759px) and (pointer:coarse){body:has(input:focus,textarea:focus,select:focus) .tabs{display:none}}
.tchat{overscroll-behavior:contain}

/* sincronizar entre teléfonos */
.sync{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:4px 16px 12px;margin:18px 0;box-shadow:var(--shadow)}
.sync h2{margin-top:14px;font-size:1.2rem}
.sync [data-sync=who][aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.hcode{font-family:var(--pixel);font-size:1.5rem;letter-spacing:.12em;color:var(--deep)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}

/* con sesión, cada uno ve solo su perfil: no hay selector de persona */
.logged .who{display:none}
/* entrada: las tres mascotas, Google y CAMILA; luego elegir mascota */
.gtrio{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:0 auto 4px}
.gtrio .gdog{width:96px;height:131px;margin:0;animation:gateIn .6s cubic-bezier(.2,.8,.2,1) both}
.gtrio .gdog:nth-child(2){width:120px;height:164px;animation-delay:.08s}
.gtrio .gdog:nth-child(3){animation-delay:.16s}
.gcam{width:100%;margin-top:12px;min-height:54px;font-size:1.1rem;letter-spacing:.12em;background:var(--tag);border-color:var(--tag);color:var(--tink);--bs:#B98F1C}
.gload{font-weight:700}
.gq{font-size:1.15rem;font-weight:700;margin:6px 0 16px}
.gpets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gpet{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;border-radius:18px;background:var(--paper);color:var(--ink);padding:10px 4px 12px;box-shadow:0 4px 0 rgba(43,26,18,.25);min-height:44px}
.gpet.on{border-color:var(--sea)}
.gpet b{font-family:var(--pixel);font-size:1.25rem}
.gpet small{font-size:.8rem;color:var(--soft);text-align:center;line-height:1.2}
.gpdog{display:block;width:72px;height:98px}
.gpdog svg{display:block;width:100%;height:100%;stroke:none}
.gpick .slow{color:var(--hero-ink)}
@media (max-width:360px){.gtrio .gdog{width:80px;height:109px}.gtrio .gdog:nth-child(2){width:96px;height:131px}.gpdog{width:60px;height:82px}}
@media (hover:hover) and (pointer:fine){.gpet:hover{border-color:var(--caramel)}}

/* bienvenida: entrar antes de usar la app (solo jeirer.web.app) */
html.gated,html.gated body{overflow:hidden}
#gate{position:fixed;inset:0;z-index:90;overflow-y:auto;overscroll-behavior:contain;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{width:100%;max-width:420px;text-align:center}
.gdog{display:block;width:132px;height:180px;margin:0 auto 4px;animation:gateIn .6s cubic-bezier(.2,.8,.2,1) both}
.gsay{display:inline-block;position:relative;margin:0 0 4px;background:var(--cream);color:var(--tink);font-weight:700;border-radius:16px;padding:8px 14px;box-shadow:0 3px 0 rgba(43,26,18,.25);animation:gateIn .5s cubic-bezier(.2,.8,.2,1) .35s both}
.gsay::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--cream);border-bottom:0}
@keyframes gateIn{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.gdog svg{display:block;width:100%;height:100%;stroke:none}
#gate h1{font-size:2.6rem;margin:0}
.gsub{margin:2px 0 18px;font-weight:700}
.gbody{background:var(--paper);color:var(--ink);border-radius:22px;padding:16px 18px;text-align:left;box-shadow:0 6px 0 rgba(43,26,18,.25)}
.glead{margin-top:0}
.gsolo{margin-top:22px}
.gbtn{width:100%;background:var(--sea);border-color:var(--sea);color:var(--cream);--bs:var(--tink);min-height:54px;font-size:1.1rem}
.gerr{margin:12px 0 0;font-weight:700}
#gate h1{margin-bottom:6px}
#gate [data-sync=who][aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}

/* motor de estados: la escena tiene 8 filas de aire arriba para los glifos (22×30) */
.tstage .dog{width:112px;height:153px}
.tstage .dog svg{stroke:none}
.dog[data-state=fix]{transform:rotate(6deg)}
.dog[data-state=party]{animation:hop .4s ease 3}
.dog.g-shake{animation:shake .23s linear 4}
.dog.g-flip{transform:scaleX(-1)}
.dog.g-jolt{transform:translateY(-3px)}

/* modo compacto */
.tmini{position:fixed;z-index:19;top:70px;white-space:nowrap;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;min-height:48px;max-width:calc(100vw - 32px);border:0;border-radius:999px;padding:2px 16px 2px 6px;background:var(--hero);color:var(--hero-ink);font-weight:700;font-size:.9rem;box-shadow:0 6px 18px rgba(43,26,18,.28);animation:miniIn .22s cubic-bezier(.2,.8,.2,1)}
.tmini[hidden]{display:none}
.dogmini{display:block;width:44px;height:44px;flex:none}
.dogmini svg{display:block;width:100%;height:100%;stroke:none}
@keyframes miniIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* pantalla de inicio de la app instalada */
#splash{display:none}
@media (display-mode:standalone){
  #splash{display:grid;position:fixed;inset:0;z-index:100;place-items:center;align-content:center;gap:16px;background:var(--hero);pointer-events:none;animation:splashOut .45s cubic-bezier(.2,.8,.2,1) .8s forwards}
  #splash span{display:block;width:132px;height:132px}
  #splash svg{display:block;width:100%;height:100%}
  #splash b{font:700 2.2rem var(--pixel);color:var(--hero-ink)}
}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

@media (min-width:760px){
  .tabs .tcenter{justify-content:center}
  .tdog{width:32px;height:32px;margin:0;border-width:0;box-shadow:none}
  .tabs{top:calc(10px + env(safe-area-inset-top,0px))}
  .tdog svg{width:22px;height:14px;margin:0}
  .hdog{width:132px;height:132px}
}
@media (prefers-reduced-motion:reduce){#splash{display:none!important}}

<script id="data" type="application/json">{"rec": [{"t": "h1", "title": "Bienvenidos", "sub": "Cómo usar esta guía (léanla juntos primero)"}, {"t": "p", "text": "Esta guía está hecha para dos personas que acaban de llegar a Aruba y necesitan comunicarse en inglés <b>desde ya<\/b>: en el supermercado, con los vecinos, en el banco y, sobre todo, en el trabajo. No es un libro de gramática: es una caja de herramientas para hablar."}, {"t": "p", "text": "En Aruba los idiomas oficiales son el papiamento y el neerlandés, pero el inglés y el español se usan muchísimo, sobre todo en turismo, servicio al cliente y comercio. Eso es una ventaja: van a escuchar inglés todos los días y mucha gente tendrá paciencia con ustedes."}, {"t": "h2", "title": "Cómo está organizada"}, {"t": "bullets", "items": ["<b>Parte 1 – Tips para aprender rápido:<\/b> hábitos que funcionan para adultos ocupados.", "<b>Parte 2 – Pronunciación:<\/b> los errores típicos de los hispanohablantes y cómo corregirlos.", "<b>Parte 3 – Gramática mínima:<\/b> solo lo necesario para armar frases.", "<b>Parte 4 – Situaciones del día a día:<\/b> supermercado, casa, vecinos, banco, médico, transporte, restaurante y emergencias.", "<b>Parte 5 – Inglés para el trabajo:<\/b> una sección para el técnico de telecomunicaciones y otra para la agente de reservaciones.", "<b>Parte 6 – Ejercicios y juegos en pareja<\/b>, con respuestas al final.", "<b>Parte 7 – Plan de 12 semanas<\/b> y hoja de seguimiento."]}, {"t": "h2", "title": "Cómo leer la columna «Cómo suena»"}, {"t": "p", "text": "Para ayudarles al principio, muchas frases traen una pronunciación aproximada escrita «a la española». Es una muleta, no una regla: no es exacta. Úsenla para arrancar y luego escuchen el audio real (Google Translate, un diccionario en línea o YouTube) y repitan imitando."}, {"t": "box", "kind": "tip", "title": "★ Antes de empezar", "items": ["Lean esta guía con un lápiz en la mano. Marquen las frases que usan cada semana y tachen las que ya dicen sin pensar. Ver el progreso motiva muchísimo."]}, {"t": "h1", "title": "Parte 1 · Tips para aprender más rápido", "sub": "Hábitos pequeños, todos los días, valen más que horas sueltas el fin de semana"}, {"t": "box", "kind": "warn", "title": "♥ La ventaja de aprender en pareja", "items": ["Ustedes tienen algo que los estudiantes solos no tienen: un compañero de práctica en casa. Úsenlo. Corríjanse con cariño, hagan los role-plays de esta guía y compitan sanamente (¿quién aprende más palabras esta semana?)."]}, {"t": "h1", "title": "Parte 2 · Pronunciación para hispanohablantes", "sub": "Los 8 errores más comunes y cómo arreglarlos"}, {"t": "h2", "title": "El alfabeto en inglés (¡vital para deletrear nombres!)"}, {"t": "p", "text": "En el trabajo de reservaciones y en el técnico van a deletrear nombres, correos y números de serie todo el tiempo. Aprendan el alfabeto y el código fonético internacional:"}, {"t": "vocab", "rows": [["A – ei", "Alpha"], ["B – bi", "Bravo"], ["C – si", "Charlie"], ["D – di", "Delta"], ["E – i", "Echo"], ["F – ef", "Foxtrot"], ["G – dyi", "Golf"], ["H – eich", "Hotel"], ["I – ai", "India"], ["J – dyei", "Juliet"], ["K – kei", "Kilo"], ["L – el", "Lima"], ["M – em", "Mike"], ["N – en", "November"], ["O – ou", "Oscar"], ["P – pi", "Papa"], ["Q – kiu", "Quebec"], ["R – ar", "Romeo"], ["S – es", "Sierra"], ["T – ti", "Tango"], ["U – iu", "Uniform"], ["V – vi", "Victor"], ["W – dábel-iu", "Whiskey"], ["X – ex", "X-ray"], ["Y – uái", "Yankee"], ["Z – zi / zed", "Zulu"]]}, {"t": "box", "kind": "tip", "title": "★ Cuidado", "items": ["Las letras que más confunden: <b>E<\/b> («i») vs. <b>I<\/b> («ai»); <b>G<\/b> («dyi») vs. <b>J<\/b> («dyei»); <b>A<\/b> («ei») vs. <b>E<\/b> («i»). Al deletrear un correo: <b>@<\/b> = «at», <b>.<\/b> = «dot», <b>_<\/b> = «underscore», <b>-<\/b> = «dash»."]}, {"t": "h1", "title": "Parte 3 · Gramática mínima para sobrevivir", "sub": "Con estas 6 estructuras pueden decir casi todo"}, {"t": "h3", "title": "1. Verbo TO BE (ser / estar)"}, {"t": "phrases", "rows": [["I <b>am<\/b> from Venezuela. / I'm tired.", "ái am from... / áim táierd", "Soy de Venezuela. / Estoy cansado(a)."], ["He <b>is<\/b> a technician. / She's at work.", "ji is a teknishan", "Él es técnico. / Ella está en el trabajo."], ["We <b>are<\/b> new in Aruba.", "uí ar niú in arúba", "Somos nuevos en Aruba."], ["<b>Is<\/b> it open? / <b>Are<\/b> you busy?", "is it óupen?", "¿Está abierto? / ¿Estás ocupado?"]]}, {"t": "h3", "title": "2. Presente simple (rutinas)"}, {"t": "p", "text": "Igual para todos, pero con <b>he/she/it<\/b> se agrega <b>-s<\/b>: <i>I work / he work<b>s<\/b><\/i>. Negativo: <i>I <b>don't<\/b> work / she <b>doesn't<\/b> work<\/i>. Pregunta: <i><b>Do<\/b> you work here? <b>Does<\/b> he speak Spanish?<\/i>"}, {"t": "h3", "title": "3. Presente continuo (lo que pasa ahora)"}, {"t": "p", "text": "<b>am/is/are + verbo-ing<\/b>: <i>I'm cooking. He's installing the modem. We're looking for an apartment.<\/i>"}, {"t": "h3", "title": "4. Pasado simple"}, {"t": "p", "text": "Regular: verbo + <b>-ed<\/b> (<i>worked, called, booked<\/i>). Irregulares importantes: <i>go → went, have → had, buy → bought, pay → paid, get → got, see → saw, do → did, make → made, say → said, come → came<\/i>. Pregunta y negativo con <b>did<\/b>: <i>Did you call? I didn't see it.<\/i>"}, {"t": "h3", "title": "5. Futuro"}, {"t": "p", "text": "<b>going to<\/b> para planes: <i>We're going to visit the beach on Sunday.<\/i> <b>will<\/b> para decisiones y promesas en el momento: <i>I'll check that for you. I'll call you back.<\/i> (¡Muy útil en el trabajo!)"}, {"t": "h3", "title": "6. Pedir con cortesía: can / could / would"}, {"t": "phrases", "rows": [["<b>Can<\/b> I pay with card?", "kan ái péi uiz kard?", "¿Puedo pagar con tarjeta?"], ["<b>Could<\/b> you repeat that, please?", "kud iú ripít dat, plis?", "¿Podría repetir eso, por favor?"], ["<b>Would<\/b> you like a receipt?", "uud iú láik a risít?", "¿Le gustaría un recibo?"], ["I <b>would like<\/b> / I'd like a coffee.", "áid láik a cófi", "Quisiera un café."]]}, {"t": "box", "kind": "tip", "title": "★ Las palabras «W»", "items": ["Las preguntas con palabra interrogativa: <b>What<\/b> (qué), <b>Where<\/b> (dónde), <b>When<\/b> (cuándo), <b>Who<\/b> (quién), <b>Why<\/b> (por qué), <b>How<\/b> (cómo), <b>How much<\/b> (cuánto cuesta), <b>How many<\/b> (cuántos), <b>What time<\/b> (a qué hora), <b>Which<\/b> (cuál)."]}, {"t": "h1", "title": "Parte 4 · Situaciones del día a día", "sub": "Empiecen por aquí: las frases que más van a usar"}, {"t": "h2", "title": "Frases de supervivencia (memorícenlas esta semana)"}, {"t": "phrases", "rows": [["Hello! / Good morning / Good afternoon", "jelóu / gud mórning / gud áfternun", "¡Hola! / Buenos días / Buenas tardes"], ["How are you? — Fine, thanks. And you?", "jáu ar iú? — fáin, zenks. end iú?", "¿Cómo está? — Bien, gracias. ¿Y usted?"], ["Sorry, I don't understand.", "sóri, ái dóunt anderstánd", "Disculpe, no entiendo."], ["Can you speak slowly, please?", "kan iú spik slóuli, plis?", "¿Puede hablar despacio, por favor?"], ["Can you repeat that, please?", "kan iú ripít dat, plis?", "¿Puede repetir, por favor?"], ["How do you say ... in English?", "jáu du iú séi ... in ínglish?", "¿Cómo se dice ... en inglés?"], ["What does ... mean?", "uát das ... min?", "¿Qué significa ...?"], ["Do you speak Spanish?", "du iú spik spánish?", "¿Habla español?"], ["My English is not very good, I'm learning.", "mái ínglish is not véri gud, áim lérning", "Mi inglés no es muy bueno, estoy aprendiendo."], ["Can you write it down, please?", "kan iú ráit it dáun, plis?", "¿Me lo puede escribir, por favor?"], ["Excuse me, where is ...?", "ekskiús mi, uér is...?", "Disculpe, ¿dónde está...?"], ["Thank you very much! / You're welcome.", "zenk iú véri mach / iór uélcam", "¡Muchas gracias! / De nada."], ["No problem. / Of course.", "nou próblem / of cors", "No hay problema. / Claro."], ["Have a nice day! — You too!", "jav a náis déi — iú tu", "¡Que tenga buen día! — ¡Igualmente!"]]}, {"t": "box", "kind": "tip", "title": "★ Bonus local", "items": ["En Aruba también escucharán papiamento. Unas palabras para quedar bien: <b>Bon dia<\/b> (buenos días), <b>Bon tardi<\/b> (buenas tardes), <b>Danki<\/b> (gracias), <b>Con ta bai?<\/b> (¿cómo estás?), <b>Mi ta bon<\/b> (estoy bien). Los arubianos aprecian mucho el esfuerzo."]}, {"t": "h1", "title": "En el supermercado", "sub": "At the supermarket / grocery store"}, {"t": "h3", "title": "Vocabulario"}, {"t": "vocab", "rows": [["cart / basket", "carrito / cesta"], ["aisle", "pasillo"], ["checkout / cashier", "caja / cajero(a)"], ["receipt", "recibo"], ["bag (plastic / paper)", "bolsa"], ["price / on sale", "precio / en oferta"], ["cash / card", "efectivo / tarjeta"], ["change", "vuelto / cambio"], ["produce", "frutas y verduras"], ["dairy", "lácteos"], ["meat / chicken / fish", "carne / pollo / pescado"], ["bakery", "panadería"], ["frozen food", "congelados"], ["cleaning products", "productos de limpieza"], ["a pound / a kilo", "una libra / un kilo"], ["a dozen eggs", "una docena de huevos"], ["a loaf of bread", "un pan (de molde)"], ["a bottle of water", "una botella de agua"], ["a can of beans", "una lata de frijoles"], ["expiration date", "fecha de vencimiento"]]}, {"t": "h3", "title": "Frases útiles"}, {"t": "phrases", "rows": [["Excuse me, where can I find the rice?", "ekskiús mi, uér kan ái fáind de ráis?", "Disculpe, ¿dónde encuentro el arroz?"], ["Is it in aisle 5?", "is it in áil fáiv?", "¿Está en el pasillo 5?"], ["How much is this?", "jáu mach is dis?", "¿Cuánto cuesta esto?"], ["Do you have ... ?", "du iú jav...?", "¿Tienen ...?"], ["Can I get half a pound of ham, please?", "kan ái guet jaf a páund of jam, plis?", "¿Me da media libra de jamón?"], ["Sliced, please. / Thin, please.", "sláist, plis / zin, plis", "En rebanadas / Delgado, por favor."], ["Can I pay with card?", "kan ái péi uiz kard?", "¿Puedo pagar con tarjeta?"], ["Do you accept US dollars?", "du iú aksépt iú-es dólars?", "¿Aceptan dólares?"], ["I don't need a bag, thanks.", "ái dóunt nid a bag, zenks", "No necesito bolsa, gracias."], ["Can I have the receipt?", "kan ái jav de risít?", "¿Me da el recibo?"]]}, {"t": "dialog", "title": "en la caja", "lines": [["Cashier", "Hi! Did you find everything okay?", "¡Hola! ¿Encontró todo bien?"], ["You", "Yes, thank you. Do you accept credit cards?", "Sí, gracias. ¿Aceptan tarjetas de crédito?"], ["Cashier", "Yes, we do. Do you need a bag?", "Sí. ¿Necesita bolsa?"], ["You", "Yes, two bags, please.", "Sí, dos bolsas, por favor."], ["Cashier", "Your total is 85 florins. Insert or tap your card.", "Su total es 85 florines. Inserte o acerque su tarjeta."], ["You", "Thank you! Have a nice day.", "¡Gracias! Que tenga buen día."]]}, {"t": "box", "kind": "tip", "title": "★ Ejercicio de la vida real", "items": ["Antes de ir al súper, escriban la lista de compras <b>en inglés<\/b>. Es el ejercicio más fácil y útil de toda la semana. En Aruba la moneda es el florín arubeño (AWG), y en muchos lugares también aceptan dólares: pregunten siempre en qué moneda les dan el vuelto (<i>«Is the change in florins or dollars?»<\/i>)."]}, {"t": "h1", "title": "En la casa", "sub": "At home: rutina, cocina, mantenimiento y conversación en pareja"}, {"t": "h3", "title": "Partes de la casa y objetos (¡para etiquetar!)"}, {"t": "vocab", "rows": [["living room", "sala"], ["bedroom", "dormitorio"], ["bathroom", "baño"], ["kitchen", "cocina"], ["fridge", "nevera"], ["stove / oven", "estufa / horno"], ["microwave", "microondas"], ["sink", "fregadero / lavamanos"], ["washing machine", "lavadora"], ["dryer", "secadora"], ["air conditioner (AC)", "aire acondicionado"], ["fan", "ventilador"], ["light switch", "interruptor"], ["outlet", "enchufe (pared)"], ["faucet / tap", "grifo / llave"], ["trash can", "bote de basura"], ["closet", "clóset"], ["key / lock", "llave / cerradura"], ["broom / mop", "escoba / trapeador"], ["dishes", "platos"]]}, {"t": "h3", "title": "Rutina diaria — para practicar juntos"}, {"t": "phrases", "rows": [["I wake up at 6. / I take a shower.", "ái uéik ap at six / ái téik a sháuer", "Me despierto a las 6. / Me ducho."], ["What do you want for breakfast?", "uát du iú uánt for brékfast?", "¿Qué quieres desayunar?"], ["I'm going to work. See you later!", "áim góing tu uork. si iú léiter", "Me voy al trabajo. ¡Nos vemos!"], ["How was your day?", "jáu uas iór déi?", "¿Cómo te fue hoy?"], ["It was good / busy / long / stressful.", "it uas gud / bísi / long / strésful", "Fue bueno / ocupado / largo / estresante."], ["Can you help me with the dishes?", "kan iú jelp mi uiz de díshis?", "¿Me ayudas con los platos?"], ["Let's cook dinner together.", "lets kuk díner tuguéder", "Cocinemos la cena juntos."], ["We need to buy milk and eggs.", "uí nid tu bái milk end egs", "Tenemos que comprar leche y huevos."], ["Don't forget to pay the electricity bill.", "dóunt forguét tu péi de electrísiti bil", "No olvides pagar la luz."], ["Turn on / turn off the AC, please.", "tern on / tern of de ei-si", "Prende / apaga el aire, por favor."], ["I'm tired. Let's go to bed.", "áim táierd. lets gou tu bed", "Estoy cansado(a). Vamos a dormir."]]}, {"t": "h3", "title": "Con el casero o un técnico en casa"}, {"t": "phrases", "rows": [["The AC is not working.", "de ei-si is not uórking", "El aire no funciona."], ["There is a leak in the bathroom.", "der is a lik in de bázrum", "Hay una fuga en el baño."], ["When can you come to fix it?", "uén kan iú kam tu fix it?", "¿Cuándo puede venir a arreglarlo?"], ["The rent is due on the first of the month.", "de rent is du on de ferst of de manz", "La renta se paga el primero de cada mes."]]}, {"t": "box", "kind": "tip", "title": "★ Juego de la cena: «Three things»", "items": ["Cada noche, durante la cena, cada uno cuenta en inglés <b>tres cosas<\/b> que hizo en el día, usando el pasado: <i>«Today I worked a lot. I talked to a customer. I bought bread.»<\/i> El otro hace una pregunta: <i>«Who did you talk to?»<\/i>"]}, {"t": "h1", "title": "Vecinos, compañeros y «small talk»", "sub": "Conversación corta y amable: la clave para hacer amigos"}, {"t": "phrases", "rows": [["Hi, I'm María. We just moved in next door.", "jái, áim maría. uí yast muvd in next dor", "Hola, soy María. Nos acabamos de mudar al lado."], ["Nice to meet you!", "náis tu mit iú", "¡Mucho gusto!"], ["Where are you from? — I'm from ...", "uér ar iú from? — áim from...", "¿De dónde eres? — Soy de ..."], ["How long have you lived in Aruba?", "jáu long jav iú livd in arúba?", "¿Cuánto tiempo llevas viviendo en Aruba?"], ["We've been here for two months.", "uív bin jíer for tu manz", "Llevamos dos meses aquí."], ["What do you do? — I work in telecommunications.", "uát du iú du? — ái uork in télecomiunikéishons", "¿A qué te dedicas? — Trabajo en telecomunicaciones."], ["I'm a reservations agent.", "áim a reservéishons éiyent", "Soy agente de reservaciones."], ["It's so hot today! / What a beautiful day!", "its sou jot tudéi / uát a biútiful déi", "¡Qué calor hace hoy! / ¡Qué día tan bonito!"], ["Can you recommend a good restaurant / beach?", "kan iú rekoménd a gud réstorant / bich?", "¿Me recomiendas un buen restaurante / playa?"], ["What do you like to do on weekends?", "uát du iú láik tu du on uíkends?", "¿Qué te gusta hacer los fines de semana?"], ["Let me know if you need anything.", "let mi nóu if iú nid énizing", "Avísame si necesitas algo."]]}, {"t": "h2", "title": "Banco, gobierno y trámites"}, {"t": "phrases", "rows": [["I'd like to open a bank account.", "áid láik tu óupen a bank akáunt", "Quisiera abrir una cuenta bancaria."], ["What documents do I need?", "uát dókiuments du ái nid?", "¿Qué documentos necesito?"], ["Here is my passport and my work permit.", "jíer is mái pásport end mái uork pérmit", "Aquí está mi pasaporte y mi permiso de trabajo."], ["I have an appointment at 10.", "ái jav an apóintment at ten", "Tengo una cita a las 10."], ["Where do I sign? / Do I fill out this form?", "uér du ái sáin? / du ái fil áut dis form?", "¿Dónde firmo? / ¿Lleno este formulario?"], ["How long does it take?", "jáu long das it téik?", "¿Cuánto tiempo tarda?"], ["Can I take a number?", "kan ái téik a námber?", "¿Puedo sacar un número / turno?"]]}, {"t": "h1", "title": "Médico y farmacia", "sub": "At the doctor / pharmacy"}, {"t": "vocab", "rows": [["headache", "dolor de cabeza"], ["stomachache", "dolor de estómago"], ["sore throat", "dolor de garganta"], ["fever", "fiebre"], ["cough", "tos"], ["cold / flu", "resfriado / gripe"], ["allergy", "alergia"], ["prescription", "receta médica"], ["pill / tablet", "pastilla"], ["insurance", "seguro"], ["appointment", "cita"], ["blood test", "examen de sangre"]]}, {"t": "phrases", "rows": [["I need to see a doctor.", "ái nid tu si a dóctor", "Necesito ver a un médico."], ["I'd like to make an appointment.", "áid láik tu méik an apóintment", "Quisiera hacer una cita."], ["I have a headache and a fever.", "ái jav a jédeik end a fíver", "Tengo dolor de cabeza y fiebre."], ["It hurts here.", "it jerts jíer", "Me duele aquí."], ["Since yesterday / for three days.", "sins iésterdei / for zri déis", "Desde ayer / desde hace tres días."], ["I'm allergic to penicillin.", "áim alérgic tu penisílin", "Soy alérgico(a) a la penicilina."], ["How many times a day?", "jáu méni táims a déi?", "¿Cuántas veces al día?"], ["Do I need a prescription for this?", "du ái nid a prescrípshon for dis?", "¿Necesito receta para esto?"], ["Here is my insurance card.", "jíer is mái inshúrans kard", "Aquí está mi tarjeta del seguro."]]}, {"t": "h2", "title": "Transporte, restaurante y emergencias"}, {"t": "phrases", "rows": [["Does this bus go to Oranjestad?", "das dis bas gou tu oranyestad?", "¿Este bus va a Oranjestad?"], ["How much is the fare?", "jáu mach is de fer?", "¿Cuánto es el pasaje?"], ["Please take me to this address.", "plis téik mi tu dis adrés", "Por favor lléveme a esta dirección."], ["A table for two, please.", "a téibol for tu, plis", "Una mesa para dos, por favor."], ["Can we see the menu? / The check, please.", "kan uí si de méniu? / de chek, plis", "¿Nos trae el menú? / La cuenta, por favor."], ["Is the tip included?", "is de tip inclúded?", "¿La propina está incluida?"], ["<b>Help!<\/b> / Call an ambulance!", "jelp / col an ámbiulans", "¡Ayuda! / ¡Llame una ambulancia!"], ["There's been an accident.", "ders bin an áksident", "Hubo un accidente."], ["My address is ...", "mái adrés is...", "Mi dirección es ..."]]}, {"t": "box", "kind": "warn", "title": "⚠ Importante", "items": ["En Aruba, para ambulancia y bomberos se marca el <b>911<\/b>; para la policía, el <b>100<\/b>. Practiquen juntos, en voz alta, cómo decir su dirección completa en inglés y cómo describir la emergencia en una frase: <i>«My husband fell and he is hurt. We are at [address].»<\/i> Escríbanla y péguenla en la nevera."]}, {"t": "h1", "title": "Parte 5 · Inglés para el trabajo", "sub": "A. Técnico de telecomunicaciones (para él)"}, {"t": "p", "text": "Buenas noticias: gran parte del vocabulario técnico ya está en inglés (router, modem, Wi-Fi, fiber, switch). El reto es la conversación con clientes, supervisores y compañeros. Aquí está lo esencial."}, {"t": "h3", "title": "Vocabulario técnico"}, {"t": "vocab", "rows": [["fiber optic cable", "cable de fibra óptica"], ["splice / splicing", "empalme / empalmar"], ["connector", "conector"], ["router / modem", "router / módem"], ["ONT (optical network terminal)", "terminal óptica (ONT)"], ["signal / signal strength", "señal / potencia de señal"], ["outage", "caída del servicio"], ["installation / setup", "instalación / configuración"], ["troubleshooting", "diagnóstico de fallas"], ["work order / ticket", "orden de trabajo / ticket"], ["cabinet / box", "gabinete / caja"], ["pole / ladder", "poste / escalera"], ["wall jack / outlet", "toma de pared"], ["drill", "taladro"], ["cable tester / power meter", "probador / medidor de potencia"], ["bandwidth / speed", "ancho de banda / velocidad"], ["password / network name", "contraseña / nombre de red"], ["reboot / reset", "reiniciar / restablecer"], ["damaged / broken / loose", "dañado / roto / flojo"], ["safety gear / harness", "equipo de seguridad / arnés"], ["helmet / gloves", "casco / guantes"], ["the field / on site", "en campo / en sitio"], ["customer premises", "domicilio del cliente"], ["downtime", "tiempo sin servicio"]]}, {"t": "h3", "title": "Con el cliente (llegar, explicar, terminar)"}, {"t": "phrases", "rows": [["Good morning, I'm the technician from [company].", "gud mórning, áim de teknishan from...", "Buenos días, soy el técnico de [empresa]."], ["I'm here to install your internet service.", "áim jíer tu instól iór ínternet sérvis", "Vengo a instalar su servicio de internet."], ["I'm here to check the problem with your connection.", "áim jíer tu chek de próblem uiz iór konékshon", "Vengo a revisar el problema con su conexión."], ["Can you show me where the modem is?", "kan iú shou mi uér de móudem is?", "¿Me muestra dónde está el módem?"], ["What is the problem exactly?", "uát is de próblem eksáktli?", "¿Cuál es el problema exactamente?"], ["When did the problem start?", "uén did de próblem start?", "¿Cuándo empezó el problema?"], ["I need to drill a small hole here. Is that okay?", "ái nid tu dril a smol jóul jíer. is dat okéi?", "Necesito hacer un hoyito aquí. ¿Está bien?"], ["It will take about one hour.", "it uil téik abáut uan áuer", "Tardará más o menos una hora."], ["The cable was damaged. I replaced it.", "de kéibol uas dámeyd. ái ripléist it", "El cable estaba dañado. Lo cambié."], ["Everything is working now.", "évrizing is uórking náu", "Ya todo funciona."], ["This is your Wi-Fi name and password.", "dis is iór uái-fai néim end pásuord", "Este es su nombre de Wi-Fi y contraseña."], ["If you have any problem, please call customer service.", "if iú jav éni próblem, plis col cástomer sérvis", "Si tiene algún problema, llame a servicio al cliente."], ["Can you sign here, please?", "kan iú sáin jíer, plis?", "¿Puede firmar aquí, por favor?"]]}, {"t": "h3", "title": "Con el supervisor y los compañeros"}, {"t": "phrases", "rows": [["I finished the job at [address].", "ái fínisht de yob at...", "Terminé el trabajo en [dirección]."], ["I need more cable / another connector.", "ái nid mor kéibol / anóder konéktor", "Necesito más cable / otro conector."], ["The customer wasn't home.", "de cástomer uásent jóum", "El cliente no estaba en casa."], ["There's no signal at the box.", "ders nou sígnal at de box", "No hay señal en la caja."], ["I think the problem is in the main line.", "ái zink de próblem is in de méin láin", "Creo que el problema está en la línea principal."], ["I'm on my way. / I'm running late.", "áim on mái uéi / áim rániŋ léit", "Voy en camino. / Voy con retraso."], ["Can you help me with this? / Can you show me how?", "kan iú jelp mi uiz dis? / ... shou mi jáu?", "¿Me ayudas con esto? / ¿Me enseñas cómo?"], ["Sorry, can you say that again more slowly?", "sóri, kan iú séi dat aguén mor slóuli?", "Perdón, ¿lo repites más despacio?"], ["Be careful! / Watch out!", "bi kérful / uách áut", "¡Ten cuidado! / ¡Cuidado!"]]}, {"t": "dialog", "title": "una visita técnica", "lines": [["Customer", "Hi! The internet has been down since yesterday.", "¡Hola! El internet no funciona desde ayer."], ["Tech", "Good morning. I'm sorry about that. Can I see the modem, please?", "Buenos días. Lo siento. ¿Puedo ver el módem?"], ["Customer", "Sure, it's in the living room.", "Claro, está en la sala."], ["Tech", "The red light is on. I'm going to check the cable outside.", "La luz roja está prendida. Voy a revisar el cable afuera."], ["Tech", "The connector was loose. I fixed it. Can you check your phone now?", "El conector estaba flojo. Lo arreglé. ¿Puede revisar su teléfono ahora?"], ["Customer", "Yes! It's working. Thank you so much!", "¡Sí! Ya funciona. ¡Muchas gracias!"], ["Tech", "You're welcome. Please sign here. Have a nice day!", "De nada. Por favor firme aquí. ¡Que tenga buen día!"]]}, {"t": "box", "kind": "tip", "title": "★ Tip para el técnico", "items": ["Prepara una «tarjeta de bolsillo» (o nota en el celular) con tus 10 frases de cliente más usadas. Léela en el carro antes de cada visita. En un mes las dirás de memoria. También practica decir números de teléfono, direcciones y números de serie en voz alta: es lo que más se usa en campo."]}, {"t": "h1", "title": "Inglés para el trabajo", "sub": "B. Agente de reservaciones (para ella)"}, {"t": "p", "text": "Las reservaciones siguen un guion bastante repetitivo. Esa es una gran ventaja: si dominas el guion, dominas el 80% de tus llamadas. Aquí hay frases útiles para hotel, aerolínea, tours o alquiler de autos; adapta las que correspondan a tu empresa."}, {"t": "h3", "title": "Vocabulario"}, {"t": "vocab", "rows": [["booking / reservation", "reserva"], ["availability", "disponibilidad"], ["to book", "reservar"], ["confirmation number", "número de confirmación"], ["check-in / check-out", "entrada / salida"], ["arrival / departure", "llegada / salida"], ["rate / price per night", "tarifa / precio por noche"], ["deposit", "depósito"], ["cancellation policy", "política de cancelación"], ["refund", "reembolso"], ["fully booked / sold out", "lleno / agotado"], ["single / double room", "habitación sencilla / doble"], ["ocean view", "vista al mar"], ["guest", "huésped"], ["adults / children", "adultos / niños"], ["flight number", "número de vuelo"], ["round trip / one way", "ida y vuelta / solo ida"], ["upgrade", "mejora de categoría"], ["special request", "solicitud especial"], ["taxes and fees", "impuestos y cargos"], ["to hold / on hold", "esperar / en espera"], ["to transfer a call", "transferir una llamada"]]}, {"t": "h3", "title": "El guion de una llamada"}, {"t": "phrases", "rows": [["Thank you for calling [company], this is [name]. How may I help you?", "zenk iú for cóling..., dis is... jáu mei ái jelp iú?", "Gracias por llamar a [empresa], habla [nombre]. ¿En qué puedo ayudarle?"], ["I'd be happy to help you with that.", "áid bi jápi tu jelp iú uiz dat", "Con gusto le ayudo con eso."], ["May I have your full name, please?", "méi ái jav iór ful néim, plis?", "¿Me da su nombre completo, por favor?"], ["Could you spell that for me, please?", "kud iú spel dat for mi, plis?", "¿Me lo podría deletrear?"], ["What dates are you looking for?", "uát déits ar iú lúking for?", "¿Qué fechas busca?"], ["How many guests will be staying?", "jáu méni guests uil bi stéiing?", "¿Cuántos huéspedes se hospedarán?"], ["Let me check the availability for you.", "let mi chek de aveilabíliti for iú", "Permítame revisar la disponibilidad."], ["Could you hold for a moment, please?", "kud iú jóuld for a móument, plis?", "¿Puede esperar un momento, por favor?"], ["Thank you for holding.", "zenk iú for jóulding", "Gracias por esperar."], ["We have a double room available for those dates.", "uí jav a dábel rum avéilabol for dóus déits", "Tenemos una habitación doble disponible para esas fechas."], ["The rate is 180 dollars per night, plus taxes.", "de réit is uán-éiti dólars per náit, plas táxes", "La tarifa es 180 dólares por noche, más impuestos."], ["Would you like me to book it for you?", "uud iú láik mi tu buk it for iú?", "¿Desea que se la reserve?"], ["Your confirmation number is ...", "iór konferméishon námber is...", "Su número de confirmación es ..."], ["You will receive a confirmation email shortly.", "iú uil risív a konferméishon ímeil shórtli", "Recibirá un correo de confirmación en breve."], ["Is there anything else I can help you with?", "is der énizing els ái kan jelp iú uiz?", "¿Hay algo más en que pueda ayudarle?"], ["Thank you for choosing us. Have a great day!", "zenk iú for chúsing as. jav a gréit déi", "Gracias por elegirnos. ¡Que tenga un gran día!"]]}, {"t": "h3", "title": "Cuando no entiendes o hay un problema"}, {"t": "phrases", "rows": [["I'm sorry, the line is not clear. Could you repeat that?", "áim sóri, de láin is not clíer...", "Disculpe, la línea no está clara. ¿Puede repetir?"], ["Just to confirm, that's March 15th to the 20th?", "yast tu konférm, dats march fiftínz tu de tuéntiez?", "Para confirmar, ¿del 15 al 20 de marzo?"], ["I apologize for the inconvenience.", "ái apóloyais for de inconvíniens", "Le pido disculpas por el inconveniente."], ["Unfortunately, we are fully booked on those dates.", "anfórchunetli, uí ar fúli bukt...", "Lamentablemente estamos llenos esas fechas."], ["I can offer you an alternative.", "ái kan ófer iú an oltérnativ", "Le puedo ofrecer una alternativa."], ["Let me transfer you to my supervisor.", "let mi transfér iú tu mái supervaisor", "Le transfiero con mi supervisor(a)."], ["There is a cancellation fee of ...", "der is a canseléishon fi of...", "Hay un cargo por cancelación de ..."]]}, {"t": "h3", "title": "Correos electrónicos: frases listas"}, {"t": "bullets", "items": ["<b>Saludo:<\/b> <i>Dear Mr. / Ms. [Apellido],<\/i> — <i>Thank you for your email.<\/i>", "<b>Confirmar:<\/b> <i>I am pleased to confirm your reservation for [dates].<\/i>", "<b>Adjuntar:<\/b> <i>Please find attached your booking confirmation.<\/i>", "<b>Pedir información:<\/b> <i>Could you please send us your flight details?<\/i>", "<b>Disculpa:<\/b> <i>We apologize for any inconvenience this may cause.<\/i>", "<b>Cierre:<\/b> <i>Please do not hesitate to contact us if you have any questions. We look forward to welcoming you. Kind regards, [Nombre]<\/i>"]}, {"t": "dialog", "title": "una reserva por teléfono", "lines": [["Agent", "Thank you for calling. This is Ana. How may I help you?", "Gracias por llamar. Habla Ana. ¿En qué puedo ayudarle?"], ["Caller", "Hi, I'd like to book a room for next weekend.", "Hola, quisiera reservar una habitación para el próximo fin de semana."], ["Agent", "Of course. What are your arrival and departure dates?", "Claro. ¿Cuáles son sus fechas de llegada y salida?"], ["Caller", "Arriving Friday the 20th, leaving Sunday the 22nd.", "Llego el viernes 20, salgo el domingo 22."], ["Agent", "Let me check... Yes, we have an ocean-view room at 210 dollars per night. Would you like to book it?", "Déjeme revisar... Sí, tenemos una con vista al mar a 210 dólares la noche. ¿Desea reservarla?"], ["Caller", "Yes, please.", "Sí, por favor."], ["Agent", "May I have your full name? Could you spell your last name, please?", "¿Su nombre completo? ¿Podría deletrear su apellido?"], ["Caller", "Smith. S-M-I-T-H.", "Smith. S-M-I-T-H."], ["Agent", "Thank you, Mr. Smith. Your confirmation number is A-7-4-2-9.", "Gracias, Sr. Smith. Su número de confirmación es A-7-4-2-9."]]}, {"t": "box", "kind": "tip", "title": "★ Tip para la agente", "items": ["Escribe tu guion completo de llamada en una hoja y tenlo junto a la computadora. Practica con tu esposo en casa: él hace de cliente (¡y que a veces sea un cliente difícil!). Graba tu voz en el celular diciendo el saludo de bienvenida y compárala con la de una compañera nativa."]}, {"t": "h1", "title": "Parte 6 · Ejercicios para practicar", "sub": "Háganlos con lápiz; las respuestas están al final"}, {"t": "exercise", "title": "Ejercicio 1 · Completa con am / is / are", "items": ["I ______ a technician.", "She ______ at work now.", "We ______ from Colombia.", "The store ______ closed on Sunday.", "______ you busy?", "My husband and I ______ new in Aruba."], "note": null}, {"t": "exercise", "title": "Ejercicio 2 · Traduce al inglés", "items": ["¿Cuánto cuesta esto?", "No entiendo. ¿Puede hablar despacio?", "Quisiera abrir una cuenta bancaria.", "El internet no funciona desde ayer.", "Permítame revisar la disponibilidad.", "Tengo dolor de cabeza."], "note": null}, {"t": "exercise", "title": "Ejercicio 3 · Pasado simple: escribe el pasado", "items": ["go → ______", "buy → ______", "work → ______", "pay → ______", "have → ______", "call → ______", "fix → ______", "book → ______"], "note": null}, {"t": "exercise", "title": "Ejercicio 4 · Ordena las palabras", "items": ["you / help / How / I / may / ?", "the / Where / rice / is / ?", "card / pay / I / Can / with / ?", "number / Your / confirmation / is / B-325", "cable / damaged / The / was"], "note": null}, {"t": "exercise", "title": "Ejercicio 5 · ¿Qué dirías? (situaciones)", "items": ["Estás en la caja y quieres saber si aceptan dólares.", "Llegas a casa de un cliente para instalar internet. Preséntate.", "Un cliente te llama y no entendiste su apellido.", "Tu vecino te saluda por primera vez.", "Tienes que decirle al casero que el aire acondicionado no funciona."], "note": null}, {"t": "exercise", "title": "Ejercicio 6 · Deletrea en voz alta (en pareja)", "items": ["Tu nombre completo y apellidos.", "Tu correo electrónico (con «at» y «dot»).", "Tu número de teléfono, número por número.", "Tu dirección en Aruba.", "Un número de confirmación inventado: K7-Q2-J9-G4 (¡cuidado con G y J!)."], "note": "Uno deletrea y el otro escribe. Después cambien de rol y comparen."}, {"t": "h1", "title": "Juegos y role-plays en pareja", "sub": "La práctica más divertida y la que más resultados da"}, {"t": "h2", "title": "Role-plays (10 minutos cada uno)"}, {"t": "p", "text": "Uno hace de cliente/empleado y el otro de ustedes mismos. Usen las frases de esta guía. Luego cambien de rol. La segunda vez, intenten hacerlo <b>sin mirar la guía<\/b>."}, {"t": "h2", "title": "Juegos rápidos"}, {"t": "bullets", "items": ["<b>«What's this?»<\/b> — Uno señala un objeto de la casa; el otro tiene 3 segundos para decir el nombre en inglés. Punto por respuesta correcta.", "<b>20 preguntas<\/b> — Uno piensa en un objeto; el otro adivina solo con preguntas de sí/no en inglés: <i>«Is it in the kitchen? Is it big?»<\/i>", "<b>El día al revés<\/b> — Cuenten su día del final al principio, en pasado.", "<b>Dictado de compras<\/b> — Uno dicta la lista del súper en inglés y el otro la escribe sin ver.", "<b>La palabra del día<\/b> — Cada mañana uno elige una palabra nueva. Quien la use más veces en el día gana (el perdedor lava los platos 😉).", "<b>Noticias de 1 minuto<\/b> — Cada uno cuenta en inglés algo que pasó en su trabajo. El otro hace dos preguntas."]}, {"t": "h1", "title": "Parte 7 · Plan de 12 semanas", "sub": "Una meta clara por semana"}, {"t": "h2", "title": "Hoja de seguimiento semanal"}, {"t": "p", "text": "Imprímanla (o cópienla en el cuaderno) y marquen cada día lo que hicieron. Una para cada uno."}, {"t": "box", "kind": "info", "title": "Nuestra meta", "items": ["Escriban aquí 3 frases que quieren poder decir con confianza dentro de 3 meses:", "1. ____________________________________________________________", "2. ____________________________________________________________", "3. ____________________________________________________________"]}, {"t": "h1", "title": "Respuestas de los ejercicios", "sub": "Revisen juntos y repitan en voz alta las que fallaron"}, {"t": "box", "kind": "warn", "title": "♥ Un último consejo", "items": ["Aprender un idioma de adulto, en un país nuevo y trabajando, es difícil, y ustedes lo están haciendo juntos. Habrá días en que sientan que no avanzan: es normal. Sigan con los 15 minutos diarios, hablen aunque sea con errores, y en unos meses se van a sorprender de todo lo que entienden y dicen.", "<b>You can do it! — ¡Ustedes pueden! — Boso por!<\/b>"]}, {"t": "h1", "title": "Números, fechas, hora y dinero", "sub": "Lo que más se dicta por teléfono y en la caja"}, {"t": "p", "text": "Los números son lo que más falla al principio, y en sus dos trabajos se usan todo el día: precios, fechas de reserva, teléfonos, direcciones, números de orden. Practíquenlos con el juego «Números al oído»."}, {"t": "h3", "title": "Números clave"}, {"t": "vocab", "rows": [["one, two, three", "1, 2, 3"], ["four, five, six", "4, 5, 6"], ["seven, eight, nine", "7, 8, 9"], ["ten, eleven, twelve", "10, 11, 12"], ["thirteen", "13"], ["thirty", "30"], ["fourteen", "14"], ["forty", "40"], ["fifteen", "15"], ["fifty", "50"], ["twenty-one", "21"], ["one hundred", "100"], ["two hundred fifty", "250"], ["one thousand", "1,000"], ["zero / oh", "0 (en teléfonos se dice «oh»)"], ["double five", "55 (en teléfonos)"]]}, {"t": "box", "kind": "tip", "title": "13 o 30", "items": ["<b>thirTEEN<\/b> lleva la fuerza al final; <b>THIRty<\/b> al principio. Si dudan, confirmen: <i>«One-three or three-zero?»<\/i>. Sirve igual para 14/40, 15/50, 16/60."]}, {"t": "h3", "title": "Primero, segundo… (para fechas y pisos)"}, {"t": "vocab", "rows": [["first (1st)", "primero"], ["second (2nd)", "segundo"], ["third (3rd)", "tercero"], ["fourth (4th)", "cuarto"], ["fifth (5th)", "quinto"], ["twelfth (12th)", "duodécimo"], ["twentieth (20th)", "vigésimo"], ["twenty-first (21st)", "vigésimo primero"], ["thirtieth (30th)", "trigésimo"], ["thirty-first (31st)", "trigésimo primero"]]}, {"t": "h3", "title": "Días y meses"}, {"t": "vocab", "rows": [["Monday", "lunes"], ["Tuesday", "martes"], ["Wednesday", "miércoles"], ["Thursday", "jueves"], ["Friday", "viernes"], ["Saturday", "sábado"], ["Sunday", "domingo"], ["January", "enero"], ["February", "febrero"], ["March", "marzo"], ["April", "abril"], ["May", "mayo"], ["June", "junio"], ["July", "julio"], ["August", "agosto"], ["September", "septiembre"], ["October", "octubre"], ["November", "noviembre"], ["December", "diciembre"], ["today / tomorrow", "hoy / mañana"], ["yesterday", "ayer"], ["next week", "la próxima semana"], ["last month", "el mes pasado"]]}, {"t": "h3", "title": "Frases con hora, fecha y dinero"}, {"t": "phrases", "rows": [["What time is it?", "uát táim is it?", "¿Qué hora es?"], ["It's three forty-five.", "its zri fórti fáiv", "Son las 3:45."], ["It's half past two.", "its jaf past tu", "Son las dos y media."], ["At nine in the morning.", "at náin in de mórning", "A las nueve de la mañana."], ["What time do you open?", "uát táim du iú óupen?", "¿A qué hora abren?"], ["We close at six p.m.", "uí clóus at six pi-em", "Cerramos a las 6 p. m."], ["What is today's date?", "uát is tudéis déit?"
