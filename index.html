", "triángulo / rectángulo"], ["odd / even", "impar / par"], ["answer", "respuesta"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Seven plus five equals twelve.", "séven plos fáiv íkuals tuelv", "Siete más cinco es igual a doce."], ["Twenty minus eight is twelve.", "tuénti máinos éit is tuelv", "Veinte menos ocho es doce."], ["Six times seven is forty-two.", "six táims séven is fórti tu", "Seis por siete es cuarenta y dos."], ["Half of ten is five.", "jaf of ten is fáiv", "La mitad de diez es cinco."], ["Three quarters is bigger than one half.", "zri kuórters is bíguer dan uán jaf", "Tres cuartos es más que un medio."], ["A triangle has three sides.", "a tráiangol jas zri sáids", "Un triángulo tiene tres lados."], ["Is twenty-one odd or even?", "is tuénti uán od or íven?", "¿Veintiuno es par o impar?"], ["I don't understand this problem.", "ái dount onderstánd dis próblem", "No entiendo este problema."], ["Let me check my answer.", "let mi chek mai ánser", "Déjame revisar mi respuesta."], ["I solved it with the bead chain.", "ái solvd it uiz de bid chéin", "Lo resolví con la cadena de cuentas."]]}, {"t": "dialog", "title": "Problema en parejas", "lines": [["Mateo", "How much is eight times six?", "¿Cuánto es ocho por seis?"], ["Camila", "Forty-eight.", "Cuarenta y ocho."], ["Mateo", "Are you sure?", "¿Estás segura?"], ["Camila", "Yes, I checked it: six times eight is forty-eight too.", "Sí, lo revisé: seis por ocho también es cuarenta y ocho."]]}, {"t": "box", "kind": "tip", "title": "13 o 30", "items": ["Los números que terminan en <b>-teen<\/b> (13 al 19) llevan la fuerza al final: thir<b>TEEN<\/b>. Los que terminan en <b>-ty<\/b> (30, 40…) la llevan al principio: <b>THIR<\/b>ty. Si alguien no te entiende, di los dígitos: «one-three»."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Inventa tres problemas de suma o multiplicación para papá y léelos en inglés."]}, {"t": "h1", "title": "16. Contar historias", "sub": "Etapa 4 · A2 · El pasado: lo que hiciste el fin de semana"}, {"t": "p", "text": "Para contar lo que pasó usamos el pasado. Muchos verbos solo agregan <b>-ed<\/b>, pero otros cambian completos: ¡hay que aprenderlos!"}, {"t": "h3", "title": "Palabras (verbos en pasado)"}, {"t": "vocab", "rows": [["go → went", "ir → fui, fue"], ["have → had", "tener → tuve"], ["eat → ate", "comer → comí"], ["see → saw", "ver → vi"], ["make → made", "hacer → hice"], ["play → played", "jugar → jugué"], ["visit → visited", "visitar → visité"], ["watch → watched", "ver (tele) → vi"], ["swim → swam", "nadar → nadé"], ["buy → bought", "comprar → compré"], ["yesterday", "ayer"], ["last weekend", "el fin de semana pasado"], ["first / then / finally", "primero / luego / al final"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Last weekend I went to the beach.", "last uíkend ái uent tu de bich", "El fin de semana pasado fui a la playa."], ["First, we had breakfast.", "ferst, uí jad brékfast", "Primero, desayunamos."], ["Then we played with the dogs.", "den uí pleid uiz de dogs", "Luego jugamos con los perros."], ["I saw a big turtle!", "ái so a big térrol!", "¡Vi una tortuga grande!"], ["We ate ice cream.", "uí éit áis crim", "Comimos helado."], ["Finally, we went home.", "fáinali, uí uent jóum", "Al final, nos fuimos a casa."], ["What did you do yesterday?", "uát did iú du iésterdei?", "¿Qué hiciste ayer?"], ["I didn't go to school.", "ái dídnt gou tu skul", "No fui al colegio."], ["Did you have fun?", "did iú jav fon?", "¿Te divertiste?"], ["It was the best day ever!", "it uós de best dei éver!", "¡Fue el mejor día de todos!"]]}, {"t": "dialog", "title": "Lunes en la mañana", "lines": [["Ana", "What did you do on the weekend?", "¿Qué hiciste el fin de semana?"], ["Camila", "I went to Baby Beach with my family.", "Fui a Baby Beach con mi familia."], ["Ana", "Did you swim?", "¿Nadaste?"], ["Camila", "Yes! I swam and I saw a lot of fish.", "¡Sí! Nadé y vi muchos peces."], ["Ana", "Lucky you!", "¡Qué suerte!"]]}, {"t": "box", "kind": "tip", "title": "Did + verbo normal", "items": ["En preguntas y negaciones del pasado, el pasado lo lleva <b>did<\/b>, y el verbo vuelve a su forma normal: <b>Did you go?<\/b> (no «Did you went?»), <b>I didn't eat<\/b> (no «didn't ate»)."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Cuenta tu fin de semana en 5 frases usando first, then y finally. Grábalo y escúchate."]}, {"t": "h1", "title": "17. Mis opiniones", "sub": "Etapa 5 · B1 · Dar tu opinión, explicar por qué y estar de acuerdo o no"}, {"t": "p", "text": "Ya sabes mucho inglés. Ahora aprende a decir lo que piensas y a explicar tus razones con respeto."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["opinion", "opinión"], ["I think / I believe", "creo / pienso"], ["because", "porque"], ["agree / disagree", "estar de acuerdo / en desacuerdo"], ["in my opinion", "en mi opinión"], ["maybe", "tal vez"], ["I'm not sure", "no estoy segura"], ["better / worse", "mejor / peor"], ["the best / the worst", "el mejor / el peor"], ["important", "importante"], ["boring / interesting", "aburrido / interesante"], ["fair / unfair", "justo / injusto"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I think reading is more fun than watching TV.", "ái zink ríding is mor fon dan uóching ti-vi", "Creo que leer es más divertido que ver tele."], ["In my opinion, homework should be shorter.", "in mai opínion, jómuerk shud bi shórter", "En mi opinión, la tarea debería ser más corta."], ["I agree with you.", "ái agrí uiz iú", "Estoy de acuerdo contigo."], ["I see your point, but I disagree.", "ái si iór póint, bot ái disagrí", "Entiendo tu idea, pero no estoy de acuerdo."], ["Why do you think that?", "uái du iú zink dat?", "¿Por qué piensas eso?"], ["Because dogs are loyal and fun.", "bicós dogs ar lóial and fon", "Porque los perros son leales y divertidos."], ["That's a good idea!", "dats a gud aidía!", "¡Es una buena idea!"], ["I'm not sure, but maybe…", "áim not shur, bot méibi…", "No estoy segura, pero tal vez…"], ["What's your favorite book and why?", "uáts iór féivorit buk and uái?", "¿Cuál es tu libro favorito y por qué?"], ["The best part was the ending.", "de best part uós di énding", "La mejor parte fue el final."]]}, {"t": "dialog", "title": "Debate en clase: ¿perros o gatos?", "lines": [["Mateo", "I think cats are better pets.", "Creo que los gatos son mejores mascotas."], ["Camila", "I see your point, but I disagree.", "Entiendo, pero no estoy de acuerdo."], ["Mateo", "Why?", "¿Por qué?"], ["Camila", "Because dogs play with you and go for walks. My three dogs are the best!", "Porque los perros juegan contigo y salen a pasear. ¡Mis tres perros son los mejores!"], ["Mateo", "Okay, that's a good reason.", "Bueno, es una buena razón."]]}, {"t": "box", "kind": "tip", "title": "Should = debería", "items": ["Para opinar sobre lo que sería mejor: <b>should<\/b> + verbo: <b>We should recycle more<\/b>. Sin «to»: no «should to recycle»."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Escoge un tema (¿playa o piscina? ¿libros o películas?) y da tu opinión con dos razones usando because."]}, {"t": "h1", "title": "18. Planes y sueños", "sub": "Etapa 5 · B1 · El futuro: planes, predicciones y qué quieres ser"}, {"t": "p", "text": "¿Qué vas a hacer en las vacaciones? ¿Qué quieres ser cuando seas grande? Usa <b>going to<\/b> para planes y <b>will<\/b> para predicciones y promesas."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["future", "futuro"], ["plan", "plan"], ["dream", "sueño"], ["vacation / holidays", "vacaciones"], ["next year", "el próximo año"], ["when I grow up", "cuando sea grande"], ["vet", "veterinaria"], ["scientist", "científica"], ["artist", "artista"], ["engineer", "ingeniera"], ["doctor", "doctora"], ["astronaut", "astronauta"], ["travel", "viajar"], ["learn", "aprender"], ["promise", "promesa, prometer"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I'm going to visit my grandma in December.", "áim góing tu vísit mai granmá in disémber", "Voy a visitar a mi abuela en diciembre."], ["What are you going to do this summer?", "uát ar iú góing tu du dis sómer?", "¿Qué vas a hacer este verano?"], ["When I grow up, I want to be a vet.", "uén ái gróu op, ái uánt tu bi a vet", "Cuando sea grande, quiero ser veterinaria."], ["I want to help animals.", "ái uánt tu jelp ánimals", "Quiero ayudar a los animales."], ["I think it will rain tomorrow.", "ái zink it uíl réin tumórou", "Creo que mañana va a llover."], ["I'll help you, I promise.", "áil jelp iú, ái prómis", "Te ayudaré, lo prometo."], ["Next year I'll be eleven.", "nekst íer áil bi iléven", "El próximo año tendré once."], ["One day I'm going to travel the world.", "uán dei áim góing tu trável de uérld", "Algún día voy a viajar por el mundo."], ["What do you want to be?", "uát du iú uánt tu bi?", "¿Qué quieres ser?"], ["I'm going to practice English every day.", "áim góing tu práctis ínglish évri dei", "Voy a practicar inglés todos los días."]]}, {"t": "dialog", "title": "Cuando sea grande", "lines": [["Teacher", "Camila, what do you want to be when you grow up?", "Camila, ¿qué quieres ser cuando seas grande?"], ["Camila", "I want to be a vet, because I love animals.", "Quiero ser veterinaria, porque amo a los animales."], ["Teacher", "That's wonderful! How are you going to prepare?", "¡Qué maravilla! ¿Cómo te vas a preparar?"], ["Camila", "I'm going to study science and take care of my three dogs.", "Voy a estudiar ciencias y cuidar a mis tres perros."]]}, {"t": "box", "kind": "tip", "title": "Going to o will", "items": ["<b>going to<\/b>: planes que ya decidiste (<b>I'm going to visit…<\/b>). <b>will<\/b>: decisiones del momento, promesas y predicciones (<b>I'll help you<\/b>, <b>It will be fun<\/b>)."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Escribe una carta a tu «yo» del futuro (de 20 años) en inglés: qué vas a hacer y qué quieres lograr."]}, {"t": "h1", "title": "19. Presentar en clase", "sub": "Etapa 5 · B1 · Show and tell, exponer un proyecto y responder preguntas"}, {"t": "p", "text": "En Montessori presentas tus investigaciones a tus compañeros. Con estas frases tu presentación en inglés va a tener principio, desarrollo y final."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["presentation", "presentación, exposición"], ["topic", "tema"], ["research", "investigación, investigar"], ["poster", "cartel, afiche"], ["first of all", "primero que todo"], ["for example", "por ejemplo"], ["in addition", "además"], ["to sum up", "en resumen"], ["questions", "preguntas"], ["audience", "público"], ["fact", "dato"], ["interesting", "interesante"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["Good morning, everyone. Today I'm going to talk about flamingos.", "gud mórning, évriuan. tudéi áim góing tu tok abáut flamíngous", "Buenos días a todos. Hoy voy a hablar de los flamencos."], ["First of all, flamingos are pink because of what they eat.", "ferst of ol, flamíngous ar pink bicós of uát déi it", "Primero que todo, los flamencos son rosados por lo que comen."], ["For example, they eat small shrimp.", "for egsámpol, déi it smol shrimp", "Por ejemplo, comen camarones pequeños."], ["Here is an interesting fact.", "jíer is an ínterestin fakt", "Aquí hay un dato interesante."], ["As you can see in my poster…", "as iú can si in mai póuster…", "Como pueden ver en mi cartel…"], ["To sum up, flamingos are amazing birds.", "tu som op, flamíngous ar améisin berds", "En resumen, los flamencos son aves increíbles."], ["Does anyone have any questions?", "dos énioun jav éni kuéstions?", "¿Alguien tiene preguntas?"], ["That's a great question.", "dats a gréit kuéstion", "Es una gran pregunta."], ["I'm not sure, but I can find out.", "áim not shur, bot ái can fáind áut", "No estoy segura, pero lo puedo averiguar."], ["Thank you for listening!", "zank iú for lísening!", "¡Gracias por escuchar!"]]}, {"t": "dialog", "title": "Show and tell", "lines": [["Camila", "Today I brought a photo of my dog Sam. He is nine years old.", "Hoy traje una foto de mi perro Sam. Tiene nueve años."], ["Leo", "Is he a beagle?", "¿Es un beagle?"], ["Camila", "No, he's a cocker spaniel. Turrón is our beagle.", "No, es un cocker spaniel. Turrón es nuestro beagle."], ["Ana", "What does Sam like to do?", "¿Qué le gusta hacer a Sam?"], ["Camila", "He likes to sleep in the sun and eat carrots!", "¡Le gusta dormir al sol y comer zanahorias!"]]}, {"t": "box", "kind": "tip", "title": "La pronunciación de -ed", "items": ["En el pasado, <b>-ed<\/b> casi nunca suena «ed»: <b>played<\/b> = «pleid», <b>watched<\/b> = «uocht». Solo suena «id» después de t o d: <b>visited<\/b>, <b>needed<\/b>."]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["Prepara un show and tell de 1 minuto sobre una de tus mascotas y preséntalo a tu familia."]}, {"t": "h1", "title": "20. Resolver problemas", "sub": "Etapa 5 · B1 · La mesa de la paz: expresar sentimientos, disculparse y llegar a acuerdos"}, {"t": "p", "text": "En la mesa de la paz aprendes a resolver problemas hablando. Usar frases con <b>I feel…<\/b> ayuda a decir lo que sientes sin pelear."}, {"t": "h3", "title": "Palabras"}, {"t": "vocab", "rows": [["problem / solution", "problema / solución"], ["feelings", "sentimientos"], ["upset", "molesto"], ["hurt", "herido, lastimado"], ["sorry", "perdón, lo siento"], ["apologize", "disculparse"], ["forgive", "perdonar"], ["listen", "escuchar"], ["respect", "respeto, respetar"], ["compromise", "acuerdo, ceder un poco"], ["together", "juntos"], ["kind", "amable"], ["share", "compartir"], ["on purpose / by accident", "a propósito / sin querer"]]}, {"t": "h3", "title": "Frases"}, {"t": "phrases", "rows": [["I feel upset when you take my things.", "ái fil opsét uén iú téik mai zings", "Me siento molesta cuando agarras mis cosas."], ["I'm sorry, it was an accident.", "áim sóri, it uós an áksident", "Lo siento, fue sin querer."], ["I didn't do it on purpose.", "ái dídnt du it on pérpos", "No lo hice a propósito."], ["Can we talk about it?", "can uí tok abáut it?", "¿Podemos hablarlo?"], ["Let's find a solution together.", "lets fáind a solúshon tuguéder", "Busquemos una solución juntos."], ["How can I make it better?", "jáu can ái méik it béter?", "¿Cómo lo puedo arreglar?"], ["Maybe we can take turns.", "méibi uí can téik terns", "Tal vez podemos turnarnos."], ["I forgive you.", "ái forguív iú", "Te perdono."], ["Thank you for listening to me.", "zank iú for lísening tu mi", "Gracias por escucharme."], ["Are we friends again?", "ar uí frends aguén?", "¿Somos amigas otra vez?"]]}, {"t": "dialog", "title": "En la mesa de la paz", "lines": [["Ana", "I feel sad because you didn't let me play.", "Me siento triste porque no me dejaste jugar."], ["Camila", "I'm sorry. I didn't know you wanted to play.", "Lo siento. No sabía que querías jugar."], ["Ana", "Can I play with you next time?", "¿Puedo jugar contigo la próxima vez?"], ["Camila", "Yes! Let's play together at recess.", "¡Sí! Juguemos juntas en el recreo."], ["Ana", "Okay. Friends again?", "Bueno. ¿Amigas otra vez?"], ["Camila", "Friends again!", "¡Amigas otra vez!"]]}, {"t": "box", "kind": "tip", "title": "I feel… when… because…", "items": ["La fórmula de la mesa de la paz: <b>I feel<\/b> (cómo me siento) + <b>when<\/b> (qué pasó) + <b>because<\/b> (por qué me importa). Ejemplo: <i>I feel sad when you don't listen because I want to share my idea.<\/i>"]}, {"t": "box", "kind": "tip", "title": "Reto de hoy", "items": ["¡Llegaste a 100! Graba un video corto presentándote en inglés: quién eres, qué te gusta, qué aprendiste y qué quieres ser."]}, {"t": "box", "kind": "warn", "title": "Para mamá y papá", "items": ["Al llegar aquí, Camila está cerca de un nivel B1 para su edad (similar a A2 Flyers / B1 Preliminary for Schools de Cambridge). Lo que más la ayudará ahora: leer libros por placer en inglés, ver series con subtítulos en inglés y hablar con nativos en situaciones reales."]}], "tips": [["1. Poco, pero todos los días", "15 a 30 minutos diarios funcionan mejor que 3 horas el domingo. Elijan un momento fijo: el café de la mañana, el viaje al trabajo o después de cenar."], ["2. La «hora en inglés» en casa", "Escojan una hora al día (por ejemplo, la cena) en la que solo se habla inglés entre ustedes. Si no saben una palabra, la dicen en español y la buscan juntos. Sin burlas: los dos están aprendiendo."], ["3. Etiqueten la casa", "Peguen papelitos con el nombre en inglés: <i>fridge, stove, sink, door, window, mirror, closet<\/i>. Cada vez que toquen algo, díganlo en voz alta."], ["4. Cambien el idioma del teléfono", "Pongan el celular, WhatsApp y Netflix en inglés. Ya saben dónde está cada botón, así que aprenderán las palabras sin esfuerzo."], ["5. Aprendan frases, no palabras sueltas", "En vez de memorizar «receipt = recibo», memoricen «<i>Can I have the receipt, please?<\/i>». Las frases completas se usan de inmediato."], ["6. Hablen solos (en serio)", "Narren lo que hacen: «<i>I'm making coffee. I'm opening the door. I'm going to work.<\/i>» Esto entrena la boca y el cerebro a la vez."], ["7. Técnica del «shadowing» (sombra)", "Pongan un audio corto en inglés, pausen después de cada frase y repítanla imitando el ritmo y la entonación, como un eco. 5 minutos al día mejoran mucho la pronunciación."], ["8. Series con subtítulos en inglés", "Primero con subtítulos en español, luego en inglés. Elijan comedias o series del día a día (no de época ni ciencia ficción). Vean el mismo episodio dos veces."], ["9. Preparen antes de salir", "Antes de ir al banco, al médico o a una cita, escriban 3 a 5 frases que van a necesitar y practíquenlas en el carro. Así llegan con confianza."], ["10. Un cuaderno compartido", "Cada vez que escuchen una frase nueva en el trabajo o en la calle, anótenla. El domingo se enseñan mutuamente lo que aprendió cada uno."], ["11. Equivocarse es parte del plan", "La gente entiende un inglés imperfecto. Lo importante es comunicar. Si no entienden, digan: «<i>Sorry, my English is not very good. Can you speak slowly, please?<\/i>»"], ["12. Usen apps como complemento", "Apps de vocabulario y de repetición espaciada (tarjetas) ayudan 10 minutos al día, pero no reemplazan hablar con personas."], ["13. Aprovechen el trabajo", "Su trabajo es su mejor clase: cada día escuchan el mismo vocabulario. Pidan a un compañero que les corrija una frase al día."], ["14. Celebren los logros", "Primera llamada en inglés, primer correo sin traductor, primera conversación con un vecino: ¡celébrenlo! La motivación es combustible."]], "pron": [["La «e» antes de S", "En español decimos «estudent», «espeak». En inglés se empieza directo con la S: <b>s-tudent, s-peak, s-chool, s-pain<\/b>. Truco: hagan un «ssss» de serpiente y luego la palabra."], ["Vocales cortas y largas", "<b>ship<\/b> (barco, «i» corta) vs. <b>sheep<\/b> (oveja, «ii» larga). <b>live<\/b> vs. <b>leave<\/b>; <b>full<\/b> vs. <b>fool<\/b>. Alarguen la vocal cuando hay «ee» o «ea»."], ["La TH", "Pongan la punta de la lengua entre los dientes y soplen: <b>think, thank you, three<\/b>. En <b>this, that, the, mother<\/b> es igual pero con vibración (como una «d» suave)."], ["V y B son distintas", "La <b>V<\/b> se hace con los dientes de arriba tocando el labio de abajo: <b>very, van, five<\/b>. La <b>B<\/b> con los dos labios: <b>bed, bus<\/b>."], ["Las consonantes finales", "No se comen el final: <b>work-ed, ask-ed, cost-s, want-s<\/b>. En inglés el final cambia el significado (<i>want<\/i> vs. <i>won't<\/i>)."], ["La terminación -ED", "Suena «t» después de sonidos sordos (<i>worked<\/i> = «uorkt»), «d» en la mayoría (<i>called<\/i> = «cold»), e «id» solo después de t/d (<i>wanted<\/i> = «uántid»)."], ["La H suena", "La H en inglés se pronuncia como una «j» suave: <b>hello<\/b> («jelóu»), <b>house<\/b> («jáus»), <b>help<\/b> («jelp»)."], ["La J y la Y", "<b>J<\/b> suena «ll» fuerte o «dy»: <b>job<\/b> («dyob»). <b>Y<\/b> suena «i»: <b>yes<\/b> («iés»). Nunca confundan <b>yes<\/b> con <b>Jess<\/b>."]], "plan": [["1", "Supervivencia", "Frases de supervivencia + saludos. Cambiar el teléfono a inglés. Etiquetar la casa."], ["2", "Pronunciación y alfabeto", "Alfabeto y código fonético. Deletrear nombres, correos y teléfonos."], ["3", "Supermercado", "Vocabulario de comida. Lista de compras en inglés. Ir y pagar hablando solo inglés."], ["4", "Casa y rutina", "Presente simple. Juego «Three things» en cada cena. Primera «hora en inglés»."], ["5", "Trabajo I", "Cada uno memoriza sus 15 frases de trabajo más importantes."], ["6", "Pasado simple", "Verbos irregulares. Contar el día en pasado. Role-play de vecinos."], ["7", "Trabajo II", "Diálogos completos: visita técnica y llamada de reserva. Grabarse y escucharse."], ["8", "Trámites y salud", "Banco, médico, farmacia, emergencias. Escribir la frase del 911 y pegarla en la nevera."], ["9", "Futuro y cortesía", "going to / will / could / would. Correos de trabajo con frases listas."], ["10", "Escuchar", "Un episodio de serie a la semana con subtítulos en inglés. Shadowing 5 min/día."], ["11", "Clientes difíciles", "Quejas, disculpas, alternativas, cancelaciones. Role-play de «cliente difícil»."], ["12", "Repaso y celebración", "Repetir todos los ejercicios sin mirar. Salir a cenar y pedir todo en inglés. ¡Celebrar!"]], "rp": [["Supermercado", "Uno es el cajero, el otro compra 5 productos. Pregunten precios, paguen y pidan el recibo."], ["Técnico en casa", "Ella es una clienta molesta porque no tiene internet; él llega, pregunta, revisa y explica la solución."], ["Llamada de reserva", "Él llama para reservar un hotel de 3 noches para 2 adultos y 1 niño; ella sigue el guion completo."], ["Cliente difícil", "Él llama para cancelar una reserva y pide reembolso; ella explica la política de cancelación con cortesía."], ["Nuevos vecinos", "Preséntense, digan de dónde son, a qué se dedican y pidan una recomendación de playa."], ["En el médico", "Uno es el doctor; el otro describe síntomas: desde cuándo, dónde duele, alergias."], ["Llamada de emergencia", "Practiquen decir al 911 qué pasó y su dirección completa, claro y despacio."]], "ans": [["Ejercicio 1", "1. am · 2. is · 3. are · 4. is · 5. Are · 6. are"], ["Ejercicio 2", "1. How much is this? · 2. I don't understand. Can you speak slowly, please? · 3. I'd like to open a bank account. · 4. The internet hasn't worked since yesterday. / The internet has been down since yesterday. · 5. Let me check the availability. · 6. I have a headache."], ["Ejercicio 3", "went · bought · worked · paid · had · called · fixed · booked"], ["Ejercicio 4", "1. How may I help you? · 2. Where is the rice? · 3. Can I pay with card? · 4. Your confirmation number is B-325. · 5. The cable was damaged."], ["Ejercicio 5", "(Respuestas posibles) 1. Do you accept US dollars? · 2. Good morning, I'm the technician from [company]. I'm here to install your internet. · 3. I'm sorry, could you spell your last name, please? · 4. Hi! Nice to meet you. I'm [name]. We just moved in. · 5. Hi, the AC is not working. When can you come to fix it?"], ["Ejercicio 6", "Respuesta libre. Revisen especialmente: E («i») / I («ai»), G («dyi») / J («dyei»), @ = «at», . = «dot». K7-Q2-J9-G4 = «kei-seven, kiu-tu, dyei-náin, dyi-for»."]], "kid": {"scen": [["Presentarme a alguien nuevo", "Role-play: you are a new classmate at Camila's Montessori school in Aruba. Greet her, ask her name, her age and what she likes. Keep it friendly."], ["Escoger mi trabajo Montessori", "Role-play: you are Camila's Montessori teacher. She wants to choose a work from the shelf. Ask which material she wants, if she needs a lesson, and remind her to put it away when she finishes."], ["Jugar en el recreo", "Role-play: you are a classmate at recess. Invite Camila to play a game (tag, hide-and-seek or ball), agree on the rules and take turns."], ["La hora del almuerzo", "Role-play: you are Camila's friend at lunch. Talk about what is in your lunchboxes, what you like and don't like, and offer to share."], ["Mis tres perros", "Have a relaxed conversation with Camila about her three dogs: Turrón the beagle, Sam the 9-year-old cocker spaniel and Roma the 3-year-old poodle. Ask what they look like and what they like to do."], ["Un día en la playa", "Role-play: you are Camila's friend planning a Saturday at the beach in Aruba. Talk about the weather, what to bring (sunscreen, towel, snacks) and what you will do."], ["Mi fiesta de cumpleaños", "Role-play: you are Camila's friend. She is inviting you to her birthday party. Ask the date, time and place, and talk about cake, games and presents."], ["Presentar mi proyecto", "Role-play: you are Camila's classmate listening to her class presentation about an animal of Aruba (flamingo, iguana, burrowing owl/shoco, donkey or parakeet). Ask her simple questions about it."], ["En la biblioteca", "Role-play: you are the librarian at a library in Aruba. Help Camila find a book she likes, ask what topics she enjoys and explain how long she can keep it."], ["Me siento mal", "Role-play: you are the school nurse. Camila doesn't feel well. Ask gently what hurts and how she feels, and comfort her. Keep it calm and kind."], ["La mesa de la paz", "Role-play: you are Camila's classmate at the Montessori peace table after a small misunderstanding at recess. Use 'I feel… when… because…', listen, apologize and find a solution together."], ["Pregúntale a tu mascota: ¿cómo se dice…?", "The learner (a 10-year-old girl) will ask, in Spanish or broken English, how to say things she needs at school, at home or with friends. In EN give the best natural, simple English phrase and one short example. Then ask what else she wants to say."]], "cando": [["Etapa 1 · Primeros pasos", ["Puedo saludar y presentarme: mi nombre, mi edad y dónde vivo.", "Puedo nombrar cosas de mi salón y sus colores.", "Puedo contar hasta 20.", "Puedo hablar de mi familia y mis mascotas.", "Puedo decir dónde están las cosas (in, on, under)."]], ["Etapa 2 · Mi día", ["Puedo contar mi rutina diaria.", "Puedo decir la hora.", "Puedo decir qué comida me gusta y cuál no.", "Puedo invitar a alguien a jugar y pedir mi turno.", "Puedo decir cómo me siento y qué me duele."]], ["Etapa 3 · Mi mundo en Aruba", ["Puedo hablar del clima.", "Puedo describir y comparar animales de Aruba.", "Puedo preguntar dónde está un lugar y entender la respuesta.", "Puedo comprar algo y preguntar el precio.", "Puedo invitar a una fiesta y decir fechas."]], ["Etapa 4 · Aprendo en inglés", ["Puedo pedir un material o una lección con «May I…?».", "Puedo explicar un experimento sencillo.", "Puedo decir operaciones de matemáticas en inglés.", "Puedo contar lo que hice el fin de semana (pasado)."]], ["Etapa 5 · Hablo con confianza", ["Puedo dar mi opinión y explicar por qué.", "Puedo hablar de mis planes y de lo que quiero ser.", "Puedo hacer una presentación corta y responder preguntas.", "Puedo resolver un problema hablando: «I feel… when… because…»."]]], "stages": [["Etapa 1 · Primeros pasos", "Pre-A1", 1, 4], ["Etapa 2 · Mi día", "A1", 5, 8], ["Etapa 3 · Mi mundo en Aruba", "A1+", 9, 12], ["Etapa 4 · Aprendo en inglés", "A2", 13, 16], ["Etapa 5 · Hablo con confianza", "B1", 17, 20]]}, "adult": {"stages": [["Etapa 1 · Sobrevivir", "A1", 1, 4], ["Etapa 2 · Mi vida en Aruba", "A1+", 5, 8], ["Etapa 3 · Mi trabajo", "A2", 9, 12], ["Etapa 4 · Conversar", "A2+", 13, 16], ["Etapa 5 · Con confianza", "B1", 17, 20]], "path": [4, 15, 5, 3, 6, 7, 8, 17, "job1", 16, 22, 19, "n0", "n1", "n2", "job2", "n3", "n4", "n5", "n6"], "scen": [["both", "Small talk con un turista", "Role-play: you are a friendly tourist from the United States visiting Aruba. Make small talk with the learner about the weather, your trip, local food and recommendations."], ["both", "Contarle mi día al supervisor", "Role-play: you are the learner's supervisor at the end of the day. Ask what they did today, if there were problems and what they finished. Encourage past simple and present perfect."], ["both", "Mi entrevista para un ascenso", "Role-play: you are a manager interviewing the learner for a promotion. Ask about experience, strengths, an achievement, English level and goals. Give brief, kind feedback."], ["both", "Proponer una idea en la reunión", "Role-play: you lead a short team meeting about a work problem. Invite the learner to give an opinion, ask for clarification and propose a solution."]], "n": 7}}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var $ = function(s, r){ return (r||document).querySelector(s); };
var view = $('#view');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function plain(s){ var d=document.createElement('div'); d.innerHTML=s; return d.textContent; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

/* ---------- sections from the guide ---------- */
var SECS=[]; D.rec.forEach(function(b){ if(b.t==='h1'){ SECS.push({title:b.title,sub:b.sub,blocks:[]}); } else if(SECS.length){ SECS[SECS.length-1].blocks.push(b); } });
// indexes: 0 bienvenida,1 tips,2 pron,3 gramática,4 supervivencia,5 súper,6 casa,7 vecinos,8 médico,9 técnico,10 reservas,11 ejercicios,12 juegos,13 plan,14 respuestas
var TOPICS=[
 {k:'surv',n:'Supervivencia',s:4},{k:'super',n:'Supermercado',s:5},{k:'casa',n:'En casa',s:6},
 {k:'vec',n:'Vecinos y trámites',s:7},{k:'med',n:'Médico y emergencias',s:8},
 {k:'pron',n:'Pronunciación',s:2},{k:'gram',n:'Gramática',s:3},
 {k:'tec',n:'Técnico',s:9,work:1},{k:'res',n:'Reservaciones',s:10,work:1}];
function pool(k){ // items for practice
  var out=[]; TOPICS.forEach(function(t){ if(k!=='all' && t.k!==k) return; if(t.k==='pron') return;
    SECS[t.s].blocks.forEach(function(b){
      if(b.t==='phrases') b.rows.forEach(function(r){ out.push({en:plain(r[0]),pr:r[1],es:plain(r[2]),ph:1}); });
      if(b.t==='vocab') b.rows.forEach(function(r){ out.push({en:plain(r[0]),pr:'',es:plain(r[1])}); });
    }); });
  return out; }
var ALLPH = pool('all').filter(function(x){return x.ph;});

/* ---------- storage (per person) ---------- */
var KEY='aruba-ingles-v1', mem={who:'ella',el:{},ella:{}};
try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.el&&o.ella) mem=o; } }catch(e){}
function save(){ if(window.TURRON_SYNC){ try{ window.TURRON_SYNC.changed(); }catch(e){} } try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} }
function me(){ var m=mem[mem.who]; ['known','weeks','track','goals'].forEach(function(k){ if(!m[k]) m[k]={}; }); return m; }

/* ---------- speech ---------- */
var synth = window.speechSynthesis || null, voice=null;
function pickVoice(){ if(!synth) return; var vs=synth.getVoices()||[]; voice = vs.filter(function(v){return /^en[-_]US/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null; }
if(synth){ pickVoice(); try{ synth.addEventListener('voiceschanged',pickVoice); }catch(e){} }
function clean(t){ return plain(t).replace(/\[company\]/gi,'the company').replace(/\[name\]/gi,'Ana').replace(/\[address\]/gi,'the address').replace(/\[[^\]]*\]/g,'').replace(/\s*\([^)]*\)/g,'').replace(/\.\.\./g,' ').replace(/ \/ /g,'. ').replace(/—/g,'. ').replace(/→/g,', '); }
var ttsCap=null, sayTok=0, curU=null;
function hookTts(){ try{ if(window.claude&&window.claude.use){ Promise.resolve(window.claude.use('tts')).then(function(t){ ttsCap=t||null; }).catch(function(){}); return true; } }catch(e){} return false; }
if(!hookTts()){ window.addEventListener('load',hookTts); }
function canSpeak(){ return !!(ttsCap||synth); }
function stopAll(){ sayTok++; try{ if(ttsCap) ttsCap.stop(); }catch(e){} try{ if(synth&&(synth.speaking||synth.pending)) synth.cancel(); }catch(e){} document.querySelectorAll('.speaking').forEach(function(x){x.classList.remove('speaking');}); }
var NOAUDIO='El audio no está disponible aquí. Abran la guía en Chrome o Safari y revisen el volumen del teléfono.';
function say(text, slow, el, done){
  var tok=++sayTok, txt=clean(text), fin=false;
  document.querySelectorAll('.speaking').forEach(function(x){x.classList.remove('speaking');});
  if(el) el.classList.add('speaking');
  function finish(ok,msg){ if(fin) return; fin=true; if(el) el.classList.remove('speaking'); if(tok!==sayTok) return; if(msg) toast(msg); if(done) done(!!ok); }
  function browser(){
    if(!synth){ finish(false,NOAUDIO); return; }
    try{
      var busy=synth.speaking||synth.pending; if(busy) synth.cancel();
      var u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; if(!voice) pickVoice(); if(voice&&!/Android/i.test(navigator.userAgent)) u.voice=voice; u.rate=slow?0.6:0.9;
      var started=false, wd;
      u.onstart=function(){ started=true; clearTimeout(wd); };
      u.onend=function(){ clearTimeout(wd); finish(true); };
      u.onerror=function(ev){ clearTimeout(wd); var c=ev&&ev.error; if(c==='interrupted'||c==='canceled'){ finish(false); } else finish(false,NOAUDIO); };
      curU=u; /* keep a reference: some browsers drop the utterance otherwise */
      var go=function(){ if(tok!==sayTok){ finish(false); return; } try{ synth.resume(); }catch(e){} synth.speak(u); wd=setTimeout(function(){ if(!started&&!fin){ try{synth.cancel();}catch(e){} finish(false,NOAUDIO); } },7000); };
      if(busy) setTimeout(go,120); else go();
    }catch(e){ finish(false,NOAUDIO); }
  }
  if(ttsCap){
    try{ if(synth&&(synth.speaking||synth.pending)) synth.cancel(); }catch(e){}
    var cap=ttsCap;
    var sp; try{ sp=Promise.resolve(cap.speak(txt,{language:'en',rate:slow?0.7:1})); }catch(e){ sp=Promise.reject(e); }
    sp.then(function(){ finish(true); }).catch(function(err){
      if(tok!==sayTok){ finish(false); return; }
      var c=err&&err.code;
      if(c==='not_granted'){ ttsCap=null; browser(); }
      else if(c==='rate_limited'){ finish(false,'Demasiados audios seguidos. Esperen unos segundos.'); }
      else if(c==='busy'){ finish(false,'Terminen el dictado por voz para poder escuchar.'); }
      else if(c==='viewer_stopped'||c==='stopped'||c==='replaced'||c==='cancelled'||c==='canceled'){ finish(false); }
      else browser();
    });
  } else browser();
}
var toastT; function toast(m){ var t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3200); }
var PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';

/* ---------- block renderers ---------- */
function phraseRow(en,pr,es){ var key=plain(en), k=me().known[key];
  return '<div class="phr'+(k?' known':'')+'" data-key="'+esc(key)+'"><button class="play" data-say="'+esc(key)+'" aria-label="Escuchar">'+PLAY+'</button>'+
    '<div><div class="en" lang="en">'+en+'</div>'+(pr?'<div class="pr">'+esc(pr)+'</div>':'')+'<div class="es">'+es+'</div></div>'+
    '<div class="side"><button class="know" aria-pressed="'+(k?'true':'false')+'" aria-label="Marcar como aprendida" title="Ya la sé">✓</button><button class="slow" data-say="'+esc(key)+'" data-slow="1">lento</button></div></div>'; }
function block(b){
  switch(b.t){
    case 'h2': return '<h2>'+b.title+'</h2>';
    case 'h3': return '<h3>'+b.title+'</h3>';
    case 'p': return '<p>'+b.text+'</p>';
    case 'bullets': return '<ul class="bl">'+b.items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
    case 'box': return '<aside class="box '+b.kind+'">'+(b.title?'<strong class="t">'+b.title.replace(/^[★♥⚠]\s*/,'')+'</strong>':'')+b.items.map(function(i){return '<p>'+i+'</p>';}).join('')+'</aside>';
    case 'phrases': return b.rows.map(function(r){return phraseRow(r[0],r[1],r[2]);}).join('');
    case 'vocab': return '<div class="vgrid">'+b.rows.map(function(r){ var m=/^([A-Z]) – /.exec(r[0]); var s=m?(m[1]+', as in '+r[1]):r[0];
        return '<button class="v" data-say="'+esc(s)+'"><b lang="en">'+r[0]+'</b><span>'+r[1]+'</span></button>'; }).join('')+'</div>';
    case 'dialog': return '<div class="dlg"><h4><span>Diálogo: '+b.title+'</span><span class="row"><button class="btn small" data-dlg="all">Escuchar todo</button><button class="btn small" data-dlg="es">Ocultar español</button></span></h4>'+
        b.lines.map(function(l){return '<div class="ln"><button class="play" data-say="'+esc(l[1])+'" aria-label="Escuchar">'+PLAY+'</button><div><div class="whoL">'+l[0]+'</div><div lang="en"><b>'+l[1]+'</b></div><div class="es">'+l[2]+'</div></div></div>';}).join('')+'</div>';
    default: return '';
  } }
function section(i){ return SECS[i].blocks.map(block).join(''); }
function pronTable(){ return '<table class="t">'+D.pron.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>'; }

/* ---------- views ---------- */
var st={tab:'inicio',topic:'surv',work:null,mode:null,deck:'all'};
function dayPhrase(){ var d=new Date(), n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5); var pick=pool('surv').concat(pool('super'),pool('casa')).filter(function(x){return x.ph && x.en.length<46;}); return pick[n%pick.length]; }
function counts(){ var k=me().known, n=0; ALLPH.forEach(function(p){ if(k[p.en]) n++; }); var w=0; for(var i in me().weeks) if(me().weeks[i]) w++; return {k:n,t:ALLPH.length,w:w}; }

function vInicio(){ var p=dayPhrase(), c=counts(), who= mem.who==='el'?'él':'ella';
  return '<section class="hero"><div class="wrap"><p class="kicker">La frase de hoy. Díganla en voz alta tres veces.</p>'+
   '<p class="daily" lang="en">'+esc(p.en)+'</p><p class="daily-es">'+esc(p.es)+'</p><p class="daily-pr">'+esc(p.pr)+'</p>'+
   '<div class="row"><button class="bigplay" data-say="'+esc(p.en)+'">'+PLAY.replace('<svg','<svg width="18" height="18" fill="#fff"')+' Escuchar</button><button class="bigplay ghost" data-say="'+esc(p.en)+'" data-slow="1">Más lento</button></div></div></section>'+
   '<div class="wrap"><h2>El avance de '+who+'</h2><p class="note">Cada uno tiene su propio progreso. Cambien de persona arriba, en «Él / Ella».</p>'+
   '<div class="stats"><div class="stat"><b>'+c.k+' de '+c.t+'</b><span>frases que ya sabe</span><div class="meter"><i style="width:'+(100*c.k/c.t)+'%"></i></div></div>'+
   '<div class="stat"><b>'+c.w+' de 12</b><span>semanas del plan completadas</span><div class="meter"><i style="width:'+(100*c.w/12)+'%"></i></div></div></div>'+
   '<h2>¿Qué hacemos hoy?</h2><div class="modes">'+
   '<button class="mode" data-go="frases"><b>Aprender frases</b><span>Supermercado, casa, vecinos, médico. Con audio.</span></button>'+
   '<button class="mode" data-go="trabajo"><b>Inglés para el trabajo</b><span>Técnico de telecomunicaciones y agente de reservaciones.</span></button>'+
   '<button class="mode" data-go="practicar"><b>Practicar 10 minutos</b><span>Tarjetas, quiz, dictado, ordenar palabras y role-plays.</span></button>'+
   '<button class="mode" data-go="plan"><b>Plan de 12 semanas</b><span>Metas por semana, hábitos diarios y tips.</span></button></div>'+
   '<div class="sos"><b>Emergencias: 911</b><p>Practiquen decir su dirección en inglés: <span lang="en">«My address is…»</span>. Las frases de emergencia están en Frases, en «Médico y emergencias».</p></div>'+
   '<details><summary>Cómo usar esta guía</summary>'+section(0)+'</details>'+
   '<p class="note">Toquen cualquier botón de escuchar para oír la frase en inglés. Si no suena, suban el volumen y quiten el modo silencio. El progreso se guarda en este navegador; si cambian de dispositivo, empieza de cero.</p></div>'; }

function chips(list,cur,attr){ return '<div class="chips">'+list.map(function(t){return '<button '+attr+'="'+t.k+'" aria-pressed="'+(t.k===cur)+'">'+t.n+'</button>';}).join('')+'</div>'; }
function vFrases(){ var list=TOPICS.filter(function(t){return !t.work;}); var t=list.filter(function(x){return x.k===st.topic;})[0]||list[0];
  var body= t.k==='pron' ? pronTable()+section(2) : section(t.s);
  return '<div class="wrap"><h1 style="margin-top:22px">'+SECS[t.s].title.replace(/^Parte \d+ · /,'')+'</h1><p class="note">Toquen el botón redondo para escuchar. Marquen ✓ cuando ya la digan sin leer.</p>'+chips(list,t.k,'data-topic')+body+'</div>'; }
function vTrabajo(){ var k= st.work || (mem.who==='el'?'tec':'res'); var t=TOPICS.filter(function(x){return x.k===k;})[0];
  return '<div class="wrap"><h1 style="margin-top:22px">'+(k==='tec'?'Técnico de telecomunicaciones':'Agente de reservaciones')+'</h1>'+
   chips(TOPICS.filter(function(x){return x.work;}),k,'data-work')+section(t.s)+
   '<div class="row" style="margin:18px 0"><button class="btn pink" data-start="quiz" data-deck="'+k+'">Hacer un quiz de este vocabulario</button><button class="btn" data-start="cards" data-deck="'+k+'">Repasar con tarjetas</button></div></div>'; }

/* practice */
var MODES=[['cards','Tarjetas','Ven el español, dicen el inglés y voltean para comprobar.','--sun'],
 ['quiz','Quiz de 10 preguntas','Elijan la respuesta correcta. Incluye preguntas de escuchar.','--flamingo-t'],
 ['order','Ordenar la frase','Toquen las palabras en el orden correcto.','--lagoon-t'],
 ['dict','Dictado','Escuchen y escriban lo que oyen.','--aloe-t'],
 ['spell','Deletrear','Letras, códigos de confirmación y el alfabeto fonético.','--sun-t'],
 ['guide','Ejercicios de la guía','Los 6 ejercicios escritos, con corrección.','--flamingo-t'],
 ['role','Role-plays y juegos','Escenarios para practicar los dos juntos.','--lagoon-t']];
function deckSel(){ return '<label>Tema: <select class="inp" id="deck"><option value="all">Todos</option>'+TOPICS.filter(function(t){return t.k!=='pron';}).map(function(t){return '<option value="'+t.k+'"'+(st.deck===t.k?' selected':'')+'>'+t.n+'</option>';}).join('')+'</select></label>'; }
function vPracticar(){
  if(!st.mode) return '<div class="wrap"><h1 style="margin-top:22px">Practicar</h1><p>Diez minutos al día valen más que dos horas el domingo. Elijan un juego.</p><div class="modes">'+
    MODES.map(function(m,i){return '<button class="mode" data-start="'+m[0]+'"><i style="background:var('+m[3]+')">'+(i+1)+'</i><b>'+m[1]+'</b><span>'+m[2]+'</span></button>';}).join('')+'</div></div>';
  var m=MODES.filter(function(x){return x[0]===st.mode;})[0];
  return '<div class="wrap"><div class="bar" style="margin-top:18px"><button class="btn small" data-start="">Volver a los juegos</button>'+(/cards|quiz|order|dict/.test(st.mode)?deckSel():'')+'</div><h1>'+m[1]+'</h1><div id="game"></div></div>'; }

var G={};
function simple(x){ return x.ph && !/[\/\[\]…—]|\.\.\./.test(x.en); }
function norm(s){ return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim(); }
function startGame(){ var g=$('#game'); if(!g) return; var P=pool(st.deck);
  if(st.mode==='cards'){ G={list:shuffle(P),i:0,flip:false}; cards(); }
  if(st.mode==='quiz'){ G={qs:shuffle(P).slice(0,10),i:0,ok:0,P:P,done:false}; quiz(); }
  if(st.mode==='order'){ G={list:shuffle(P.filter(function(x){var n=x.en.split(' ').length;return simple(x)&&n>=3&&n<=9;})),i:0}; order(); }
  if(st.mode==='dict'){ G={list:shuffle(P.filter(function(x){return simple(x)&&x.en.split(' ').length<=9;})),i:0}; dict(); }
  if(st.mode==='spell'){ spell(); }
  if(st.mode==='guide'){ guide(); }
  if(st.mode==='role'){ g.innerHTML='<div class="stage"><p class="sub">Escenario al azar</p><p class="q" id="rpT">Toquen el botón</p><p id="rpD"></p><button class="btn pink" id="rpB">Elegir un escenario</button></div><h2>Todos los escenarios</h2><table class="t">'+D.rp.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>'+section(12).replace(/<h2>Role-plays[^<]*<\/h2>/,''); }
}
function cards(){ var g=$('#game'), c=G.list[G.i]; if(!c){ g.innerHTML='<div class="stage"><p class="q">Terminaron este mazo</p><button class="btn pink" data-again>Barajar de nuevo</button></div>'; return; }
  g.innerHTML='<p class="note">Tarjeta '+(G.i+1)+' de '+G.list.length+'</p><div class="card'+(G.flip?' flip':'')+'"><button id="flip">'+
   (G.flip?'<span class="q" style="display:block;font-family:var(--display);font-size:1.6rem;font-weight:700" lang="en">'+esc(c.en)+'</span><i style="color:var(--soft)">'+esc(c.pr)+'</i><br><span>'+esc(c.es)+'</span>'
          :'<span class="sub" style="color:var(--soft)">¿Cómo se dice en inglés?</span><br><span style="font-family:var(--display);font-size:1.6rem;font-weight:700">'+esc(c.es)+'</span><br><span class="note">Toquen para voltear</span>')+'</button></div>'+
   '<div class="row" style="justify-content:center">'+(G.flip?'<button class="btn" data-say="'+esc(c.en)+'">Escuchar</button><button class="btn" id="cNo">Todavía no</button><button class="btn pink" id="cYes">Ya la sé</button>':'')+'</div>'; }
function quiz(){ var g=$('#game'); if(G.i>=G.qs.length){ var msg=G.ok>=9?'Excelente.':G.ok>=6?'Van muy bien. Repasen las que fallaron.':'Repasen el tema con las tarjetas y vuelvan a intentarlo.';
    g.innerHTML='<div class="stage"><p class="sub">Resultado</p><p class="q">'+G.ok+' de '+G.qs.length+'</p><p>'+msg+'</p><button class="btn pink" data-again>Otro quiz</button></div>'; return; }
  var q=G.qs[G.i], type=['en2es','es2en','listen'][Math.floor(Math.random()*3)]; if(!canSpeak() && type==='listen') type='en2es';
  var wrong=shuffle(G.P.filter(function(x){return x.en!==q.en && x.es!==q.es;})).slice(0,3), opts=shuffle([q].concat(wrong)); G.cur={q:q,type:type,ans:false};
  var show= type==='es2en'?function(x){return x.en;}:function(x){return x.es;};
  g.innerHTML='<div class="stage"><p class="sub">Pregunta '+(G.i+1)+' de '+G.qs.length+'</p>'+
    (type==='listen'?'<p class="sub">Escuchen y elijan qué significa</p><button class="bigplay" data-say="'+esc(q.en)+'">'+PLAY.replace('<svg','<svg width="18" height="18" fill="#fff"')+' Escuchar</button>'
      :'<p class="sub">'+(type==='en2es'?'¿Qué significa?':'¿Cómo se dice en inglés?')+'</p><p class="q">'+esc(type==='en2es'?q.en:q.es)+'</p>')+
    '<div class="opts">'+opts.map(function(o){return '<button class="opt" data-ok="'+(o===q?1:0)+'">'+esc(show(o))+'</button>';}).join('')+'</div><p class="fb" id="fb"></p><button class="btn fill" id="next" disabled>Siguiente</button></div>'; }
function order(){ var g=$('#game'), c=G.list[G.i]; if(!c){ g.innerHTML='<div class="stage"><p class="q">No quedan frases en este tema</p><button class="btn pink" data-again>Empezar de nuevo</button></div>'; return; }
  G.words=shuffle(c.en.split(' ').map(function(w,i){return {w:w,i:i};})); G.pick=[]; drawOrder(); }
function drawOrder(msg,cls){ var c=G.list[G.i], used={}; G.pick.forEach(function(p){used[p.i]=1;});
  $('#game').innerHTML='<div class="stage"><p class="sub">Armen esta frase en inglés</p><p class="q">'+esc(c.es)+'</p><div class="words ans">'+G.pick.map(function(p,n){return '<button class="w" data-un="'+n+'">'+esc(p.w)+'</button>';}).join('')+'</div>'+
   '<div class="words">'+G.words.filter(function(p){return !used[p.i];}).map(function(p){return '<button class="w" data-pick="'+p.i+'">'+esc(p.w)+'</button>';}).join('')+'</div>'+
   '<p class="fb '+(cls||'')+'">'+(msg||'')+'</p><div class="row" style="justify-content:center"><button class="btn" id="oCheck">Comprobar</button><button class="btn" id="oShow">Ver respuesta</button><button class="btn fill" id="oNext">Siguiente</button></div></div>'; }
function dict(){ var g=$('#game'), c=G.list[G.i]; if(!c){ g.innerHTML='<div class="stage"><p class="q">No quedan frases en este tema</p><button class="btn pink" data-again>Empezar de nuevo</button></div>'; return; }
  if(!canSpeak()){ g.innerHTML='<p>El dictado necesita audio, y aquí no está disponible. Abran la guía en Chrome o Safari.</p>'; return; }
  g.innerHTML='<div class="stage"><p class="sub">Escuchen y escriban la frase en inglés</p><div class="row" style="justify-content:center"><button class="bigplay" data-say="'+esc(c.en)+'">'+PLAY.replace('<svg','<svg width="18" height="18" fill="#fff"')+' Escuchar</button><button class="btn" data-say="'+esc(c.en)+'" data-slow="1">Más lento</button></div>'+
   '<p><input class="inp" id="dIn" style="width:100%;margin-top:16px;text-align:center" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" aria-label="Escriban lo que oyen"></p><p class="fb" id="fb"></p>'+
   '<div class="row" style="justify-content:center"><button class="btn" id="dCheck">Comprobar</button><button class="btn" id="dShow">Ver respuesta</button><button class="btn fill" id="dNext">Siguiente</button></div></div>'; }
var NATO={A:'Alpha',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliet',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-ray',Y:'Yankee',Z:'Zulu'};
function newCode(){ var L='AEIGJKQYCZVBHRW', s=''; for(var i=0;i<3;i++){ s+=L[Math.floor(Math.random()*L.length)]+Math.floor(Math.random()*10); } return s; }

  $('#game').innerHTML='<p>En reservaciones y en soporte técnico se deletrea todo el día. Las letras que más se confunden: E / I, G / J, A / E.</p>'+

  '<div class="stage"><p class="sub">Juego 2: escuchen y escriban el código</p><div class="row" style="justify-content:center"><button class="bigplay" id="hSay">'+PLAY.replace('<svg','<svg width="18" height="18" fill="#fff"')+' Escuchar código secreto</button></div><p><input class="inp" id="hIn" style="text-align:center;margin-top:14px;text-transform:uppercase" maxlength="8" autocomplete="off" aria-label="Código"></p><p class="fb" id="fb"></p><div class="row" style="justify-content:center"><button class="btn" id="hCheck">Comprobar</button><button class="btn fill" id="hNew">Nuevo código</button></div></div>'+
  '<h2>El alfabeto, letra por letra</h2>'+block(SECS[2].blocks.filter(function(b){return b.t==='vocab';})[0]);
  G.hidden=newCode(); }
var KEYS={0:['am','is','are','is','are','are'],2:['went','bought','worked','paid','had','called','fixed','booked'],3:['How may I help you?','Where is the rice?','Can I pay with card?','Your confirmation number is B-325','The cable was damaged']};
function guide(){ var exs=SECS[11].blocks.filter(function(b){return b.t==='exercise';});
  $('#game').innerHTML=exs.map(function(e,n){ var key=KEYS[n];
    var items=e.items.map(function(it,i){
      if(n===0||n===2) return '<li>'+it.replace('______','<input class="inp s" data-a="'+esc(key[i])+'" autocapitalize="off" autocomplete="off" aria-label="Respuesta">')+'</li>';
      if(n===3) return '<li>'+it+'<br><input class="inp w100" data-a="'+esc(key[i])+'" autocomplete="off" aria-label="Respuesta"></li>';
      return '<li>'+it+(n<5?'<br><input class="inp w100" autocomplete="off" aria-label="Su respuesta">':'')+'</li>'; }).join('');
    return '<div class="ex"><h3 style="margin-top:0">'+e.title+'</h3>'+(e.note?'<p class="note">'+e.note+'</p>':'')+'<ol>'+items+'</ol>'+
      (key?'<div class="bar"><button class="btn small fill" data-check>Comprobar</button><span class="fb" style="margin:0"></span></div>':'')+
      '<details><summary>Ver respuestas</summary><p>'+D.ans[n][1]+'</p></details></div>'; }).join(''); }

   '<h2>14 tips para aprender más rápido</h2>'+D.tips.map(function(t){return '<details><summary>'+t[0]+'</summary><p>'+t[1]+'</p></details>';}).join('')+
   SECS[1].blocks.filter(function(b){return b.t==='box';}).map(block).join('')+
   '<aside class="box warn"><strong class="t">Un último consejo</strong><p>Habrá días en que sientan que no avanzan: es normal. Sigan con los 15 minutos diarios y hablen aunque sea con errores.</p><p><b>You can do it! ¡Ustedes pueden! Boso por!</b></p></aside></div>'; }

function today(){ var d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function me(){ var m=mem[mem.who]; ['known','weeks','track','goals','srs','days','sess','cando'].forEach(function(k){ if(!m[k]||typeof m[k]!=='object') m[k]={}; }); if(!Array.isArray(m.mine)) m.mine=[]; return m; }
function touch(){ var m=me(), t=today(); if(!m.days[t]){ m.days[t]=1; save(); } }
function streak(){ var d=me().days, t=today(), n=0; if(!d[t]) t--; while(d[t]){ n++; t--; } return n; }
var NAME={el:'Eduardo',ella:'Mariana',camila:'Camila',inv:'Invitado'};
/* puente para la sincronización (src/sync.html, solo en jeirer.web.app) */
window.TURRON_APP={ get:function(){ return mem; }, esc:esc,
  put:function(m){ if(!m||!m.el||!m.ella) return; m.who=mem.who; mem=m; try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} if(st.tab==='inicio'||(st.tab!=='practicar'&&st.tab!=='tutor')) render(true); },
  who:function(w){ if((w==='el'||w==='ella')&&w!==mem.who){ mem.who=w; save(); render(true); } },
  /* perfil según quién entró (Eduardo, Mariana, Camila o un invitado con su propio progreso) */
  putPerson:function(k,data){ mem[k]=data; try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} if(k===mem.who&&(st.tab==='inicio'||(st.tab!=='practicar'&&st.tab!=='tutor'))) render(true); },
  login:function(k,name,uid){ if(k==='inv'){ if(mem.invUid!==uid){ mem.inv={}; mem.invUid=uid; } NAME.inv=name||'Invitado'; }
    if(!mem[k]||typeof mem[k]!=='object') mem[k]={}; mem.who=k; document.documentElement.classList.add('logged'); try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} render(true); },
  logout:function(){ document.documentElement.classList.remove('logged'); render(true); } };
var PAW='<svg viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h1v2H2zM4 0h1v2H4zM0 1h1v2H0zM6 1h1v2H6zM2 3h3v1H2zM1 4h5v2H1z"/></svg>';
function dogMood(nd,sk){ if(nd===4) return 'happy'; if(!sk&&Object.keys(me().days).length) return 'sleep'; return 'idle'; }
function sess(){ var m=me(); if(m.sess.d!==today()) m.sess={d:today()}; return m.sess; }
function stepDone(k){ var s=sess(); if(!s[k]){ s[k]=1; save(); } touch(); }

/* capabilities: tutor con IA y micrófono */
var caps={sample:undefined,dictation:undefined};
function hookCaps(late){ var ok=false; try{ ok=!!(window.claude&&window.claude.use); }catch(e){}
  if(!ok&&!late&&document.readyState!=='complete'){ window.addEventListener('load',function(){ hookCaps(true); }); return; }
  ['sample','dictation'].forEach(function(n){
    if(!ok){ caps[n]=null; if(st.tab==='tutor'&&n==='sample'&&!T.sc) render(true); return; }
    var pr; try{ pr=Promise.resolve(window.claude.use(n)); }catch(e){ pr=Promise.resolve(null); }
    pr.then(function(v){ caps[n]=v||null; },function(){ caps[n]=null; }).then(function(){
      if(n==='dictation'&&caps[n]) wireMic();
      if(st.tab==='tutor'){ if(!T.sc) render(true); else if(n==='dictation'&&!T.busy&&!mic.on){ var tc=$('#tCtl'); if(tc){ tc.innerHTML=''; tDraw(); } } }
      if(st.tab==='practicar'&&st.mode==='tutor'&&n==='sample'&&!(G&&G.chat)) startGame();
    });
  }); }

TOPICS=[
 {k:'surv',n:'Supervivencia',s:[4]},{k:'num',n:'Números y hora',s:[15]},{k:'super',n:'Supermercado',s:[5]},{k:'casa',n:'En casa',s:[6]},
 {k:'vec',n:'Vecinos y trámites',s:[7]},{k:'med',n:'Médico y emergencias',s:[8]},{k:'tel',n:'Por teléfono',s:[16]},{k:'serv',n:'Carro y servicios',s:[17]},
 {k:'cort',n:'Cortesía',s:[22]},{k:'pron',n:'Pronunciación',s:[2],nopool:1},{k:'gram',n:'Gramática',s:[3]},{k:'verbs',n:'Verbos',s:[19]},{k:'err',n:'Errores típicos',s:[18],nopool:1},
 {k:'tec',n:'Técnico',s:[9,20],work:1},{k:'res',n:'Reservaciones',s:[10,21],work:1}];
/* Camila: su propio camino de 20 unidades (secciones de content_camila.py, después de las de los adultos) */
var KID0=SECS.length-20, CTOPICS=[]; for(var ci=0;ci<20;ci++) CTOPICS.push({k:'c'+(ci+1),n:SECS[KID0+ci].title,s:[KID0+ci],kid:1});
/* unidades nuevas de los adultos (content_adult.py): van en Frases y en su camino */
var AD0=KID0-D.adult.n, ANEW=['Small talk','Contar el pasado','Planes y citas','Problemas y quejas','Mensajes y correos','Reuniones','Entrevistas'];
for(var ai=0;ai<D.adult.n;ai++) TOPICS.splice(TOPICS.length-2,0,{k:'n'+ai,n:ANEW[ai],s:[AD0+ai]});
/* camino de 0 a 100 de cada persona: Camila tiene el suyo; Eduardo y Mariana comparten 18 unidades y cambian las 2 de su trabajo */
function adultPath(){ var tec=mem.who==='el'; return D.adult.path.map(function(x,i){ var s=x==='job1'?(tec?9:10):x==='job2'?(tec?20:21):typeof x==='string'?AD0+(+x.slice(1)):x;
    return {k:'p'+(i+1),n:(i+1)+'. '+SECS[s].title.replace(/^Parte \d+ · /,''),s:[s],path:1}; }); }
function pathTopics(){ return isKid()?CTOPICS:adultPath(); }
function pathStages(){ return isKid()?D.kid.stages:D.adult.stages; }
function isKid(){ return !!(mem&&mem.who==='camila'); }
function TOP(){ return isKid()?CTOPICS:TOPICS; }
function pool(k,noMine){ var out=[], seen={};
  TOP().forEach(function(t){ if((k!=='all'&&t.k!==k)||t.nopool) return;
    [].concat(t.s).forEach(function(i){ SECS[i].blocks.forEach(function(b){
      if(b.t==='phrases') b.rows.forEach(function(r){ var en=plain(r[0]); if(seen[en]) return; seen[en]=1; out.push({en:en,pr:r[1],es:plain(r[2]),ph:1}); });
      if(b.t==='vocab') b.rows.forEach(function(r){ var en=plain(r[0]); if(seen[en]) return; seen[en]=1; out.push({en:en,pr:'',es:plain(r[1])}); });
    }); }); });
  if(!noMine&&mem&&(k==='all'||k==='mio')) me().mine.forEach(function(x){ if(!seen[x.en]){ seen[x.en]=1; out.push({en:x.en,pr:'',es:x.es,ph:1,mine:1}); } });
  return out; }
ALLPH=pool('all',true).filter(function(x){return x.ph;});
var PHC={}; function allPh(){ var key=isKid()?'k':'a'; if(!PHC[key]) PHC[key]=pool('all',true).filter(function(x){return x.ph;}); return PHC[key]; }
/* puntaje de Camila de 0 a 100: cada unidad vale 5, según las frases que ya dice sin leer */
function unitPct(t){ var k=me().known, n=0, tot=0; [].concat(t.s).forEach(function(i){ SECS[i].blocks.forEach(function(b){ if(b.t==='phrases') b.rows.forEach(function(r){ tot++; if(k[plain(r[0])]) n++; }); }); }); return tot?n/tot:0; }
function kidScore(){ var sum=0, P=pathTopics(); P.forEach(function(t){ sum+=unitPct(t)*100/P.length; }); return Math.round(sum); }

function block(b){
  switch(b.t){
    case 'h2': return '<h2>'+b.title+'</h2>';
    case 'h3': return '<h3>'+b.title+'</h3>';
    case 'p': return '<p>'+b.text+'</p>';
    case 'bullets': return '<ul class="bl">'+b.items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
    case 'box': return '<aside class="box '+b.kind+'">'+(b.title?'<strong class="t">'+b.title.replace(/^[★♥⚠]\s*/,'')+'</strong>':'')+b.items.map(function(i){return '<p>'+i+'</p>';}).join('')+'</aside>';
    case 'phrases': return b.rows.map(function(r){return phraseRow(r[0],r[1],r[2]);}).join('');
    case 'vocab': return '<div class="vgrid">'+b.rows.map(function(r){ var m=/^([A-Z]) – /.exec(r[0]); var s=m?(m[1]+', as in '+r[1]):r[0].replace(/\s*\([^)]*\)/g,'');
        return '<button class="v" data-say="'+esc(s)+'"><b lang="en">'+r[0]+'</b><span>'+r[1]+'</span></button>'; }).join('')+'</div>';
    case 'table': return '<div class="tscroll"><table class="t"><tr>'+b.head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+b.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
    case 'dialog': return '<div class="dlg"><h4><span>Diálogo: '+b.title+'</span><span class="row"><button class="btn small" data-dlg="all">Escuchar todo</button><button class="btn small" data-dlg="es">Ocultar español</button></span></h4>'+
        b.lines.map(function(l){return '<div class="ln"><button class="play" data-say="'+esc(l[1])+'" aria-label="Escuchar">'+PLAY+'</button><div><div class="whoL">'+l[0]+'</div><div lang="en"><b>'+l[1]+'</b></div><div class="es">'+l[2]+'</div></div></div>';}).join('')+'</div>';
    default: return '';

  var gag=(s==='idle'&&DS.gag&&now<DS.gagEnd)?DS.gag:null;

  if(s==='happy'||s==='party') mods.push('happy');

  else if(!noMotion&&t%16===0) mods.push('blink');
  else if(DS.look&&now<DS.lookUntil&&(s==='idle'||s==='listen')) mods.push(DS.look==='L'?'L':'R');
  if(s==='talk'||gag==='woof'){ var words=now-DS.lastWord<1200; if(noMotion||(words?now<DS.mouthUntil:t%2===0)) mods.push('talk'); }
  // cola

  // glifos
  if(s==='think') g=(noMotion||Math.floor(t/4)%2===0)?'q':'dots';
  else if(s==='listen') g=(now-mic.heardAt<700)?'note':'ex';
  else if(s==='fix') g='dots';

  else if(s==='party') g='star';
  else if(s==='sleep'){ g='z'; gy=noMotion?-6:-5-(Math.floor(t/3)%3); extra=extra.concat(NIGHTCAP); }
  else if(now<DS.wakeUntil) g='ex';

  else if(gag==='woof') g='note';
  if(g) extra=extra.concat(glyphPx(g,g==='z'?1:16,s==='sleep'?gy:gy));
  if(s==='party'){ for(var i=0;i<12;i++){ var k=(i*7+(noMotion?0:t)*3)%22, yy=-8+((i*5+(noMotion?0:t))%12); extra.push([k,yy,CONF[i%CONF.length]]); } }
  if(gag==='shake') cls='g-shake'; else if(gag==='chase') cls=(Math.floor(t/2)%2)?'g-flip':''; else if(gag==='sneeze'&&t%6>=3) cls='g-jolt';

function speakLines(lines,done){ var tok=++sayTok, fin=false; lines=lines.filter(function(l){return l&&l.text;});

    var i=0; (function next(){ if(tok!==sayTok){ finish(false); return; } if(i>=lines.length){ finish(true); return; }

    pr.then(function(){ finish(true); }).catch(function(err){ var c=err&&err.code; if(tok!==sayTok){ finish(false); return; } if(c==='not_granted'){ ttsCap=null; browser(); } else if(c==='rate_limited'||c==='busy'){ finish(false); } else browser(); }); }

  return '<p class="en" lang="en">Woof! I\'m '+esc(PN())+'. Let\'s practice your English.</p><p class="es">¡Guau! Soy '+esc(PN())+'. Practiquemos tu inglés.</p>'; }
function tDraw(){ var b=$('#tBub'); if(b) b.innerHTML=tBubble(); var c=$('#tLog'); if(!c) return;
  c.innerHTML=T.chat.map(function(m,i){ if(m.role==='user') return '<div class="msg me" lang="en">'+esc(m.text)+'</div>'; var p=m.p, out='';
    if(i>0&&p.fix) out+='<div class="msg tipm"><b>Se dice así:</b> <span lang="en">'+esc(p.fix)+'</span> <button class="slow" data-say="'+esc(p.fix)+'">escuchar</button>'+(p.tip?'<br>'+esc(p.tip):'')+'</div>';
    else if(i>0&&p.tip) out+='<div class="msg okm">'+esc(p.tip)+'</div>';
    return out+'<div class="msg bot"><button class="play" data-say="'+esc(p.en)+'" aria-label="Escuchar">'+PLAY+'</button><div><div lang="en"><b>'+esc(p.en)+'</b></div>'+(p.es?'<div class="es">'+esc(p.es)+'</div>':'')+'</div></div>'; }).join('');
  var f=$('#tCtl'); if(f){ var dis=T.busy?' disabled':'';
    if(T.needPass){ if(!f.querySelector('#tPass')) f.innerHTML=window.TUTOR_KEY?'<div class="ex" style="text-align:left"><h3 style="margin-top:0">Conecta a '+PN()+' con Gemini</h3><ol><li>Abre <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu cuenta de Google.</li><li>Toca «Create API key» y copia la clave.</li><li>Pégala aquí. Se guarda solo en este teléfono.</li></ol><div class="bar"><input class="inp" id="tPass" type="password" autocomplete="off" style="flex:1;min-width:0" aria-label="Clave de Gemini"><button class="btn fill" id="tPassOk">Guardar</button></div></div>':'<p>Escriban la clave del tutor:</p><div class="bar"><input class="inp" id="tPass" type="password" style="flex:1;min-width:0" aria-label="Clave del tutor"><button class="btn fill" id="tPassOk">Guardar</button></div>'; }
    else if(T.over){ f.innerHTML='<p><b>Buena práctica.</b> Lean otra vez las correcciones y anoten una frase en «Mi cuaderno».</p><button class="btn pink" id="tNew">Otra conversación</button>'; }
    else if(!f.querySelector('#tIn2')){ f.innerHTML=(micAvail()?'<button class="micbig" id="tMic" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Toca para hablar</span></button><p class="heard" id="tHeard" aria-live="polite"></p>':'<p class="note">El micrófono no está disponible en esta vista. Escriban su respuesta; '+PN()+' igual responde y corrige.</p>')+
        '<div class="bar"><input class="inp" id="tIn2" enterkeyhint="send" style="flex:1;min-width:0" lang="en" autocomplete="off" placeholder="O escriban aquí en inglés" aria-label="Su respuesta"><button class="btn fill" id="tSend2">Enviar</button></div>'+
        '<div class="row tset"><button class="btn small" id="tVoice" aria-pressed="'+T.voice+'">Voz de '+PN()+': '+(T.voice?'sí':'no')+'</button><button class="btn small" id="tFix" aria-pressed="'+T.fix+'">Corregir en voz alta: '+(T.fix?'sí':'no')+'</button>'+(!caps.dictation&&SRClass()&&!T.noSR?'<button class="btn small" id="tLang">Hablo en: '+(T.micLang==='es'?'español':'inglés')+'</button>':'')+'<button class="btn small" id="tNew">Cambiar de tema</button>'+(window.TUTOR_KEY&&window.TUTOR_KEY.get()?'<button class="btn small" id="tKey">Cambiar clave de Gemini</button>':'')+'</div>'; }
    var bs=f.querySelectorAll('#tMic,#tSend2'); for(var k=0;k<bs.length;k++) bs[k].disabled=!!T.busy; }
  var end=$('#tEnd'); if(end&&T.chat.length>1){ try{ end.scrollIntoView({block:'end'}); }catch(e){} } }
function vTutor(){ var a=aiState(), mine=mem.who, list=scList().map(function(s,i){return {s:s,i:i};}).sort(function(x,y){ function r(z){ return z.s.who===mine?0:z.s.who==='both'?1:2; } return r(x)-r(y)||x.i-y.i; });
  var head='<div class="tstage"><div><div class="dog" id="dog" data-state="'+T.dog+'"></div><p class="doglab" id="dogLab" aria-live="polite"></p></div><div class="tb" id="tBub">'+tBubble()+'</div></div>'+(T.sc?'<button class="tmini" id="tMini" hidden><span class="dogmini" id="dogMini" aria-hidden="true"></span><span id="tMiniLab">'+(DOGLAB[T.dog]||'Ver a '+PN())+'</span></button>':'');
  var body;
  if(a!=='wait'&&!caps.sample&&navigator.onLine===false){ T.dog='sleep'; head=head.replace('data-state="idle"','data-state="sleep"'); body='<div class="empty"><p><b>Sin conexión.</b> '+PN()+' necesita internet para conversar. Todo lo demás funciona sin conexión: frases, juegos y tarjetas.</p></div><button class="btn" data-go="practicar">Ir a los juegos</button>'; }
  else if(a==='wait') body='<p>Buscando a '+PN()+'…</p>';
  else if(a==='none') body='<aside class="box warn"><strong class="t">'+PN()+' necesita conexión con la IA</strong><p>En esta vista no hay un servicio de IA disponible. Dentro de Claude funciona al abrir la guía con sesión iniciada. Mientras tanto pueden practicar las mismas situaciones en «Role-plays y juegos».</p></aside><button class="btn" data-start="role">Ir a los role-plays</button>';
  else if(!T.sc) body='<h1>'+PN()+', tu '+(PET.f?'tutora':'tutor')+' de inglés</h1><p><button class="btn small" data-pickpet="1">Cambiar de mascota</button></p><p>Elige una situación'+(mem.who==='camila'?' de tu día':'')+'. '+PN()+' hace el otro papel, te habla en inglés sencillo y corrige cada respuesta, por voz y por escrito.</p><div class="tlist">'+list.map(function(x){ return '<button class="mode" data-tsc="'+x.i+'"><b>'+x.s.t+'</b><span>'+(x.s.who==='kid'?'Para Camila':x.s.who==='el'?'Técnico':x.s.who==='ella'?'Reservaciones':'Para los dos')+'</span></button>'; }).join('')+'</div><p class="note">La primera vez puede pedir permiso para usar la IA y el micrófono. '+PN()+' es una IA y puede equivocarse.</p>';
  else body='<p class="note" style="margin-top:0">'+esc(T.sc.t)+'</p><div id="tLog" class="chat tchat" aria-live="polite"></div><div id="tCtl" class="tctl"></div><div id="tEnd"></div>';
  return '<div class="wrap tutor">'+head+body+'</div>'; }

document.addEventListener('click',function(e){ var t=e.target.closest('button'); if(!t||st.tab!=='tutor') return; var d=t.dataset;
  if(d.tsc!==undefined){ tStart(+d.tsc); return; }
  if(t.id==='tMic'){ tListen(); return; }
  if(t.id==='tSend2'){ var i=$('#tIn2'), v=i.value.trim(); if(!v) return; i.value=''; stopAll(); tSend(v); return; }
  if(t.id==='tVoice'){ T.voice=!T.voice; if(!T.voice) stopAll(); $('#tCtl').innerHTML=''; tDraw(); return; }
  if(t.id==='tFix'){ T.fix=!T.fix; $('#tCtl').innerHTML=''; tDraw(); return; }
  if(t.id==='tLang'){ T.micLang=T.micLang==='es'?'en':'es'; $('#tCtl').innerHTML=''; tDraw(); return; }
  if(t.id==='tKey'){ window.TUTOR_KEY.set(''); T.needPass=true; $('#tCtl').innerHTML=''; tDraw(); return; }
  if(t.id==='tNew'){ stopAll(); stopMic(); T.sc=null; T.chat=[]; T.busy=false; T.over=false; T.dog='idle'; render(); return; }
  if(t.id==='tPassOk'){ var pv=$('#tPass').value.trim(); if(!pv) return; if(window.TUTOR_KEY) window.TUTOR_KEY.set(pv); else { try{ localStorage.setItem('turron-clave',pv); }catch(x){} } T.needPass=false; $('#tCtl').innerHTML=''; if(T.chat.length&&T.chat[T.chat.length-1].role==='user') tTurn(); else if(!T.chat.length) tTurn(); else tDraw(); return; }
});
document.addEventListener('keydown',function(e){ if(e.key!=='Enter') return; if(e.target.id==='tIn2'){ e.preventDefault(); $('#tSend2').click(); } if(e.target.id==='tPass'){ $('#tPassOk').click(); } });
/* el modo «tutor» de Practicar lleva a la pestaña de Turrón */
function tutor(){ st.mode=null; setTimeout(function(){ go('tutor'); },0); var g=$('#game'); if(g) g.innerHTML='<p>Abriendo a '+PN()+'…</p>'; }
/* modo compacto: si la escena de Turrón sale de la pantalla, queda una barrita con su cabeza y su glifo */
function afterRender(){ applyPet(); [].forEach.call(document.querySelectorAll('body > .tmini'),function(x){ x.remove(); }); if(st.tab!=='tutor') return;
  var mv=$('#view .tmini'); if(mv) document.body.appendChild(mv); /* fuera de #view: su animación de entrada rompería position:fixed */ dogKey=''; dogDraw(); if(T.sc) tDraw();
  miniCheck(); }
function miniCheck(){ var stg=$('.tstage'), mini=$('#tMini'); if(!stg||!mini) return; var top=0, hd=$('.top'), tb=$('.tabs'); if(hd){ var hr=hd.getBoundingClientRect(); if(hr.bottom>0) top=hr.bottom; } if(tb){ var br=tb.getBoundingClientRect(); if(br.top<140&&br.bottom>top) top=br.bottom; }
  var hide=stg.getBoundingClientRect().bottom>top+10; mini.style.top=Math.round(top+8)+'px'; if(mini.hidden!==hide){ mini.hidden=hide; dogKey=''; dogDraw(); } }
var miniRaf=0; window.addEventListener('scroll',function(){ if(st.tab!=='tutor'||miniRaf) return; miniRaf=requestAnimationFrame(function(){ miniRaf=0; miniCheck(); }); },{passive:true});
document.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('#tMini')){ var stg=$('.tstage'); if(stg) stg.scrollIntoView({behavior:noMotion?'auto':'smooth',block:'start'}); } });

/* avisos de conexión */
window.addEventListener('offline',function(){ toast('Sin conexión. Todo funciona menos la conversación con '+PN()+'.'); if(st.tab==='tutor'&&!T.sc) render(true); });
window.addEventListener('online',function(){ if(st.tab==='tutor'&&!T.sc){ T.dog='idle'; render(true); } });

/* Gemini por Firebase listo (src/sync.html): si Turrón esperaba una clave, sigue solo */
window.TURRON_APP.aiReady=function(){ if(st.tab!=='tutor'||!T.needPass) return; T.needPass=false; var f=$('#tCtl'); if(f) f.innerHTML=''; if(T.sc&&!T.busy&&(!T.chat.length||T.chat[T.chat.length-1].role==='user')) tTurn(); else tDraw(); };

/* Turrón de bienvenida (pantalla de entrar con Google): saluda hablando, después mueve la cola feliz */
window.TURRON_APP.welcomeFrame=function(t,pet){ var mods=[], extra=[], tail='tailA', c=t%24;
  if(noMotion) return dogSVG(['happy'],'tailA',glyphPx('heart',16,-7),'0 -8 22 30',pet);
  if(t<12){ if(t%2===0) mods.push('talk'); if(t%4<2) tail='tailB'; extra=glyphPx('note',16,-7); }
  else if(c<12){ mods.push('happy'); if(t%2) tail='tailB'; extra=glyphPx('heart',16,-7-(Math.floor(t/2)%2)); }
  else { if(c===20) mods.push('blink'); if(Math.floor(t/2)%2) tail='tailB'; }
  return dogSVG(mods,tail,extra,'0 -8 22 30',pet); };
/* elegir mascota (pantalla de bienvenida y tarjeta de Inicio) */
window.TURRON_APP.pets=function(){ return Object.keys(DOG.pets).map(function(k){ var p=DOG.pets[k]; return {k:k,n:p.n,breed:p.breed,age:p.age,f:p.f}; }); };
window.TURRON_APP.pet=function(){ var m=mem[mem.who]; return (m&&m.pet)||''; };
window.TURRON_APP.setPet=function(k){ if(!DOG.pets[k]) return; me().pet=k; save(); setPet(k); render(true); };
applyPet();

function stopMic(){ mic.cb=null; if(mic.on){ if(caps.dictation){ try{ caps.dictation.stop(); }catch(e){} } if(T.rec){ try{ T.rec.abort(); }catch(e){} } } mic.on=false; }

var VIEWS={tutor:vTutor,inicio:vInicio,frases:vFrases,trabajo:vTrabajo,practicar:vPracticar,plan:vPlan};
function renderV1(keep){ var y=window.scrollY; stopAll();
  view.innerHTML=VIEWS[st.tab]();
  document.querySelectorAll('.tabs button').forEach(function(b){ if(b.dataset.tab===st.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.querySelectorAll('.who button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.who===mem.who); });
  if(st.tab==='practicar'&&st.mode) startGame();
  window.scrollTo(0, keep?y:0); }
function go(tab){ st.tab=tab; st.mode=null; try{ if(location.hash!=='#'+tab) location.hash=tab; }catch(e){} render(); }
window.addEventListener('hashchange',function(){ var h=location.hash.slice(1); if(VIEWS[h]&&h!==st.tab){ st.tab=h; st.mode=null; render(); } });

/* ---------- events ---------- */
function playDialog(box){ var btns=[].slice.call(box.querySelectorAll('.ln .play')), i=0; (function nx(){ if(i>=btns.length) return; var b=btns[i++]; say(b.dataset.say,false,b,function(ok){ if(ok) setTimeout(nx,350); }); })(); }
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-go]'); if(!t) return; var d=t.dataset;
  if(d.tab){ go(d.tab); return; }
  if(d.go){ go(d.go); return; }
  if(d.who){ mem.who=d.who; save(); st.work=null; render(); return; }
  if(d.topic){ st.topic=d.topic; render(); return; }
  if(d.work){ st.work=d.work; render(); return; }
  if(d.start!==undefined){ st.tab='practicar'; st.mode=d.start||null; if(d.deck) st.deck=d.deck; try{location.hash='practicar';}catch(x){} render(); return; }
  if(d.say){ say(d.say, !!d.slow, t.classList.contains('play')||t.classList.contains('v')?t:null); return; }
  if(d.dlg==='all'){ playDialog(t.closest('.dlg')); return; }
  if(d.dlg==='es'){ var bx=t.closest('.dlg'); bx.classList.toggle('hide-es'); t.textContent=bx.classList.contains('hide-es')?'Mostrar español':'Ocultar español'; return; }
  if(t.classList.contains('know')){ var row=t.closest('.phr'), k=row.dataset.key, m=me(); m.known[k]=!m.known[k]; if(!m.known[k]) delete m.known[k]; save(); row.classList.toggle('known',!!m.known[k]); t.setAttribute('aria-pressed',!!m.known[k]); return; }
  if(d.again!==undefined){ startGame(); return; }
  // cards
  if(t.id==='flip'){ G.flip=!G.flip; cards(); return; }
  if(t.id==='cYes'||t.id==='cNo'){ var c=G.list[G.i]; if(t.id==='cYes'&&c.ph){ me().known[c.en]=true; save(); } else if(t.id==='cNo'){ G.list.push(c); } G.i++; G.flip=false; cards(); return; }
  // quiz
  if(t.classList.contains('opt')&&!G.cur.ans){ G.cur.ans=true; var ok=d.ok==='1'; if(ok) G.ok++; t.classList.add(ok?'ok':'bad'); document.querySelectorAll('.opt').forEach(function(o){ if(o.dataset.ok==='1') o.classList.add('ok'); o.disabled=true; });
    var fb=$('#fb'); fb.className='fb '+(ok?'ok':'bad'); fb.textContent=(ok?'Correcto. ':'Casi. ')+G.cur.q.en+' = '+G.cur.q.es; $('#next').disabled=false; say(G.cur.q.en); return; }
  if(t.id==='next'){ G.i++; quiz(); return; }
  // order
  if(d.pick!==undefined){ G.pick.push(G.words.filter(function(p){return p.i==d.pick;})[0]); drawOrder(); return; }
  if(d.un!==undefined){ G.pick.splice(+d.un,1); drawOrder(); return; }
  if(t.id==='oCheck'){ var c2=G.list[G.i], got=G.pick.map(function(p){return p.w;}).join(' '); if(norm(got)===norm(c2.en)){ drawOrder('Correcto.','ok'); say(c2.en); } else drawOrder('Todavía no. Cambien el orden y prueben otra vez.','bad'); return; }
  if(t.id==='oShow'){ drawOrder(G.list[G.i].en,'ok'); say(G.list[G.i].en); return; }
  if(t.id==='oNext'){ G.i++; order(); return; }
  // dictation
  if(t.id==='dCheck'){ var c3=G.list[G.i], inp=$('#dIn'), good=norm(inp.value)===norm(c3.en); inp.className='inp '+(good?'ok':'bad'); var f=$('#fb'); f.className='fb '+(good?'ok':'bad'); f.textContent=good?'Correcto. Significa: '+c3.es:'Todavía no. Escuchen otra vez, más lento.'; return; }
  if(t.id==='dShow'){ var c4=G.list[G.i], f2=$('#fb'); f2.className='fb ok'; f2.textContent=c4.en+' = '+c4.es; return; }
  if(t.id==='dNext'){ G.i++; dict(); return; }
  // spelling
  function letters(code){ return code.split('').join(', '); }
  if(t.id==='sSay'){ say(letters(G.code),true); return; }
  if(t.id==='sNato'){ say(G.code.split('').map(function(ch){return NATO[ch]?ch+' as in '+NATO[ch]:ch;}).join(', '),false); return; }
  if(t.id==='sNew'){ G.code=newCode(); $('#sCode').textContent=G.code; return; }
  if(t.id==='hSay'){ say(letters(G.hidden),true); return; }
  if(t.id==='hCheck'){ var hi=$('#hIn'), g2=hi.value.toUpperCase().replace(/[^A-Z0-9]/g,'')===G.hidden, f3=$('#fb'); hi.className='inp '+(g2?'ok':'bad'); f3.className='fb '+(g2?'ok':'bad'); f3.textContent=g2?'Correcto: '+G.hidden:'Todavía no. Escuchen otra vez.'; return; }
  if(t.id==='hNew'){ G.hidden=newCode(); $('#hIn').value=''; $('#hIn').className='inp'; $('#fb').textContent=''; say(letters(G.hidden),true); return; }
  // guide exercises
  if(d.check!==undefined){ var ex=t.closest('.ex'), ins=ex.querySelectorAll('input[data-a]'), n=0; ins.forEach(function(i){ var g3=norm(i.value)===norm(i.dataset.a); if(g3) n++; i.className=i.className.replace(/ ok| bad/g,'')+(g3?' ok':' bad'); });
    var f4=ex.querySelector('.fb'); f4.className='fb '+(n===ins.length?'ok':'bad'); f4.textContent=n+' de '+ins.length+' correctas'; return; }
  if(t.id==='rpB'){ var r=D.rp[Math.floor(Math.random()*D.rp.length)]; $('#rpT').textContent=r[0]; $('#rpD').textContent=r[1]; return; }
  if(t.id==='trkReset'){ me().track={}; save(); render(true); return; }
});
document.addEventListener('change',function(e){ var t=e.target, d=t.dataset, m=me();
  if(t.id==='deck'){ st.deck=t.value; startGame(); return; }
  if(d.week){ m.weeks[d.week]=t.checked; save(); t.closest('.wk').classList.toggle('done',t.checked); return; }
  if(d.track){ m.track[d.track]=t.checked; save(); return; }
  if(d.goal){ m.goals[d.goal]=t.value; save(); return; }
});
document.addEventListener('keydown',function(e){ if(e.key!=='Enter') return; if(e.target.id==='dIn'){ $('#dCheck').click(); } if(e.target.id==='hIn'){ $('#hCheck').click(); } });

var h0=location.hash.slice(1); if(VIEWS[h0]) st.tab=h0; render();
})();
