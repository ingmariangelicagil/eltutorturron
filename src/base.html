<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Dog: aprendiendo inglés con Turrón</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#5A2F0E">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#8A4B17">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --foam:#F1F9F8; --paper:#FFFFFF; --ink:#0F2F3A; --soft:#5C7680; --line:#D3E6E6;
  --lagoon:#0B8A99; --deep:#0A4D63; --flamingo:#E4487A; --sun:#FFC83A; --aloe:#2F8F5B;
  --lagoon-t:#DDF2F3; --flamingo-t:#FCE4EC; --sun-t:#FFF3CF; --aloe-t:#DFF2E6;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--foam);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--flamingo);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700;margin:1.8rem 0 .7rem}
h3{font-size:1.1rem;font-weight:700;color:var(--deep);margin:1.5rem 0 .5rem}
p{margin:.5rem 0;max-width:68ch}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;flex:1;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;opacity:.8}
.who{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.who button{border:0;background:none;color:#fff;padding:6px 14px;border-radius:999px;font-size:.9rem}
.who button[aria-pressed=true]{background:var(--sun);color:var(--ink);font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:2px solid var(--line);display:flex;justify-content:center}
.tabs button{flex:1;max-width:150px;border:0;background:none;padding:9px 4px 11px;font-size:.78rem;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--deep);font-weight:700;box-shadow:inset 0 3px 0 var(--flamingo)}

/* hero */
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden;padding:26px 0 34px}
.hero::before{content:"";position:absolute;right:-120px;top:-150px;width:270px;height:270px;border-radius:50%;background:var(--sun)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:18px;background:
  radial-gradient(circle at 12px -6px,transparent 13px,var(--foam) 14px) 0 0/24px 18px repeat-x}
.hero .wrap{position:relative}
.hero .kicker{font-size:.95rem;opacity:.9;margin:0 0 8px;max-width:22ch}
.daily{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.6rem);line-height:1.02;letter-spacing:-.025em;margin:0 0 10px;max-width:14ch;text-wrap:balance}
.daily-es{font-size:1.1rem;margin:0;opacity:.95}
.daily-pr{font-style:italic;opacity:.7;margin:2px 0 16px}
.bigplay{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--flamingo);color:#fff;font-weight:700;padding:13px 22px;border-radius:999px;font-size:1.05rem}
.bigplay.ghost{background:rgba(255,255,255,.16)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* generic pieces */
.btn{border:2px solid var(--deep);background:var(--paper);color:var(--deep);font-weight:700;padding:10px 18px;border-radius:999px}
.btn.fill{background:var(--deep);color:#fff}
.btn.pink{background:var(--flamingo);border-color:var(--flamingo);color:#fff}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1}
.stat span{color:var(--soft);font-size:.9rem}
.meter{height:8px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--aloe);border-radius:9px}
.box{border-left:6px solid var(--lagoon);background:var(--lagoon-t);border-radius:4px 14px 14px 4px;padding:12px 16px;margin:14px 0}
.box.tip{border-color:var(--sun);background:var(--sun-t)}
.box.warn{border-color:var(--flamingo);background:var(--flamingo-t)}
.box strong.t{display:block;font-family:var(--display);margin-bottom:2px}
ul.bl{padding-left:1.2rem;margin:.5rem 0}
ul.bl li{margin:.35rem 0;max-width:68ch}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px;margin:0 -18px;scrollbar-width:thin}
.chips button{white-space:nowrap;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 15px;font-size:.93rem}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

/* phrase rows */
.phr{background:var(--paper);border:2px solid var(--line);border-radius:14px;margin:8px 0;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 12px;align-items:start}
.phr.known{border-color:var(--aloe);background:var(--aloe-t)}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--lagoon);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.play.speaking{background:var(--flamingo)}
.phr .en{font-weight:700;font-size:1.08rem}
.phr .pr{font-style:italic;color:var(--soft);font-size:.92rem}
.phr .es{font-size:.98rem}
.phr .side{display:flex;flex-direction:column;gap:6px;align-items:center}
.slow{border:0;background:none;font-size:.82rem;color:var(--lagoon);text-decoration:underline;padding:8px 4px}
.know{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font-weight:700;color:transparent}
.known .know{background:var(--aloe);border-color:var(--aloe);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0}
.v{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.v b{font-size:1rem}.v span{color:var(--soft);font-size:.9rem}
.v.speaking{border-color:var(--flamingo)}
.dlg{background:var(--paper);border:2px solid var(--deep);border-radius:16px;padding:14px;margin:16px 0}
.dlg h4{font-family:var(--display);margin:0 0 8px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ln{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.ln .play{width:36px;height:36px}
.ln .whoL{font-size:.8rem;color:var(--flamingo);font-weight:700}
.ln .es{color:var(--soft);font-size:.93rem}
.hide-es .ln .es{visibility:hidden}
table.t{width:100%;border-collapse:collapse;margin:10px 0;background:var(--paper);border-radius:12px;overflow:hidden}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child{font-weight:700;width:30%}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:16px 0}
.mode{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:16px}
.mode b{font-family:var(--display);font-size:1.15rem;display:block}
.mode span{color:var(--soft);font-size:.93rem}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--lagoon)}}
.mode i{font-style:normal;display:inline-block;width:38px;height:38px;border-radius:11px;margin-bottom:8px;display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.stage{background:var(--paper);border:2px solid var(--deep);border-radius:20px;padding:22px;margin:16px 0;text-align:center}
.stage .q{font-family:var(--display);font-size:clamp(1.4rem,5vw,2rem);font-weight:700;margin:10px 0 4px;text-wrap:balance}
.stage .sub{color:var(--soft);margin:0 0 14px}
.opts{display:grid;gap:9px;margin:14px 0;text-align:left}
.opt{border:2px solid var(--line);background:var(--foam);border-radius:12px;padding:12px 14px;text-align:left}
.opt.ok{border-color:var(--aloe);background:var(--aloe-t);font-weight:700}
.opt.bad{border-color:var(--flamingo);background:var(--flamingo-t)}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;padding:8px;border-radius:12px}
.words.ans{border:2px dashed var(--line);margin-bottom:10px}
.w{border:2px solid var(--deep);background:var(--paper);border-radius:10px;padding:7px 13px;font-weight:700}
.fb{font-weight:700;min-height:1.6em;margin:10px 0}
.fb.ok{color:var(--aloe)}.fb.bad{color:var(--flamingo)}
.card{perspective:1000px;margin:12px auto;max-width:460px}
.card button{width:100%;min-height:210px;border:2px solid var(--deep);border-radius:20px;background:var(--sun-t);padding:22px;font-size:1rem}
.card.flip button{background:var(--lagoon-t)}
.inp{font:inherit;border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);max-width:100%}
.inp.ok{border-color:var(--aloe);background:var(--aloe-t)}
.inp.bad{border-color:var(--flamingo);background:var(--flamingo-t)}
.inp.s{width:6.5em;padding:4px 8px}
.ex{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.ex ol{padding-left:1.3rem;margin:.4rem 0}.ex li{margin:.6rem 0}
.ex .inp.w100{width:100%;margin-top:4px}
details{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
select.inp{padding-right:28px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.spell{font-family:var(--display);font-size:2.4rem;font-weight:800;letter-spacing:.08em}

/* plan */
.wk{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;align-items:start;cursor:pointer}
.wk.done{border-color:var(--aloe);background:var(--aloe-t)}
.wk input{width:24px;height:24px;accent-color:var(--aloe);margin-top:3px}
.wk b{font-family:var(--display)}
.wk small{display:block;color:var(--soft);font-size:.9rem}
.trk{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden}
.trk th,.trk td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-size:.92rem}
.trk td:first-child,.trk th:first-child{text-align:left;padding-left:12px}
.trk input{width:22px;height:22px;accent-color:var(--lagoon)}
.sos{background:var(--flamingo);color:#fff;border-radius:16px;padding:16px 18px;margin:18px 0}
.sos b{font-family:var(--display);font-size:1.5rem}
.note{color:var(--soft);font-size:.9rem}
@media (min-width:760px){
  body{padding-bottom:0;padding-top:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--line);order:-1}
  .tabs button{flex-direction:row;gap:8px;font-size:.95rem;padding:12px 10px;max-width:none}
  .tabs button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--flamingo)}
  .top{position:static}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.tabs{padding-bottom:env(safe-area-inset-bottom,0)}
button,summary,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
</style>
</head>

dicen sin pensar. Ver el progreso motiva muchísimo."]}, {"t": "h1", "title": "Parte 1 · Tips para aprender más rápido", "sub": "Hábitos pequeños, todos los días, valen más que horas sueltas el fin de semana"}, {"t": "box", "kind": "warn", "title": "♥ La ventaja de aprender en pareja", "items": ["Ustedes tienen algo que los estudiantes solos no tienen: un compañero de práctica en casa. Úsenlo. Corríjanse con cariño, hagan los role-plays de esta guía y compitan sanamente (¿quién aprende más palabras esta semana?)."]}, {"t": "h1", "title": "Parte 2 · Pronunciación para hispanohablantes", "sub": "Los 8 errores más comunes y cómo arreglarlos"}, {"t": "h2", "title": "El alfabeto en inglés (¡vital para deletrear nombres!)"}, {"t": "p", "text": "En el trabajo de reservaciones y en el técnico van a deletrear nombres, correos y números de serie todo el tiempo. Aprendan el alfabeto y el código fonético internacional:"}, {"t": "vocab", "rows": [["A – ei", "Alpha"], ["B – bi", "Bravo"], ["C – si", "Charlie"], ["D – di", "Delta"], ["E – i", "Echo"], ["F – ef", "Foxtrot"], ["G – dyi", "Golf"], ["H – eich", "Hotel"], ["I – ai", "India"], ["J – dyei", "Juliet"], ["K – kei", "Kilo"], ["L – el", "Lima"], ["M – em", "Mike"], ["N – en", "November"], ["O – ou", "Oscar"], ["P – pi", "Papa"], ["Q – kiu", "Quebec"], ["R – ar", "Romeo"], ["S – es", "Sierra"], ["T – ti", "Tango"], ["U – iu", "Uniform"], ["V – vi", "Victor"], ["W – dábel-iu", "Whiskey"], ["X – ex", "X-ray"], ["Y – uái", "Yankee"], ["Z – zi / zed", "Zulu"]]}, {"t": "box", "kind": "tip", "title": "★ Cuidado", "items": ["Las letras que más confunden: <b>E<\/b> («i») vs. <b>I<\/b> («ai»); <b>G<\/b> («dyi») vs. <b>J<\/b> («dyei»); <b>A<\/b> («ei») vs. <b>E<\/b> («i»). Al deletrear un correo: <b>@<\/b> = «at», <b>.<\/b> = «dot», <b>_<\/b> = «underscore», <b>-<\/b> = «dash»."]}, {"t": "h1", "title": "Parte 3 · Gramática mínima para sobrevivir", "sub": "Con estas 6 estructuras pueden decir casi todo"}, {"t": "h3", "title": "1. Verbo TO BE (ser / estar)"}, {"t": "phrases", "rows": [["I <b>am<\/b> from Venezuela. / I'm tired.", "ái am from... / áim táierd", "Soy de Venezuela. / Estoy cansado(a)."], ["He <b>is<\/b> a technician. / She's at work.", "ji is a teknishan", "Él es técnico. / Ella está en el trabajo."], ["We <b>are<\/b> new in Aruba.", "uí ar niú in arúba", "Somos nuevos en Aruba."], ["<b>Is<\/b> it open? / <b>Are<\/b> you busy?", "is it óupen?", "¿Está abierto? / ¿Estás ocupado?"]]}, {"t": "h3", "title": "2. Presente simple (rutinas)"}, {"t": "p", "text": "Igual para todos, pero con <b>he/she/it<\/b> se agrega <b>-s<\/b>: <i>I work / he work<b>s<\/b><\/i>. Negativo: <i>I <b>don't<\/b> work / she <b>doesn't<\/b> work<\/i>. Pregunta: <i><b>Do<\/b> you work here? <b>Does<\/b> he speak Spanish?<\/i>"}, {"t": "h3", "title": "3. Presente continuo (lo que pasa ahora)"}, {"t": "p", "text": "<b>am/is/are + verbo-ing<\/b>: <i>I'm cooking. He's installing the modem. We're looking for an apartment.<\/i>"}, {"t": "h3", "title": "4. Pasado simple"}, {"t": "p", "text": "Regular: verbo + <b>-ed<\/b> (<i>worked, called, booked<\/i>). Irregulares importantes: <i>go → went, have → had, buy → bought, pay → paid, get → got, see → saw, do → did, make → made, say → said, come → came<\/i>. Pregunta y negativo con <b>did<\/b>: <i>Did you call? I didn't see it.<\/i>"}, {"t": "h3", "title": "5. Futuro"}, {"t": "p", "text": "<b>going to<\/b> para planes: <i>We're going to visit the beach on Sunday.<\/i> <b>will<\/b> para decisiones y promesas en el momento: <i>I'll check that for you. I'll call you back.<\/i> (¡Muy útil en el trabajo!)"}, {"t": "h3", "title": "6. Pedir con cortesía: can / could / would"}, {"t": "phrases", "rows": [["<b>Can<\/b> I pay with card?", "kan ái péi uiz kard?", "¿Puedo pagar con tarjeta?"], ["<b>Could<\/b> you repeat that, please?", "kud iú ripít dat, plis?", "¿Podría repetir eso, por favor?"], ["<b>Would<\/b> you like a receipt?", "uud iú láik a risít?", "¿Le gustaría un recibo?"], ["I <b>would like<\/b> / I'd like a coffee.", "áid láik a cófi", "Quisiera un café."]]}, {"t": "box", "kind": "tip", "title": "★ Las palabras «W»", "items": ["Las preguntas con palabra interrogativa: <b>What<\/b> (qué), <b>Where<\/b> (dónde), <b>When<\/b> (cuándo), <b>Who<\/b> (quién), <b>Why<\/b> (por qué), <b>How<\/b> (cómo), <b>How much<\/b> (cuánto cuesta), <b>How many<\/b> (cuántos), <b>What time<\/b> (a qué hora), <b>Which<\/b> (cuál)."]}, {"t": "h1", "title": "Parte 4 · Situaciones del día a día", "sub": "Empiecen por aquí: las frases que más van a usar"}, {"t": "h2", "title": "Frases de supervivencia (memorícenlas esta semana)"}, {"t": "phrases", "rows": [["Hello! / Good morning / Good afternoon", "jelóu / gud mórning / gud áfternun", "¡Hola! / Buenos días / Buenas tardes"], ["How are you? — Fine, thanks. And you?", "jáu ar iú? — fáin, zenks. end iú?", "¿Cómo está? — Bien, gracias. ¿Y usted?"], ["Sorry, I don't understand.", "sóri, ái dóunt anderstánd", "Disculpe, no entiendo."], ["Can you speak slowly, please?", "kan iú spik slóuli, plis?", "¿Puede hablar despacio, por favor?"], ["Can you repeat that, please?", "kan iú ripít dat, plis?", "¿Puede repetir, por favor?"], ["How do you say ... in English?", "jáu du iú séi ... in ínglish?", "¿Cómo se dice ... en inglés?"], ["What does ... mean?", "uát das ... min?", "¿Qué significa ...?"], ["Do you speak Spanish?", "du iú spik spánish?", "¿Habla español?"], ["My English is not very good, I'm learning.", "mái ínglish is not véri gud, áim lérning", "Mi inglés no es muy bueno, estoy aprendiendo."], ["Can you write it down, please?", "kan iú ráit it dáun, plis?", "¿Me lo puede escribir, por favor?"], ["Excuse me, where is ...?", "ekskiús mi, uér is...?", "Disculpe, ¿dónde está...?"], ["Thank you very much! / You're welcome.", "zenk iú véri mach / iór uélcam", "¡Muchas gracias! / De nada."], ["No problem. / Of course.", "nou próblem / of cors", "No hay problema. / Claro."], ["Have a nice day! — You too!", "jav a náis déi — iú tu", "¡Que tenga buen día! — ¡Igualmente!"]]}, {"t": "box", "kind": "tip", "title": "★ Bonus local", "items": ["En Aruba también escucharán papiamento. Unas palabras para quedar bien: <b>Bon dia<\/b> (buenos días), <b>Bon tardi<\/b> (buenas tardes), <b>Danki<\/b> (gracias), <b>Con ta bai?<\/b> (¿cómo estás?), <b>Mi ta bon<\/b> (estoy bien). Los arubianos aprecian mucho el esfuerzo."]}, {"t": "h1", "title": "En el supermercado", "sub": "At the supermarket / grocery store"}, {"t": "h3", "title": "Vocabulario"}, {"t": "vocab", "rows": [["cart / basket", "carrito / cesta"], ["aisle", "pasillo"], ["checkout / cashier", "caja / cajero(a)"], ["receipt", "recibo"], ["bag (plastic / paper)", "bolsa"], ["price / on sale", "precio / en oferta"], ["cash / card", "efectivo / tarjeta"], ["change", "vuelto / cambio"], ["produce", "frutas y verduras"], ["dairy", "lácteos"], ["meat / chicken / fish", "carne / pollo / pescado"], ["bakery", "panadería"], ["frozen food", "congelados"], ["cleaning products", "productos de limpieza"], ["a pound / a kilo", "una libra / un kilo"], ["a dozen eggs", "una docena de huevos"], ["a loaf of bread", "un pan (de molde)"], ["a bottle of water", "una botella de agua"], ["a can of beans", "una lata de frijoles"], ["expiration date", "fecha de vencimiento"]]}, {"t": "h3", "title": "Frases útiles"}, {"t": "phrases", "rows": [["Excuse me, where can I find the rice?", "ekskiús mi, uér kan ái fáind de ráis?", "Disculpe, ¿dónde encuentro el arroz?"], ["Is it in aisle 5?", "is it in áil fáiv?", "¿Está en el pasillo 5?"], ["How much is this?", "jáu mach is dis?", "¿Cuánto cuesta esto?"], ["Do you have ... ?", "du iú jav...?", "¿Tienen ...?"], ["Can I get half a pound of ham, please?", "kan ái guet jaf a páund of jam, plis?", "¿Me da media libra de jamón?"], ["Sliced, please. / Thin, please.", "sláist, plis / zin, plis", "En rebanadas / Delgado, por favor."], ["Can I pay with card?", "kan ái péi uiz kard?", "¿Puedo pagar con tarjeta?"], ["Do you accept US dollars?", "du iú aksépt iú-es dólars?", "¿Aceptan dólares?"], ["I don't need a bag, thanks.", "ái dóunt nid a bag, zenks", "No necesito bolsa, gracias."], ["Can I have the receipt?", "kan ái jav de risít?", "¿Me da el recibo?"]]}, {"t": "dialog", "title": "en la caja", "lines": [["Cashier", "Hi! Did you find everything okay?", "¡Hola! ¿Encontró todo bien?"], ["You", "Yes, thank you. Do you accept credit cards?", "Sí, gracias. ¿Aceptan tarjetas de crédito?"], ["Cashier", "Yes, we do. Do you need a bag?", "Sí. ¿Necesita bolsa?"], ["You", "Yes, two bags, please.", "Sí, dos bolsas, por favor."], ["Cashier", "Your total is 85 florins. Insert or tap your card.", "Su total es 85 florines. Inserte o acerque su tarjeta."], ["You", "Thank you! Have a nice day.", "¡Gracias! Que tenga buen día."]]}, {"t": "box", "kind": "tip", "title": "★ Ejercicio de la vida real", "items": ["Antes de ir al súper, escriban la lista de compras <b>en inglés<\/b>. Es el ejercicio más fácil y útil de toda la semana. En Aruba la moneda es el florín arubeño (AWG), y en muchos lugares también aceptan dólares: pregunten siempre en qué moneda les dan el vuelto (<i>«Is the change in florins or dollars?»<\/i>)."]}, {"t": "h1", "title": "En la casa", "sub": "At home: rutina, cocina, mantenimiento y conversación en pareja"}, {"t": "h3", "title": "Partes de la casa y objetos (¡para etiquetar!)"}, {"t": "vocab", "rows": [["living room", "sala"], ["bedroom", "dormitorio"], ["bathroom", "baño"], ["kitchen", "cocina"], ["fridge", "nevera"], ["stove / oven", "estufa / horno"], ["microwave", "microondas"], ["sink", "fregadero / lavamanos"], ["washing machine", "lavadora"], ["dryer", "secadora"], ["air conditioner (AC)", "aire acondicionado"], ["fan", "ventilador"], ["light switch", "interruptor"], ["outlet", "enchufe (pared)"], ["faucet / tap", "grifo / llave"], ["trash can", "bote de basura"], ["closet", "clóset"], ["key / lock", "llave / cerradura"], ["broom / mop", "escoba / trapeador"], ["dishes", "platos"]]}, {"t": "h3", "title": "Rutina diaria — para practicar juntos"}, {"t": "phrases", "rows": [["I wake up at 6. / I take a shower.", "ái uéik ap at six / ái téik a sháuer", "Me despierto a las 6. / Me ducho."], ["What do you want for breakfast?", "uát du iú uánt for brékfast?", "¿Qué quieres desayunar?"], ["I'm going to work. See you later!", "áim góing tu uork. si iú léiter", "Me voy al trabajo. ¡Nos vemos!"], ["How was your day?", "jáu uas iór déi?", "¿Cómo te fue hoy?"], ["It was good / busy / long / stressful.", "it uas gud / bísi / long / strésful", "Fue bueno / ocupado / largo / estresante."], ["Can you help me with the dishes?", "kan iú jelp mi uiz de díshis?", "¿Me ayudas con los platos?"], ["Let's cook dinner together.", "lets kuk díner tuguéder", "Cocinemos la cena juntos."], ["We need to buy milk and eggs.", "uí nid tu bái milk end egs", "Tenemos que comprar leche y huevos."], ["Don't forget to pay the electricity bill.", "dóunt forguét tu péi de electrísiti bil", "No olvides pagar la luz."], ["Turn on / turn off the AC, please.", "tern on / tern of de ei-si", "Prende / apaga el aire, por favor."], ["I'm tired. Let's go to bed.", "áim táierd. lets gou tu bed", "Estoy cansado(a). Vamos a dormir."]]}, {"t": "h3", "title": "Con el casero o un técnico en casa"}, {"t": "phrases", "rows": [["The AC is not working.", "de ei-si is not uórking", "El aire no funciona."], ["There is a leak in the bathroom.", "der is a lik in de bázrum", "Hay una fuga en el baño."], ["When can you come to fix it?", "uén kan iú kam tu fix it?", "¿Cuándo puede venir a arreglarlo?"], ["The rent is due on the first of the month.", "de rent is du on de ferst of de manz", "La renta se paga el primero de cada mes."]]}, {"t": "box", "kind": "tip", "title": "★ Juego de la cena: «Three things»", "items": ["Cada noche, durante la cena, cada uno cuenta en inglés <b>tres cosas<\/b> que hizo en el día, usando el pasado: <i>«Today I worked a lot. I talked to a customer. I bought bread.»<\/i> El otro hace una pregunta: <i>«Who did you talk to?»<\/i>"]}, {"t": "h1", "title": "Vecinos, compañeros y «small talk»", "sub": "Conversación corta y amable: la clave para hacer amigos"}, {"t": "phrases", "rows": [["Hi, I'm María. We just moved in next door.", "jái, áim maría. uí yast muvd in next dor", "Hola, soy María. Nos acabamos de mudar al lado."], ["Nice to meet you!", "náis tu mit iú", "¡Mucho gusto!"], ["Where are you from? — I'm from ...", "uér ar iú from? — áim from...", "¿De dónde eres? — Soy de ..."], ["How long have you lived in Aruba?", "jáu long jav iú livd in arúba?", "¿Cuánto tiempo llevas viviendo en Aruba?"], ["We've been here for two months.", "uív bin jíer for tu manz", "Llevamos dos meses aquí."], ["What do you do? — I work in telecommunications.", "uát du iú du? — ái uork in télecomiunikéishons", "¿A qué te dedicas? — Trabajo en telecomunicaciones."], ["I'm a reservations agent.", "áim a reservéishons éiyent", "Soy agente de reservaciones."], ["It's so hot today! / What a beautiful day!", "its sou jot tudéi / uát a biútiful déi", "¡Qué calor hace hoy! / ¡Qué día tan bonito!"], ["Can you recommend a good restaurant / beach?", "kan iú rekoménd a gud réstorant / bich?", "¿Me recomiendas un buen restaurante / playa?"], ["What do you like to do on weekends?", "uát du iú láik tu du on uíkends?", "¿Qué te gusta hacer los fines de semana?"], ["Let me know if you need anything.", "let mi nóu if iú nid énizing", "Avísame si necesitas algo."]]}, {"t": "h2", "title": "Banco, gobierno y trámites"}, {"t": "phrases", "rows": [["I'd like to open a bank account.", "áid láik tu óupen a bank akáunt", "Quisiera abrir una cuenta bancaria."], ["What documents do I need?", "uát dókiuments du ái nid?", "¿Qué documentos necesito?"], ["Here is my passport and my work permit.", "jíer is mái pásport end mái uork pérmit", "Aquí está mi pasaporte y mi permiso de trabajo."], ["I have an appointment at 10.", "ái jav an apóintment at ten", "Tengo una cita a las 10."], ["Where do I sign? / Do I fill out this form?", "uér du ái sáin? / du ái fil áut dis form?", "¿Dónde firmo? / ¿Lleno este formulario?"], ["How long does it take?", "jáu long das it téik?", "¿Cuánto tiempo tarda?"], ["Can I take a number?", "kan ái téik a námber?", "¿Puedo sacar un número / turno?"]]}, {"t": "h1", "title": "Médico y farmacia", "sub": "At the doctor / pharmacy"}, {"t": "vocab", "rows": [["headache", "dolor de cabeza"], ["stomachache", "dolor de estómago"], ["sore throat", "dolor de garganta"], ["fever", "fiebre"], ["cough", "tos"], ["cold / flu", "resfriado / gripe"], ["allergy", "alergia"], ["prescription", "receta médica"], ["pill / tablet", "pastilla"], ["insurance", "seguro"], ["appointment", "cita"], ["blood test", "examen de sangre"]]}, {"t": "phrases", "rows": [["I need to see a doctor.", "ái nid tu si a dóctor", "Necesito ver a un médico."], ["I'd like to make an appointment.", "áid láik tu méik an apóintment", "Quisiera hacer una cita."], ["I have a headache and a fever.", "ái jav a jédeik end a fíver", "Tengo dolor de cabeza y fiebre."], ["It hurts here.", "it jerts jíer", "Me duele aquí."], ["Since yesterday / for three days.", "sins iésterdei / for zri déis", "Desde ayer / desde hace tres días."], ["I'm allergic to penicillin.", "áim alérgic tu penisílin", "Soy alérgico(a) a la penicilina."], ["How many times a day?", "jáu méni táims a déi?", "¿Cuántas veces al día?"], ["Do I need a prescription for this?", "du ái nid a prescrípshon for dis?", "¿Necesito receta para esto?"], ["Here is my insurance card.", "jíer is mái inshúrans kard", "Aquí está mi tarjeta del seguro."]]}, {"t": "h2", "title": "Transporte, restaurante y emergencias"}, {"t": "phrases", "rows": [["Does this bus go to Oranjestad?", "das dis bas gou tu oranyestad?", "¿Este bus va a Oranjestad?"], ["How much is the fare?", "jáu mach is de fer?", "¿Cuánto es el pasaje?"], ["Please take me to this address.", "plis téik mi tu dis adrés", "Por favor lléveme a esta dirección."], ["A table for two, please.", "a téibol for tu, plis", "Una mesa para dos, por favor."], ["Can we see the menu? / The check, please.", "kan uí si de méniu? / de chek, plis", "¿Nos trae el menú? / La cuenta, por favor."], ["Is the tip included?", "is de tip inclúded?", "¿La propina está incluida?"], ["<b>Help!<\/b> / Call an ambulance!", "jelp / col an ámbiulans", "¡Ayuda! / ¡Llame una ambulancia!"], ["There's been an accident.", "ders bin an áksident", "Hubo un accidente."], ["My address is ...", "mái adrés is...", "Mi dirección es ..."]]}, {"t": "box", "kind": "warn", "title": "⚠ Importante", "items": ["En Aruba el número de emergencias es el <b>911<\/b>. Practiquen juntos, en voz alta, cómo decir su dirección completa en inglés y cómo describir la emergencia en una frase: <i>«My husband fell and he is hurt. We are at [address].»<\/i> Escríbanla y péguenla en la nevera."]}, {"t": "h1", "title": "Parte 5 · Inglés para el trabajo", "sub": "A. Técnico de telecomunicaciones (para él)"}, {"t": "p", "text": "Buenas noticias: gran parte del vocabulario técnico ya está en inglés (router, modem, Wi-Fi, fiber, switch). El reto es la conversación con clientes, supervisores y compañeros. Aquí está lo esencial."}, {"t": "h3", "title": "Vocabulario técnico"}, {"t": "vocab", "rows": [["fiber optic cable", "cable de fibra óptica"], ["splice / splicing", "empalme / empalmar"], ["connector", "conector"], ["router / modem", "router / módem"], ["ONT (optical network terminal)", "terminal óptica (ONT)"], ["signal / signal strength", "señal / potencia de señal"], ["outage", "caída del servicio"], ["installation / setup", "instalación / configuración"], ["troubleshooting", "diagnóstico de fallas"], ["work order / ticket", "orden de trabajo / ticket"], ["cabinet / box", "gabinete / caja"], ["pole / ladder", "poste / escalera"], ["wall jack / outlet", "toma de pared"], ["drill", "taladro"], ["cable tester / power meter", "probador / medidor de potencia"], ["bandwidth / speed", "ancho de banda / velocidad"], ["password / network name", "contraseña / nombre de red"], ["reboot / reset", "reiniciar / restablecer"], ["damaged / broken / loose", "dañado / roto / flojo"], ["safety gear / harness", "equipo de seguridad / arnés"], ["helmet / gloves", "casco / guantes"], ["the field / on site", "en campo / en sitio"], ["customer premises", "domicilio del cliente"], ["downtime", "tiempo sin servicio"]]}, {"t": "h3", "title": "Con el cliente (llegar, explicar, terminar)"}, {"t": "phrases", "rows": [["Good morning, I'm the technician from [company].", "gud mórning, áim de teknishan from...", "Buenos días, soy el técnico de [empresa]."], ["I'm here to install your internet service.", "áim jíer tu instól iór ínternet sérvis", "Vengo a instalar su servicio de internet."], ["I'm here to check the problem with your connection.", "áim jíer tu chek de próblem uiz iór konékshon", "Vengo a revisar el problema con su conexión."], ["Can you show me where the modem is?", "kan iú shou mi uér de móudem is?", "¿Me muestra dónde está el módem?"], ["What is the problem exactly?", "uát is de próblem eksáktli?", "¿Cuál es el problema exactamente?"], ["When did the problem start?", "uén did de próblem start?", "¿Cuándo empezó el problema?"], ["I need to drill a small hole here. Is that okay?", "ái nid tu dril a smol jóul jíer. is dat okéi?", "Necesito hacer un hoyito aquí. ¿Está bien?"], ["It will take about one hour.", "it uil téik abáut uan áuer", "Tardará más o menos una hora."], ["The cable was damaged. I replaced it.", "de kéibol uas dámeyd. ái ripléist it", "El cable estaba dañado. Lo cambié."], ["Everything is working now.", "évrizing is uórking náu", "Ya todo funciona."], ["This is your Wi-Fi name and password.", "dis is iór uái-fai néim end pásuord", "Este es su nombre de Wi-Fi y contraseña."], ["If you have any problem, please call customer service.", "if iú jav éni próblem, plis col cástomer sérvis", "Si tiene algún problema, llame a servicio al cliente."], ["Can you sign here, please?", "kan iú sáin jíer, plis?", "¿Puede firmar aquí, por favor?"]]}, {"t": "h3", "title": "Con el supervisor y los compañeros"}, {"t": "phrases", "rows": [["I finished the job at [address].", "ái fínisht de yob at...", "Terminé el trabajo en [dirección]."], ["I need more cable / another connector.", "ái nid mor kéibol / anóder konéktor", "Necesito más cable / otro conector."], ["The customer wasn't home.", "de cástomer uásent jóum", "El cliente no estaba en casa."], ["There's no signal at the box.", "ders nou sígnal at de box", "No hay señal en la caja."], ["I think the problem is in the main line.", "ái zink de próblem is in de méin láin", "Creo que el problema está en la línea principal."], ["I'm on my way. / I'm running late.", "áim on mái uéi / áim rániŋ léit", "Voy en camino. / Voy con retraso."], ["Can you help me with this? / Can you show me how?", "kan iú jelp mi uiz dis? / ... shou mi jáu?", "¿Me ayudas con esto? / ¿Me enseñas cómo?"], ["Sorry, can you say that again more slowly?", "sóri, kan iú séi dat aguén mor slóuli?", "Perdón, ¿lo repites más despacio?"], ["Be careful! / Watch out!", "bi kérful / uách áut", "¡Ten cuidado! / ¡Cuidado!"]]}, {"t": "dialog", "title": "una visita técnica", "lines": [["Customer", "Hi! The internet has been down since yesterday.", "¡Hola! El internet no funciona desde ayer."], ["Tech", "Good morning. I'm sorry about that. Can I see the modem, please?", "Buenos días. Lo siento. ¿Puedo ver el módem?"], ["Customer", "Sure, it's in the living room.", "Claro, está en la sala."], ["Tech", "The red light is on. I'm going to check the cable outside.", "La luz roja está prendida. Voy a revisar el cable afuera."], ["Tech", "The connector was loose. I fixed it. Can you check your phone now?", "El conector estaba flojo. Lo arreglé. ¿Puede revisar su teléfono ahora?"], ["Customer", "Yes! It's working. Thank you so much!", "¡Sí! Ya funciona. ¡Muchas gracias!"], ["Tech", "You're welcome. Please sign here. Have a nice day!", "De nada. Por favor firme aquí. ¡Que tenga buen día!"]]}, {"t": "box", "kind": "tip", "title": "★ Tip para el técnico", "items": ["Prepara una «tarjeta de bolsillo» (o nota en el celular) con tus 10 frases de cliente más usadas. Léela en el carro antes de cada visita. En un mes las dirás de memoria. También practica decir números de teléfono, direcciones y números de serie en voz alta: es lo que más se usa en campo."]}, {"t": "h1", "title": "Inglés para el trabajo", "sub": "B. Agente de reservaciones (para ella)"}, {"t": "p", "text": "Las reservaciones siguen un guion bastante repetitivo. Esa es una gran ventaja: si dominas el guion, dominas el 80% de tus llamadas. Aquí hay frases útiles para hotel, aerolínea, tours o alquiler de autos; adapta las que correspondan a tu empresa."}, {"t": "h3", "title": "Vocabulario"}, {"t": "vocab", "rows": [["booking / reservation", "reserva"], ["availability", "disponibilidad"], ["to book", "reservar"], ["confirmation number", "número de confirmación"], ["check-in / check-out", "entrada / salida"], ["arrival / departure", "llegada / salida"], ["rate / price per night", "tarifa / precio por noche"], ["deposit", "depósito"], ["cancellation policy", "política de cancelación"], ["refund", "reembolso"], ["fully booked / sold out", "lleno / agotado"], ["single / double room", "habitación sencilla / doble"], ["ocean view", "vista al mar"], ["guest", "huésped"], ["adults / children", "adultos / niños"], ["flight number", "número de vuelo"], ["round trip / one way", "ida y vuelta / solo ida"], ["upgrade", "mejora de categoría"], ["special request", "solicitud especial"], ["taxes and fees", "impuestos y cargos"], ["to hold / on hold", "esperar / en espera"], ["to transfer a call", "transferir una llamada"]]}, {"t": "h3", "title": "El guion de una llamada"}, {"t": "phrases", "rows": [["Thank you for calling [company], this is [name]. How may I help you?", "zenk iú for cóling..., dis is... jáu mei ái jelp iú?", "Gracias por llamar a [empresa], habla [nombre]. ¿En qué puedo ayudarle?"], ["I'd be happy to help you with that.", "áid bi jápi tu jelp iú uiz dat", "Con gusto le ayudo con eso."], ["May I have your full name, please?", "méi ái jav iór ful néim, plis?", "¿Me da su nombre completo, por favor?"], ["Could you spell that for me, please?", "kud iú spel dat for mi, plis?", "¿Me lo podría deletrear?"], ["What dates are you looking for?", "uát déits ar iú lúking for?", "¿Qué fechas busca?"], ["How many guests will be staying?", "jáu méni guests uil bi stéiing?", "¿Cuántos huéspedes se hospedarán?"], ["Let me check the availability for you.", "let mi chek de aveilabíliti for iú", "Permítame revisar la disponibilidad."], ["Could you hold for a moment, please?", "kud iú jóuld for a móument, plis?", "¿Puede esperar un momento, por favor?"], ["Thank you for holding.", "zenk iú for jóulding", "Gracias por esperar."], ["We have a double room available for those dates.", "uí jav a dábel rum avéilabol for dóus déits", "Tenemos una habitación doble disponible para esas fechas."], ["The rate is 180 dollars per night, plus taxes.", "de réit is uán-éiti dólars per náit, plas táxes", "La tarifa es 180 dólares por noche, más impuestos."], ["Would you like me to book it for you?", "uud iú láik mi tu buk it for iú?", "¿Desea que se la reserve?"], ["Your confirmation number is ...", "iór konferméishon námber is...", "Su número de confirmación es ..."], ["You will receive a confirmation email shortly.", "iú uil risív a konferméishon ímeil shórtli", "Recibirá un correo de confirmación en breve."], ["Is there anything else I can help you with?", "is der énizing els ái kan jelp iú uiz?", "¿Hay algo más en que pueda ayudarle?"], ["Thank you for choosing us. Have a great day!", "zenk iú for chúsing as. jav a gréit déi", "Gracias por elegirnos. ¡Que tenga un gran día!"]]}, {"t": "h3", "title": "Cuando no entiendes o hay un problema"}, {"t": "phrases", "rows": [["I'm sorry, the line is not clear. Could you repeat that?", "áim sóri, de láin is not clíer...", "Disculpe, la línea no está clara. ¿Puede repetir?"], ["Just to confirm, that's March 15th to the 20th?", "yast tu konférm, dats march fiftínz tu de tuéntiez?", "Para confirmar, ¿del 15 al 20 de marzo?"], ["I apologize for the inconvenience.", "ái apóloyais for de inconvíniens", "Le pido disculpas por el inconveniente."], ["Unfortunately, we are fully booked on those dates.", "anfórchunetli, uí ar fúli bukt...", "Lamentablemente estamos llenos esas fechas."], ["I can offer you an alternative.", "ái kan ófer iú an oltérnativ", "Le puedo ofrecer una alternativa."], ["Let me transfer you to my supervisor.", "let mi transfér iú tu mái supervaisor", "Le transfiero con mi supervisor(a)."], ["There is a cancellation fee of ...", "der is a canseléishon fi of...", "Hay un cargo por cancelación de ..."]]}, {"t": "h3", "title": "Correos electrónicos: frases listas"}, {"t": "bullets", "items": ["<b>Saludo:<\/b> <i>Dear Mr. / Ms. [Apellido],<\/i> — <i>Thank you for your email.<\/i>", "<b>Confirmar:<\/b> <i>I am pleased to confirm your reservation for [dates].<\/i>", "<b>Adjuntar:<\/b> <i>Please find attached your booking confirmation.<\/i>", "<b>Pedir información:<\/b> <i>Could you please send us your flight details?<\/i>", "<b>Disculpa:<\/b> <i>We apologize for any inconvenience this may cause.<\/i>", "<b>Cierre:<\/b> <i>Please do not hesitate to contact us if you have any questions. We look forward to welcoming you. Kind regards, [Nombre]<\/i>"]}, {"t": "dialog", "title": "una reserva por teléfono", "lines": [["Agent", "Thank you for calling. This is Ana. How may I help you?", "Gracias por llamar. Habla Ana. ¿En qué puedo ayudarle?"], ["Caller", "Hi, I'd like to book a room for next weekend.", "Hola, quisiera reservar una habitación para el próximo fin de semana."], ["Agent", "Of course. What are your arrival and departure dates?", "Claro. ¿Cuáles son sus fechas de llegada y salida?"], ["Caller", "Arriving Friday the 20th, leaving Sunday the 22nd.", "Llego el viernes 20, salgo el domingo 22."], ["Agent", "Let me check... Yes, we have an ocean-view room at 210 dollars per night. Would you like to book it?", "Déjeme revisar... Sí, tenemos una con vista al mar a 210 dólares la noche. ¿Desea reservarla?"], ["Caller", "Yes, please.", "Sí, por favor."], ["Agent", "May I have your full name? Could you spell your last name, please?", "¿Su nombre completo? ¿Podría deletrear su apellido?"], ["Caller", "Smith. S-M-I-T-H.", "Smith. S-M-I-T-H."], ["Agent", "Thank you, Mr. Smith. Your confirmation number is A-7-4-2-9.", "Gracias, Sr. Smith. Su número de confirmación es A-7-4-2-9."]]}, {"t": "box", "kind": "tip", "title": "★ Tip para la agente", "items": ["Escribe tu guion completo de llamada en una hoja y tenlo junto a la computadora. Practica con tu esposo en casa: él hace de cliente (¡y que a veces sea un cliente difícil!). Graba tu voz en el celular diciendo el saludo de bienvenida y compárala con la de una compañera nativa."]}, {"t": "h1", "title": "Parte 6 · Ejercicios para practicar", "sub": "Háganlos con lápiz; las respuestas están al final"}, {"t": "exercise", "title": "Ejercicio 1 · Completa con am / is / are", "items": ["I ______ a technician.", "She ______ at work now.", "We ______ from Colombia.", "The store ______ closed on Sunday.", "______ you busy?", "My husband and I ______ new in Aruba."], "note": null}, {"t": "exercise", "title": "Ejercicio 2 · Traduce al inglés", "items": ["¿Cuánto cuesta esto?", "No entiendo. ¿Puede hablar despacio?", "Quisiera abrir una cuenta bancaria.", "El internet no funciona desde ayer.", "Permítame revisar la disponibilidad.", "Tengo dolor de cabeza."], "note": null}, {"t": "exercise", "title": "Ejercicio 3 · Pasado simple: escribe el pasado", "items": ["go → ______", "buy → ______", "work → ______", "pay → ______", "have → ______", "call → ______", "fix → ______", "book → ______"], "note": null}, {"t": "exercise", "title": "Ejercicio 4 · Ordena las palabras", "items": ["you / help / How / I / may / ?", "the / Where / rice / is / ?", "card / pay / I / Can / with / ?", "number / Your / confirmation / is / B-325", "cable / damaged / The / was"], "note": null}, {"t": "exercise", "title": "Ejercicio 5 · ¿Qué dirías? (situaciones)", "items": ["Estás en la caja y quieres saber si aceptan dólares.", "Llegas a casa de un cliente para instalar internet. Preséntate.", "Un cliente te llama y no entendiste su apellido.", "Tu vecino te saluda por primera vez.", "Tienes que decirle al casero que el aire acondicionado no funciona."], "note": null}, {"t": "exercise", "title": "Ejercicio 6 · Deletrea en voz alta (en pareja)", "items": ["Tu nombre completo y apellidos.", "Tu correo electrónico (con «at» y «dot»).", "Tu número de teléfono, número por número.", "Tu dirección en Aruba.", "Un número de confirmación inventado: K7-Q2-J9-G4 (¡cuidado con G y J!)."], "note": "Uno deletrea y el otro escribe. Después cambien de rol y comparen."}, {"t": "h1", "title": "Juegos y role-plays en pareja", "sub": "La práctica más divertida y la que más resultados da"}, {"t": "h2", "title": "Role-plays (10 minutos cada uno)"}, {"t": "p", "text": "Uno hace de cliente/empleado y el otro de ustedes mismos. Usen las frases de esta guía. Luego cambien de rol. La segunda vez, intenten hacerlo <b>sin mirar la guía<\/b>."}, {"t": "h2", "title": "Juegos rápidos"}, {"t": "bullets", "items": ["<b>«What's this?»<\/b> — Uno señala un objeto de la casa; el otro tiene 3 segundos para decir el nombre en inglés. Punto por respuesta correcta.", "<b>20 preguntas<\/b> — Uno piensa en un objeto; el otro adivina solo con preguntas de sí/no en inglés: <i>«Is it in the kitchen? Is it big?»<\/i>", "<b>El día al revés<\/b> — Cuenten su día del final al principio, en pasado.", "<b>Dictado de compras<\/b> — Uno dicta la lista del súper en inglés y el otro la escribe sin ver.", "<b>La palabra del día<\/b> — Cada mañana uno elige una palabra nueva. Quien la use más veces en el día gana (el perdedor lava los platos 😉).", "<b>Noticias de 1 minuto<\/b> — Cada uno cuenta en inglés algo que pasó en su trabajo. El otro hace dos preguntas."]}, {"t": "h1", "title": "Parte 7 · Plan de 12 semanas", "sub": "Una meta clara por semana"}, {"t": "h2", "title": "Hoja de seguimiento semanal"}, {"t": "p", "text": "Imprímanla (o cópienla en el cuaderno) y marquen cada día lo que hicieron. Una para cada uno."}, {"t": "box", "kind": "info", "title": "Nuestra meta", "items": ["Escriban aquí 3 frases que quieren poder decir con confianza dentro de 3 meses:", "1. ____________________________________________________________", "2. ____________________________________________________________", "3. ____________________________________________________________"]}, {"t": "h1", "title": "Respuestas de los ejercicios", "sub": "Revisen juntos y repitan en voz alta las que fallaron"}, {"t": "box", "kind": "warn", "title": "♥ Un último consejo", "items": ["Aprender un idioma de adulto, en un país nuevo y trabajando, es difícil, y ustedes lo están haciendo juntos. Habrá días en que sientan que no avanzan: es normal. Sigan con los 15 minutos diarios, hablen aunque sea con errores, y en unos meses se van a sorprender de todo lo que entienden y dicen.", "<b>You can do it! — ¡Ustedes pueden! — Boso por!<\/b>"]}], "tips": [["1. Poco, pero todos los días", "15 a 30 minutos diarios funcionan mejor que 3 horas el domingo. Elijan un momento fijo: el café de la mañana, el viaje al trabajo o después de cenar."], ["2. La «hora en inglés» en casa", "Escojan una hora al día (por ejemplo, la cena) en la que solo se habla inglés entre ustedes. Si no saben una palabra, la dicen en español y la buscan juntos. Sin burlas: los dos están aprendiendo."], ["3. Etiqueten la casa", "Peguen papelitos con el nombre en inglés: <i>fridge, stove, sink, door, window, mirror, closet<\/i>. Cada vez que toquen algo, díganlo en voz alta."], ["4. Cambien el idioma del teléfono", "Pongan el celular, WhatsApp y Netflix en inglés. Ya saben dónde está cada botón, así que aprenderán las palabras sin esfuerzo."], ["5. Aprendan frases, no palabras sueltas", "En vez de memorizar «receipt = recibo», memoricen «<i>Can I have the receipt, please?<\/i>». Las frases completas se usan de inmediato."], ["6. Hablen solos (en serio)", "Narren lo que hacen: «<i>I'm making coffee. I'm opening the door. I'm going to work.<\/i>» Esto entrena la boca y el cerebro a la vez."], ["7. Técnica del «shadowing» (sombra)", "Pongan un audio corto en inglés, pausen después de cada frase y repítanla imitando el ritmo y la entonación, como un eco. 5 minutos al día mejoran mucho la pronunciación."], ["8. Series con subtítulos en inglés", "Primero con subtítulos en español, luego en inglés. Elijan comedias o series del día a día (no de época ni ciencia ficción). Vean el mismo episodio dos veces."], ["9. Preparen antes de salir", "Antes de ir al banco, al médico o a una cita, escriban 3 a 5 frases que van a necesitar y practíquenlas en el carro. Así llegan con confianza."], ["10. Un cuaderno compartido", "Cada vez que escuchen una frase nueva en el trabajo o en la calle, anótenla. El domingo se enseñan mutuamente lo que aprendió cada uno."], ["11. Equivocarse es parte del plan", "La gente entiende un inglés imperfecto. Lo importante es comunicar. Si no entienden, digan: «<i>Sorry, my English is not very good. Can you speak slowly, please?<\/i>»"], ["12. Usen apps como complemento", "Apps de vocabulario y de repetición espaciada (tarjetas) ayudan 10 minutos al día, pero no reemplazan hablar con personas."], ["13. Aprovechen el trabajo", "Su trabajo es su mejor clase: cada día escuchan el mismo vocabulario. Pidan a un compañero que les corrija una frase al día."], ["14. Celebren los logros", "Primera llamada en inglés, primer correo sin traductor, primera conversación con un vecino: ¡celébrenlo! La motivación es combustible."]], "pron": [["La «e» antes de S", "En español decimos «estudent», «espeak». En inglés se empieza directo con la S: <b>s-tudent, s-peak, s-chool, s-pain<\/b>. Truco: hagan un «ssss» de serpiente y luego la palabra."], ["Vocales cortas y largas", "<b>ship<\/b> (barco, «i» corta) vs. <b>sheep<\/b> (oveja, «ii» larga). <b>live<\/b> vs. <b>leave<\/b>; <b>full<\/b> vs. <b>fool<\/b>. Alarguen la vocal cuando hay «ee» o «ea»."], ["La TH", "Pongan la punta de la lengua entre los dientes y soplen: <b>think, thank you, three<\/b>. En <b>this, that, the, mother<\/b> es igual pero con vibración (como una «d» suave)."], ["V y B son distintas", "La <b>V<\/b> se hace con los dientes de arriba tocando el labio de abajo: <b>very, van, five<\/b>. La <b>B<\/b> con los dos labios: <b>bed, bus<\/b>."], ["Las consonantes finales", "No se comen el final: <b>work-ed, ask-ed, cost-s, want-s<\/b>. En inglés el final cambia el significado (<i>want<\/i> vs. <i>won't<\/i>)."], ["La terminación -ED", "Suena «t» después de sonidos sordos (<i>worked<\/i> = «uorkt»), «d» en la mayoría (<i>called<\/i> = «cold»), e «id» solo después de t/d (<i>wanted<\/i> = «uántid»)."], ["La H suena", "La H en inglés se pronuncia como una «j» suave: <b>hello<\/b> («jelóu»), <b>house<\/b> («jáus»), <b>help<\/b> («jelp»)."], ["La J y la Y", "<b>J<\/b> suena «ll» fuerte o «dy»: <b>job<\/b> («dyob»). <b>Y<\/b> suena «i»: <b>yes<\/b> («iés»). Nunca confundan <b>yes<\/b> con <b>Jess<\/b>."]], "plan": [["1", "Supervivencia", "Frases de supervivencia + saludos. Cambiar el teléfono a inglés. Etiquetar la casa."], ["2", "Pronunciación y alfabeto", "Alfabeto y código fonético. Deletrear nombres, correos y teléfonos."], ["3", "Supermercado", "Vocabulario de comida. Lista de compras en inglés. Ir y pagar hablando solo inglés."], ["4", "Casa y rutina", "Presente simple. Juego «Three things» en cada cena. Primera «hora en inglés»."], ["5", "Trabajo I", "Cada uno memoriza sus 15 frases de trabajo más importantes."], ["6", "Pasado simple", "Verbos irregulares. Contar el día en pasado. Role-play de vecinos."], ["7", "Trabajo II", "Diálogos completos: visita técnica y llamada de reserva. Grabarse y escucharse."], ["8", "Trámites y salud", "Banco, médico, farmacia, emergencias. Escribir la frase del 911 y pegarla en la nevera."], ["9", "Futuro y cortesía", "going to / will / could / would. Correos de trabajo con frases listas."], ["10", "Escuchar", "Un episodio de serie a la semana con subtítulos en inglés. Shadowing 5 min/día."], ["11", "Clientes difíciles", "Quejas, disculpas, alternativas, cancelaciones. Role-play de «cliente difícil»."], ["12", "Repaso y celebración", "Repetir todos los ejercicios sin mirar. Salir a cenar y pedir todo en inglés. ¡Celebrar!"]], "rp": [["Supermercado", "Uno es el cajero, el otro compra 5 productos. Pregunten precios, paguen y pidan el recibo."], ["Técnico en casa", "Ella es una clienta molesta porque no tiene internet; él llega, pregunta, revisa y explica la solución."], ["Llamada de reserva", "Él llama para reservar un hotel de 3 noches para 2 adultos y 1 niño; ella sigue el guion completo."], ["Cliente difícil", "Él llama para cancelar una reserva y pide reembolso; ella explica la política de cancelación con cortesía."], ["Nuevos vecinos", "Preséntense, digan de dónde son, a qué se dedican y pidan una recomendación de playa."], ["En el médico", "Uno es el doctor; el otro describe síntomas: desde cuándo, dónde duele, alergias."], ["Llamada de emergencia", "Practiquen decir al 911 qué pasó y su dirección completa, claro y despacio."]], "ans": [["Ejercicio 1", "1. am · 2. is · 3. are · 4. is · 5. Are · 6. are"], ["Ejercicio 2", "1. How much is this? · 2. I don't understand. Can you speak slowly, please? · 3. I'd like to open a bank account. · 4. The internet hasn't worked since yesterday. / The internet has been down since yesterday. · 5. Let me check the availability. · 6. I have a headache."], ["Ejercicio 3", "went · bought · worked · paid · had · called · fixed · booked"], ["Ejercicio 4", "1. How may I help you? · 2. Where is the rice? · 3. Can I pay with card? · 4. Your confirmation number is B-325. · 5. The cable was damaged."], ["Ejercicio 5", "(Respuestas posibles) 1. Do you accept US dollars? · 2. Good morning, I'm the technician from [company]. I'm here to install your internet. · 3. I'm sorry, could you spell your last name, please? · 4. Hi! Nice to meet you. I'm [name]. We just moved in. · 5. Hi, the AC is not working. When can you come to fix it?"], ["Ejercicio 6", "Respuesta libre. Revisen especialmente: E («i») / I («ai»), G («dyi») / J («dyei»), @ = «at», . = «dot». K7-Q2-J9-G4 = «kei-seven, kiu-tu, dyei-náin, dyi-for»."]]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var $ = function(s, r){ return (r||document).querySelector(s); };
var view = $('#view');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function plain(s){ var d=document.createElement('div'); d.innerHTML=s; return d.textContent; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function pool(k){ // items for practice
  var out=[]; TOPICS.forEach(function(t){ if(k!=='all' && t.k!==k) return; if(t.k==='pron') return;
    SECS[t.s].blocks.forEach(function(b){
      if(b.t==='phrases') b.rows.forEach(function(r){ out.push({en:plain(r[0]),pr:r[1],es:plain(r[2]),ph:1}); });
      if(b.t==='vocab') b.rows.forEach(function(r){ out.push({en:plain(r[0]),pr:'',es:plain(r[1])}); });
    }); });
  return out; }

/* ---------- speech ---------- */
var synth = window.speechSynthesis || null, voice=null;
function pickVoice(){ if(!synth) return; var vs=synth.getVoices()||[]; voice = vs.filter(function(v){return /^en[-_]US/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null; }
if(synth){ pickVoice(); try{ synth.addEventListener('voiceschanged',pickVoice); }catch(e){} }
function clean(t){ return plain(t).replace(/\[company\]/gi,'the company').replace(/\[name\]/gi,'Ana').replace(/\[address\]/gi,'the address').replace(/\[[^\]]*\]/g,'').replace(/\.\.\./g,' ').replace(/ \/ /g,'. ').replace(/—/g,'. ').replace(/→/g,', '); }
var ttsCap=null, sayTok=0, curU=null;
function hookTts(){ try{ if(window.claude&&window.claude.use){ window.claude.use('tts').then(function(t){ ttsCap=t||null; }).catch(function(){}); return true; } }catch(e){} return false; }
if(!hookTts()){ window.addEventListener('load',hookTts); }
function canSpeak(){ return !!(ttsCap||synth); }
function stopAll(){ sayTok++; try{ if(ttsCap) ttsCap.stop(); }catch(e){} try{ if(synth&&(synth.speaking||synth.pending)) synth.cancel(); }catch(e){} document.querySelectorAll('.speaking').forEach(function(x){x.classList.remove('speaking');}); }
var NOAUDIO='El audio no está disponible aquí. Abran la guía en Chrome o Safari y revisen el volumen del teléfono.';
function say(text, slow, el, done){
  var tok=++sayTok, txt=clean(text), fin=false;
  document.querySelectorAll('.speaking').forEach(function(x){x.classList.remove('speaking');});
  if(el) el.classList.add('speaking');
  function finish(ok,msg){ if(fin) return; fin=true; if(el) el.classList.remove('speaking'); if(tok!==sayTok) return; if(msg) toast(msg); if(done) done(!!ok); }
  function browser(){
    if(!synth){ finish(false,NOAUDIO); return; }
    try{
      var busy=synth.speaking||synth.pending; if(busy) synth.cancel();
      var u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; if(!voice) pickVoice(); if(voice) u.voice=voice; u.rate=slow?0.6:0.9;
      var started=false, wd;
      u.onstart=function(){ started=true; clearTimeout(wd); };
      u.onend=function(){ clearTimeout(wd); finish(true); };
      u.onerror=function(ev){ clearTimeout(wd); var c=ev&&ev.error; if(c==='interrupted'||c==='canceled'){ finish(false); } else finish(false,NOAUDIO); };
      curU=u; /* keep a reference: some browsers drop the utterance otherwise */
      var go=function(){ if(tok!==sayTok){ finish(false); return; } try{ synth.resume(); }catch(e){} synth.speak(u); wd=setTimeout(function(){ if(!started&&!fin){ try{synth.cancel();}catch(e){} finish(false,NOAUDIO); } },4000); };
      if(busy) setTimeout(go,120); else go();
    }catch(e){ finish(false,NOAUDIO); }
  }
  if(ttsCap){
    try{ if(synth&&(synth.speaking||synth.pending)) synth.cancel(); }catch(e){}
    var cap=ttsCap;
    cap.speak(txt,{language:'en',rate:slow?0.7:1}).then(function(){ finish(true); }).catch(function(err){
      if(tok!==sayTok){ finish(false); return; }
      var c=err&&err.code;
      if(c==='not_granted'){ ttsCap=null; browser(); }
      else if(c==='rate_limited'){ finish(false,'Demasiados audios seguidos. Esperen unos segundos.'); }
      else if(c==='busy'){ finish(false,'Terminen el dictado por voz para poder escuchar.'); }
      else if(c==='viewer_stopped'||c==='stopped'||c==='replaced'||c==='cancelled'||c==='canceled'){ finish(false); }
      else browser();
    });
  } else browser();
}
var toastT; function toast(m){ var t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3200); }

  return '<div class="phr'+(k?' known':'')+'" data-key="'+esc(key)+'"><button class="play" data-say="'+esc(key)+'" aria-label="Escuchar">'+PLAY+'</button>'+

    '<div class="side"><button class="know" aria-pressed="'+(k?'true':'false')+'" aria-label="Marcar como aprendida" title="Ya la sé">✓</button><button class="slow" data-say="'+esc(key)+'" data-slow="1">lento</button></div></div>'; }
function block(b){
  switch(b.t){
    case 'h2': return '<h2>'+b.title+'</h2>';

    case 'box': return '<aside class="box '+b.kind+'">'+(b.title?'<strong class="t">'+b.title.replace(/^[★♥⚠]\s*/,'')+'</strong>':'')+b.items.map(function(i){return '<p>'+i+'</p>';}).join('')+'</aside>';
    case 'phrases': return b.rows.map(function(r){return phraseRow(r[0],r[1],r[2]);}).join('');
    case 'vocab': return '<div class="vgrid">'+b.rows.map(function(r){ var m=/^([A-Z]) – /.exec(r[0]); var s=m?(m[1]+', as in '+r[1]):r[0];
        return '<button class="v" data-say="'+esc(s)+'"><b lang="en">'+r[0]+'</b><span>'+r[1]+'</span></button>'; }).join('')+'</div>';
    case 'dialog': return '<div class="dlg"><h4><span>Diálogo: '+b.title+'</span><span class="row"><button class="btn small" data-dlg="all">Escuchar todo</button><button class="btn small" data-dlg="es">Ocultar español</button></span></h4>'+

    default: return '';
  } }

var G={};
function simple(x){ return x.ph && !/[\/\[\]…—]|\.\.\./.test(x.en); }
function norm(s){ return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim(); }
function startGame(){ var g=$('#game'); if(!g) return; var P=pool(st.deck);
  if(st.mode==='cards'){ G={list:shuffle(P),i:0,flip:false}; cards(); }
  if(st.mode==='quiz'){ G={qs:shuffle(P).slice(0,10),i:0,ok:0,P:P,done:false}; quiz(); }
  if(st.mode==='order'){ G={list:shuffle(P.filter(function(x){var n=x.en.split(' ').length;return simple(x)&&n>=3&&n<=9;})),i:0}; order(); }

}

var NATO={A:'Alpha',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliet',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-ray',Y:'Yankee',Z:'Zulu'};

function spell(){ G={code:newCode(),hid:true};
  $('#game').innerHTML='<p>En reservaciones y en soporte técnico se deletrea todo el día. Las letras que más se confunden: E / I, G / J, A / E.</p>'+
  '<div class="stage"><p class="sub">Juego 1: uno lee el código en voz alta, el otro lo escribe sin mirar</p><p class="spell" id="sCode">'+G.code+'</p><div class="row" style="justify-content:center"><button class="btn" id="sSay">Escuchar el código</button><button class="btn" id="sNato">Escuchar con alfabeto fonético</button><button class="btn fill" id="sNew">Otro código</button></div></div>'+
  '<div class="stage"><p class="sub">Juego 2: escuchen y escriban el código</p><div class="row" style="justify-content:center"><button class="bigplay" id="hSay">'+PLAY.replace('<svg','<svg width="18" height="18" fill="#fff"')+' Escuchar código secreto</button></div><p><input class="inp" id="hIn" style="text-align:center;margin-top:14px;text-transform:uppercase" maxlength="8" autocomplete="off" aria-label="Código"></p><p class="fb" id="fb"></p><div class="row" style="justify-content:center"><button class="btn" id="hCheck">Comprobar</button><button class="btn fill" id="hNew">Nuevo código</button></div></div>'+
  '<h2>El alfabeto, letra por letra</h2>'+block(SECS[2].blocks.filter(function(b){return b.t==='vocab';})[0]);
  G.hidden=newCode(); }
var KEYS={0:['am','is','are','is','are','are'],2:['went','bought','worked','paid','had','called','fixed','booked'],3:['How may I help you?','Where is the rice?','Can I pay with card?','Your confirmation number is B-325','The cable was damaged']};
function guide(){ var exs=SECS[11].blocks.filter(function(b){return b.t==='exercise';});
  $('#game').innerHTML=exs.map(function(e,n){ var key=KEYS[n];
    var items=e.items.map(function(it,i){
      if(n===0||n===2) return '<li>'+it.replace('______','<input class="inp s" data-a="'+esc(key[i])+'" autocapitalize="off" autocomplete="off" aria-label="Respuesta">')+'</li>';
      if(n===3) return '<li>'+it+'<br><input class="inp w100" data-a="'+esc(key[i])+'" autocomplete="off" aria-label="Respuesta"></li>';
      return '<li>'+it+(n<5?'<br><input class="inp w100" autocomplete="off" aria-label="Su respuesta">':'')+'</li>'; }).join('');
    return '<div class="ex"><h3 style="margin-top:0">'+e.title+'</h3>'+(e.note?'<p class="note">'+e.note+'</p>':'')+'<ol>'+items+'</ol>'+
      (key?'<div class="bar"><button class="btn small fill" data-check>Comprobar</button><span class="fb" style="margin:0"></span></div>':'')+
      '<details><summary>Ver respuestas</summary><p>'+D.ans[n][1]+'</p></details></div>'; }).join(''); }

function vPlan(){ var m=me(); var days=['L','M','X','J','V','S','D'];
  var acts=['15 min de estudio con la guía','Hora en inglés en casa','Juego «Three things» en la cena','5 min de repetir audio (shadowing)','Una frase nueva en el cuaderno','Usé inglés en el trabajo o la calle'];
  return '<div class="wrap"><h1 style="margin-top:22px">Plan de 12 semanas</h1><p>Una meta por semana. Marquen cada semana cuando la terminen.</p>'+
   D.plan.map(function(p){ var d=m.weeks[p[0]]; return '<label class="wk'+(d?' done':'')+'"><input type="checkbox" data-week="'+p[0]+'"'+(d?' checked':'')+'><span><b>Semana '+p[0]+': '+p[1]+'</b><small>'+p[2]+'</small></span></label>'; }).join('')+
   '<h2>Hábitos de esta semana</h2><table class="trk"><tr><th>Actividad</th>'+days.map(function(d){return '<th>'+d+'</th>';}).join('')+'</tr>'+
   acts.map(function(a,i){return '<tr><td>'+a+'</td>'+days.map(function(d,j){var k=i+'-'+j;return '<td><input type="checkbox" aria-label="'+esc(a)+' '+d+'" data-track="'+k+'"'+(m.track[k]?' checked':'')+'></td>';}).join('')+'</tr>';}).join('')+'</table>'+
   '<p><button class="btn small" id="trkReset">Empezar una semana nueva</button></p>'+
   '<h2>Nuestra meta</h2><p>Tres frases que quieren decir con confianza en tres meses:</p>'+[0,1,2].map(function(i){return '<p><input class="inp" style="width:100%" data-goal="'+i+'" value="'+esc(m.goals[i]||'')+'" placeholder="Meta '+(i+1)+'" aria-label="Meta '+(i+1)+'"></p>';}).join('')+
   '<h2>14 tips para aprender más rápido</h2>'+D.tips.map(function(t){return '<details><summary>'+t[0]+'</summary><p>'+t[1]+'</p></details>';}).join('')+
   SECS[1].blocks.filter(function(b){return b.t==='box';}).map(block).join('')+
   '<aside class="box warn"><strong class="t">Un último consejo</strong><p>Habrá días en que sientan que no avanzan: es normal. Sigan con los 15 minutos diarios y hablen aunque sea con errores.</p><p><b>You can do it! ¡Ustedes pueden! Boso por!</b></p></aside></div>'; }

var VIEWS={inicio:vInicio,frases:vFrases,trabajo:vTrabajo,practicar:vPracticar,plan:vPlan};
function render(keep){ var y=window.scrollY; stopAll();
  view.innerHTML=VIEWS[st.tab]();
  document.querySelectorAll('.tabs button').forEach(function(b){ if(b.dataset.tab===st.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.querySelectorAll('.who button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.who===mem.who); });
  if(st.tab==='practicar'&&st.mode) startGame();
  window.scrollTo(0, keep?y:0); }
function go(tab){ st.tab=tab; st.mode=null; try{ if(location.hash!=='#'+tab) location.hash=tab; }catch(e){} render(); }
window.addEventListener('hashchange',function(){ var h=location.hash.slice(1); if(VIEWS[h]&&h!==st.tab){ st.tab=h; st.mode=null; render(); } });

/* ---------- events ---------- */
function playDialog(box){ var btns=[].slice.call(box.querySelectorAll('.ln .play')), i=0; (function nx(){ if(i>=btns.length) return; var b=btns[i++]; say(b.dataset.say,false,b,function(ok){ if(ok) setTimeout(nx,350); }); })(); }
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-go]'); if(!t) return; var d=t.dataset;
  if(d.tab){ go(d.tab); return; }
  if(d.go){ go(d.go); return; }
  if(d.who){ mem.who=d.who; save(); st.work=null; render(); return; }
  if(d.topic){ st.topic=d.topic; render(); return; }
  if(d.work){ st.work=d.work; render(); return; }
  if(d.start!==undefined){ st.tab='practicar'; st.mode=d.start||null; if(d.deck) st.deck=d.deck; try{location.hash='practicar';}catch(x){} render(); return; }
  if(d.say){ say(d.say, !!d.slow, t.classList.contains('play')||t.classList.contains('v')?t:null); return; }
  if(d.dlg==='all'){ playDialog(t.closest('.dlg')); return; }
  if(d.dlg==='es'){ var bx=t.closest('.dlg'); bx.classList.toggle('hide-es'); t.textContent=bx.classList.contains('hide-es')?'Mostrar español':'Ocultar español'; return; }
  if(t.classList.contains('know')){ var row=t.closest('.phr'), k=row.dataset.key, m=me(); m.known[k]=!m.known[k]; if(!m.known[k]) delete m.known[k]; save(); row.classList.toggle('known',!!m.known[k]); t.setAttribute('aria-pressed',!!m.known[k]); return; }
  if(d.again!==undefined){ startGame(); return; }
  // cards
  if(t.id==='flip'){ G.flip=!G.flip; cards(); return; }
  if(t.id==='cYes'||t.id==='cNo'){ var c=G.list[G.i]; if(t.id==='cYes'&&c.ph){ me().known[c.en]=true; save(); } else if(t.id==='cNo'){ G.list.push(c); } G.i++; G.flip=false; cards(); return; }
  // quiz
  if(t.classList.contains('opt')&&!G.cur.ans){ G.cur.ans=true; var ok=d.ok==='1'; if(ok) G.ok++; t.classList.add(ok?'ok':'bad'); document.querySelectorAll('.opt').forEach(function(o){ if(o.dataset.ok==='1') o.classList.add('ok'); o.disabled=true; });
    var fb=$('#fb'); fb.className='fb '+(ok?'ok':'bad'); fb.textContent=(ok?'Correcto. ':'Casi. ')+G.cur.q.en+' = '+G.cur.q.es; $('#next').disabled=false; say(G.cur.q.en); return; }
  if(t.id==='next'){ G.i++; quiz(); return; }
  // order
  if(d.pick!==undefined){ G.pick.push(G.words.filter(function(p){return p.i==d.pick;})[0]); drawOrder(); return; }
  if(d.un!==undefined){ G.pick.splice(+d.un,1); drawOrder(); return; }
  if(t.id==='oCheck'){ var c2=G.list[G.i], got=G.pick.map(function(p){return p.w;}).join(' '); if(norm(got)===norm(c2.en)){ drawOrder('Correcto.','ok'); say(c2.en); } else drawOrder('Todavía no. Cambien el orden y prueben otra vez.','bad'); return; }
  if(t.id==='oShow'){ drawOrder(G.list[G.i].en,'ok'); say(G.list[G.i].en); return; }
  if(t.id==='oNext'){ G.i++; order(); return; }
  // dictation
  if(t.id==='dCheck'){ var c3=G.list[G.i], inp=$('#dIn'), good=norm(inp.value)===norm(c3.en); inp.className='inp '+(good?'ok':'bad'); var f=$('#fb'); f.className='fb '+(good?'ok':'bad'); f.textContent=good?'Correcto. Significa: '+c3.es:'Todavía no. Escuchen otra vez, más lento.'; return; }
  if(t.id==='dShow'){ var c4=G.list[G.i], f2=$('#fb'); f2.className='fb ok'; f2.textContent=c4.en+' = '+c4.es; return; }
  if(t.id==='dNext'){ G.i++; dict(); return; }
  // spelling
  function letters(code){ return code.split('').join(', '); }
  if(t.id==='sSay'){ say(letters(G.code),true); return; }
  if(t.id==='sNato'){ say(G.code.split('').map(function(ch){return NATO[ch]?ch+' as in '+NATO[ch]:ch;}).join(', '),false); return; }
  if(t.id==='sNew'){ G.code=newCode(); $('#sCode').textContent=G.code; return; }
  if(t.id==='hSay'){ say(letters(G.hidden),true); return; }
  if(t.id==='hCheck'){ var hi=$('#hIn'), g2=hi.value.toUpperCase().replace(/[^A-Z0-9]/g,'')===G.hidden, f3=$('#fb'); hi.className='inp '+(g2?'ok':'bad'); f3.className='fb '+(g2?'ok':'bad'); f3.textContent=g2?'Correcto: '+G.hidden:'Todavía no. Escuchen otra vez.'; return; }
  if(t.id==='hNew'){ G.hidden=newCode(); $('#hIn').value=''; $('#hIn').className='inp'; $('#fb').textContent=''; say(letters(G.hidden),true); return; }
  // guide exercises
  if(d.check!==undefined){ var ex=t.closest('.ex'), ins=ex.querySelectorAll('input[data-a]'), n=0; ins.forEach(function(i){ var g3=norm(i.value)===norm(i.dataset.a); if(g3) n++; i.className=i.className.replace(/ ok| bad/g,'')+(g3?' ok':' bad'); });
    var f4=ex.querySelector('.fb'); f4.className='fb '+(n===ins.length?'ok':'bad'); f4.textContent=n+' de '+ins.length+' correctas'; return; }
  if(t.id==='rpB'){ var r=D.rp[Math.floor(Math.random()*D.rp.length)]; $('#rpT').textContent=r[0]; $('#rpD').textContent=r[1]; return; }
  if(t.id==='trkReset'){ me().track={}; save(); render(true); return; }
});
document.addEventListener('change',function(e){ var t=e.target, d=t.dataset, m=me();
  if(t.id==='deck'){ st.deck=t.value; startGame(); return; }
  if(d.week){ m.weeks[d.week]=t.checked; save(); t.closest('.wk').classList.toggle('done',t.checked); return; }
  if(d.track){ m.track[d.track]=t.checked; save(); return; }
  if(d.goal){ m.goals[d.goal]=t.value; save(); return; }
});
document.addEventListener('keydown',function(e){ if(e.key!=='Enter') return; if(e.target.id==='dIn'){ $('#dCheck').click(); } if(e.target.id==='hIn'){ $('#hCheck').click(); } });

var h0=location.hash.slice(1); if(VIEWS[h0]) st.tab=h0; render();
})();
</script>
</body>
</html>
